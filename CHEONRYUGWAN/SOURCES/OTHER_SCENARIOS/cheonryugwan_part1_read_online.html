.<\/p>\n<p>“손을 맞았다고 해서 모든 경우가 반칙인 건 아니다. 검을 겨루다 우연히 손이 닿을 수도 있어. 공격 의도와 당시 상황을 확인해야 한다.”<\/p>\n<p>“우연히 세 번이나요?”<\/p>\n<p>태경의 목소리가 높아졌다.<\/p>\n<p>“윤태경.”<\/p>\n<p>소윤이 그의 소매를 잡았다.<\/p>\n<p>태경은 이를 악물고 한 걸음 물러났다.<\/p>\n<p>서율이 물었다.<\/p>\n<p>“그럼 심판에게 확인해 주실 수 있습니까?”<\/p>\n<p>선배는 서율을 바라봤다.<\/p>\n<p>“확인 요청은 올리겠다. 다만 결과가 달라질지는 장담할 수 없다.”<\/p>\n<p>“결과를 바꾸고 싶은 건 아닙니다.”<\/p>\n<p>“그럼?”<\/p>\n<p>서율은 잠시 생각했다.<\/p>\n<p>“그 공격이 괜찮은 것이었는지 알고 싶습니다. 제가 뭘 잘못 막았는지도요.”<\/p>\n<p>선배의 표정이 조금 달라졌다.<\/p>\n<p>“……알겠다. 심판 기록을 살펴보마.”<\/p>\n<p>세 사람은 고개를 숙이고 나왔다.<\/p>\n<p>행정동 계단을 내려가자 태경이 말했다.<\/p>\n<p>“그래도 생각보다 잘 들어 주네.”<\/p>\n<p>소윤이 고개를 끄덕였다.<\/p>\n<p>“응. 규정도 직접 보여 줬고.”<\/p>\n<p>서율은 조금 안도했다.<\/p>\n<p>“그러니까 확인해 보면 되겠지.”<\/p>\n<p>그날 오후, 세 사람은 다시 행정동으로 불려 갔다.<\/p>\n<p>그곳에는 운영 선배와 전날 심판, 그리고 정파 수련을 담당하는 교두가 앉아 있었다.<\/p>\n<p>심판은 소윤의 기록을 훑어보더니 말했다.<\/p>\n<p>“손을 노렸다는 건 네 판단이지?”<\/p>\n<p>소윤은 고개를 들었다.<\/p>\n<p>“같은 부위를 반복해서 맞았으니까요.”<\/p>\n<p>“그건 결과다. 공격할 때부터 손을 겨냥했는지는 알 수 없지.”<\/p>\n<p>태경이 앞으로 몸을 기울였다.<\/p>\n<p>“검이 손으로 꺾이는 걸 저도 봤습니다.”<\/p>\n<p>“그 정도 검로 변경은 정상적인 기술이다.”<\/p>\n<p>심판은 단호하게 말했다.<\/p>\n<p>“마지막 공격은 강했지만, 상대가 검을 놓친 건 방어 자세가 무너졌기 때문이기도 하다.”<\/p>\n<p>서율은 손가락을 내려다봤다.<\/p>\n<p>방어 자세가 무너졌다는 말은 틀리지 않았다. 통증 때문에 검을 제대로 쥘 수 없었으니까.<\/p>\n<p>하지만 왜 통증이 생겼는지는 그 설명에 없었다.<\/p>\n<p>교두가 입을 열었다.<\/p>\n<p>“전서율. 네가 정식으로 이의를 제기하는 것이냐?”<\/p>\n<p>“네.”<\/p>\n<p>“비무 결과에 불복하는 것이냐?”<\/p>\n<p>“아닙니다. 패배는 인정합니다.”<\/p>\n<p>서율은 허리를 폈다.<\/p>\n<p>“다만 손을 반복해서 공격한 것이 허용되는지 알고 싶습니다. 제가 다음 비무에 나간다면, 같은 방식으로 상대를 공격해도 되는 겁니까?”<\/p>\n<p>방 안이 조용해졌다.<\/p>\n<p>심판이 인상을 찌푸렸다.<\/p>\n<p>“말을 이상하게 돌리는구나.”<\/p>\n<p>“그럴 생각은 없었습니다.”<\/p>\n<p>“비무에서는 상대를 제압하는 기술이 허용된다. 하지만 부상을 목적으로 한 공격은 금지다. 그 차이를 모르는 건 아니겠지?”<\/p>\n<p>“네. 그래서 여쭤보는 겁니다.”<\/p>\n<p>서율은 조심스럽게 말을 이었다.<\/p>\n<p>“어제 공격은 어느 쪽이었습니까?”<\/p>\n<p>심판은 곧바로 대답하지 않았다.<\/p>\n<p>교두가 대신 말했다.<\/p>\n<p>“현재 기록만으로는 고의적인 가혹행위라고 단정할 수 없다.”<\/p>\n<p>소윤이 물었다.<\/p>\n<p>“그럼 다른 목격자에게도 확인하실 수 있나요? 관람석 앞쪽에 있던 학생들이 봤을 거예요.”<\/p>\n<p>교두는 그녀를 바라봤다.<\/p>\n<p>“백소윤. 네가 친구를 걱정하는 마음은 알겠다.”<\/p>\n<p>“네.”<\/p>\n<p>“하지만 비무 하나마다 관람객을 불러 조사할 수는 없다. 학관에는 정해진 절차가 있다.”<\/p>\n<p>“그 절차가 무엇인지 알고 싶습니다.”<\/p>\n<p>소윤의 목소리는 작았지만 또렷했다.<\/p>\n<p>교두의 미간이 좁아졌다.<\/p>\n<p>“이미 심판의 판단을 확인했다. 여기서 마무리하자.”<\/p>\n<p>태경이 입을 열려 했다.<\/p>\n<p>서율이 먼저 고개를 숙였다.<\/p>\n<p>“알겠습니다. 시간 내 주셔서 감사합니다.”<\/p>\n<p>세 사람은 방을 나왔다.<\/p>\n<p>문이 닫히자 태경이 서율을 돌아봤다.<\/p>\n<p>“왜 거기서 끝내?”<\/p>\n<p>“더 물어봐도 대답이 같을 것 같아서.”<\/p>\n<p>“그래서 그냥 참겠다고?”<\/p>\n<p>서율은 대답하지 않았다.<\/p>\n<p>그는 아직 화를 내야 하는지, 실망해야 하는지조차 정리하지 못했다.<\/p>\n<p>다만 분명한 것이 하나 있었다.<\/p>\n<p>규정집에는 부상을 목적으로 한 공격을 금한다고 적혀 있었다.<\/p>\n<p>그런데 정작 자신의 손가락이 부러진 자리에서는 누구도 그 목적을 확인하려 하지 않았다.<\/p>\n<h3>3. 문밖에서 들은 이름<\/h3>\n<p>행정동을 나오려던 소윤이 걸음을 멈췄다.<\/p>\n<p>복도 안쪽에서 낮은 목소리가 들렸다.<\/p>\n<p>“그 집안에서 이번 비무에 얼마나 신경 쓰는지 아시잖습니까.”<\/p>\n<p>세 사람은 동시에 고개를 돌렸다.<\/p>\n<p>열린 창 너머의 작은 접견실이었다. 안쪽에서 누군가 이야기를 나누고 있었다.<\/p>\n<p>“그 학생이 정파 대표 후보라는 것도 압니다. 그렇다고 부상 건을 덮으라는 말은 아니지 않습니까.”<\/p>\n<p>아까 규정집을 보여 준 운영 선배의 목소리였다.<\/p>\n<p>다른 사람이 답했다.<\/p>\n<p>“덮는다는 표현은 삼가게. 심판이 이미 판단했네.”<\/p>\n<p>“하지만 반복 타격은 확인해야 합니다.”<\/p>\n<p>“지금 이 일로 대표 선발을 중단하면 정파 쪽에서 어떤 소리가 나오겠나. 사파에서는 벌써 자기들 대표를 내세워 기세를 올리고 있어.”<\/p>\n<p>잠시 침묵이 흘렀다.<\/p>\n<p>“그 학생의 가문에서도 학관에 후원을 이어 오고 있네. 물론 그 때문에 판정을 바꾸지는 않겠지만, 근거가 부족한 일을 크게 만들 이유도 없지.”<\/p>\n<p>태경이 주먹을 꽉 쥐었다.<\/p>\n<p>소윤은 그의 팔을 붙잡았다.<\/p>\n<p>서율은 그 자리에 선 채 접견실 문을 바라봤다.<\/p>\n<p>안쪽에서는 다시 목소리가 이어졌다.<\/p>\n<p>“다친 학생에게는 치료를 충분히 제공하게. 그 정도는 학관이 책임져야지.”<\/p>\n<p>“……알겠습니다.”<\/p>\n<p>세 사람은 말없이 계단을 내려왔다.<\/p>\n<p>밖으로 나오자 태경이 숨을 내뱉었다.<\/p>\n<p>“들었지?”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>“응.”<\/p>\n<p>“가문에서 후원한다고? 대표 후보라고? 그게 지금 무슨 상관인데?”<\/p>\n<p>소윤이 낮게 말했다.<\/p>\n<p>“아예 확인할 생각이 없는 건 아니었어. 그 선배는 확인해야 한다고 했잖아.”<\/p>\n<p>“그런데 결국 못 하게 하잖아!”<\/p>\n<p>태경의 목소리가 갈라졌다.<\/p>\n<p>“그럼 뭐가 달라?”<\/p>\n<p>소윤은 대답하지 못했다.<\/p>\n<p>서율은 멀리 대연무장의 지붕을 바라봤다. 오늘도 비무가 열리고 있었다. 종소리가 들렸고, 곧 환호가 뒤따랐다.<\/p>\n<p>“태경아.”<\/p>\n<p>“왜.”<\/p>\n<p>“그 선배는 우리 말을 들어 줬어.”<\/p>\n<p>“알아.”<\/p>\n<p>“의원도 치료해 줬고.”<\/p>\n<p>“그것도 알아.”<\/p>\n<p>서율은 잠시 입을 다물었다.<\/p>\n<p>“그런데…….”<\/p>\n<p>말을 끝내기 어려웠다.<\/p>\n<p>“그런데 왜 이렇게 된 건지는 모르겠어.”<\/p>\n<p>태경은 그를 바라보다가 고개를 돌렸다.<\/p>\n<p>“나도 모르겠어.”<\/p>\n<p>이번에는 아무도 웃지 않았다.<\/p>\n<h3>4. 승자의 연무장<\/h3>\n<p>다음 날, 태경은 서율을 의무실에 두고 혼자 대연무장으로 갔다.<\/p>\n<p>정확히는 혼자 가려고 했다.<\/p>\n<p>“나도 갈게.”<\/p>\n<p>소윤이 뒤따랐다.<\/p>\n<p>“넌 왜?”<\/p>\n<p>“확인할 게 있어.”<\/p>\n<p>그녀는 수첩을 보여 주었다.<\/p>\n<p>“어제 심판 기록에 남았다는 경기 결과랑 실제 다음 대진이 같은지.”<\/p>\n<p>태경은 한숨을 쉬었다.<\/p>\n<p>“너도 참 고집 세다.”<\/p>\n<p>“너한테 들을 말은 아닌데.”<\/p>\n<p>둘은 관람석 뒤쪽에 섰다.<\/p>\n<p>남궁현우가 다음 비무를 준비하고 있었다.<\/p>\n<p>그는 아무 일도 없었다는 듯 동료들과 웃고 있었다. 오른손에는 새 보호구가 감겨 있었고, 목검은 어제와 같은 것이었다.<\/p>\n<p>“저 자식…….”<\/p>\n<p>태경이 이를 갈았다.<\/p>\n<p>소윤은 대진표를 확인했다.<\/p>\n<p>이름 옆에는 작은 글씨로 적혀 있었다.<\/p>\n<p><em>전 경기 승리. 차전 진출.<\/em><\/p>\n<p>주의도, 심판 검토도, 참가 제한도 없었다.<\/p>\n<p>태경은 한참 그 글자를 바라봤다.<\/p>\n<p>“정말 아무것도 없네.”<\/p>\n<p>소윤은 수첩을 덮었다.<\/p>\n<p>그때 남학생이 관람석 쪽을 돌아봤다.<\/p>\n<p>두 사람과 눈이 마주쳤다.<\/p>\n<p>그는 잠시 놀란 표정을 지었다가 이내 입꼬리를 올렸다.<\/p>\n<p>“친구는 안 왔나?”<\/p>\n<p>태경이 앞으로 나서려 했다.<\/p>\n<p>소윤이 먼저 말했다.<\/p>\n<p>“치료받고 있어요.”<\/p>\n<p>“그래? 안됐네.”<\/p>\n<p>남학생은 전혀 안타깝지 않은 얼굴로 말했다.<\/p>\n<p>“비무라는 게 원래 그렇지. 실력 차이를 모르고 덤비면 다치는 법이야.”<\/p>\n<p>태경이 주먹을 폈다가 다시 쥐었다.<\/p>\n<p>“너, 그 말 서율이 앞에서도 할 수 있어?”<\/p>\n<p>“못 할 이유가 있나?”<\/p>\n<p>남학생은 어깨를 으쓱했다.<\/p>\n<p>“다음엔 자기 수준에 맞는 상대를 고르라고 전해.”<\/p>\n<p>그는 웃으며 비무대로 올라갔다.<\/p>\n<p>태경이 난간을 꽉 잡았다.<\/p>\n<p>“소윤아. 나 진짜 한 대만 때리면 안 되냐?”<\/p>\n<p>“안 돼.”<\/p>\n<p>“한 대만.”<\/p>\n<p>“네가 때리면 그쪽은 바로 규칙 위반이라고 할 거야.”<\/p>\n<p>태경은 입을 다물었다.<\/p>\n<p>그 말이 너무 정확해서 더 화가 났다.<\/p>\n<p>소윤은 비무대를 바라봤다.<\/p>\n<p>“지금은 서율이 옆에 있어 주자.”<\/p>\n<p>“……알아.”<\/p>\n<p>“그리고 기억하자.”<\/p>\n<p>그녀는 수첩을 다시 펼쳤다.<\/p>\n<p>“오늘도 아무 조치가 없었다는 거.”<\/p>\n<h3>5. 정파의 가르침<\/h3>\n<p>서율은 그날 오후 혼자 강론당에 앉아 있었다.<\/p>\n<p>수업은 끝났고 학생들도 모두 떠났다. 빈 강론당 앞쪽에는 아침에 교두가 적어 놓은 글자가 남아 있었다.<\/p>\n<p><em>수신(修身).<\/em><\/p>\n<p>자신을 먼저 바로잡으라는 가르침.<\/p>\n<p>서율은 그 글자를 한참 바라봤다.<\/p>\n<p>“여기 있었구나.”<\/p>\n<p>문가에서 목소리가 들렸다.<\/p>\n<p>처음 정파의 가르침을 설명해 주었던 나이 든 교두였다. 그는 서율의 붕대를 보고 잠시 표정을 굳혔다.<\/p>\n<p>“손은 어떠냐?”<\/p>\n<p>“조금 나아졌습니다.”<\/p>\n<p>“의원이 쉬라고 했겠지?”<\/p>\n<p>“네.”<\/p>\n<p>“그럼 쉬어라. 검은 도망가지 않는다.”<\/p>\n<p>서율은 작게 웃었다.<\/p>\n<p>“예.”<\/p>\n<p>교두는 교탁 위의 서책을 정리하다가 물었다.<\/p>\n<p>“무슨 고민이 있느냐?”<\/p>\n<p>서율은 대답을 망설였다.<\/p>\n<p>“교두님.”<\/p>\n<p>“말해 보아라.”<\/p>\n<p>“정파의 무인은 약한 사람을 지켜야 한다고 배웠습니다.”<\/p>\n<p>“그렇지.”<\/p>\n<p>“그런데 강한 사람이 약한 사람을 다치게 했을 때는, 누가 그걸 바로잡아야 합니까?”<\/p>\n<p>교두의 손이 멈췄다.<\/p>\n<p>그는 서율을 한참 바라보다가 옆자리에 앉았다.<\/p>\n<p>“네 비무 이야기를 들었다.”<\/p>\n<p>서율은 고개를 숙였다.<\/p>\n<p>“제가 졌다는 건 인정합니다.”<\/p>\n<p>“그 말을 하려고 여기까지 온 건 아니겠지.”<\/p>\n<p>“……네.”<\/p>\n<p>서율은 붕대 감긴 손을 바라봤다.<\/p>\n<p>“잘못한 사람이 있다면, 그 사람을 바로잡는 것도 정파의 도리라고 생각했습니다.”<\/p>\n<p>교두는 쉽게 대답하지 않았다.<\/p>\n<p>잠시 후 그가 말했다.<\/p>\n<p>“도리는 사람에게 방향을 알려 준다. 하지만 사람은 언제나 그 방향대로 걷지는 않는다.”<\/p>\n<p>서율이 고개를 들었다.<\/p>\n<p>“그럼 어떻게 해야 합니까?”<\/p>\n<p>“그것은 나도 평생 배우는 중이다.”<\/p>\n<p>뜻밖의 대답이었다.<\/p>\n<p>교두는 칠판의 글자를 바라봤다.<\/p>\n<p>“규정이 있다고 해서 늘 공정한 판정이 나오는 것은 아니다. 권세 있는 자의 말이 더 크게 들리는 때도 있다. 그런 일을 없다고 말하면 거짓말이겠지.”<\/p>\n<p>서율은 조용히 들었다.<\/p>\n<p>“하지만 잘못된 판정 하나를 보고 네가 배운 도리까지 버리지는 마라.”<\/p>\n<p>“……예.”<\/p>\n<p>“그리고 그 도리를 지키려면, 검을 잘 쓰는 것만으로는 부족할 때가 있다.”<\/p>\n<p>교두는 자리에서 일어났다.<\/p>\n<p>“지금 당장 네가 할 수 있는 일은 손을 낫게 하는 것이다. 그다음에 무엇을 할지는 네가 생각해 보아라.”<\/p>\n<p>서율은 허리를 숙였다.<\/p>\n<p>“감사합니다.”<\/p>\n<p>교두는 문 쪽으로 향하다가 멈췄다.<\/p>\n<p>“전서율.”<\/p>\n<p>“네?”<\/p>\n<p>“네가 제기한 일에 답을 얻지 못했다고 해서, 그 질문이 잘못된 것은 아니다.”<\/p>\n<p>그는 그렇게 말하고 강론당을 나섰다.<\/p>\n<p>서율은 다시 칠판을 바라봤다.<\/p>\n<p><em>수신.<\/em><\/p>\n<p>글자는 그대로였다.<\/p>\n<p>하지만 그 글자를 바라보는 자신의 마음은 며칠 전과 조금 달라져 있었다.<\/p>\n<h3>6. 셋이서 먹는 저녁<\/h3>\n<p>저녁 식당에서 태경은 만두 접시를 서율 앞으로 밀었다.<\/p>\n<p>“먹어.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“네가 제일 좋아하는 거잖아.”<\/p>\n<p>“오늘은 양보한다.”<\/p>\n<p>“왜?”<\/p>\n<p>“다친 사람 특별 대우.”<\/p>\n<p>소윤이 말했다.<\/p>\n<p>“젓가락은 왼손으로 써야 하니까 천천히 먹어.”<\/p>\n<p>“응.”<\/p>\n<p>서율은 어설프게 만두를 집으려 했다. 만두가 젓가락 사이에서 미끄러져 접시에 떨어졌다.<\/p>\n<p>태경이 손뼉을 쳤다.<\/p>\n<p>“오! 첫 번째 패배!”<\/p>\n<p>서율이 그를 노려봤다.<\/p>\n<p>“어제 놀리지 않기로 했잖아.”<\/p>\n<p>“그건 비무 얘기였지!”<\/p>\n<p>소윤이 웃음을 터뜨렸다.<\/p>\n<p>서율도 결국 웃었다.<\/p>\n<p>태경은 만두를 하나 집어 서율의 그릇에 놓았다.<\/p>\n<p>“자. 이건 내가 이겼으니까 주는 상이다.”<\/p>\n<p>“만두 하나에 무슨 승부야.”<\/p>\n<p>“세상에는 여러 종류의 승부가 있는 법이거든.”<\/p>\n<p>잠깐 동안은 평소와 같았다.<\/p>\n<p>그러다 소윤이 수첩을 꺼냈다.<\/p>\n<p>“서율아. 오늘 대진표 확인했어.”<\/p>\n<p>서율은 젓가락을 내려놓았다.<\/p>\n<p>“……그래?”<\/p>\n<p>“그 사람, 다음 경기에도 나갔어. 별다른 조치는 없었고.”<\/p>\n<p>태경이 입술을 꾹 다물었다.<\/p>\n<p>서율은 잠시 생각했다.<\/p>\n<p>“알았어.”<\/p>\n<p>“화 안 나?”<\/p>\n<p>태경이 물었다.<\/p>\n<p>“나.”<\/p>\n<p>서율은 자신의 손을 내려다봤다.<\/p>\n<p>“화가 나긴 해.”<\/p>\n<p>두 친구가 그를 바라봤다.<\/p>\n<p>서율은 조용히 말을 이었다.<\/p>\n<p>“내가 졌다는 게 아니라, 손을 다치게 한 일이 아무 일도 아닌 것처럼 지나가는 게.”<\/p>\n<p>태경의 표정이 조금 누그러졌다.<\/p>\n<p>“……그래. 그거야.”<\/p>\n<p>“그런데 지금은 뭘 해야 할지 모르겠어.”<\/p>\n<p>서율은 솔직하게 말했다.<\/p>\n<p>“교두님도 손부터 낫게 하라고 하셨고.”<\/p>\n<p>소윤이 고개를 끄덕였다.<\/p>\n<p>“그럼 일단 그렇게 하자.”<\/p>\n<p>태경이 물었다.<\/p>\n<p>“그냥 끝내자고?”<\/p>\n<p>“아니.”<\/p>\n<p>소윤은 수첩을 덮었다.<\/p>\n<p>“잊지는 말자고.”<\/p>\n<p>세 사람은 잠시 서로를 바라봤다.<\/p>\n<p>태경이 먼저 손을 내밀었다.<\/p>\n<p>“좋아. 그럼 하나 더 약속하자.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“너는 약속하는 거 좋아한다?”<\/p>\n<p>“당연하지. 안 지킬 거면 안 하면 되잖아.”<\/p>\n<p>소윤이 손을 올렸다.<\/p>\n<p>“이번엔 무슨 약속인데?”<\/p>\n<p>태경은 잠시 생각했다.<\/p>\n<p>“누가 다치면, 나머지 둘은 도망가지 않기.”<\/p>\n<p>서율은 그 말을 들으며 태경을 바라봤다.<\/p>\n<p>“우린 도망간 적 없잖아.”<\/p>\n<p>“그러니까 앞으로도.”<\/p>\n<p>소윤이 고개를 끄덕였다.<\/p>\n<p>“응. 앞으로도.”<\/p>\n<p>서율은 다치지 않은 왼손을 두 사람의 손 위에 올렸다.<\/p>\n<p>“약속.”<\/p>\n<p>세 사람은 잠시 손을 포갰다.<\/p>\n<p>밖에서는 저녁 종이 울렸다.<\/p>\n<p>대연무장에서는 아직 비무가 이어지고 있을 것이다. 누군가는 승리하고, 누군가는 패배하고, 누군가는 다음 경기를 준비하고 있을 것이다.<\/p>\n<p>그곳에 서율의 자리는 없었다.<\/p>\n<p>하지만 식당의 작은 탁자에는 그의 자리가 남아 있었다.<\/p>\n<p>태경이 먼저 손을 뗐다.<\/p>\n<p>“자, 이제 만두 먹자.”<\/p>\n<p>소윤이 웃었다.<\/p>\n<p>“결국 그 얘기네.”<\/p>\n<p>“식기 전에 먹어야지!”<\/p>\n<p>서율은 왼손으로 젓가락을 다시 쥐었다.<\/p>\n<p>이번에는 만두가 떨어지지 않았다.<\/p>\n<p><strong>— 제9장 「묵인」 끝.<\/strong><\/p>\n"}, {"n": 10, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제10장. 승자의 자격<\/h2>\n<h3>1. 붕대와 대진표<\/h3>\n<p>“너 오늘도 나올 거야?”<\/p>\n<p>윤태경은 전서율이 생활관 문을 나서는 것을 보고 눈을 가늘게 떴다.<\/p>\n<p>“구경은 해도 된다셨어.”<\/p>\n<p>“의원님이?”<\/p>\n<p>“응.”<\/p>\n<p>“그럼 왜 어제는 하루 종일 누워 있었는데?”<\/p>\n<p>“네가 못 나오게 했잖아.”<\/p>\n<p>태경은 잠시 생각하다가 고개를 끄덕였다.<\/p>\n<p>“맞네.”<\/p>\n<p>백소윤이 두 사람 사이로 걸어왔다. 그녀는 서율의 오른손에 감긴 붕대를 살피고, 손목에 걸어 둔 물통을 왼편으로 옮겨 주었다.<\/p>\n<p>“사람 많으면 부딪히지 않게 조심해.”<\/p>\n<p>“알았어.”<\/p>\n<p>“아프면 바로 돌아오고.”<\/p>\n<p>“응.”<\/p>\n<p>“태경이는 서율이 끌고 뛰지 말고.”<\/p>\n<p>“내가 언제 그랬어?”<\/p>\n<p>“어제.”<\/p>\n<p>“……그건 늦을까 봐.”<\/p>\n<p>서율이 웃었다. 손가락은 여전히 아팠지만, 친구들과 이렇게 티격태격하는 시간만큼은 입관 전부터 계속되었던 평범한 아침 같았다.<\/p>\n<p>대연무장으로 향하는 길목에는 새 대진표가 붙어 있었다. 정파 선발 비무의 남은 참가자는 넷. 그 가운데 한 이름을 둘러싸고 학도생들이 모여 있었다.<\/p>\n<p>서율에게 부상을 입힌 남궁현우였다.<\/p>\n<p>“이번에도 이기겠지?”<\/p>\n<p>“가문에서 어릴 때부터 검을 배웠다던데.”<\/p>\n<p>“지난번에는 상대가 검도 못 잡고 내려왔다며.”<\/p>\n<p>“그건 실력 차이겠지.”<\/p>\n<p>사람들의 말이 서율의 귀에 닿았다.<\/p>\n<p>태경의 걸음이 멈췄다. 소윤도 대진표를 바라봤다.<\/p>\n<p>서율은 잠시 이름을 읽다가 먼저 움직였다.<\/p>\n<p>“가자. 자리 없어지겠다.”<\/p>\n<p>태경이 따라오며 물었다.<\/p>\n<p>“괜찮아?”<\/p>\n<p>“안 괜찮으면 뭐가 달라져?”<\/p>\n<p>서율은 대답하고 나서 스스로도 조금 놀랐다. 말이 생각보다 차갑게 나왔다.<\/p>\n<p>그는 곧 덧붙였다.<\/p>\n<p>“……그냥, 오늘은 제대로 보고 싶어. 얼마나 잘하는지.”<\/p>\n<p>태경은 더 묻지 않았다.<\/p>\n<h3>2. 모두가 아는 승자<\/h3>\n<p>준결승은 빠르게 끝났다.<\/p>\n<p>명문가 학도생은 상대의 공격을 두 번 흘린 뒤, 세 번째 교차에서 목검을 정확하게 뻗었다. 상대의 가슴 보호구에 닿는 소리가 연무장 전체에 울렸다.<\/p>\n<p>“승자!”<\/p>\n<p>환호가 쏟아졌다.<\/p>\n<p>서율은 자신도 모르게 손에 힘을 주려다가 오른손의 통증에 얼굴을 찡그렸다.<\/p>\n<p>“아프지?”<\/p>\n<p>소윤이 물었다.<\/p>\n<p>“조금.”<\/p>\n<p>“손에 힘주지 마.”<\/p>\n<p>서율은 왼손으로 오른손을 감쌌다.<\/p>\n<p>비무대 위의 남학생은 검을 내리고 상대에게 예를 갖췄다. 빈틈없는 자세였다. 상대 역시 고개를 숙였다. 관람석에서는 그 장면을 보고 정파의 품격이라는 말까지 나왔다.<\/p>\n<p>태경이 낮게 말했다.<\/p>\n<p>“저렇게 멀쩡히 이길 수 있으면서.”<\/p>\n<p>서율은 대답하지 않았다.<\/p>\n<p>자신이 맞았던 세 번의 공격이 떠올랐다. 그때 남학생이 실수한 것인지, 일부러 손을 노린 것인지는 아직 공식적으로 밝혀지지 않았다.<\/p>\n<p>하지만 지금 눈앞의 검은 분명했다.<\/p>\n<p>빠르고 정확했다. 굳이 상대의 손가락을 부러뜨리지 않아도 이길 수 있는 검이었다.<\/p>\n<p>그 사실이 서율을 더 혼란스럽게 했다.<\/p>\n<p>“전서율.”<\/p>\n<p>뒤에서 누군가 불렀다.<\/p>\n<p>돌아보니 지난번 강론당에서 만났던 나이 든 교두였다.<\/p>\n<p>“손은 어떠냐?”<\/p>\n<p>“회복 중입니다.”<\/p>\n<p>“무리하지 말거라.”<\/p>\n<p>“예.”<\/p>\n<p>교두는 비무대를 바라봤다.<\/p>\n<p>“저 학생의 검을 어떻게 보느냐?”<\/p>\n<p>서율은 잠시 생각했다.<\/p>\n<p>“잘합니다. 제가 따라가기 어려울 만큼요.”<\/p>\n<p>“그렇지.”<\/p>\n<p>“……그런데 교두님.”<\/p>\n<p>“말해 보아라.”<\/p>\n<p>“검을 잘 쓰는 것과, 그 검을 어떻게 쓰는지는 다른 일입니까?”<\/p>\n<p>교두는 바로 답하지 않았다.<\/p>\n<p>“그 질문을 잊지 말아라.”<\/p>\n<p>그는 짧게 말한 뒤 다른 교두들이 있는 자리로 향했다.<\/p>\n<p>서율은 그 뒷모습을 바라봤다.<\/p>\n<p>예전 같았으면 답을 듣지 못한 것이 답답했을 것이다. 오늘은 이상하게도, 스스로 답을 찾아야 할 질문이라는 생각이 들었다.<\/p>\n<h3>3. 마지막 한 자리<\/h3>\n<p>오후의 결승전에서 명문가 학도생은 더 강한 상대를 만났다.<\/p>\n<p>상대는 체격이 크고 수비가 단단했다. 첫 공격을 흘려도 빈틈이 생기지 않았다. 두 사람은 한동안 서로의 거리를 재며 원을 그렸다.<\/p>\n<p>“저쪽이 이길 수도 있겠는데?”<\/p>\n<p>태경이 말했다.<\/p>\n<p>소윤은 고개를 저었다.<\/p>\n<p>“아직 몰라. 저 사람은 공격을 거의 안 했어.”<\/p>\n<p>그 말이 끝나기 무섭게 명문가 학도생이 발을 바꿨다.<\/p>\n<p>앞발을 살짝 들었다 내려놓는 짧은 동작이었다. 상대는 그 움직임을 공격의 시작으로 받아들이고 검을 세웠다.<\/p>\n<p>그 순간 목검이 아래에서 위로 튀어 올랐다.<\/p>\n<p>탁!<\/p>\n<p>상대의 검이 옆으로 밀렸다.<\/p>\n<p>이어서 가슴을 향한 일격.<\/p>\n<p>“유효!”<\/p>\n<p>관람석이 술렁였다.<\/p>\n<p>다음 교차에서 상대가 강하게 반격했다. 명문가 학도생은 한 발도 물러나지 않고 검을 받아 냈다. 이어 손목을 틀어 상대의 검끝을 아래로 눌렀다.<\/p>\n<p>서율은 그 동작을 놓치지 않으려 몸을 앞으로 기울였다.<\/p>\n<p><em>'저렇게도 막는구나.'<\/em><\/p>\n<p>순간 상대의 목검이 흔들렸다. 명문가 학도생은 빈틈을 놓치지 않았다.<\/p>\n<p>탁!<\/p>\n<p>마지막 점수였다.<\/p>\n<p>“정파 대표 선발 비무, 최종 승자!”<\/p>\n<p>심판의 선언과 함께 대연무장이 함성으로 가득 찼다.<\/p>\n<p>정파의 깃발 아래 남학생이 목검을 높이 들었다.<\/p>\n<p>남궁현우는 정파 대표가 되었다.<\/p>\n<p>태경은 아무 말도 하지 않았다.<\/p>\n<p>소윤은 수첩을 펼쳤지만 한동안 글씨를 쓰지 못했다.<\/p>\n<p>서율은 박수를 치는 사람들을 바라봤다. 그들 가운데 대부분은 자신이 다쳤던 날의 일을 몰랐다. 알고 있는 사람들조차 그 일을 어떻게 받아들여야 할지 달랐다.<\/p>\n<p>저 무대 위의 학생은 분명 강했다.<\/p>\n<p>그리고 서율에게는 그 사실을 부정할 이유가 없었다.<\/p>\n<p>그렇지만 그가 대표가 되었다는 사실과, 그가 정파의 도리를 대표할 자격이 있다는 말은 같은 뜻일까.<\/p>\n<p>서율은 왼손으로 천천히 박수를 쳤다.<\/p>\n<p>태경이 그를 돌아봤다.<\/p>\n<p>“너 지금 뭐 해?”<\/p>\n<p>“이긴 건 이긴 거니까.”<\/p>\n<p>“……그렇다고 박수까지 쳐야 해?”<\/p>\n<p>서율은 손을 내렸다.<\/p>\n<p>“모르겠어.”<\/p>\n<p>그는 솔직하게 말했다.<\/p>\n<p>“안 치면 내가 졌다는 걸 인정하지 않는 것 같고, 치면 그날 일까지 괜찮다고 하는 것 같아서.”<\/p>\n<p>소윤이 조용히 말했다.<\/p>\n<p>“둘은 다른 일이야.”<\/p>\n<p>서율이 그녀를 바라봤다.<\/p>\n<p>“상대가 잘한 건 잘한 거고, 잘못한 건 잘못한 거지.”<\/p>\n<p>소윤은 수첩을 덮었다.<\/p>\n<p>“하나를 인정한다고 다른 하나가 없어지는 건 아니잖아.”<\/p>\n<p>서율은 천천히 고개를 끄덕였다.<\/p>\n<p>“……맞아.”<\/p>\n<p>태경은 한숨을 내쉬었다.<\/p>\n<p>“너희 둘은 어려운 얘기를 참 쉽게 한다.”<\/p>\n<p>“넌 어떻게 생각하는데?”<\/p>\n<p>서율이 물었다.<\/p>\n<p>태경은 비무대를 노려봤다.<\/p>\n<p>“나는 그냥 저 자식이 싫어.”<\/p>\n<p>소윤이 작게 웃었다.<\/p>\n<p>“그것도 충분히 알겠어.”<\/p>\n<h3>4. 붉은 깃발 아래<\/h3>\n<p>정파의 시상식이 끝나자 대연무장 반대편에서 새로운 함성이 터졌다.<\/p>\n<p>사파 선발 비무의 마지막 경기였다.<\/p>\n<p>“진하연이다!”<\/p>\n<p>누군가 외쳤다.<\/p>\n<p>서율이 고개를 돌렸다.<\/p>\n<p>진하연은 이미 비무대에 올라 있었다. 검은 머리를 뒤로 정리하고 붉은빛이 도는 제복 소매를 단단히 묶은 모습이었다. 평소 회랑에서 장난스럽게 웃던 얼굴과는 달랐다.<\/p>\n<p>상대는 그녀보다 키가 크고 긴 목검을 들고 있었다.<\/p>\n<p>“하연이는 저렇게 진지한 얼굴도 하는구나.”<\/p>\n<p>태경이 중얼거렸다.<\/p>\n<p>소윤이 웃었다.<\/p>\n<p>“당연하지. 대표 선발 결승인데.”<\/p>\n<p>종이 울렸다.<\/p>\n<p>상대가 먼저 들어왔다. 검끝이 곧게 뻗었다. 하연은 옆으로 한 발 움직였다.<\/p>\n<p>검이 스쳐 지나갔다.<\/p>\n<p>그녀의 목검은 아직 움직이지 않았다.<\/p>\n<p>상대가 다시 찔러 들어왔다. 이번에는 하연의 검이 부드럽게 올라왔다. 두 목검이 부딪혔지만 큰 소리는 나지 않았다.<\/p>\n<p>서율은 눈을 크게 떴다.<\/p>\n<p>상대의 검이 밀려난 것이 아니었다. 하연의 검을 따라 방향이 바뀌고 있었다.<\/p>\n<p><em>'힘으로 막는 게 아니야.'<\/em><\/p>\n<p>하연은 그 흐름을 끊지 않고 손목을 돌렸다. 검끝이 원을 그리듯 움직였다.<\/p>\n<p>탁.<\/p>\n<p>상대의 어깨에 가볍게 닿았다.<\/p>\n<p>“유효!”<\/p>\n<p>서율은 자신도 모르게 왼손을 무릎 위에서 움직였다. 검을 쥐고 있다고 상상하며 방금 본 궤적을 따라 그렸다.<\/p>\n<p>“서율아.”<\/p>\n<p>소윤이 그의 손을 바라봤다.<\/p>\n<p>“응?”<\/p>\n<p>“지금 또 따라 하고 있지?”<\/p>\n<p>“……티 나?”<\/p>\n<p>“많이.”<\/p>\n<p>태경이 웃었다.<\/p>\n<p>“너는 정말 검만 보면 정신이 없어지는구나.”<\/p>\n<p>비무대 위에서는 두 번째 교차가 시작됐다.<\/p>\n<p>상대는 이번에는 거리를 좁히지 않았다. 하연의 검을 경계하며 옆으로 움직였다. 하연도 서두르지 않았다.<\/p>\n<p>그러다 상대가 검을 크게 휘두르는 순간, 그녀의 발이 움직였다.<\/p>\n<p>반 걸음.<\/p>\n<p>그것으로 충분했다.<\/p>\n<p>목검이 허공을 가르고, 하연의 검끝이 상대의 옆구리 보호구에 닿았다.<\/p>\n<p>“유효!”<\/p>\n<p>세 번째 공격은 더 짧았다.<\/p>\n<p>상대가 먼저 검을 뻗었지만 하연은 그 검을 따라 움직이지 않았다. 공격선에서 비켜나며 검을 낮게 흘렸고, 상대가 자세를 되찾기도 전에 목검 끝을 가슴 앞에 멈춰 세웠다.<\/p>\n<p>“승자, 진하연!”<\/p>\n<p>사파 관람석이 들썩였다.<\/p>\n<p>하연은 검을 내리고 상대에게 먼저 예를 갖췄다. 상대도 고개를 숙였다. 두 사람은 짧게 말을 나눈 뒤 비무대에서 내려왔다.<\/p>\n<p>태경이 입을 벌렸다.<\/p>\n<p>“……끝이야?”<\/p>\n<p>소윤은 수첩에 적던 손을 멈췄다.<\/p>\n<p>“응. 끝났어.”<\/p>\n<p>서율은 아무 말도 하지 못했다.<\/p>\n<p>방금 본 검은 자신이 어설프게 흉내 내던 동작과 닮아 있었다. 그러나 닮았다는 말로 묶기에는 너무 큰 차이가 있었다.<\/p>\n<p>하연은 흐름을 이어 가기 위해 애쓰지 않았다.<\/p>\n<p>그저 필요한 만큼 움직였고, 검은 자연스럽게 다음 자리에 도착했다.<\/p>\n<p>서율은 부목이 감긴 오른손을 바라봤다.<\/p>\n<p><em>'나는 왜 자꾸 넘어졌을까.'<\/em><\/p>\n<p>답을 찾으려면 아직 오래 걸릴 것 같았다.<\/p>\n<h3>5. 두 대표<\/h3>\n<p>해가 기울 무렵, 두 세력의 대표가 대연무장 중앙에 섰다.<\/p>\n<p>정파의 푸른 깃발 아래에는 명문가 학도생이, 사파의 붉은 깃발 아래에는 진하연이 있었다.<\/p>\n<p>학관장은 두 사람을 차례로 소개했다.<\/p>\n<p>“정파와 사파는 서로 다른 길을 걸어왔으나, 이곳 학관에서는 같은 규율 아래 무를 익힌다. 최종 비무는 우열을 가리기 위한 자리이면서 서로의 무를 배우는 자리이기도 하다.”<\/p>\n<p>관람석에서 박수가 일었다.<\/p>\n<p>명문가 학도생은 단정하게 허리를 숙였다. 하연도 예를 갖췄다.<\/p>\n<p>학관장은 최종 비무가 사흘 뒤에 열린다고 알렸다.<\/p>\n<p>그 말이 끝나자 사람들이 저마다 승자를 점치기 시작했다.<\/p>\n<p>“정파 대표가 이길 거야. 검식이 완벽하잖아.”<\/p>\n<p>“진하연의 검을 못 봤어? 닿지도 못할걸.”<\/p>\n<p>“정파의 체면이 걸렸는데 쉽게 끝나겠어?”<\/p>\n<p>태경은 그 말들을 들으며 팔짱을 꼈다.<\/p>\n<p>“나는 진하연이 이겼으면 좋겠다.”<\/p>\n<p>소윤이 물었다.<\/p>\n<p>“왜?”<\/p>\n<p>“뻔하잖아.”<\/p>\n<p>서율은 대답하지 않았다.<\/p>\n<p>그는 비무대 아래의 두 사람을 바라봤다.<\/p>\n<p>명문가 학도생이 하연에게 무언가 말했다. 거리가 멀어 들리지는 않았다. 하연은 웃으며 짧게 대답했다. 그러자 남학생의 입가에서 미소가 사라졌다.<\/p>\n<p>“무슨 얘기 했을까?”<\/p>\n<p>태경이 목을 길게 뺐다.<\/p>\n<p>소윤이 말했다.<\/p>\n<p>“안 들리는데 어떻게 알아.”<\/p>\n<p>“입 모양이라도 보면…….”<\/p>\n<p>“너 그런 거 못 하잖아.”<\/p>\n<p>“시도는 할 수 있지!”<\/p>\n<p>서율은 두 사람의 대화를 들으며 조금 웃었다.<\/p>\n<p>그때 하연이 관람석 쪽을 돌아봤다.<\/p>\n<p>멀리서 서율을 발견한 그녀는 잠시 눈을 깜빡였다. 그러고는 그의 붕대 감긴 손을 보았다.<\/p>\n<p>웃음기가 사라졌다.<\/p>\n<p>서율은 왼손을 들어 가볍게 인사했다.<\/p>\n<p>하연은 잠시 그를 바라보다가 고개를 끄덕였다.<\/p>\n<p>그것이 전부였다.<\/p>\n<h3>6. 대표가 아닌 사람들<\/h3>\n<p>대연무장을 나서는 길에 태경이 말했다.<\/p>\n<p>“사흘 뒤면 결승이네.”<\/p>\n<p>“응.”<\/p>\n<p>“너도 보러 올 거지?”<\/p>\n<p>서율은 오른손을 살폈다.<\/p>\n<p>“의원님이 괜찮다고 하시면.”<\/p>\n<p>소윤이 곧바로 말했다.<\/p>\n<p>“그날도 사람 많을 거야. 내가 자리 먼저 잡아 둘게.”<\/p>\n<p>태경이 웃었다.<\/p>\n<p>“그럼 나는 먹을 거 가져올게.”<\/p>\n<p>“비무 보러 가는 거야, 소풍 가는 거야?”<\/p>\n<p>서율이 묻자 태경은 당당하게 대답했다.<\/p>\n<p>“둘 다.”<\/p>\n<p>세 사람은 웃으며 걸었다.<\/p>\n<p>그런데 연무장 바깥 계단에서 서율이 잠시 멈췄다.<\/p>\n<p>담장 너머로 정파의 깃발이 보였다. 오늘 그 아래에서 한 사람이 대표가 되었다. 수많은 사람이 그에게 박수를 보냈다.<\/p>\n<p>서율도 그 검이 뛰어나다는 사실은 인정했다.<\/p>\n<p>하지만 마음 한구석에는 아직 정리되지 않은 질문이 남아 있었다.<\/p>\n<p><em>'강하다는 건 무엇일까.'<\/em><\/p>\n<p>남보다 빠르게 검을 휘두르는 것.<\/p>\n<p>상대를 쓰러뜨리고 승리를 얻는 것.<\/p>\n<p>그것만으로 충분한 걸까.<\/p>\n<p>“서율아!”<\/p>\n<p>태경이 아래에서 불렀다.<\/p>\n<p>“뭐 해? 밥 먹으러 가자!”<\/p>\n<p>소윤도 손을 흔들었다.<\/p>\n<p>서율은 담장에서 시선을 거뒀다.<\/p>\n<p>“응! 지금 가!”<\/p>\n<p>그는 계단을 내려갔다.<\/p>\n<p>손가락은 아직 아팠다. 검을 쥘 수도 없었다. 그가 익히려던 움직임은 여전히 완성되지 않았다.<\/p>\n<p>그렇지만 오늘 두 사람의 검을 보았다.<\/p>\n<p>하나는 정확하고 강했다.<\/p>\n<p>다른 하나는 물처럼 흘렀다.<\/p>\n<p>서율은 두 검 모두에게서 배울 것이 있다고 생각했다.<\/p>\n<p>다만 어떤 검을 닮고 싶은지는, 아직 조금 더 생각해 봐야 할 것 같았다.<\/p>\n<p><strong>— 제10장 「승자의 자격」 끝.<\/strong><\/p>\n"}, {"n": 11, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제11장. 묶인 검<\/h2>\n<h3>1. 손이 기억하는 것<\/h3>\n<p>전서율은 세 번째로 젓가락을 떨어뜨렸다.<\/p>\n<p>탁.<\/p>\n<p>나무젓가락이 식탁 아래로 굴러갔다.<\/p>\n<p>“…….”<\/p>\n<p>그는 한동안 바닥을 바라봤다.<\/p>\n<p>맞은편에 앉아 있던 윤태경이 말없이 새 젓가락을 내밀었다.<\/p>\n<p>“이번에는 내가 아무 말 안 했다.”<\/p>\n<p>“그 말이 이미 한마디 한 거잖아.”<\/p>\n<p>“아니, 정말 아무 말도 안 하려고 했어.”<\/p>\n<p>백소윤은 서율의 밥그릇을 자기 쪽으로 끌어당겼다.<\/p>\n<p>“잠깐 줘 봐.”<\/p>\n<p>“왜?”<\/p>\n<p>“반찬 좀 잘라 주려고.”<\/p>\n<p>“그 정도는 내가…….”<\/p>\n<p>서율은 말을 멈췄다.<\/p>\n<p>오른손은 부목과 붕대로 고정되어 있었다. 왼손으로 젓가락을 쓰는 일도 며칠째 연습하고 있었지만 아직 익숙하지 않았다. 특히 질긴 고기나 길게 이어진 나물을 집을 때면 손끝에서 힘이 빠졌다.<\/p>\n<p>소윤은 반찬을 먹기 좋은 크기로 나누어 그릇을 돌려주었다.<\/p>\n<p>“이제 먹어.”<\/p>\n<p>“……고마워.”<\/p>\n<p>태경은 턱을 괴고 서율을 바라봤다.<\/p>\n<p>“너 이렇게 얌전한 거 처음 본다.”<\/p>\n<p>“내가 평소에 얼마나 얌전한데.”<\/p>\n<p>“검 들면 안 얌전하잖아.”<\/p>\n<p>“검 들 때도 얌전했어.”<\/p>\n<p>“그 이상한 동작 하다가 세 번 넘어졌던 건?”<\/p>\n<p>“두 번이야.”<\/p>\n<p>“소윤아, 몇 번이었지?”<\/p>\n<p>소윤은 잠깐 생각했다.<\/p>\n<p>“세 번.”<\/p>\n<p>“봐.”<\/p>\n<p>서율이 억울한 표정을 지었다.<\/p>\n<p>“한 번은 넘어진 게 아니라 주저앉은 거였어.”<\/p>\n<p>태경이 웃음을 터뜨렸다.<\/p>\n<p>“그게 그거지!”<\/p>\n<p>서율도 웃었다.<\/p>\n<p>그러다 무심코 오른손을 움직이려 했다.<\/p>\n<p>손가락 안쪽에서 날카로운 통증이 올라왔다.<\/p>\n<p>“……윽.”<\/p>\n<p>소윤의 표정이 즉시 달라졌다.<\/p>\n<p>“서율아?”<\/p>\n<p>“괜찮아. 잠깐 움직여서.”<\/p>\n<p>“의원님이 손에 힘주지 말라고 하셨잖아.”<\/p>\n<p>“응. 조심할게.”<\/p>\n<p>서율은 오른손을 무릎 위에 얹었다.<\/p>\n<p>조금 전까지 웃고 있었는데, 손가락이 아프자 다시 현실로 돌아온 기분이었다.<\/p>\n<p>대연무장에서는 정파와 사파 대표의 최종 비무를 앞두고 준비가 한창이었다. 학도생들은 누구의 검이 더 뛰어난지 떠들었고, 수련반마다 승자를 맞히는 내기까지 벌어졌다.<\/p>\n<p>서율도 그 경기를 기다리고 있었다.<\/p>\n<p>하지만 다른 학도생들과는 이유가 조금 달랐다.<\/p>\n<p>그는 진하연의 검을 다시 보고 싶었다.<\/p>\n<p>그리고 자신이 놓치고 있는 것이 무엇인지 알고 싶었다.<\/p>\n<p>문제는 그 검을 본다 해도 당분간 직접 따라 해 볼 수 없다는 것이었다.<\/p>\n<p>서율은 왼손으로 젓가락을 다시 들었다.<\/p>\n<p>이번에는 천천히 움직였다.<\/p>\n<p>작은 반찬 하나가 겨우 입에 들어갔다.<\/p>\n<p>태경이 손뼉을 쳤다.<\/p>\n<p>“오, 성공!”<\/p>\n<p>“조용히 해.”<\/p>\n<p>“축하해 주는 건데?”<\/p>\n<p>소윤이 웃었다.<\/p>\n<p>서율도 웃었지만, 오른손은 식사가 끝날 때까지 한 번도 움직이지 않았다.<\/p>\n<h3>2. 빈 연무장<\/h3>\n<p>오후 수업이 끝난 뒤 서율은 제삼 연무장으로 향했다.<\/p>\n<p>목검을 들고 간 것은 아니었다.<\/p>\n<p>그저 걷고 싶었다.<\/p>\n<p>연무장에는 몇몇 학생들이 남아 기초 검식을 반복하고 있었다. 발을 내딛고, 검을 내려치고, 자세를 거두는 익숙한 움직임이었다.<\/p>\n<p>서율은 담장 옆에 앉아 그 모습을 바라봤다.<\/p>\n<p>하나.<\/p>\n<p>둘.<\/p>\n<p>셋.<\/p>\n<p>검이 내려온다.<\/p>\n<p>멈춘다.<\/p>\n<p>다시 처음 자세로 돌아간다.<\/p>\n<p>그는 왼손을 들어 허공에 작은 원을 그렸다.<\/p>\n<p><em>'왜 꼭 여기서 멈춰야 하지?'<\/em><\/p>\n<p>처음 강론당에서 했던 질문이었다.<\/p>\n<p>그때는 단순히 궁금했다.<\/p>\n<p>지금은 조금 달랐다.<\/p>\n<p>진하연의 검을 보고 난 뒤부터, 동작이 끝나는 자리에 다른 움직임이 이어질 수 있다는 생각이 머릿속에서 떠나지 않았다.<\/p>\n<p>그녀는 상대의 검을 막은 뒤 자신의 검을 되돌리지 않았다. 상대의 힘이 흘러가는 방향으로 검을 움직였고, 그 끝에서 다음 공격이 시작됐다.<\/p>\n<p>서율은 손목을 돌려 보았다.<\/p>\n<p>왼손이었다.<\/p>\n<p>평소 검을 쥐던 손과는 감각이 달랐다.<\/p>\n<p>“뭐 하냐?”<\/p>\n<p>뒤에서 태경의 목소리가 들렸다.<\/p>\n<p>서율은 손을 내렸다.<\/p>\n<p>“그냥 구경.”<\/p>\n<p>태경은 그의 옆에 털썩 앉았다.<\/p>\n<p>“구경하는 사람치고는 손을 엄청 움직이던데.”<\/p>\n<p>“생각 좀 했어.”<\/p>\n<p>“검 생각?”<\/p>\n<p>“응.”<\/p>\n<p>“역시.”<\/p>\n<p>태경은 하늘을 올려다봤다.<\/p>\n<p>“너는 손이 나아도 문제고 안 나아도 문제다.”<\/p>\n<p>“왜?”<\/p>\n<p>“나으면 검을 휘두를 거고, 안 나으면 검 생각만 하잖아.”<\/p>\n<p>서율은 대꾸하지 못했다.<\/p>\n<p>틀린 말이 아니었다.<\/p>\n<p>잠시 뒤 태경이 물었다.<\/p>\n<p>“그렇게까지 하고 싶어?”<\/p>\n<p>서율은 연무장을 바라봤다.<\/p>\n<p>“……응.”<\/p>\n<p>“왜?”<\/p>\n<p>그 질문은 의외로 어려웠다.<\/p>\n<p>남보다 강해지고 싶어서.<\/p>\n<p>비무에서 이기고 싶어서.<\/p>\n<p>그런 이유도 없지는 않았다.<\/p>\n<p>하지만 그뿐이라면 손이 다친 지금은 쉬는 편이 나았다. 더 좋은 검식을 배우고, 몸이 회복되기를 기다리면 될 일이었다.<\/p>\n<p>그런데 서율은 자꾸만 머릿속에서 검을 움직이고 있었다.<\/p>\n<p>“내가 생각한 게 맞는지 궁금해서.”<\/p>\n<p>그가 대답했다.<\/p>\n<p>태경이 고개를 돌렸다.<\/p>\n<p>“뭐가?”<\/p>\n<p>“검을 한 번 휘두른 다음에 꼭 처음으로 돌아가야 하는지.”<\/p>\n<p>“그 얘기 또 하네.”<\/p>\n<p>“응. 아직 답을 못 찾았으니까.”<\/p>\n<p>태경은 잠시 생각했다.<\/p>\n<p>“그럼 손 나으면 해 봐.”<\/p>\n<p>“그럴 생각이야.”<\/p>\n<p>“그런데 지금도 해 보고 싶은 거지?”<\/p>\n<p>서율은 멋쩍게 웃었다.<\/p>\n<p>“……조금.”<\/p>\n<p>태경은 그 웃음을 보고 길게 한숨을 쉬었다.<\/p>\n<p>“아, 정말.”<\/p>\n<p>그는 자리에서 일어났다.<\/p>\n<p>“잠깐 기다려 봐.”<\/p>\n<p>“어디 가?”<\/p>\n<p>“생각 좀 해 보게.”<\/p>\n<p>서율은 태경의 뒷모습을 바라봤다.<\/p>\n<p>그가 무슨 생각을 하는지는 알 수 없었다.<\/p>\n<h3>3. 검자루와 천 조각<\/h3>\n<p>태경이 돌아온 것은 해가 조금 기울었을 때였다.<\/p>\n<p>그의 손에는 낡은 천 조각과 목검 한 자루가 들려 있었다.<\/p>\n<p>소윤도 함께였다.<\/p>\n<p>“뭐야, 둘이 어디 갔다 왔어?”<\/p>\n<p>서율이 묻자 태경은 목검을 들어 보였다.<\/p>\n<p>“방법을 생각해 왔다.”<\/p>\n<p>소윤이 곧바로 덧붙였다.<\/p>\n<p>“아직 해도 된다고 한 건 아니야.”<\/p>\n<p>태경이 인상을 찌푸렸다.<\/p>\n<p>“말 좀 끝까지 듣게 해 줘.”<\/p>\n<p>“네가 먼저 해 보자고 할 것 같아서.”<\/p>\n<p>“……그건 맞는데.”<\/p>\n<p>서율은 두 사람을 번갈아 봤다.<\/p>\n<p>“무슨 방법?”<\/p>\n<p>태경은 서율 앞에 쪼그려 앉았다.<\/p>\n<p>“검을 손으로 꽉 못 쥐잖아.”<\/p>\n<p>“응.”<\/p>\n<p>“그럼 검자루를 손에 고정하면 되지 않을까?”<\/p>\n<p>그는 천 조각을 목검 손잡이에 둘러 보였다.<\/p>\n<p>“이렇게.”<\/p>\n<p>서율의 눈이 조금 커졌다.<\/p>\n<p>“묶는다고?”<\/p>\n<p>“응. 손이 검을 놓치지 않게.”<\/p>\n<p>소윤은 팔짱을 꼈다.<\/p>\n<p>“그래서 내가 위험하다고 했어.”<\/p>\n<p>“아니, 그냥 생각해 본 거라니까!”<\/p>\n<p>태경이 억울하게 말했다.<\/p>\n<p>“정말 휘두르자는 건 아니고. 적어도 검을 쥐는 모양은 만들 수 있잖아.”<\/p>\n<p>서율은 목검을 바라봤다.<\/p>\n<p>그럴듯해 보였다.<\/p>\n<p>손가락에 힘을 주지 않아도 손잡이를 고정할 수 있다면, 검을 움직이는 궤적 정도는 확인할 수 있을지 몰랐다.<\/p>\n<p>하지만 소윤의 표정은 단호했다.<\/p>\n<p>“서율아, 검을 놓치지 못하게 만드는 건 오히려 위험할 수도 있어.”<\/p>\n<p>“왜?”<\/p>\n<p>“손목이 잘못 꺾이거나 검이 어디에 걸렸을 때 바로 놓을 수 없잖아. 손가락에도 힘이 전달될 거고.”<\/p>\n<p>태경이 천 조각을 내려다봤다.<\/p>\n<p>“……그건 생각 못 했네.”<\/p>\n<p>소윤은 서율을 바라봤다.<\/p>\n<p>“의원님한테 먼저 물어보자.”<\/p>\n<p>서율은 잠시 망설였다.<\/p>\n<p>“오늘?”<\/p>\n<p>“응. 아직 의무실 문 안 닫았을 거야.”<\/p>\n<p>태경이 목검을 어깨에 걸쳤다.<\/p>\n<p>“좋아. 물어보자. 안 된다고 하면 안 하는 거고.”<\/p>\n<p>서율은 두 친구를 바라봤다.<\/p>\n<p>혼자였다면 아마 그 자리에서 한 번쯤 시도했을 것이다.<\/p>\n<p>그 생각을 하자 조금 부끄러워졌다.<\/p>\n<p>“……그래. 먼저 물어보자.”<\/p>\n<p>세 사람은 목검과 천 조각을 챙겨 의무실로 향했다.<\/p>\n<h3>4. 허락되지 않은 방법<\/h3>\n<p>의원은 태경이 가져온 목검을 보자마자 눈썹을 치켜올렸다.<\/p>\n<p>“이걸 왜 들고 왔느냐?”<\/p>\n<p>태경은 씩씩하게 대답했다.<\/p>\n<p>“검을 손에 묶어도 되는지 여쭤보려고요.”<\/p>\n<p>“안 된다.”<\/p>\n<p>대답은 즉시 나왔다.<\/p>\n<p>태경이 입을 벌렸다.<\/p>\n<p>“아직 설명도 안 했는데요?”<\/p>\n<p>“설명할 필요도 없다.”<\/p>\n<p>의원은 서율의 오른손을 가리켰다.<\/p>\n<p>“손가락이 아직 회복되지 않았는데 검을 묶어 움직이겠다고? 검을 쥐는 것보다 더 위험할 수 있다.”<\/p>\n<p>서율이 조심스럽게 물었다.<\/p>\n<p>“휘두르지 않고 자세만 잡는 것도 안 됩니까?”<\/p>\n<p>“왜 굳이 그 손에 검을 달아야 하느냐?”<\/p>\n<p>“검이 움직이는 길을 확인하고 싶어서요.”<\/p>\n<p>의원은 잠시 서율을 바라봤다.<\/p>\n<p>“네가 궁금한 것은 알겠다. 하지만 지금 손가락에 필요한 건 움직임이 아니라 안정이다.”<\/p>\n<p>“……예.”<\/p>\n<p>“왼손으로 연습하거나, 검 없이 발놀림을 익히는 건 상태를 봐 가며 할 수 있다. 다만 오른손은 부목을 유지하고, 통증을 일으키는 동작은 하지 마라.”<\/p>\n<p>태경이 풀이 죽은 얼굴로 천 조각을 접었다.<\/p>\n<p>“괜히 가져왔네.”<\/p>\n<p>의원은 그를 바라봤다.<\/p>\n<p>“괜히 가져온 건 아니다.”<\/p>\n<p>“예?”<\/p>\n<p>“몰래 해 보고 다쳐서 오는 것보다는 먼저 물어보는 게 낫지.”<\/p>\n<p>태경의 표정이 조금 밝아졌다.<\/p>\n<p>“그렇죠?”<\/p>\n<p>“하지만 다시는 그 손에 검을 묶을 생각 하지 마라.”<\/p>\n<p>“……예.”<\/p>\n<p>의무실을 나온 뒤 태경은 천 조각을 흔들었다.<\/p>\n<p>“결국 못 쓰게 됐네.”<\/p>\n<p>서율이 말했다.<\/p>\n<p>“그래도 고마워.”<\/p>\n<p>“뭐가?”<\/p>\n<p>“방법 생각해 줬잖아.”<\/p>\n<p>태경은 코끝을 긁었다.<\/p>\n<p>“생각만 한 거지 뭐.”<\/p>\n<p>소윤이 말했다.<\/p>\n<p>“생각하는 건 좋은데, 실행하기 전에 확인해야지.”<\/p>\n<p>“알았어, 알았어.”<\/p>\n<p>태경은 목검을 서율에게 건네려다가 멈췄다.<\/p>\n<p>“아, 이건 내가 들게.”<\/p>\n<p>서율은 웃었다.<\/p>\n<p>“응.”<\/p>\n<p>그날 세 사람은 검을 묶지 못했다.<\/p>\n<p>하지만 서율의 머릿속에서는 이미 다른 방법이 떠오르고 있었다.<\/p>\n<p>검을 손에 묶을 수 없다면, 움직임을 나누어 보면 어떨까.<\/p>\n<p>검이 아니라 발부터.<\/p>\n<p>손목이 아니라 몸의 방향부터.<\/p>\n<p>그는 걸음을 옮기며 발끝을 내려다봤다.<\/p>\n<h3>5. 검 없는 수련<\/h3>\n<p>다음 날부터 서율의 방과 후 일정이 바뀌었다.<\/p>\n<p>태경은 목검을 들고 연무장에 섰고, 서율은 빈손으로 그 앞에 섰다.<\/p>\n<p>소윤은 평소처럼 수첩을 펼쳤다.<\/p>\n<p>“오늘은 뭘 확인할 거야?”<\/p>\n<p>서율이 대답했다.<\/p>\n<p>“발.”<\/p>\n<p>태경이 고개를 갸웃했다.<\/p>\n<p>“발?”<\/p>\n<p>“응. 검을 휘두르다가 멈추는 이유가 손 때문만은 아닌 것 같아서.”<\/p>\n<p>서율은 왼발을 앞으로 내디뎠다.<\/p>\n<p>“보통 이렇게 내려치면 여기서 자세를 거두잖아.”<\/p>\n<p>태경이 목검을 들어 기본 검식을 시연했다.<\/p>\n<p>검이 내려오고, 발이 멈췄다.<\/p>\n<p>“그렇지.”<\/p>\n<p>“그런데 여기서 발을 한 번 더 옮기면?”<\/p>\n<p>서율은 검 없이 몸을 돌렸다.<\/p>\n<p>한 걸음.<\/p>\n<p>그리고 반 걸음.<\/p>\n<p>몸이 예상보다 크게 흔들렸다.<\/p>\n<p>“어?”<\/p>\n<p>그는 급히 왼발을 뻗어 균형을 잡았다.<\/p>\n<p>태경이 웃음을 터뜨렸다.<\/p>\n<p>“야, 검도 없는데 넘어질 뻔했어!”<\/p>\n<p>“그러게.”<\/p>\n<p>서율도 웃었다.<\/p>\n<p>소윤은 수첩에 무언가 적었다.<\/p>\n<p>“발을 옮기는 순간 상체가 먼저 돌아갔어.”<\/p>\n<p>“응. 나도 느꼈어.”<\/p>\n<p>“다시 해 볼래?”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>두 번째 시도에서는 상체를 늦게 돌렸다.<\/p>\n<p>이번에는 발이 엉켰다.<\/p>\n<p>세 번째에서는 방향을 바꾸는 데 성공했지만 움직임이 너무 느렸다.<\/p>\n<p>태경이 팔짱을 꼈다.<\/p>\n<p>“이거 그냥 기본 보법부터 다시 해야 하는 거 아니야?”<\/p>\n<p>서율은 잠시 생각하다가 웃었다.<\/p>\n<p>“……그런 것 같아.”<\/p>\n<p>그날 서율이 얻은 것은 새로운 검식이 아니었다.<\/p>\n<p>자신이 발놀림조차 제대로 이해하지 못하고 있다는 사실이었다.<\/p>\n<p>그는 저녁까지 기초 보법을 반복했다.<\/p>\n<p>오른손을 몸 가까이에 두고, 왼손은 균형을 잡는 데 사용했다. 조금이라도 오른손에 통증이 느껴지면 즉시 멈췄다.<\/p>\n<p>태경은 처음에는 옆에서 놀렸다.<\/p>\n<p>그러다 어느 순간부터 함께 발을 움직였다.<\/p>\n<p>“야, 이거 생각보다 힘든데?”<\/p>\n<p>“그러니까.”<\/p>\n<p>“너 이걸 왜 계속해?”<\/p>\n<p>“모르겠어.”<\/p>\n<p>“모르면서 해?”<\/p>\n<p>“하다 보면 알 것 같아서.”<\/p>\n<p>태경은 고개를 저었다.<\/p>\n<p>“정말 이상한 놈.”<\/p>\n<p>그러면서도 자리를 떠나지 않았다.<\/p>\n<p>소윤은 두 사람의 움직임을 번갈아 보다가 말했다.<\/p>\n<p>“태경아, 너는 오른발이 너무 멀리 나가.”<\/p>\n<p>“어?”<\/p>\n<p>“서율이는 반대로 너무 짧고.”<\/p>\n<p>두 사람이 동시에 그녀를 바라봤다.<\/p>\n<p>소윤은 수첩을 들어 보였다.<\/p>\n<p>“둘 다 다시.”<\/p>\n<p>태경이 하늘을 올려다봤다.<\/p>\n<p>“우리 수련반 교두님보다 무서워.”<\/p>\n<p>“칭찬으로 들을게.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>그렇게 세 사람의 수련은 다시 시작됐다.<\/p>\n<h3>6. 묶어 두어야 하는 것<\/h3>\n<p>사흘째 되던 날, 서율은 생활관 방에서 홀로 천 조각을 바라보고 있었다.<\/p>\n<p>태경이 가져왔던 천이었다.<\/p>\n<p>그는 그것을 목검에 묶어 보지 않았다.<\/p>\n<p>대신 손바닥 위에 펼쳐 놓고 한참 바라봤다.<\/p>\n<p><em>'검을 놓치지 않게 묶는다.'<\/em><\/p>\n<p>처음 들었을 때는 좋은 방법이라고 생각했다.<\/p>\n<p>하지만 의원의 말을 듣고 나니 다른 점이 보였다.<\/p>\n<p>검을 놓치지 않는 것과 검을 제대로 다루는 것은 같지 않았다.<\/p>\n<p>손이 검을 놓아야 하는 순간에도 놓지 못한다면, 그것은 도움보다 위험이 될 수 있었다.<\/p>\n<p>서율은 천을 접어 책상 서랍에 넣었다.<\/p>\n<p>그때 문이 열렸다.<\/p>\n<p>“뭐 해?”<\/p>\n<p>태경이었다.<\/p>\n<p>“그냥 정리.”<\/p>\n<p>“또 검 생각했지?”<\/p>\n<p>“……응.”<\/p>\n<p>태경은 웃으며 침상에 앉았다.<\/p>\n<p>“나도 생각해 봤는데.”<\/p>\n<p>“뭘?”<\/p>\n<p>“네가 하려는 거 말이야.”<\/p>\n<p>서율이 고개를 들었다.<\/p>\n<p>태경은 손을 허공에 뻗었다.<\/p>\n<p>“검을 이렇게 휘두르면 끝에서 멈추잖아.”<\/p>\n<p>“응.”<\/p>\n<p>“그런데 그걸 계속 이어 가려면, 다음에 어디로 갈지 미리 알아야 하는 거 아니야?”<\/p>\n<p>서율은 눈을 깜빡였다.<\/p>\n<p>태경은 머쓱하게 웃었다.<\/p>\n<p>“아니, 그냥 내가 해 보니까 그렇더라고. 검을 계속 움직이려니까 어디로 가야 할지 모르겠어서.”<\/p>\n<p>서율은 잠시 생각했다.<\/p>\n<p>그 말은 맞았다.<\/p>\n<p>자신은 지금까지 검을 멈추지 않는 것에만 집중했다.<\/p>\n<p>그런데 검을 멈추지 않으려면, 다음 움직임이 무엇인지 알아야 했다.<\/p>\n<p>그리고 그다음도.<\/p>\n<p>“……태경아.”<\/p>\n<p>“왜?”<\/p>\n<p>“그거 좋은 생각이다.”<\/p>\n<p>태경이 눈을 크게 떴다.<\/p>\n<p>“진짜?”<\/p>\n<p>“응.”<\/p>\n<p>“내가?”<\/p>\n<p>“응, 네가.”<\/p>\n<p>태경은 벌떡 일어났다.<\/p>\n<p>“소윤아!”<\/p>\n<p>방 밖으로 외치는 목소리가 복도에 울렸다.<\/p>\n<p>“내가 드디어 서율이 검술에 도움이 됐다!”<\/p>\n<p>멀리서 소윤의 목소리가 들렸다.<\/p>\n<p>“알았으니까 조용히 해!”<\/p>\n<p>서율은 웃음을 참지 못했다.<\/p>\n<p>태경도 웃었다.<\/p>\n<p>그러다 서율은 책상 위에 놓인 수련 기록을 펼쳤다.<\/p>\n<p>그는 왼손으로 서툰 글씨를 적기 시작했다.<\/p>\n<p><em>첫 번째 움직임의 끝이 두 번째 움직임의 시작이 되려면.<\/em><\/p>\n<p>문장을 쓰다가 멈췄다.<\/p>\n<p>아직 뒤에 무엇을 적어야 할지 몰랐다.<\/p>\n<p>그는 붓을 내려놓았다.<\/p>\n<p>모르는 것은 모르는 채로 두기로 했다.<\/p>\n<p>억지로 답을 만들면, 몸이 그 답을 따라가다가 또 넘어질 테니까.<\/p>\n<h3>7. 혼자 남은 연무장<\/h3>\n<p>정사 최종 비무를 하루 앞둔 저녁이었다.<\/p>\n<p>제삼 연무장에 마지막까지 남아 있던 수련생들이 목검을 챙겨 돌아갔다. 서율도 태경과 소윤에게 먼저 들어가라고 했다.<\/p>\n<p>“혼자 괜찮겠어?” 소윤이 물었다.<\/p>\n<p>“조금만 더 걷다가 갈게. 오른손은 안 쓸 거야.”<\/p>\n<p>“통증 나면 바로 멈춰.”<\/p>\n<p>“응.”<\/p>\n<p>태경은 영 못 미더운 얼굴로 서율을 가리켰다.<\/p>\n<p>“나중에 와서 또 넘어졌다고 하지 마라.”<\/p>\n<p>“넘어지면 말 안 할게.”<\/p>\n<p>“그게 더 문제잖아!”<\/p>\n<p>소윤이 웃으며 태경의 등을 밀었다. 두 사람의 발소리가 담장 밖으로 멀어졌다.<\/p>\n<p>이윽고 연무장에는 서율 혼자 남았다.<\/p>\n<p>그는 오른팔을 몸 가까이 붙인 채 연무장 중앙에 섰다. 붕대 아래 손가락이 욱신거렸다. 부목은 단단했고, 의원이 검을 잡지 말라고 했던 말도 똑똑히 기억하고 있었다.<\/p>\n<p>검은 없었다.<\/p>\n<p>서율은 발부터 움직였다.<\/p>\n<p>왼발을 앞으로 내딛고, 허리를 돌리고, 오른발을 반 걸음 옮겼다. 두 번째 동작까지는 괜찮았다. 세 번째에서 중심이 앞으로 쏠렸다.<\/p>\n<p>“……또.”<\/p>\n<p>그는 멈춰 서서 흙바닥에 찍힌 발자국을 살폈다. 늘 같은 자리에서 발이 너무 멀리 나갔다. 다음 움직임을 급하게 만들려는 탓이었다.<\/p>\n<p>다시 처음으로 돌아갔다.<\/p>\n<p>한 걸음. 반 걸음. 몸을 돌린다.<\/p>\n<p>이번에는 균형을 잡았지만 흐름이 끊겼다.<\/p>\n<p>서율은 한숨을 내쉬었다. 오른손이 멀쩡했다면 목검을 들고 확인해 볼 수 있었을까. 아니, 그랬다면 또 검을 억지로 이어 붙이느라 발을 보지 못했을지도 몰랐다.<\/p>\n<p>그는 왼손을 허공에 뻗었다. 검을 쥐었다고 상상하며 팔을 천천히 움직였다.<\/p>\n<p>“거기서 멈추면 아깝지 않아?”<\/p>\n<p>담장 쪽에서 낯익은 목소리가 들렸다.<\/p>\n<p>서율이 돌아봤다.<\/p>\n<p>진하연이 혼자 서 있었다.<\/p>\n<p>“언제 왔어?”<\/p>\n<p>“네가 같은 자리에서 세 번째 멈출 때.”<\/p>\n<p>“……그렇게 오래 보고 있었어?”<\/p>\n<p>“세 번째라고 오래 본 건 아니잖아.”<\/p>\n<p>하연은 웃으며 연무장 안으로 들어왔다. 오늘은 사파 제복의 소매를 걷어 올린 편한 차림이었다. 허리에는 목검이 매달려 있었지만 손을 대지는 않았다.<\/p>\n<p>“내일 결승이라며. 연습 안 해도 돼?” 서율이 물었다.<\/p>\n<p>“했어. 돌아가다가 여기 불이 아직 켜져 있길래.”<\/p>\n<p>그녀는 그의 붕대 감긴 오른손을 바라봤다.<\/p>\n<p>“그 손으로 수련하는 건 아니지?”<\/p>\n<p>“검은 안 잡았어. 발만 연습하고 있었어.”<\/p>\n<p>“그럼 다행이고.”<\/p>\n<p>하연은 그가 남긴 발자국을 내려다봤다. 발끝이 이리저리 얽힌 흔적이 흙 위에 남아 있었다.<\/p>\n<p>“뭘 해 보려던 거야?”<\/p>\n<p>“검을 내려친 다음에 다시 거두지 않고 이어 가 보려고.”<\/p>\n<p>“그런데?”<\/p>\n<p>“검이 없으니까 발부터 해 봤는데, 자꾸 여기서 멈춰.”<\/p>\n<p>서율은 아까의 움직임을 다시 보여 주었다. 첫걸음, 몸의 회전, 그리고 지나치게 멀리 뻗는 다음 발.<\/p>\n<p>결국 그는 중심을 잃고 급히 멈췄다.<\/p>\n<p>“봐. 이래.”<\/p>\n<p>하연은 웃지 않았다.<\/p>\n<p>“네가 왜 그걸 해 보려는지 알 것 같아.”<\/p>\n<p>“정말?”<\/p>\n<p>“응. 그런데 아직 몸이 따라오지 않는 것 같네.”<\/p>\n<p>“그건 나도 알아.”<\/p>\n<p>서율은 멋쩍게 웃었다.<\/p>\n<p>하연은 잠시 생각하다가 물었다.<\/p>\n<p>“정파에서는 검을 한 동작씩 정확하게 끝내는 걸 중요하게 가르치지?”<\/p>\n<p>“응. 기본이 흐트러지면 다음 동작도 무너진다고.”<\/p>\n<p>“틀린 말은 아니네.”<\/p>\n<p>서율은 그녀를 돌아봤다. 사파 대표가 정파의 가르침에 동의하리라고는 생각하지 못했다.<\/p>\n<p>“그런데 네가 궁금한 건 동작을 끝내는 법이 아니라, 끝난 다음에 어디로 갈 수 있느냐는 거잖아.”<\/p>\n<p>“……응.”<\/p>\n<p>“그건 재미있네.”<\/p>\n<p>하연은 발자국을 다시 살폈다.<\/p>\n<p>“남들은 검을 더 빠르게 휘두르려고 하는데, 너는 왜 멈추는지부터 따지고 있으니까.”<\/p>\n<p>서율은 고개를 숙여 자신의 발끝을 봤다.<\/p>\n<p>“사실 아직 아무것도 못 찾았어. 손도 이 모양이고.”<\/p>\n<p>“손은 나으면 되지.”<\/p>\n<p>“의원님 말로는 당분간 오래 걸릴 거래.”<\/p>\n<p>“그럼 당분간 오래 기다려야겠네.”<\/p>\n<p>너무 간단한 대답이라 서율이 웃었다.<\/p>\n<p>“그렇게 말하면 쉬운 일 같잖아.”<\/p>\n<p>“어려운 건 알지.”<\/p>\n<p>하연의 목소리가 조금 낮아졌다.<\/p>\n<p>“그래도 안 나은 손으로 검을 묶어 휘두르다가 다시 다치는 것보다는 낫잖아.”<\/p>\n<p>서율이 놀라 그녀를 봤다.<\/p>\n<p>“그걸 어떻게 알아?”<\/p>\n<p>“린이 들었어. 의무실에 목검 들고 찾아간 사람이 셋이나 있었다며?”<\/p>\n<p>“……소문이 벌써 났구나.”<\/p>\n<p>하연이 웃음을 터뜨렸다.<\/p>\n<p>“걱정 마. 너희 셋 말고는 누가 그런 생각을 하겠어.”<\/p>\n<p>서율도 웃었다.<\/p>\n<p>잠시 바람이 불었다. 담장 너머 나뭇잎이 서로 스쳤다.<\/p>\n<p>“전서율.”<\/p>\n<p>“응?”<\/p>\n<p>“너, 그날 비무에서 많이 억울했지?”<\/p>\n<p>서율의 웃음이 조금 사라졌다.<\/p>\n<p>그는 곧바로 대답하지 못했다.<\/p>\n<p>“졌다는 건 억울하지 않아.”<\/p>\n<p>“그럼?”<\/p>\n<p>“……손을 다치게 한 일이 아무 일도 아니게 된 건 좀 그래.”<\/p>\n<p>하연은 아무 말 없이 기다렸다.<\/p>\n<p>“그래도 정파의 검을 배운 게 잘못됐다고 생각하진 않아. 그 사람의 검이 강한 것도 사실이고.”<\/p>\n<p>“그렇겠지.”<\/p>\n<p>“그래서 더 잘 모르겠어. 강한 사람이 꼭 옳은 건 아닌데, 강한 사람한테는 사람들이 쉽게 박수를 치잖아.”<\/p>\n<p>하연은 서율을 바라봤다.<\/p>\n<p>“나는 오늘 네가 여기 혼자 남아 있는 게 조금 이상했어.”<\/p>\n<p>“왜?”<\/p>\n<p>“그런 일을 겪고도 검을 어떻게 움직일지 생각하고 있으니까.”<\/p>\n<p>서율은 어깨를 으쓱했다.<\/p>\n<p>“좋아하니까.”<\/p>\n<p>“검을?”<\/p>\n<p>“응. 그리고 아직 모르는 게 많아서.”<\/p>\n<p>하연은 잠깐 말을 잃은 듯했다. 이윽고 그녀가 웃었다.<\/p>\n<p>“너 정말 이상한 사람이구나.”<\/p>\n<p>“그 말도 많이 들어.”<\/p>\n<p>“누가?”<\/p>\n<p>“태경이가 매일.”<\/p>\n<p>하연은 소리 내어 웃었다.<\/p>\n<p>서율은 그녀가 그렇게 웃는 모습을 처음 보는 것 같았다. 비무대 위에서는 빈틈없고 당당했던 사람이, 지금은 저녁바람을 맞으며 평범하게 웃고 있었다.<\/p>\n<p>“내일 비무 잘해.” 서율이 말했다.<\/p>\n<p>“내가 질 것 같아?”<\/p>\n<p>“아니. 그런 뜻은 아니고.”<\/p>\n<p>“알아.”<\/p>\n<p>하연은 한 걸음 물러났다.<\/p>\n<p>“너도 손 잘 낫게 해. 다음에 볼 때까지 그 이상한 걸 조금은 알아냈으면 좋겠네.”<\/p>\n<p>“장담은 못 해.”<\/p>\n<p>“그럼 못 알아낸 얘기라도 들려줘.”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>“응.”<\/p>\n<p>하연은 담장 쪽으로 걸어갔다. 문 앞에서 한 번 돌아보더니 왼손을 들어 작게 흔들었다. 서율도 왼손을 들어 답했다.<\/p>\n<p>그녀가 사라진 뒤 서율은 다시 연무장 가운데 섰다.<\/p>\n<p>조금 전과 똑같이 발을 옮겼다. 세 번째 움직임에서 또 중심이 흔들렸다.<\/p>\n<p>“……아직 멀었네.”<\/p>\n<p>그는 웃으며 자세를 바로잡았다.<\/p>\n<p>그때 연무장 바깥, 담장과 회랑이 만나는 그늘에 누군가 서 있었다.<\/p>\n<p>그 남학생은 진하연이 혼자 연무장으로 들어가는 모습을 보았다. 그리고 그녀가 전서율 앞에서 웃고, 둘이 한참 말을 나누고, 헤어지기 전 손까지 흔드는 모습을 처음부터 끝까지 지켜봤다.<\/p>\n<p>그는 정파 대표 선발 비무에서 서율의 손을 다치게 한 남학생이 아니었다. 그와는 다른 사람이었다.<\/p>\n<p>하연이 비무대에 설 때마다 가장 앞에서 지켜보던 사람. 그녀가 사파 대표가 된 뒤로는 축하할 기회만 기다리던 사람이었다.<\/p>\n<p>그런데 하연은 자신에게는 늘 짧게 인사하고 지나가면서, 저 이름 없는 수련생 앞에서는 발걸음을 멈췄다.<\/p>\n<p>남학생의 시선이 서율의 붕대에 닿았다.<\/p>\n<p><em>'저런 놈한테 무슨 볼일이 있다고.'<\/em><\/p>\n<p>그는 입술을 굳게 다물었다.<\/p>\n<p>하연에게 직접 물을 수도 있었다. 우연히 마주쳤을 뿐이라고 생각할 수도 있었다. 하지만 그는 어느 쪽도 택하지 않았다.<\/p>\n<p>그저 서율의 얼굴을 기억했다.<\/p>\n<p>멀리서 저녁 종이 울렸다.<\/p>\n<p>남학생은 끝내 모습을 드러내지 않은 채 회랑 반대편으로 걸어갔다.<\/p>\n<p>서율은 그가 있었다는 사실조차 몰랐다.<\/p>\n<h3>8. 검을 놓지 않는 이유<\/h3>\n<p>저녁 무렵, 세 사람은 생활관 뒤뜰에 모였다.<\/p>\n<p>태경은 목검을 들고 기본 검식을 반복했다. 소윤은 옆에서 기록을 정리했다. 서율은 빈손으로 보법을 연습했다.<\/p>\n<p>한동안 말이 없었다.<\/p>\n<p>탁.<\/p>\n<p>태경의 목검이 허공을 갈랐다.<\/p>\n<p>사박.<\/p>\n<p>서율의 발이 흙바닥을 밟았다.<\/p>\n<p>사각.<\/p>\n<p>소윤의 붓이 종이를 스쳤다.<\/p>\n<p>해가 담장 아래로 내려갈 무렵 태경이 먼저 검을 내렸다.<\/p>\n<p>“아, 힘들어.”<\/p>\n<p>소윤이 말했다.<\/p>\n<p>“오늘은 여기까지 하자.”<\/p>\n<p>서율도 걸음을 멈췄다.<\/p>\n<p>그의 이마에는 땀이 맺혀 있었다.<\/p>\n<p>태경이 목검을 어깨에 걸치고 물었다.<\/p>\n<p>“서율아.”<\/p>\n<p>“응?”<\/p>\n<p>“너 손 나으면 제일 먼저 뭐 할 거야?”<\/p>\n<p>서율은 잠시 생각했다.<\/p>\n<p>“검 쥐어 봐야지.”<\/p>\n<p>“그다음은?”<\/p>\n<p>“기본 검식.”<\/p>\n<p>태경이 인상을 찌푸렸다.<\/p>\n<p>“그 이상한 거 말고?”<\/p>\n<p>“그걸 하려면 기본부터 제대로 해야 할 것 같아서.”<\/p>\n<p>소윤이 고개를 끄덕였다.<\/p>\n<p>“좋은 생각이네.”<\/p>\n<p>태경은 잠시 서율을 바라보다가 웃었다.<\/p>\n<p>“너 좀 달라졌다.”<\/p>\n<p>“뭐가?”<\/p>\n<p>“전에는 무조건 이어서 휘두르려고 했잖아.”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>“응.”<\/p>\n<p>“지금은 안 그러네.”<\/p>\n<p>서율은 자신의 오른손을 내려다봤다.<\/p>\n<p>붕대는 여전히 단단히 감겨 있었다.<\/p>\n<p>“손을 못 쓰니까 알게 되는 것도 있더라.”<\/p>\n<p>“뭔데?”<\/p>\n<p>“내가 생각보다 모르는 게 많다는 거.”<\/p>\n<p>태경이 웃었다.<\/p>\n<p>“그건 나도 알고 있었는데.”<\/p>\n<p>“야.”<\/p>\n<p>소윤도 웃었다.<\/p>\n<p>서율은 잠시 두 사람을 바라보다가 말했다.<\/p>\n<p>“그래도 계속해 보려고.”<\/p>\n<p>태경이 고개를 끄덕였다.<\/p>\n<p>“알아.”<\/p>\n<p>“아직 제대로 되는 건 하나도 없지만.”<\/p>\n<p>“그것도 알아.”<\/p>\n<p>“언제 될지도 모르겠고.”<\/p>\n<p>“그것까지 알아.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“그럼 됐네.”<\/p>\n<p>태경은 목검을 서율 쪽으로 내밀다가 멈췄다.<\/p>\n<p>잠시 뒤 검을 자기 어깨에 다시 걸쳤다.<\/p>\n<p>“손 나으면 그때 받아.”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>“응.”<\/p>\n<p>소윤은 수첩을 덮었다.<\/p>\n<p>“그때까지 내가 기록해 둘게.”<\/p>\n<p>“고마워.”<\/p>\n<p>세 사람은 함께 생활관으로 돌아갔다.<\/p>\n<p>서율의 책상 서랍에는 여전히 낡은 천 조각이 들어 있었다.<\/p>\n<p>검을 손에 묶어 보자는 태경의 생각에서 시작된 물건이었다.<\/p>\n<p>그러나 서율은 그것을 꺼내지 않았다.<\/p>\n<p>지금 묶어 두어야 할 것은 검이 아니었다.<\/p>\n<p>다 낫지도 않은 손으로 무언가를 증명하려는 조급함이었다.<\/p>\n<p>그는 아직 그것을 완전히 내려놓지는 못했다.<\/p>\n<p>다만 오늘은, 검을 쥐지 않고도 수련을 마칠 수 있었다.<\/p>\n<p>그리고 내일은 정파와 사파의 최종 비무가 열리는 날이었다.<\/p>\n<p><strong>— 제11장 「묶인 검」 끝.<\/strong><\/p>\n"}, {"n": 12, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제12장. 알고 있어<\/h2>\n<h3>1. 결승의 아침<\/h3>\n<p>“전서율. 일어나.”<\/p>\n<p>윤태경이 침상 끝을 두드렸다. 서율은 눈을 뜨기 전에 오른손부터 확인했다. 부목에 고정된 두 손가락은 여전히 묵직했다. 어젯밤 검 없이 보법만 연습했는데도 몸 곳곳이 뻐근했다.<\/p>\n<p>“종 울리려면 아직 멀었잖아.”<\/p>\n<p>“앞자리 없어지면 네가 대신 뛰어갈 거냐?”<\/p>\n<p>“네가 업어 주면 되지.”<\/p>\n<p>“부상자라고 다 봐줄 줄 알아?”<\/p>\n<p>태경은 투덜대면서도 서율의 겉옷을 침상 곁에 놓았다. 매듭을 한 손으로 묶기 어렵다는 걸 알고 있었다. 서율은 그걸 모르는 척했다.<\/p>\n<p>식당 앞에서 기다리던 백소윤은 보자기를 펼쳤다. 작은 주먹밥 셋이 나란히 놓여 있었다. 서율의 것은 한 손으로 쥐기 좋게 조금 더 단단하게 뭉쳐져 있었다.<\/p>\n<p>“너희는 왜 자꾸 내가 애라도 된 것처럼 굴어?”<\/p>\n<p>“그럼 오늘부터 오른손으로 밥 먹어.” 태경이 말했다.<\/p>\n<p>“……고맙게 먹겠습니다.”<\/p>\n<p>소윤은 웃었다. 그리고 그 웃음이 오래 남는 이유를 아직 생각해 본 적이 없었다.<\/p>\n<p>대연무장으로 향하는 길에는 정파의 푸른 깃발과 사파의 붉은 깃발이 번갈아 걸려 있었다. 오늘은 두 세력의 대표가 맞붙는 날이었다. 서율은 어젯밤 제삼 연무장에서 만난 진하연을 떠올렸다.<\/p>\n<p><em>‘네가 궁금한 건 동작을 끝내는 법이 아니라, 끝난 다음에 어디로 갈 수 있느냐는 거잖아.’<\/em><\/p>\n<p>그녀는 서율이 넘어지는 모습을 세 번이나 보고도 비웃지 않았다. 대신 그가 무엇을 하려는지 물었다.<\/p>\n<p>그것만으로도 서율은 조금 이상한 기분이었다.<\/p>\n<h3>2. 관람석에서<\/h3>\n<p>태경이 앞자리를 잡는 동안 소윤은 서율의 오른편에 앉았다. 사람들이 지나가며 다친 손을 건드리지 않도록 한 자리였다.<\/p>\n<p>“오늘은 어느 쪽이 이길까?” 태경이 물었다.<\/p>\n<p>“진하연.” 서율이 대답했다.<\/p>\n<p>“너 어제 만나더니 아주 확신이 생겼구나?”<\/p>\n<p>“그런 게 아니라.”<\/p>\n<p>“그럼 뭐?”<\/p>\n<p>서율은 잠시 생각했다.<\/p>\n<p>“저 사람이 어디까지 움직일 수 있는지 보고 싶어.”<\/p>\n<p>태경은 소윤을 바라봤다.<\/p>\n<p>“들었지? 사람이 아니라 검만 보고 있어.”<\/p>\n<p>“서율이는 원래 그렇잖아.”<\/p>\n<p>소윤은 수첩을 펼쳤다. 앞쪽에는 며칠 전 먹었던 음식과 태경이 야간 점호에 늦을 뻔한 일, 수업에서 이해하지 못한 구절이 뒤섞여 있었다. 그 뒤로 서율의 손이 다친 날의 기록이 이어졌다. 의원이 말한 주의사항과 서율이 괜찮다고 웃었던 표정도 적혀 있었다.<\/p>\n<p>그녀는 오늘 날짜를 쓰고 잠깐 멈췄다.<\/p>\n<p><em>서율이는 어젯밤 혼자 남아 발을 연습했다.<\/em><\/p>\n<p>그 문장을 적은 뒤에야 소윤은 자신이 아직 시작하지도 않은 결승보다 친구의 어젯밤을 먼저 기록했다는 사실을 알아차렸다.<\/p>\n<p>“또 비무 분석이야?” 태경이 고개를 내밀었다.<\/p>\n<p>“내 일기장이라니까.”<\/p>\n<p>“그럼 나도 좀 멋있게 적어 줘.”<\/p>\n<p>“오늘 아침에 남의 주먹밥까지 먹으려 했다고?”<\/p>\n<p>“그건 빼고.”<\/p>\n<p>서율이 웃었다. 소윤은 그 웃음을 보고 수첩을 덮었다.<\/p>\n<p>그때 정파 대표가 비무대에 올랐다.<\/p>\n<p>태경의 웃음이 멎었다.<\/p>\n<p>서율의 손가락을 부러뜨린 남학생이었다. 단정한 제복, 흐트러지지 않는 자세, 관람석 높은 곳에서 그를 지켜보는 가문의 사람들. 정파 대표는 손을 다치게 한 뒤에도 아무 징계를 받지 않았고, 결국 정파의 이름으로 이 자리에 섰다.<\/p>\n<p>“저놈은 오늘도 박수받네.” 태경이 낮게 말했다.<\/p>\n<p>서율은 아무 말도 하지 않았다.<\/p>\n<p>소윤은 수첩 위에 얹은 손을 천천히 움켜쥐었다.<\/p>\n<h3>3. 진하연이 알고 있는 것<\/h3>\n<p>비무대 반대편에서 진하연이 모습을 드러냈다. 사파 수련생들이 환호했고, 앞줄에 선 한서린이 누구보다 크게 이름을 불렀다.<\/p>\n<p>하연은 손을 들어 답했다. 평소와 같은 당당한 미소였다.<\/p>\n<p>그러나 그녀는 비무대에 오르기 직전, 정파 대표의 오른손을 보았다.<\/p>\n<p>저 손이 전서율의 검을 몇 번이고 노렸다는 이야기를 들었다. 상대가 검을 놓친 뒤에도 공격이 이어졌다는 말도. 그리고 그 일을 두고 학관이 내놓은 답이 사실상 아무것도 없었다는 사실도.<\/p>\n<p>하연은 서율의 붕대 감긴 손을 떠올렸다.<\/p>\n<p>어젯밤 그는 혼자 남아 검도 없이 발을 옮겼다. 다친 일을 원망하기보다 자신이 아직 모르는 움직임을 궁금해했다. 그런 사람의 손을 부러뜨리고도 이 자리에 당당히 선 상대를 보자, 가슴속에 눌러 두었던 감정이 다시 올라왔다.<\/p>\n<p>한서린이 곁으로 다가왔다.<\/p>\n<p>“하연아. 너 오늘 좀 무서운데.”<\/p>\n<p>“그래?”<\/p>\n<p>“평소엔 이길 생각을 할 때 웃잖아.”<\/p>\n<p>하연은 잠시 눈을 감았다 떴다.<\/p>\n<p>“오늘은 확인할 게 있어.”<\/p>\n<p>“뭔데?”<\/p>\n<p>“정파를 대표한다는 사람이 정파의 이름을 얼마나 가볍게 쓰는지.”<\/p>\n<p>한서린이 입을 다물었다.<\/p>\n<p>하연은 정파의 가르침 자체를 우습게 여기지 않았다. 예를 지키고, 강한 자가 약한 자를 함부로 짓밟지 말아야 한다는 말은 오히려 옳다고 생각했다. 그래서 더 화가 났다. 그 말을 입에 올리는 사람이 정작 그 반대로 행동하는 것을 견딜 수 없었다.<\/p>\n<p>그녀가 비무대 위에 섰다.<\/p>\n<p>정파 대표가 예를 갖추며 말했다.<\/p>\n<p>“사파의 검이 얼마나 대단한지 보겠다.”<\/p>\n<p>하연도 예를 갖췄다.<\/p>\n<p>“잘 보세요.”<\/p>\n<p>목소리는 차분했다.<\/p>\n<p>“오늘은 놓치지 않게.”<\/p>\n<h3>4. 첫 번째 검<\/h3>\n<p>심판이 손을 내렸다.<\/p>\n<p>“시작!”<\/p>\n<p>정파 대표가 먼저 움직였다. 검끝이 곧게 뻗었다. 찌르기를 피하면 곧장 내려베기가 이어지도록 짜인 정파의 정교한 초식이었다.<\/p>\n<p>하연은 반 걸음 옆으로 비켜섰다.<\/p>\n<p>목검이 그녀의 옷자락만 스쳤다. 정파 대표는 즉시 검을 돌려 두 번째 공격을 넣었다. 하연은 검을 들어 막지 않았다. 몸을 낮추며 상대의 팔꿈치 바깥으로 지나갔다.<\/p>\n<p>그리고 그의 어깨 보호구를 목검 끝으로 가볍게 두드렸다.<\/p>\n<p>탁.<\/p>\n<p>“유효!”<\/p>\n<p>정파 대표가 급히 돌아섰다. 하연은 이미 거리를 벌리고 있었다.<\/p>\n<p>“운이 좋군.” 그가 말했다.<\/p>\n<p>하연은 대답하지 않았다.<\/p>\n<p>두 번째 교차에서 그는 속도를 높였다. 검이 연달아 세 번 울었다. 하연은 첫 번째를 피하고, 두 번째를 흘리고, 세 번째가 끝나기도 전에 상대의 손목 위쪽 보호구에 검끝을 댔다.<\/p>\n<p>탁.<\/p>\n<p>“유효!”<\/p>\n<p>정파 관람석에서 웅성거림이 일었다.<\/p>\n<p>태경은 난간을 붙잡았다.<\/p>\n<p>“……방금 봤어?”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>하연은 정파 대표의 검을 힘으로 꺾지 않았다. 공격이 도달할 곳을 미리 비워 두고, 그가 돌아와야 할 자리에 먼저 있었다.<\/p>\n<p>그것은 빠르기만 한 검이 아니었다.<\/p>\n<p>상대의 움직임이 끝나는 자리를 아는 검이었다.<\/p>\n<h3>5. 정파 대표의 절초<\/h3>\n<p>정파 대표의 얼굴에서 여유가 사라졌다.<\/p>\n<p>그는 자세를 낮추고 두 손으로 목검을 단단히 잡았다. 정파 수련생들이 숨을 삼켰다. 대표 선발전에서 여러 상대를 무너뜨렸던 연속 초식의 시작이었다.<\/p>\n<p>“이번에는 피하지 못할 거다.”<\/p>\n<p>그가 땅을 박찼다.<\/p>\n<p>검이 정면에서 떨어졌다. 하연이 비켜서자 검로가 꺾였고, 꺾인 검은 곧장 옆구리를 향했다. 두 번째 공격을 피하면 세 번째가 퇴로를 막도록 짜인 검술이었다.<\/p>\n<p>하연은 첫 번째 검을 피했다.<\/p>\n<p>두 번째에는 목검을 비스듬히 대어 힘을 흘렸다.<\/p>\n<p>세 번째가 나오려는 순간, 그녀의 발이 앞으로 들어갔다.<\/p>\n<p>정파 대표의 검은 아직 돌아오는 중이었다.<\/p>\n<p>하연의 목검 끝이 그의 가슴 보호구 앞에서 멈췄다.<\/p>\n<p>탁.<\/p>\n<p>“유효!”<\/p>\n<p>그는 뒤로 물러났다. 검끝이 떨렸다.<\/p>\n<p>“다시.”<\/p>\n<p>하연은 심판을 바라봤다. 아직 승부는 끝나지 않았다. 그녀는 조용히 처음 자리로 돌아갔다.<\/p>\n<p>정파 대표는 같은 절초를 다시 펼쳤다. 이번에는 첫 공격을 속임수로 쓰고 아래쪽을 노렸다. 하연은 그가 무게를 싣는 발을 보더니, 아까와 반대편으로 움직였다.<\/p>\n<p>탁.<\/p>\n<p>또 한 번의 유효타.<\/p>\n<p>관람석이 조용해졌다.<\/p>\n<p>정파 대표는 더 이상 말을 하지 않았다. 그는 자신의 검이 느린 것인지, 하연의 검이 빠른 것인지조차 분간하지 못하는 얼굴이었다.<\/p>\n<p>서율은 숨을 죽였다.<\/p>\n<p>자신을 쓰러뜨린 검이었다. 그날 서율은 공격이 어디서 오는지 알고도 피하지 못했다. 그런데 하연은 그 검이 완성되기 전에 이미 다음 자리에 있었다.<\/p>\n<p><em>‘검을 따라가는 게 아니구나.’<\/em><\/p>\n<p>그는 무릎 위에서 왼손을 펼쳤다.<\/p>\n<p><em>‘사람이 움직일 수밖에 없는 자리를 보고 있어.’<\/em><\/p>\n<h3>6. 무너지는 체면<\/h3>\n<p>정파 대표는 마지막으로 거리를 좁혔다.<\/p>\n<p>이번에는 초식이 아니었다. 힘으로 상대의 목검을 누르고, 물러설 틈을 주지 않으려는 거친 공격이었다. 검이 부딪히는 소리가 대연무장에 울렸다.<\/p>\n<p>하연의 눈빛이 차가워졌다.<\/p>\n<p>“그날도 그랬나요?”<\/p>\n<p>그의 움직임이 잠깐 멈췄다.<\/p>\n<p>“무슨 소리지?”<\/p>\n<p>“상대가 더는 검을 제대로 쥐지 못할 때까지.”<\/p>\n<p>정파 대표의 표정이 굳었다.<\/p>\n<p>하연은 목소리를 높이지 않았다. 가까이 선 두 사람만 들을 수 있는 크기였다.<\/p>\n<p>“정파의 검이 원래 그런 건가요?”<\/p>\n<p>“비무 중의 부상은—”<\/p>\n<p>“알아요. 그 말은 충분히 들었어요.”<\/p>\n<p>그가 검을 세게 밀었다.<\/p>\n<p>하연은 맞서지 않았다. 손목의 힘을 풀고 검을 옆으로 흘렸다. 상대가 앞으로 쏠린 순간, 그의 검자루 바로 아래를 목검으로 쳐 올렸다.<\/p>\n<p>딱!<\/p>\n<p>정파 대표의 목검이 허공으로 튀었다.<\/p>\n<p>나무가 모래 위에 떨어지는 소리가 유난히 크게 들렸다.<\/p>\n<p>하연은 검끝을 그의 목 앞에서 멈췄다. 닿지 않았다. 다치게 할 필요도 없었다.<\/p>\n<p>심판이 손을 들었다.<\/p>\n<p>“승자, 진하연!”<\/p>\n<p>사파 관람석에서 환호가 터졌다. 그러나 정파 쪽은 한동안 아무 소리도 내지 못했다.<\/p>\n<p>정파 대표는 빈손으로 서 있었다. 그가 가장 자랑하던 절초는 여러 번 무력화됐고, 마지막에는 검까지 놓쳤다. 상대는 거친 공격을 받으면서도 한 번도 균형을 잃지 않았다.<\/p>\n<p>하연은 목검을 내리고 예를 갖췄다.<\/p>\n<p>“검을 놓쳤다고 해서 더 치지는 않겠습니다.”<\/p>\n<p>그 말은 조용했지만 가까운 관람석까지 닿았다.<\/p>\n<p>정파 대표의 얼굴이 붉어졌다. 그는 고개를 들지 못했다.<\/p>\n<p>하연은 더 말하지 않았다. 상대가 스스로 무엇을 잃었는지 알게 하는 것만으로 충분했다.<\/p>\n<h3>7. 승부 뒤의 얼굴들<\/h3>\n<p>“끝난 거야?” 태경이 멍하니 물었다.<\/p>\n<p>“응.” 소윤이 대답했다.<\/p>\n<p>“저렇게?”<\/p>\n<p>서율은 비무대를 바라보고 있었다.<\/p>\n<p>자신에게 상처를 입힌 사람이 졌다. 통쾌한 마음이 없지는 않았다. 그러나 하연의 마지막 일격보다 더 선명하게 남는 것은 그녀가 상대의 검을 받아들이지 않고 비워 낸 순간들이었다.<\/p>\n<p>그는 생각했다.<\/p>\n<p><em>‘나는 다음 동작을 억지로 만들려고 했어.’<\/em><\/p>\n<p>어젯밤 세 번째 걸음에서 넘어졌던 이유가 조금 보이는 듯했다. 다음 걸음이 정해져 있어야 한다고 믿었기에 몸이 무너졌다. 하연은 다음 걸음을 고집하지 않았다. 상대의 중심이 기울어지는 만큼만 움직였다.<\/p>\n<p>서율은 무릎 위에 놓인 왼손을 천천히 폈다.<\/p>\n<p>소윤은 그를 바라봤다. 모두가 승자를 보고 있을 때 서율은 이미 검이 지나간 자리를 다시 보고 있었다.<\/p>\n<p>그 모습이 이상하게 오래 눈에 남았다.<\/p>\n<p>대연무장 위쪽에서는 다른 종류의 침묵이 흘렀다.<\/p>\n<p>정파 대표의 가문에서 온 중년 남자가 자리에서 일어났다. 곁에 앉은 학관 관계자가 급히 그를 따라 나섰다.<\/p>\n<p>“오늘 비무의 결과는 인정합니다.” 중년 남자가 말했다.<\/p>\n<p>말은 정중했지만 목소리는 굳어 있었다.<\/p>\n<p>“다만 정파 대표가 저런 모습으로 내려왔다는 사실을 학관에서도 가볍게 보지는 않겠지요.”<\/p>\n<p>“물론입니다.”<\/p>\n<p>“대표 선발과 수련 과정 전반을 다시 살펴볼 필요가 있겠습니다.”<\/p>\n<p>학관 관계자는 선뜻 대답하지 못했다. 결승의 승패를 뒤집을 수는 없었다. 하지만 명문가가 체면을 잃었다는 사실은 다른 문제였다.<\/p>\n<p>조금 떨어진 회랑 그늘에서 한 남학생이 그 대화를 듣고 있었다.<\/p>\n<p>어젯밤 제삼 연무장에서 하연과 서율이 함께 웃는 모습을 지켜봤던 바로 그 남학생이었다.<\/p>\n<p>그는 정파 대표가 목검을 놓치는 장면보다, 승리한 하연이 관람석 아래쪽을 한 번 훑어보는 모습을 더 오래 기억했다.<\/p>\n<p>그녀의 시선이 잠시 멈춘 곳에는 붕대를 감은 전서율이 있었다.<\/p>\n<p>남학생은 입술을 깨물었다.<\/p>\n<p><em>‘또 저놈인가.’<\/em><\/p>\n<p>아직 누구와도 말을 나누지 않았다. 그러나 그의 마음속에서는 이미 서율의 이름이 불쾌한 표식처럼 남아 있었다.<\/p>\n<h3>8. 알고 있어<\/h3>\n<p>비무가 끝나고 사람들이 흩어질 때, 태경은 간식을 구하겠다며 달려갔다. 소윤은 수첩을 품에 안고 서율 옆에 남았다.<\/p>\n<p>“손은 괜찮아?”<\/p>\n<p>“응. 오늘은 아무것도 안 했잖아.”<\/p>\n<p>“눈으로는 엄청 했지.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“그건 맞아.”<\/p>\n<p>그때 하연이 한서린과 함께 다가왔다. 조금 전까지 비무대에서 상대를 몰아붙이던 사람이라고 믿기 어려울 만큼 평온한 얼굴이었다. 다만 서율은 그녀가 평소보다 말이 적다는 것을 알아차렸다.<\/p>\n<p>“축하해.” 그가 말했다.<\/p>\n<p>“고마워.”<\/p>\n<p>“정말 대단했어.”<\/p>\n<p>하연은 잠시 그를 바라봤다.<\/p>\n<p>“네 손을 다치게 한 사람이잖아.”<\/p>\n<p>서율은 대답하지 못했다.<\/p>\n<p>“그래서 화가 났어.” 하연이 덧붙였다. “정파라고 하면 적어도 지켜야 할 게 있다고 생각했거든.”<\/p>\n<p>서율은 비무대를 돌아봤다.<\/p>\n<p>“나도 그렇게 생각해.”<\/p>\n<p>“그런데도 정파에서 배우는 걸 계속 좋아하네.”<\/p>\n<p>“그 사람이 정파의 전부는 아니니까.”<\/p>\n<p>하연의 표정이 조금 누그러졌다.<\/p>\n<p>“그런 대답을 할 줄 알았어.”<\/p>\n<p>한서린이 두 사람을 번갈아 봤다.<\/p>\n<p>“잠깐. 설마 결승 끝나자마자 또 검 이야기하려는 건 아니지?”<\/p>\n<p>“조금만.” 하연이 말했다.<\/p>\n<p>“그 말 어제도 했잖아!”<\/p>\n<p>소윤이 웃었다. 서율도 웃었다. 하연은 어쩐지 그 웃음 속에 자연스럽게 끼어들지 못하고 한 걸음 떨어져 서 있었다.<\/p>\n<p>하연이 물었다.<\/p>\n<p>“어제 네가 넘어지던 이유, 오늘은 조금 알겠어?”<\/p>\n<p>서율은 눈을 크게 떴다.<\/p>\n<p>“응. 나는 검이 갈 길을 미리 정해 놓고 발을 거기로 보내려고 했어. 그런데 너는 상대가 움직인 다음에야 길을 정하는 것 같았어.”<\/p>\n<p>“정확히는 그 전에 보기도 하지만.”<\/p>\n<p>“그러니까. 그게 아직 잘 안 돼.”<\/p>\n<p>“당연하지. 한 번 봤다고 되면 내가 억울하잖아.”<\/p>\n<p>하연이 웃었다.<\/p>\n<p>서율은 잠시 망설이다가 물었다.<\/p>\n<p>“그런데 너는 어떻게 어제 내가 하려던 걸 알아봤어?”<\/p>\n<p>“세 번이나 같은 자리에서 넘어졌잖아. 그냥 발이 꼬인 사람은 세 번 다 똑같이 넘어지지 않아.”<\/p>\n<p>그녀는 서율의 왼손을 내려다봤다.<\/p>\n<p>“너는 틀린 걸 반복하는 게 아니라, 무언가를 확인하고 있었어. 아직 검술이라고 부를 단계는 아니지만.”<\/p>\n<p>“그렇게까지 봤어?”<\/p>\n<p>“응.”<\/p>\n<p>하연은 더 설명하지 않았다. 그 움직임이 얼마나 멀리 갈 수 있을지는 그녀도 몰랐다. 다만 정해진 초식을 흉내 내는 눈이 아니라, 움직임의 이유를 끝까지 붙드는 눈이라는 것만은 알았다.<\/p>\n<p>“너는 그날 왜 네가 생각하던 움직임을 안 썼어?”<\/p>\n<p>서율은 부목을 내려다봤다.<\/p>\n<p>“아직 불완전하니까. 실전에서 잘못 쓰면 위험하고, 무엇보다 정파에서 배운 것도 제대로 익히지 못했어.”<\/p>\n<p>“그래도 승부가 조금 달라졌을 수는 있겠지.”<\/p>\n<p>“이겼을 거라는 뜻은 아니지?”<\/p>\n<p>“물론. 상대는 강했어. 오늘 내가 쉽게 이겼다고 해서 그 사실이 없어지는 건 아니야.”<\/p>\n<p>하연은 잠시 말을 고르더니 덧붙였다.<\/p>\n<p>“하지만 네가 할 수 있는 게 배운 초식뿐이라고 생각하지는 마.”<\/p>\n<p>서율은 한동안 침묵했다.<\/p>\n<p>“알고 있어.”<\/p>\n<p>“뭘?”<\/p>\n<p>“다른 길이 있을지도 모른다는 거. 그런데 나는 정파의 가르침을 버리고 싶지는 않아.”<\/p>\n<p>“버리라고 한 적 없어.”<\/p>\n<p>“응. 그래서 더 고민돼.”<\/p>\n<p>그의 말에는 억울함보다 진지함이 더 많았다. 하연은 그 얼굴을 보며 자신도 모르게 웃었다. 이 사람은 손가락이 부러지고도 누가 더 강한지만 묻지 않았다. 무엇이 옳고, 왜 움직여야 하는지를 궁금해했다.<\/p>\n<p>한서린이 하연의 소매를 잡아당겼다.<\/p>\n<p>“진짜 가야 해. 애들 다 기다려.”<\/p>\n<p>“알았어.”<\/p>\n<p>하연은 서율에게 말했다.<\/p>\n<p>“손 나으면 네가 찾은 움직임 보여 줘. 내가 대신 만들어 주지는 못해도, 보고 이야기할 수는 있으니까.”<\/p>\n<p>“언제 나을지 모르는데.”<\/p>\n<p>“그럼 나을 때까지 기다려.”<\/p>\n<p>그녀는 소윤에게도 인사를 건넸다. 소윤은 밝게 답했다.<\/p>\n<p>“오늘 정말 멋있었어요.”<\/p>\n<p>“고마워. 서율이 손 좀 잘 봐 줘.”<\/p>\n<p>“그건 제가 계속하고 있어요.”<\/p>\n<p>소윤의 대답은 아무렇지도 않았다. 하연도 웃으며 고개를 끄덕였다.<\/p>\n<p>그러나 두 사람이 나란히 서 있는 모습이 눈에 들어왔다. 소윤은 서율의 붕대가 느슨해진 것까지 알아채고 손을 뻗어 매듭을 확인했다. 서율은 익숙하게 팔을 내밀었다. 두 사람 사이에는 설명이 필요 없는 시간이 쌓여 있었다.<\/p>\n<p>하연은 자신이 그 사이에 끼어들 자리는 없을지도 모른다고 생각했다.<\/p>\n<p>그것은 소윤이나 서율이 그녀를 밀어낸 탓이 아니었다. 하연 혼자 그렇게 느낀 것이었다.<\/p>\n<p>“다음에 봐.”<\/p>\n<p>그녀는 평소처럼 웃으며 돌아섰다.<\/p>\n<p>한서린이 곁에서 작게 물었다.<\/p>\n<p>“너, 왜 갑자기 조용해졌어?”<\/p>\n<p>“그냥. 오늘 좀 피곤해서.”<\/p>\n<p>하연은 대답하고 걸음을 재촉했다.<\/p>\n<h3>9. 수첩에 남은 사람<\/h3>\n<p>저녁이 되자 태경은 결승의 마지막 장면을 몇 번이고 흉내 냈다.<\/p>\n<p>“이렇게 들어와서, 탁! 검이 날아갔다니까!”<\/p>\n<p>“네가 그렇게 하면 네 검부터 날아갈걸.” 서율이 말했다.<\/p>\n<p>“한 번쯤은 멋있게 받아 주면 안 되냐?”<\/p>\n<p>소윤은 웃으며 두 사람을 지켜봤다. 서율이 왼손으로 젓가락을 서툴게 움직이자, 태경이 말없이 반찬 접시를 가까이 밀어 주었다. 세 사람에게는 이런 일이 특별하지 않았다.<\/p>\n<p>밤에 소윤은 혼자 수첩을 펼쳤다.<\/p>\n<p><em>오늘 정사 대표 결승에서 진하연 언니가 이겼다. 정파 대표는 끝내 검을 놓쳤다. 많은 사람이 놀랐고, 태경이는 입을 다물지 못했다.<\/em><\/p>\n<p>그녀는 한 줄을 비우고 다시 적었다.<\/p>\n<p><em>서율이는 그 장면을 보고도 상대를 비웃지 않았다. 나는 조금 통쾌했는데, 서율이는 검이 움직인 길을 계속 생각했다.<\/em><\/p>\n<p>또 한 줄.<\/p>\n<p><em>오늘도 오른손이 아파 보였다. 그런데 하연 언니와 검 이야기를 할 때는 아픈 것도 잊은 사람처럼 웃었다.<\/em><\/p>\n<p>소윤은 붓을 멈췄다. 오늘의 승부를 적으려 했는데 어느새 서율의 표정과 말이 더 많아져 있었다.<\/p>\n<p>그녀는 그저 가까운 친구라서 그렇다고 생각했다. 손이 다친 뒤로 걱정할 일이 많아졌으니까. 그렇게 설명하면 충분했다.<\/p>\n<p><em>내일은 의원에게 언제 부목을 풀 수 있는지 다시 물어봐야겠다.<\/em><\/p>\n<p>마지막 문장을 적고 수첩을 덮었다.<\/p>\n<p>한편 사파 생활관에서는 한서린이 하연의 침상 끝에 걸터앉아 있었다.<\/p>\n<p>“너 오늘 이겨 놓고 왜 기쁜 얼굴이 아니야?”<\/p>\n<p>“기뻐.”<\/p>\n<p>“그런데?”<\/p>\n<p>“그냥 생각할 게 있어.”<\/p>\n<p>“검?”<\/p>\n<p>하연은 잠시 대답하지 않았다.<\/p>\n<p>한서린이 눈을 가늘게 떴다.<\/p>\n<p>“설마 또 전서율?”<\/p>\n<p>“……린.”<\/p>\n<p>“아니면 아니라고 하면 되지.”<\/p>\n<p>하연은 창밖으로 고개를 돌렸다. 대연무장의 깃발은 어둠 속에서 보이지 않았다. 대신 저녁 연무장에 혼자 남아 세 번째 걸음을 되풀이하던 서율의 모습이 떠올랐다.<\/p>\n<p>그녀는 그가 어떤 검을 만들지 궁금했다.<\/p>\n<p>그가 다시 웃는 모습을 보고 싶기도 했다.<\/p>\n<p>두 마음의 경계가 어디인지, 하연은 아직 남에게 말할 생각이 없었다.<\/p>\n<p>그리고 정파 대표의 가문에서는 그날의 패배를 단순한 패배로 끝낼 생각이 없었다.<\/p>\n<p>승부는 끝났다.<\/p>\n<p>하지만 비무대 밖에서 시작될 일들은 아직 누구도 알지 못했다.<\/p>\n<p><strong>— 제12장 「알고 있어」 끝.<\/strong><\/p>\n"}, {"n": 13, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제13장. 말하지 못한 것<\/h2>\n<h3>1. 검이 떨어진 자리<\/h3>\n<p>결승이 끝난 다음 날, 대연무장의 모래는 새로 고르게 펴져 있었다.<\/p>\n<p>전서율은 난간 앞에 서서 한동안 아무 말도 하지 않았다. 어제 진하연의 검이 정파 대표의 목검을 쳐 올린 자리는 이미 사라졌다. 나무가 모래 위에 떨어지던 소리만은 여전히 귓가에 남아 있었다.<\/p>\n<p>“야, 전서율.”<\/p>\n<p>윤태경이 종이 봉투를 그의 눈앞에 흔들었다.<\/p>\n<p>“여기서 또 검 생각하냐?”<\/p>\n<p>“조금.”<\/p>\n<p>“나는 어제부터 그놈 얼굴만 생각나는데.”<\/p>\n<p>태경은 떡 하나를 꺼내 입에 물었다. 그가 말하는 ‘그놈’이 누구인지는 묻지 않아도 알았다.<\/p>\n<p>“검을 놓친 다음에도 멀쩡히 서 있더라. 네 손을 그렇게 만들고도 말이야.”<\/p>\n<p>서율은 붕대 감긴 오른손을 내려다봤다. 부목을 댄 두 손가락은 여전히 움직일 수 없었다.<\/p>\n<p>“하연이가 더 때리지 않았잖아.”<\/p>\n<p>“그래서 더 속이 시원했어.”<\/p>\n<p>태경이 씹던 떡을 삼켰다.<\/p>\n<p>“상대가 검을 놓쳤으면 거기서 끝내는 거. 그게 원래 비무 아니냐?”<\/p>\n<p>“응.”<\/p>\n<p>“근데 저놈은 너한테 안 그랬지.”<\/p>\n<p>서율은 대답하지 않았다. 하연이 마지막에 남긴 말이 떠올랐다.<\/p>\n<p><em>검을 놓쳤다고 해서 더 치지는 않겠습니다.<\/em><\/p>\n<p>그 말은 승자의 자랑이 아니었다. 자신을 다치게 한 사람에게도 지켜야 할 선이 있다는 선언처럼 들렸다.<\/p>\n<p>“네가 대신 화내 준 사람 같았어.” 태경이 중얼거렸다.<\/p>\n<p>“내가 부탁한 건 아닌데.”<\/p>\n<p>“알아. 그래서 더 고마운 거지.”<\/p>\n<p>서율은 왼손으로 떡을 받아 들었다. 따뜻한 떡에서는 단내가 났다.<\/p>\n<p>그는 하연이 자신 때문에 싸웠다고 단정하고 싶지 않았다. 하연에게는 사파 대표로서의 자존심도, 자신의 검도 있었다. 하지만 어제 그녀가 비무대에서 왜 그렇게 차가운 얼굴을 했는지는 이제 조금 알 것 같았다.<\/p>\n<h3>2. 체면이라는 이름<\/h3>\n<p>같은 시각, 학관의 접견실에서는 찻물이 두 번이나 식었다.<\/p>\n<p>정파 대표의 가문에서 온 중년 남자는 찻잔에 손을 대지 않았다. 맞은편의 학관 책임자는 낮은 목소리로 말했다.<\/p>\n<p>“승부는 정해진 규정에 따라 진행됐습니다.”<\/p>\n<p>“승부를 뒤집으라는 말이 아닙니다.”<\/p>\n<p>중년 남자의 목소리는 정중했다.<\/p>\n<p>“정파를 대표하도록 선발한 아이가 수많은 사람 앞에서 검을 놓쳤습니다. 그것도 사파 대표에게. 학관이 그 결과를 어떻게 받아들이는지 묻는 겁니다.”<\/p>\n<p>“대표 선발 과정에는 문제가 없었습니다.”<\/p>\n<p>“그렇다면 수련 과정에 문제가 있었다는 뜻입니까?”<\/p>\n<p>책임자는 입을 다물었다.<\/p>\n<p>중년 남자는 탁자 위에 놓인 보고서를 손끝으로 밀었다. 정파 대표 선발전의 기록이었다. 그중 전서율과의 비무 항목에 붉은 표시가 남아 있었다.<\/p>\n<p>“이 아이의 부상은 이미 검토가 끝났다고 들었습니다.”<\/p>\n<p>“그렇습니다. 비무 중 사고로 처리됐습니다.”<\/p>\n<p>“그런데 결승에서 사파 대표가 그 일을 암시하는 말을 했다는 증언이 있습니다. 사소한 사고가 정파 전체의 명예를 더럽히는 구실이 되어서는 곤란합니다.”<\/p>\n<p>학관 책임자는 보고서를 내려다봤다.<\/p>\n<p>“학도생들 사이의 사적인 교류까지 통제할 수는 없습니다.”<\/p>\n<p>“통제하라고 한 적 없습니다. 다만 누가 정파의 이름을 등에 업고 다니는지, 누구와 어울리는지, 교육의 질서를 흐리는 일이 없는지 살펴 달라는 겁니다.”<\/p>\n<p>중년 남자는 그제야 식은 차를 한 모금 마셨다.<\/p>\n<p>“가문의 이름이 걸린 일입니다. 조용히 끝낼 수 있다면 좋겠군요.”<\/p>\n<p>그가 떠난 뒤에도 책임자는 한참 동안 보고서를 덮지 못했다.<\/p>\n<p>학관 안의 모든 교두가 그 말에 동의하는 것은 아니었다. 그러나 누구도 가문의 항의를 가벼운 불평으로 취급할 수 없었다.<\/p>\n<h3>3. 일기장의 빈자리<\/h3>\n<p>백소윤은 수업이 끝난 뒤 수첩을 펼쳤다.<\/p>\n<p>원래는 오늘 배운 심법의 구절을 정리하려던 참이었다. 그런데 붓을 들자 가장 먼저 떠오른 것은 아침 식당에서 서율이 젓가락을 놓친 일이었다.<\/p>\n<p><em>오늘 서율이는 왼손으로 국그릇을 잡다가 조금 흘렸다. 태경이가 놀렸고, 서율이는 웃었다. 웃을 때는 손이 덜 아픈 것처럼 보인다.<\/em><\/p>\n<p>소윤은 문장을 읽어 보고 고개를 갸웃했다.<\/p>\n<p><em>왜 이것부터 적었지?<\/em><\/p>\n<p>앞장을 넘겨 보았다. 처음에는 자신의 수업과 식사, 친구 셋이 함께 겪은 일이 고르게 적혀 있었다. 최근 며칠의 기록은 달랐다. 서율의 부상, 서율이 먹지 못한 음식, 서율이 혼자 남아 연습한 밤, 서율이 하연의 검을 보며 웃었던 얼굴.<\/p>\n<p>태경의 이름도 있었지만 전보다 짧았다.<\/p>\n<p>소윤은 괜히 종이를 넘겨 빈 곳을 찾았다.<\/p>\n<p>“뭐 그렇게 열심히 써?”<\/p>\n<p>태경이 옆자리에 털썩 앉았다.<\/p>\n<p>“오늘 일.”<\/p>\n<p>“오늘은 별일 없었는데?”<\/p>\n<p>“그러니까 적어 두는 거야. 별일 없던 날도 나중엔 기억이 안 나니까.”<\/p>\n<p>태경은 수첩을 들여다보려다 소윤의 눈치를 보고 멈췄다.<\/p>\n<p>“서율이는?”<\/p>\n<p>“의원한테 갔어. 손 상태 확인한다고.”<\/p>\n<p>“또 혼자 갔어?”<\/p>\n<p>“응. 이번에는 네가 따라가지 말래.”<\/p>\n<p>태경이 코웃음을 쳤다.<\/p>\n<p>“내가 따라가면 또 검을 묶을 방법이나 묻는다고 생각하나 보지.”<\/p>\n<p>“실제로 물었잖아.”<\/p>\n<p>“한 번!”<\/p>\n<p>소윤이 웃었다. 그러다 자신도 모르게 문 쪽을 돌아봤다.<\/p>\n<p>서율이 돌아올 시간이 조금 늦었다는 이유만으로.<\/p>\n<p>그녀는 그 행동에 특별한 이름을 붙이지 않았다.<\/p>\n<h3>4. 축하의 뒤편<\/h3>\n<p>사파 생활관에서는 승리의 이야기가 아직 끝나지 않았다.<\/p>\n<p>“정파 대표의 절초를 두 번이나 똑같이 막았다니까!”<\/p>\n<p>한서린이 탁자를 두드렸다.<\/p>\n<p>“똑같이는 아니었어.” 진하연이 대답했다.<\/p>\n<p>“알아, 알아. 네가 두 번째는 반대로 돌았다는 거. 근데 보는 사람한텐 그냥 아무것도 못 하게 만든 것처럼 보였다고.”<\/p>\n<p>하연은 웃었지만, 기뻐하는 얼굴은 오래가지 않았다.<\/p>\n<p>한서린이 그 변화를 놓치지 않았다.<\/p>\n<p>“아직도 화났어?”<\/p>\n<p>“조금.”<\/p>\n<p>“이겼잖아.”<\/p>\n<p>“이겼다고 없던 일이 되는 건 아니니까.”<\/p>\n<p>하연은 창밖을 바라봤다. 결승에서 상대가 검을 놓친 순간, 자신은 더 치지 않았다. 그게 당연하다고 믿었다. 그런데 전서율에게는 그 당연한 일이 허락되지 않았다.<\/p>\n<p>“서율이 손은 괜찮대?” 한서린이 물었다.<\/p>\n<p>“오늘 의원한테 간다던데.”<\/p>\n<p>“그걸 어떻게 알아?”<\/p>\n<p>“어제 얘기했어.”<\/p>\n<p>한서린이 천천히 웃었다.<\/p>\n<p>“너 요즘 그 애 일은 참 잘 알더라.”<\/p>\n<p>“린.”<\/p>\n<p>“응, 알아. 검이 재미있는 애라서 그렇지?”<\/p>\n<p>하연은 대꾸하지 않았다.<\/p>\n<p>처음에는 정말 그랬다. 다친 손으로도 검을 놓지 못하는 사람인 줄 알았는데, 검을 잡지 말라는 말을 지키면서도 검이 지나갈 길을 고민하고 있었다. 세 번 넘어져도 같은 질문을 놓지 않는 사람이었다.<\/p>\n<p>그런데 이제는 그가 검 이야기를 하지 않을 때의 표정도 떠올랐다. 태경에게 놀림받을 때의 어이없는 얼굴, 소윤이 붕대를 고쳐 매 주면 당연하다는 듯 팔을 내미는 모습.<\/p>\n<p>하연은 그런 생각을 하는 자신이 낯설었다.<\/p>\n<p>“그 애한테는 늘 같이 다니는 친구들이 있잖아.”<\/p>\n<p>한서린이 눈썹을 올렸다.<\/p>\n<p>“그게 왜?”<\/p>\n<p>“아니. 그냥.”<\/p>\n<p>하연은 물잔을 들었다.<\/p>\n<p>자신이 그들 사이에 끼어들 자리가 없을 것 같다는 말은 하지 않았다. 그 생각이 사실인지조차 확인해 본 적 없었다.<\/p>\n<h3>5. 다른 쪽 복도<\/h3>\n<p>오후 강론이 끝난 뒤, 전서율은 정파 수련관과 사파 수련관을 잇는 회랑에서 하연을 마주쳤다.<\/p>\n<p>“전서율.”<\/p>\n<p>“어, 안녕.”<\/p>\n<p>하연은 먼저 그의 오른손을 봤다.<\/p>\n<p>“의원은 뭐래?”<\/p>\n<p>“조금 더 쉬래. 부목도 그대로고.”<\/p>\n<p>“잘됐네.”<\/p>\n<p>“뭐가?”<\/p>\n<p>“몰래 검 잡을 핑계가 없어졌잖아.”<\/p>\n<p>“그런 생각 안 했다니까.”<\/p>\n<p>“네가 안 한다고 해도 주변에서 걱정하겠지.”<\/p>\n<p>한서린이 하연의 뒤에서 고개를 끄덕였다.<\/p>\n<p>“맞아. 듣자 하니 친구 둘이 아주 고생하던데.”<\/p>\n<p>서율은 웃었다.<\/p>\n<p>그때 회랑 건너편에서 정파 학도생 둘이 걸어왔다. 그중 하나가 서율을 알아보고 발걸음을 늦췄다.<\/p>\n<p>“정파 강론당은 반대편인데.”<\/p>\n<p>“알아.” 서율이 대답했다.<\/p>\n<p>“요즘 사파 대표하고 자주 보이네. 어제 일 때문에 정파 사람들 시선이 곱지 않은데, 조심하는 게 좋지 않겠어?”<\/p>\n<p>하연의 눈빛이 굳었다.<\/p>\n<p>“무슨 뜻이지?”<\/p>\n<p>“별뜻 없습니다. 학관 안에서 소문이 빠르다는 말입니다.”<\/p>\n<p>남학생은 정중하게 고개를 숙이고 지나갔다.<\/p>\n<p>서율은 그 뒷모습을 바라봤다. 딱히 잘못한 일은 없었다. 그런데도 잠깐 자신이 어디에 서 있는지 의식하게 됐다.<\/p>\n<p>“신경 쓰지 마.” 하연이 말했다.<\/p>\n<p>“응. 그런데 나 강론 늦겠다.”<\/p>\n<p>“그래. 가.”<\/p>\n<p>서율은 서둘러 발걸음을 옮겼다.<\/p>\n<p>하연은 그가 멀어질 때까지 바라봤다. 방금 남학생이 한 말보다, 서율이 자신의 눈치를 보는 것처럼 급히 떠난 모습이 더 마음에 걸렸다.<\/p>\n<p>한서린이 옆에서 중얼거렸다.<\/p>\n<p>“이제 대놓고 저런 소리를 하네.”<\/p>\n<p>하연은 대답하지 않았다.<\/p>\n<h3>6. 처음 움직이는 손<\/h3>\n<p>그날 저녁, 정파 대표는 아무도 없는 수련실에 앉아 있었다.<\/p>\n<p>목검은 벽에 기대어 있었다. 그는 그 검을 쳐다보지 않았다.<\/p>\n<p>문이 열리고 한 남학생이 들어왔다. 결승 전날 제삼 연무장 담장 뒤에서 하연과 서율을 지켜봤던 사람이었다.<\/p>\n<p>“무슨 일이지?” 정파 대표가 물었다.<\/p>\n<p>“학관에서 소문이 돌고 있습니다.”<\/p>\n<p>“무슨 소문.”<\/p>\n<p>“사파 대표가 그날 비무를 문제 삼아 일부러 당신을 망신 줬다는 이야기입니다.”<\/p>\n<p>정파 대표의 턱이 굳었다.<\/p>\n<p>“그래서?”<\/p>\n<p>“그 여자와 자주 어울리는 정파 학도생이 있습니다. 전서율이라고.”<\/p>\n<p>정파 대표가 처음으로 고개를 들었다.<\/p>\n<p>“그놈?”<\/p>\n<p>“예. 손을 다쳤던.”<\/p>\n<p>잠깐 침묵이 흘렀다.<\/p>\n<p>“그놈이 뭘 했다는 거지?”<\/p>\n<p>“아직은 아무것도요. 하지만 사파 대표는 그놈 앞에서만 유난히 오래 머뭅니다. 결승 전날에도 둘이 단둘이 있었습니다.”<\/p>\n<p>정파 대표는 목검을 쳐다봤다. 모래 위에 검을 떨어뜨렸던 감각이 다시 손바닥에 살아났다.<\/p>\n<p>“그래서 나더러 그놈한테 화풀이하라는 건가?”<\/p>\n<p>“그럴 필요까지는 없지요.”<\/p>\n<p>남학생은 한 걸음 가까이 왔다.<\/p>\n<p>“학관은 정파의 질서를 중요하게 여깁니다. 정파 수련생이 사파 대표와 가까워지는 일을 반가워하지 않는 사람도 많습니다. 가문에서도 이번 일을 신경 쓰고 계시고요.”<\/p>\n<p>정파 대표는 한참 동안 그를 바라봤다.<\/p>\n<p>“네가 원하는 건 뭔데?”<\/p>\n<p>남학생은 잠시 대답을 골랐다.<\/p>\n<p>“그놈이 더는 그녀 곁을 얼쩡거리지 않는 겁니다.”<\/p>\n<p>그 말에 정파 대표의 입가가 비뚤어졌다.<\/p>\n<p>“이유가 고작 그거야?”<\/p>\n<p>“당신에게는 다른 이유가 있겠지요.”<\/p>\n<p>두 사람은 서로를 믿지 않았다. 그러나 같은 이름을 불편하게 여기고 있다는 사실만은 확인했다.<\/p>\n<p>“학관 안에서 눈에 띄게 움직이지 마.” 정파 대표가 말했다. “괜히 일을 키우면 가문에서도 싫어할 테니까.”<\/p>\n<p>“알겠습니다.”<\/p>\n<p>“먼저 저놈이 어디서 뭘 배우는지, 누구와 다니는지 알아봐.”<\/p>\n<p>남학생이 고개를 숙였다.<\/p>\n<p>문이 닫힌 뒤 정파 대표는 손을 뻗어 목검을 집었다. 손잡이를 쥔 손에 힘이 들어갔다.<\/p>\n<p>그가 잃어버린 것은 한 번의 승부가 아니었다. 적어도 그는 그렇게 믿었다.<\/p>\n<h3>7. 사과가 아닌 말<\/h3>\n<p>다음 날, 전서율은 사파 수련관 앞에서 진하연을 기다렸다.<\/p>\n<p>그가 복도에서 갑자기 떠난 뒤 하연의 표정이 어딘가 어두워졌다는 이야기를 소윤에게 들었기 때문이다.<\/p>\n<p>“네가 수업에 늦을까 봐 간 건 알아도, 하연 언니는 다른 뜻으로 받아들였을 수도 있잖아.”<\/p>\n<p>소윤은 그렇게 말했다.<\/p>\n<p>“다른 뜻?”<\/p>\n<p>“사람들 앞에서 같이 있는 게 싫어진 줄 알 수도 있지.”<\/p>\n<p>서율은 한참 생각하다 고개를 끄덕였다.<\/p>\n<p>하연이 모습을 드러낸 것은 해가 기울 무렵이었다.<\/p>\n<p>“전서율? 여기서 뭐 해?”<\/p>\n<p>“너 기다렸어.”<\/p>\n<p>“나를?”<\/p>\n<p>“응. 어제 내가 갑자기 가 버려서.”<\/p>\n<p>하연의 얼굴에 잠깐 놀란 기색이 스쳤다.<\/p>\n<p>“수업 때문이었잖아.”<\/p>\n<p>“맞아. 그런데 네가 불편했을 수도 있다고 해서.”<\/p>\n<p>“누가?”<\/p>\n<p>“소윤이가.”<\/p>\n<p>하연은 대답하지 않았다. 역시 소윤은 그가 무슨 생각을 하는지 잘 아는 사람이었다.<\/p>\n<p>“나는 네가 사파라서 피한 게 아니야.” 서율이 말했다. “그런 소문 때문에 너랑 말하지 못하게 되는 것도 싫고.”<\/p>\n<p>하연은 천천히 숨을 내쉬었다.<\/p>\n<p>“나도 네가 그런 사람이라고 생각하진 않아.”<\/p>\n<p>“그럼 다행이다.”<\/p>\n<p>“다만 네가 곤란해질까 봐.”<\/p>\n<p>“곤란해지는 건 내가 판단할게.”<\/p>\n<p>서율은 멋쩍게 웃었다.<\/p>\n<p>“사실 아직 어떻게 해야 할지는 잘 모르지만.”<\/p>\n<p>하연도 웃었다.<\/p>\n<p>“너는 모른다는 말을 참 쉽게 하네.”<\/p>\n<p>“모르는 게 많으니까.”<\/p>\n<p>두 사람은 수련관 앞에서 잠시 나란히 걸었다. 서율은 다친 손을 소매 안에 넣고, 하연은 평소보다 걸음을 조금 늦췄다.<\/p>\n<p>“손 나으면 뭘 먼저 할 거야?” 하연이 물었다.<\/p>\n<p>“정파 기본 검식부터.”<\/p>\n<p>“네가 찾던 흐름은?”<\/p>\n<p>“그것도 계속 생각할 거야. 하지만 기본을 버리지는 않을래.”<\/p>\n<p>하연은 고개를 끄덕였다.<\/p>\n<p>“좋아. 네가 어디까지 갈지 궁금해.”<\/p>\n<p>그 말에 서율이 웃었다.<\/p>\n<p>“아직 시작도 못 했는데.”<\/p>\n<p>“그러니까 궁금한 거지.”<\/p>\n<p>하연은 그 말을 하고 나서야 자신이 검술만 궁금한 것은 아니라는 생각을 했다.<\/p>\n<p>하지만 그 마음은 입 밖에 내지 않았다.<\/p>\n<h3>8. 세 사람의 저녁<\/h3>\n<p>서율이 청운관으로 돌아오자 태경이 문 앞에 쪼그리고 앉아 있었다.<\/p>\n<p>“어디 갔다 와?”<\/p>\n<p>“하연이 만나고.”<\/p>\n<p>“또?”<\/p>\n<p>“또라니.”<\/p>\n<p>“요즘 너는 검 얘기하러 사파까지 원정 가냐?”<\/p>\n<p>소윤이 뒤에서 나타났다.<\/p>\n<p>“태경아, 네가 먼저 가서 기다린 거잖아. 왜 서율이한테 화내?”<\/p>\n<p>“화낸 거 아니거든.”<\/p>\n<p>서율이 웃었다. 태경도 결국 웃었다.<\/p>\n<p>셋은 식당에서 남은 반찬을 나눠 먹었다. 서율이 왼손으로 그릇을 잡는 동안 태경이 국을 떠 주고, 소윤은 의원이 알려 준 주의사항을 다시 설명했다.<\/p>\n<p>“이 정도면 너희 둘이 의원 해도 되겠다.”<\/p>\n<p>“그러면 네가 첫 환자지.” 태경이 말했다.<\/p>\n<p>“무료로 봐 줄게.” 소윤이 덧붙였다.<\/p>\n<p>“그건 고맙네.”<\/p>\n<p>평소와 같은 저녁이었다. 그래서 서율은 누군가 자신들의 수업 시간과 이동 경로를 알아보고 있다는 사실을 전혀 눈치채지 못했다.<\/p>\n<p>소윤은 밤에 일기장을 펼쳤다.<\/p>\n<p><em>오늘은 별일 없었다.<\/em><\/p>\n<p>그렇게 적었다가 문장을 지웠다.<\/p>\n<p><em>서율이는 하연 언니를 만나고 돌아왔다. 둘이 무슨 말을 했는지는 묻지 않았다. 다만 돌아왔을 때 표정이 편안해 보여서 다행이었다.<\/em><\/p>\n<p>그녀는 잠시 붓을 내려놓았다.<\/p>\n<p><em>요즘은 내가 겪은 일보다 서율이가 겪은 일을 더 많이 적는 것 같다.<\/em><\/p>\n<p>소윤은 그 문장을 한참 바라보다가 지우지 않았다.<\/p>\n<p>그것이 무엇을 뜻하는지는 아직 알지 못했다.<\/p>\n<p>같은 밤, 사파 생활관에서 하연은 한서린의 질문에 대답하지 못하고 있었다.<\/p>\n<p>“너 오늘도 전서율 만났지?”<\/p>\n<p>“응.”<\/p>\n<p>“좋았어?”<\/p>\n<p>하연은 창밖을 바라봤다.<\/p>\n<p>“……그냥, 얘기하기 편했어.”<\/p>\n<p>한서린은 더 캐묻지 않았다.<\/p>\n<p>하연은 서율이 자신을 피하지 않았다는 사실에 안도하면서도, 그에게는 돌아가면 기다려 주는 두 친구가 있다는 사실을 떠올렸다. 그들 사이에 쌓인 시간을 자신이 대신할 수 없다는 생각이 들었다.<\/p>\n<p>그녀는 그 마음을 누구에게도 말하지 않았다.<\/p>\n<p>정파의 회랑에서는 늦은 시간까지 불이 꺼지지 않았다. 누군가는 서율의 수련반과 출석 기록을 살폈고, 누군가는 학관의 규율을 적은 서책을 펼쳤다.<\/p>\n<p>아직 서율에게 직접 닥친 일은 없었다.<\/p>\n<p>하지만 비무대에서 떨어진 목검 하나가, 이제는 세 사람의 평범한 저녁까지 흔들 준비를 하고 있었다.<\/p>\n<p><strong>— 제13장 「말하지 못한 것」 끝.<\/strong><\/p>\n"}, {"n": 14, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제14장. 괜히 신경 쓰이는 사람<\/h2>\n<h3>1. 자리가 없어진 아침<\/h3>\n<p>전서율이 식당에 들어섰을 때, 늘 앉던 긴 탁자에는 낯선 학도생 셋이 앉아 있었다.<\/p>\n<p>“여기 앉아도 될까요?”<\/p>\n<p>서율의 물음에 가장 안쪽에 앉은 남학생이 천천히 고개를 들었다. 제일 연무장에서 자주 보던 얼굴이었다. 정파 대표와 함께 다니는 무리 중 하나였다.<\/p>\n<p>“자리가 보이나?”<\/p>\n<p>탁자에는 빈자리가 넷이나 있었다.<\/p>\n<p>서율은 잠시 그 빈자리를 보았다.<\/p>\n<p>“아, 기다리는 사람이 있나 보네요.”<\/p>\n<p>“눈치는 있네.”<\/p>\n<p>남학생이 웃었다. 옆의 둘도 따라 웃었다.<\/p>\n<p>서율은 더 묻지 않고 돌아섰다. 오른손의 부목이 소매 끝에 걸려 옷자락을 한 번 당겼다. 그는 왼손으로 소매를 정리하고 식판을 들었다.<\/p>\n<p>“야, 전서율!”<\/p>\n<p>뒤에서 윤태경이 불렀다. 태경은 상황을 한눈에 알아본 듯 탁자 쪽으로 고개를 돌렸다.<\/p>\n<p>“우리 자리인데?”<\/p>\n<p>“누가 정해 놨냐?” 남학생이 되물었다.<\/p>\n<p>“어제까지 우리가 앉았거든.”<\/p>\n<p>“그럼 어제 앉지 그랬어. 오늘은 우리가 먼저 왔는데.”<\/p>\n<p>태경의 얼굴이 붉어졌다.<\/p>\n<p>“말을 꼭 그렇게—”<\/p>\n<p>“태경아.”<\/p>\n<p>서율이 왼손으로 그의 소매를 잡았다.<\/p>\n<p>“저쪽에 앉자. 음식 식겠다.”<\/p>\n<p>태경은 서율을 돌아봤다. 참으라는 말이 아니라, 지금 다투어도 달라질 게 없다는 얼굴이었다. 그래서 더 화가 났다.<\/p>\n<p>백소윤은 창가의 작은 탁자를 찾아 먼저 자리를 잡았다. 세 사람이 마주 앉기에는 조금 좁았다. 태경이 팔꿈치를 움직일 때마다 소윤의 찻잔이 흔들렸다.<\/p>\n<p>“이제 밥 먹을 때도 비무를 해야 하냐?” 태경이 중얼거렸다.<\/p>\n<p>“밥이랑 싸우면 네가 이길 것 같은데.” 서율이 말했다.<\/p>\n<p>“웃기냐?”<\/p>\n<p>“조금.”<\/p>\n<p>태경은 화난 얼굴로 밥을 한 숟갈 크게 떠먹었다. 소윤은 웃지 않았다. 그녀는 건너편 탁자에서 남학생들이 이쪽을 힐끗거리는 모습을 보고 있었다.<\/p>\n<p>어제까지는 소문이었다. 오늘은 자리를 빼앗았다.<\/p>\n<p>그 차이가 소윤에게는 작지 않았다.<\/p>\n<h3>2. 규율을 아는 사람들<\/h3>\n<p>오전 강론이 끝나자 제삼 수련반의 학도생들이 연무장으로 향했다.<\/p>\n<p>서율은 다른 사람들보다 조금 늦게 걸었다. 의원은 아직 검을 잡지 말라고 했다. 오늘도 그는 기본 보법과 자세만 확인할 예정이었다.<\/p>\n<p>연무장 입구에는 아침 식당에서 본 남학생들이 서 있었다. 그들 곁에는 제일 연무장 출입패를 단 선배 한 명이 있었다.<\/p>\n<p>“전서율.”<\/p>\n<p>서율이 멈췄다.<\/p>\n<p>“네가 요즘 사파 대표랑 어울린다지?”<\/p>\n<p>“가끔 이야기합니다.”<\/p>\n<p>“가끔이라.” 선배가 웃었다. “정파 수련생이 자기 수련은 뒤로하고 사파 검술을 기웃거린다는 말이 있더군.”<\/p>\n<p>“수련을 빠진 적은 없습니다.”<\/p>\n<p>“그건 확인해 보면 알겠지.”<\/p>\n<p>선배는 손에 든 명부를 펼쳤다.<\/p>\n<p>“오늘부터 제삼 수련반의 기초 자세를 따로 점검한다. 특히 부상으로 실습을 빠지는 학도생은 보충 기록을 남겨야 한다.”<\/p>\n<p>태경이 앞으로 나섰다.<\/p>\n<p>“부상은 의원이 검을 잡지 말랬으니까 그런 거잖습니까.”<\/p>\n<p>“누가 검을 잡으랬나? 기록을 남기라는데 왜 네가 끼어들지?”<\/p>\n<p>“기록이 필요하면 우리 반 전부—”<\/p>\n<p>“윤태경.”<\/p>\n<p>선배가 명부를 덮었다.<\/p>\n<p>“말이 많구나. 네 기초 자세도 같이 보자.”<\/p>\n<p>서율이 한 걸음 나섰다.<\/p>\n<p>“저 때문에 생긴 일이면 제 것만 확인해 주세요.”<\/p>\n<p>“너 때문에 생긴 일이라고 누가 했지?”<\/p>\n<p>그는 웃으며 길을 비켰다.<\/p>\n<p>연무장에 들어서자 태경이 이를 악물었다.<\/p>\n<p>“저놈들, 일부러 저러는 거잖아.”<\/p>\n<p>“그럴지도.”<\/p>\n<p>“그럴지도? 넌 화도 안 나?”<\/p>\n<p>“나지.”<\/p>\n<p>서율은 조용히 대답했다.<\/p>\n<p>태경이 입을 다물었다.<\/p>\n<p>“그런데 규정대로 하겠다고 하면 일단 규정이 뭔지 알아야 하잖아. 내가 빠진 수업이 있는지부터 확인할게.”<\/p>\n<p>소윤이 고개를 끄덕였다.<\/p>\n<p>“내가 수업 날짜랑 의원 진료 기록을 맞춰 볼게. 실제로 빠진 게 없으면 그건 분명히 말할 수 있어.”<\/p>\n<p>“그리고 나는?” 태경이 물었다.<\/p>\n<p>“오늘은 싸우지 말아 줘.” 소윤이 말했다.<\/p>\n<p>“……그게 제일 어렵네.”<\/p>\n<h3>3. 빼앗긴 연습 시간<\/h3>\n<p>점심 무렵, 제삼 연무장의 가장 평평한 자리는 이미 다른 수련생들이 차지하고 있었다.<\/p>\n<p>이상한 일이었다. 평소 제일 연무장을 쓰던 명문가 자제들이 굳이 여기까지 내려와 연습하고 있었다.<\/p>\n<p>“저기 비어 있잖아.” 태경이 말했다.<\/p>\n<p>그가 가리킨 자리는 담장 아래의 좁은 흙바닥이었다. 비가 오면 물이 고이고, 마르면 발자국이 깊게 패이는 곳이었다.<\/p>\n<p>“거기서 하라고?”<\/p>\n<p>“왜? 낮은 반은 낮은 자리에서 시작해야지.”<\/p>\n<p>누군가 웃었다.<\/p>\n<p>태경은 목검을 세게 쥐었다.<\/p>\n<p>“한 번 더 말해 봐.”<\/p>\n<p>“태경아.” 서율이 불렀다.<\/p>\n<p>하지만 이번에는 태경도 바로 물러나지 않았다.<\/p>\n<p>“우리가 뭘 잘못했는데? 네놈들이 정파 대표랑 친하다는 이유로 이래도 되는 거냐?”<\/p>\n<p>연무장이 조용해졌다.<\/p>\n<p>상대의 얼굴에서 웃음이 사라졌다.<\/p>\n<p>“말조심해. 누가 들으면 우리가 괴롭히는 줄 알겠다.”<\/p>\n<p>“지금 하는 게 그거잖아!”<\/p>\n<p>목검이 서로 부딪힐 듯 가까워진 순간, 늙은 교두의 목소리가 울렸다.<\/p>\n<p>“검 내려라.”<\/p>\n<p>모두가 돌아봤다.<\/p>\n<p>교두는 태경의 손과 상대의 목검을 번갈아 살폈다.<\/p>\n<p>“연무장에서 사사로이 검을 겨누면 양쪽 모두 벌점을 받는다. 사정이 있다면 말로 해라.”<\/p>\n<p>태경이 입을 열었지만, 상대가 먼저 공손히 고개를 숙였다.<\/p>\n<p>“교두님, 자리가 비어 있어 잠시 연습하고 있었습니다. 저희가 잘못한 것이 있다면 물러나겠습니다.”<\/p>\n<p>교두는 발밑의 흙을 내려다봤다. 제일 연무장 학도생들이 쓰기에는 지나치게 좁은 공간이었다.<\/p>\n<p>“연습은 각자 배정된 곳에서 해라. 제삼 수련반도 이곳을 사용할 권리가 있다.”<\/p>\n<p>그 말에 상대는 순순히 물러났다. 그러나 태경의 옆을 지나며 아주 작은 소리로 속삭였다.<\/p>\n<p>“매번 교두를 부를 수 있을 것 같아?”<\/p>\n<p>태경이 돌아서려 하자 서율이 그의 앞에 섰다.<\/p>\n<p>“오늘은 우리가 여기서 연습하자.”<\/p>\n<p>태경은 한동안 서율을 노려봤다. 화를 낸 대상이 서율은 아니었지만, 그를 보고 있지 않으면 당장 뒤쫓아 갈 것 같았다.<\/p>\n<p>“너는 왜 맨날 참기만 해?”<\/p>\n<p>서율은 잠시 말이 없었다.<\/p>\n<p>“참는 게 맞는지 아직 모르겠어.”<\/p>\n<p>그가 말했다.<\/p>\n<p>“그래도 네가 다치는 건 싫어.”<\/p>\n<p>태경은 검끝을 내렸다.<\/p>\n<p>“……그런 말 하면 화도 못 내잖아.”<\/p>\n<h3>4. 세 번째 걸음<\/h3>\n<p>서율은 흙이 고르지 않은 구석에 섰다.<\/p>\n<p>오른손으로 검을 쥘 수 없으니 오늘도 빈손이었다. 그는 정파의 기본 보법부터 시작했다. 발을 모으고, 중심을 낮추고, 정해진 위치에 발끝을 놓았다.<\/p>\n<p>한 번. 두 번.<\/p>\n<p>세 번째 걸음에서 멈췄다.<\/p>\n<p>예전 같았으면 다음 발을 억지로 뻗었을 것이다. 하지만 하연의 결승을 본 뒤로는 그게 자꾸 마음에 걸렸다.<\/p>\n<p><em>다음 자리를 먼저 정하지 말고, 지금 몸이 어디로 움직일 수 있는지 보자.<\/em><\/p>\n<p>서율은 앞발에 실린 무게를 조금 덜었다. 허리를 먼저 돌리는 대신 발뒤꿈치를 가볍게 풀었다. 그랬더니 세 번째 걸음이 길어지지 않았다. 몸이 쓰러지기 전에 방향을 바꿀 수 있었다.<\/p>\n<p>그는 다시 해 보았다.<\/p>\n<p>이번에는 너무 일찍 돌았다. 중심이 뒤로 빠졌다.<\/p>\n<p>“아.”<\/p>\n<p>서율은 흙 위에 두 발의 위치를 표시했다.<\/p>\n<p>“여기가 아니구나.”<\/p>\n<p>그 모습을 소윤이 바라봤다. 그녀는 조금 전까지 태경의 보법을 살피고 있었다. 서율이 같은 동작을 열 번 넘게 반복하는 동안, 실패하는 자리가 조금씩 바뀌고 있다는 것을 알아챘다.<\/p>\n<p>“서율아. 아까는 세 번째에 넘어질 뻔했는데 지금은 네 번째에서 멈추네.”<\/p>\n<p>“응. 세 번째는 조금 나아진 것 같아.”<\/p>\n<p>“그럼 나아진 거잖아.”<\/p>\n<p>“아직 검을 들면 어떻게 될지 몰라.”<\/p>\n<p>태경이 다가왔다.<\/p>\n<p>“뭐 하는데 그렇게 땅만 보고 있어?”<\/p>\n<p>서율은 왼손으로 허공에 검로를 그렸다.<\/p>\n<p>“여기서 베고, 검을 거두기 전에 몸을 돌리려고 했어. 그런데 발을 먼저 보내면 중심이 무너지더라고.”<\/p>\n<p>“그럼 돌지 말고 바로 찌르면 되잖아.”<\/p>\n<p>“상대가 그 자리에 없으면?”<\/p>\n<p>“그럼 따라가야지.”<\/p>\n<p>“따라갈 때 발이 너무 길어져.”<\/p>\n<p>태경은 직접 두 걸음을 움직여 보았다. 처음에는 자신만만했지만, 서율이 말한 자리에서 발이 꼬였다.<\/p>\n<p>“어?”<\/p>\n<p>그는 다시 해 봤다.<\/p>\n<p>“잠깐, 이거 생각보다 이상한데?”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“그렇지?”<\/p>\n<p>태경은 서율이 흙에 남긴 작은 표시를 내려다봤다.<\/p>\n<p>“너 이걸 며칠째 혼자 생각한 거야?”<\/p>\n<p>“손 다친 뒤부터.”<\/p>\n<p>“검도 못 잡는데?”<\/p>\n<p>“그래서 발부터 보는 거지.”<\/p>\n<p>태경은 더 놀리지 않았다.<\/p>\n<p>소윤도 수첩을 꺼냈다. 그러나 검로를 적기 전에 잠깐 서율의 얼굴을 보았다. 실패한 동작을 다시 해 볼 때마다 그는 지친 얼굴보다 궁금한 얼굴을 하고 있었다.<\/p>\n<p>그제야 소윤은 진하연이 왜 그를 오래 바라봤는지 조금 이해할 것 같았다.<\/p>\n<h3>5. 보이는 것과 보이지 않는 것<\/h3>\n<p>“저기 있네.”<\/p>\n<p>담장 밖에서 한서린이 먼저 서율을 발견했다.<\/p>\n<p>진하연은 발걸음을 멈췄다. 제삼 연무장 구석에서 서율과 태경이 번갈아 발을 움직이고 있었다. 소윤은 옆에서 무언가를 적었다.<\/p>\n<p>“또 검 연구야?” 한서린이 물었다.<\/p>\n<p>“아마.”<\/p>\n<p>“가서 말 걸어.”<\/p>\n<p>“지금은 셋이 연습 중이잖아.”<\/p>\n<p>“너도 같이 보면 되지.”<\/p>\n<p>하연은 대답하지 않았다.<\/p>\n<p>서율이 동작을 마치자 태경이 뭐라고 외쳤다. 소윤이 웃었고, 서율도 왼손을 들어 변명하듯 흔들었다. 셋은 서로의 말을 끊고도 불편해하지 않았다.<\/p>\n<p>하연은 그 모습을 한참 바라봤다.<\/p>\n<p>그녀가 먼저 알아본 것은 서율의 움직임 속에 있는 질문이었다. 하지만 요즘 그녀의 눈은 그가 검을 생각하지 않을 때에도 그를 찾았다. 그런 변화가 자신에게 생겼다는 사실이 조금 성가셨다.<\/p>\n<p>“하연아.”<\/p>\n<p>“응?”<\/p>\n<p>“정말 안 갈 거야?”<\/p>\n<p>“오늘은.”<\/p>\n<p>한서린이 고개를 갸웃했다.<\/p>\n<p>“넌 정파 대표한테는 그렇게 당당하더니, 전서율 앞에서는 왜 이래?”<\/p>\n<p>“그런 거 아니야.”<\/p>\n<p>“그럼 뭐야?”<\/p>\n<p>하연은 웃으며 몸을 돌렸다.<\/p>\n<p>“그냥, 지금은 저 셋의 시간이니까.”<\/p>\n<p>한서린은 따라 걸으면서도 몇 번이나 뒤를 돌아봤다.<\/p>\n<p>하연은 그러지 않았다. 다시 보면 발걸음을 돌릴 것 같았기 때문이다.<\/p>\n<h3>6. 사라진 명부<\/h3>\n<p>다음 날 아침, 제삼 수련반 앞에는 출석 점검표가 붙었다.<\/p>\n<p>서율의 이름 옆에 붉은 표시가 세 개 있었다. 보충 수련 미이행, 실습 태도 미흡, 지정 연무장 이탈.<\/p>\n<p>태경이 먼저 종이를 뜯어 낼 뻔했다.<\/p>\n<p>“이게 대체 뭐야?”<\/p>\n<p>소윤은 표시된 날짜를 확인했다.<\/p>\n<p>“이날은 서율이가 의원에게 갔어. 교두님께 진료 확인서도 냈고.”<\/p>\n<p>“여긴 어제야.” 서율이 말했다. “우리는 제삼 연무장에 있었잖아.”<\/p>\n<p>“그런데 지정 연무장 이탈?”<\/p>\n<p>태경이 헛웃음을 쳤다.<\/p>\n<p>셋은 담당 교두를 찾아갔다. 교두는 서류를 살피더니 미간을 찌푸렸다.<\/p>\n<p>“내가 적은 기록이 아니다.”<\/p>\n<p>“그럼 누가 적은 겁니까?” 소윤이 물었다.<\/p>\n<p>“상위 수련반에서 보충 점검 결과를 올렸다고 들었다. 원본 명부를 확인하겠다.”<\/p>\n<p>교두는 서랍을 열었다. 몇 장의 종이를 뒤적이다 손을 멈췄다.<\/p>\n<p>“……원본이 없군.”<\/p>\n<p>태경이 입을 벌렸다.<\/p>\n<p>“없다고요?”<\/p>\n<p>“어제 분명 여기 두었다. 우선 내가 확인한 수업 출석은 다시 증명해 주마. 다만 상위 점검 기록을 지우려면 절차가 필요하다.”<\/p>\n<p>서율은 조용히 물었다.<\/p>\n<p>“그동안 제 평가에는 그대로 남습니까?”<\/p>\n<p>교두는 선뜻 대답하지 못했다.<\/p>\n<p>“일단 이의 신청서를 내라. 내가 확인해 보겠다.”<\/p>\n<p>그 말에는 진심이 있었다. 그러나 서율은 진심만으로 기록이 고쳐지지 않을 수도 있다는 사실을 이미 배운 뒤였다.<\/p>\n<p>교두의 방을 나오자 태경이 벽을 쳤다.<\/p>\n<p>“이제는 없는 일까지 만들어?”<\/p>\n<p>소윤은 들고 온 수첩을 펼쳤다.<\/p>\n<p>“그날 누가 어디에 있었는지 내가 적어 뒀어. 의원에 간 시간도, 교두님이 연무장에 오신 시간도.”<\/p>\n<p>“네 일기장에?”<\/p>\n<p>“응. 원래 내 하루를 적는 거니까.”<\/p>\n<p>그녀는 서율을 돌아봤다.<\/p>\n<p>“그런데 이건 일기만으로는 부족해. 의원 확인서랑 교두님 기록을 같이 받아 두자. 나중에 누가 물어봐도 설명할 수 있게.”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>“고마워.”<\/p>\n<p>소윤은 수첩을 덮었다. 그 짧은 말에 마음이 놓였지만, 왜 그렇게까지 안도했는지는 생각하지 않았다.<\/p>\n<h3>7. 정파의 이름으로<\/h3>\n<p>그날 오후, 정파 대표는 가문에서 보낸 편지를 읽고 있었다.<\/p>\n<p>편지에는 결승에 관한 직접적인 꾸지람이 없었다. 대신 학관의 교육 질서, 정파 수련생의 기강, 가문의 명예를 회복할 기회에 관한 말이 길게 적혀 있었다.<\/p>\n<p>그는 편지를 접었다.<\/p>\n<p>맞은편에는 며칠 전 찾아왔던 남학생이 앉아 있었다. 진하연과 서율을 몰래 지켜봤던 바로 그 인물이었다.<\/p>\n<p>“제삼 수련반이 이의를 제기했답니다.” 남학생이 말했다.<\/p>\n<p>“벌써?”<\/p>\n<p>“교두 하나가 도와주고 있습니다.”<\/p>\n<p>정파 대표가 비웃었다.<\/p>\n<p>“그럼 기록을 바로잡겠지. 그 정도로는 아무것도 안 돼.”<\/p>\n<p>“그래서 더 큰 이유가 필요합니다.”<\/p>\n<p>“무슨 이유.”<\/p>\n<p>남학생은 잠시 말을 고르다가 대답했다.<\/p>\n<p>“정파 수련생이 정파의 교육을 따르지 않는다는 이유요.”<\/p>\n<p>정파 대표의 눈이 가늘어졌다.<\/p>\n<p>“전서율은 정파 검식을 버린 적 없다고 들었는데.”<\/p>\n<p>“혼자 다른 움직임을 연구하고 있습니다. 사파 대표와 자주 만나기도 하고요.”<\/p>\n<p>“그것만으로는 부족해.”<\/p>\n<p>“지금은 그렇지요.”<\/p>\n<p>두 사람 사이에 침묵이 흘렀다.<\/p>\n<p>정파 대표는 편지 위에 손가락을 얹었다. 결승에서 목검이 손을 떠나던 감각이 떠올랐다. 그 뒤 관람석 아래에서 진하연이 누구를 찾아보았는지도.<\/p>\n<p>“그놈 혼자서는 버티기 어려울 거다.”<\/p>\n<p>남학생이 말했다.<\/p>\n<p>“그런데 친구 둘이 계속 끼어듭니다.”<\/p>\n<p>“윤태경이랑 백소윤?”<\/p>\n<p>“예.”<\/p>\n<p>정파 대표는 잠시 생각했다.<\/p>\n<p>“그럼 셋 다 자기 일에 바빠지게 만들면 되겠군.”<\/p>\n<p>그 말에 남학생이 고개를 숙였다.<\/p>\n<p>그들은 아직 서율을 학관 밖으로 내보낼 구체적인 방법을 정하지 못했다. 다만 서율이 의지하는 일상부터 흔들면 된다고 믿기 시작했다.<\/p>\n<h3>8. 세 사람의 자리<\/h3>\n<p>저녁 식당의 창가에는 작은 탁자가 하나 있었다.<\/p>\n<p>태경이 먼저 앉아 그릇 셋을 나란히 놓았다.<\/p>\n<p>“여긴 이제 우리 자리다.”<\/p>\n<p>“어제는 좁다고 불평했잖아.” 소윤이 말했다.<\/p>\n<p>“생각해 보니까 좋더라고. 누가 와도 셋이 다 앉으면 빈자리 없잖아.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“그런 이유야?”<\/p>\n<p>“중요한 이유지.”<\/p>\n<p>소윤은 의원에게서 받아 온 확인서를 서율에게 건넸다. 교두가 다시 작성해 준 출석 확인도 함께 있었다.<\/p>\n<p>“내일 이의 신청서에 붙이면 돼.”<\/p>\n<p>“고마워. 너도 수업 끝나고 쉬어야 하는데.”<\/p>\n<p>“나도 내 일 하는 거야.”<\/p>\n<p>소윤은 자연스럽게 대답했다.<\/p>\n<p>태경은 젓가락을 내려놓았다.<\/p>\n<p>“근데 우리 언제까지 이렇게 당하고만 있어야 해?”<\/p>\n<p>서율은 한동안 대답하지 않았다.<\/p>\n<p>“나도 모르겠어.”<\/p>\n<p>“또 모른대.”<\/p>\n<p>“대신 하나는 알아.”<\/p>\n<p>서율이 두 사람을 봤다.<\/p>\n<p>“나 때문에 너희가 다치는 건 싫어. 그렇다고 너희한테 나랑 다니지 말라고도 못 하겠어.”<\/p>\n<p>태경이 어이없다는 듯 웃었다.<\/p>\n<p>“누가 네 허락받고 친구 하냐?”<\/p>\n<p>소윤도 고개를 끄덕였다.<\/p>\n<p>“그리고 우리가 당하는 건 네 잘못이 아니야. 잘못한 사람이 따로 있잖아.”<\/p>\n<p>서율은 두 사람을 번갈아 보았다.<\/p>\n<p>식당 구석의 작은 탁자는 여전히 좁았다. 하지만 그는 그날 처음으로 그 자리가 다른 어떤 곳보다 넓게 느껴졌다.<\/p>\n<p>밤이 깊어 소윤은 일기장을 펼쳤다.<\/p>\n<p><em>오늘 태경이가 화를 많이 냈다. 나도 화가 났다. 서율이는 화가 나면서도 우리가 다칠까 봐 걱정했다.<\/em><\/p>\n<p>그녀는 잠시 붓을 멈췄다.<\/p>\n<p><em>그 애는 자기가 다친 것보다 우리가 다칠 일을 더 무서워하는 것 같다.<\/em><\/p>\n<p>다음 줄에는 제삼 연무장에서 서율이 그려 놓은 발자국을 떠올리며 적었다.<\/p>\n<p><em>오늘은 세 번째 걸음을 넘어 네 번째까지 갔다. 아직 검도 못 쥐는데, 그걸 보고 기뻐하는 얼굴이었다. 나도 조금 기뻤다.<\/em><\/p>\n<p>소윤은 페이지를 넘겼다. 빈 종이가 아직 많이 남아 있었다.<\/p>\n<p>그녀는 자신이 앞으로 그 종이에 누구의 이야기를 가장 많이 적게 될지 알지 못했다.<\/p>\n<p>같은 밤, 제삼 연무장에는 아무도 없었다.<\/p>\n<p>서율이 낮에 그려 놓은 발자국은 바람에 조금 흐려져 있었다. 첫 번째와 두 번째는 뚜렷했지만, 세 번째 자리는 반쯤 지워져 있었다.<\/p>\n<p>그 뒤로 이어진 네 번째 발자국만이 뜻밖에 선명했다.<\/p>\n<p><strong>— 제14장 「괜히 신경 쓰이는 사람」 끝.<\/strong><\/p>\n"}, {"n": 15, "title": "제15장. 사파 대표의 비밀", "body": "<h1>제15장. 사파 대표의 비밀<\/h1>\n<blockquote>\n<p>누적본 보완 원고: 대화에서 집필된 제15장의 확정 사건·대사·감정선을 바탕으로 재구성. 이전 대화의 출력과 문자 단위 동일본은 아님.<\/p>\n<\/blockquote>\n<h2>1. 다시 쥔 검<\/h2>\n<p>의원은 전서율의 오른손을 한참 살폈다. 부목을 풀자 두 손가락은 가늘어져 있었다. 손가락을 굽힐 때마다 뻣뻣한 느낌이 들었다.<\/p>\n<p>“쥐어 보아라.”<\/p>\n<p>서율은 천천히 주먹을 쥐었다.<\/p>\n<p>“아픕니다.”<\/p>\n<p>“그럼 아직 낫지 않은 거다. 가벼운 목검은 쥐어도 된다. 다만 내려치거나 다른 검과 부딪치는 건 안 된다.”<\/p>\n<p>“그럼 연습해도 됩니까?”<\/p>\n<p>“내가 방금 뭐라고 했지?”<\/p>\n<p>“……힘을 주면 안 된다고 하셨습니다.”<\/p>\n<p>의원은 한숨을 쉬었다.<\/p>\n<p>밖에서 기다리던 태경은 서율이 검을 다시 잡을 수 있다는 말에 환호했다. 소윤은 먼저 손을 살폈다.<\/p>\n<p>“완전히 나았대?”<\/p>\n<p>“아직.”<\/p>\n<p>“그럼 무리하면 안 돼.”<\/p>\n<p>“너희 둘이 번갈아 감시하면 무리하고 싶어도 못 하겠다.”<\/p>\n<p>그날 오후, 서율은 오랜만에 목검을 쥐었다. 부상 중에 빈손으로 반복하던 첫 번째 걸음, 두 번째 걸음, 세 번째 걸음. 정파 기본 검식을 시작한 순간 몸이 저절로 반 걸음 돌아갔다. 검이 멈춰야 할 자리에서 멈추지 않고 다음 길로 이어졌다.<\/p>\n<p>“……어?”<\/p>\n<p>다시 의식적으로 따라 하자 어깨가 굳었다. 검끝이 흔들리고 오른손에 통증이 올라왔다. 서율은 검을 내렸다.<\/p>\n<p>조금 전의 움직임은 우연이었을까. 검을 잡지 못했던 동안 머릿속으로 이어 보았던 동작들이 어느새 몸 안에 쌓인 것 같았다. 그러나 아직 그 흐름을 스스로 설명할 수도, 다시 만들어 낼 수도 없었다.<\/p>\n<h2>2. 웃음의 방향<\/h2>\n<p>백소윤에 관한 소문이 돌기 시작했다.<\/p>\n<p>“늘 남자 둘이랑 다니는 애?”<\/p>\n<p>“전서율이 다쳤을 때 하루 종일 따라다녔다던데.”<\/p>\n<p>그 말은 곧 소윤이 서율을 좋아한다거나 진하연을 질투한다는 이야기로 바뀌었다. 그녀가 정파 대표에 관한 소문을 퍼뜨렸다는 거짓말도 더해졌다.<\/p>\n<p>여자 학도생 몇 명이 소윤을 보면 대화를 멈췄다. 공동 세면장의 물건이 옮겨져 있었고, 강론당에서 늘 앉던 자리에 누군가 먼저 앉았다.<\/p>\n<p>“미안해. 여기 사람 있어.”<\/p>\n<p>그러나 그 옆자리는 수업이 끝날 때까지 비어 있었다.<\/p>\n<p>소윤의 서책 사이에는 접힌 종이 한 장이 끼워져 있었다.<\/p>\n<p><em>정파 수련생이면 사파 대표 뒤를 따라다니는 남자부터 말려야지.<\/em><\/p>\n<p>소윤은 종이를 접어 소매 안에 넣었다. 태경에게 말하면 화를 낼 것이고, 서율에게 말하면 자신 때문이라고 생각할 것이었다.<\/p>\n<p>그날 밤 일기장에는 짧게 적었다.<\/p>\n<p><em>오늘은 조금 피곤했다. 서율이 손이 많이 나았다. 오늘은 목검을 쥐고 웃었다. 다행이다.<\/em><\/p>\n<h2>3. 계획된 고립<\/h2>\n<p>정파 대표의 곁에 붙어 다니던 남학생은 여자 학도생들에게 말을 전했다.<\/p>\n<p>“백소윤이 너희 이야기를 하고 다닌다더라.”<\/p>\n<p>“무슨 이야기?”<\/p>\n<p>“명문가 덕분에 좋은 수련반에 들어갔다고.”<\/p>\n<p>실제로 그런 말을 한 사람은 없었다. 그러나 의심은 쉽게 퍼졌다. 학생들은 소윤에게 따지기보다 먼저 주변 사람들을 떼어 놓았다. 식당에서 인사하던 사람도 눈을 피했다.<\/p>\n<p>그러던 오후, 여자 학도생 하나가 소윤을 찾아왔다.<\/p>\n<p>“백소윤, 네 물건이 뒤뜰에 떨어져 있더라. 작은 수첩 같은 거.”<\/p>\n<p>소윤은 품속의 일기장을 확인했다. 다른 기록장을 잃어버렸을지도 몰랐다.<\/p>\n<p>“어디?”<\/p>\n<p>“창고 뒤쪽.”<\/p>\n<p>뒤뜰에는 사람이 거의 없었다. 그곳에서 소윤을 기다린 것은 수첩이 아니라 여자 학도생 넷이었다.<\/p>\n<h2>4. 건드리지 말았어야 할 것<\/h2>\n<p>“너는 남의 이야기나 하고 다니면서 네 물건만 걱정하니?”<\/p>\n<p>“무슨 말인지 모르겠어요.”<\/p>\n<p>“모르는 척하지 마.”<\/p>\n<p>한 명이 소윤의 어깨를 밀었다. 다른 한 명은 소매를 붙잡았다.<\/p>\n<p>“놓으세요.”<\/p>\n<p>“왜? 전서율 부를 거야?”<\/p>\n<p>“서율이는 관계없어요.”<\/p>\n<p>그 이름을 듣자 소윤의 표정이 굳었다. 상대는 오히려 웃었다.<\/p>\n<p>누군가 가방을 빼앗아 서책과 종이를 바닥에 쏟았다. 소윤이 몸을 숙이려 하자 길을 막았다. 다른 학생이 옷자락을 거칠게 잡아당겼다. 소윤은 두 손으로 옷을 움켜쥐었다.<\/p>\n<p>“하지 마!”<\/p>\n<p>누군가 팔을 붙잡았다. 그녀가 벗어나려다 벽에 부딪혔다.<\/p>\n<p>그때 창고 바깥에서 발소리가 들렸다.<\/p>\n<p>“백소윤?”<\/p>\n<p>서율의 목소리였다.<\/p>\n<p>“서율아, 오지 마!”<\/p>\n<p>이미 늦었다. 서율은 모퉁이를 돌아 들어왔다. 바닥에 흩어진 물건들, 옷자락을 움켜쥔 채 떨고 있는 소윤, 그녀를 둘러싼 사람들.<\/p>\n<p>“……뭐 하는 겁니까?”<\/p>\n<p>소윤의 눈가에 눈물이 맺혀 있었다. 그것을 본 순간 서율의 얼굴에서 표정이 사라졌다.<\/p>\n<h2>5. 함정의 문<\/h2>\n<p>“손 놓으세요.”<\/p>\n<p>“왜? 네 여자라도 돼?”<\/p>\n<p>“손 놓으라고 했습니다.”<\/p>\n<p>한 학생이 소윤을 밀었다. 소윤은 바닥의 서책 위로 넘어졌다. 서율은 달려가 그녀를 일으켰다. 흐트러진 옷을 가리도록 겉옷을 둘러 주었다.<\/p>\n<p>그때 창고 입구에서 박수 소리가 들렸다. 정파 대표와 가까운 남학생이었다. 뒤에는 정파 학도생들이 서 있었다.<\/p>\n<p>“역시 왔군.”<\/p>\n<p>“당신들이 시킨 겁니까?”<\/p>\n<p>“여자 학도생들끼리 다투는 데 네가 끼어든 거잖아.”<\/p>\n<p>“다투는 거라고요?”<\/p>\n<p>“소문이 아주 틀린 것도 아닌 모양이네.”<\/p>\n<p>서율은 일어났다. “사과하세요. 소윤이한테.”<\/p>\n<p>“싫다면?”<\/p>\n<p>남학생이 목검을 꺼냈다. “정파 수련생이면 예의를 지켜야지. 손은 좀 나았나 보네.”<\/p>\n<p>그날 비무에서 검을 놓친 뒤에도 멈추지 않던 공격이 떠올랐다. 하지만 이번에는 자신이 아니었다. 소윤이었다.<\/p>\n<p>“검 치우세요.”<\/p>\n<p>남학생이 검끝을 서율의 가슴으로 들었다. 서율은 바닥의 연습용 목검을 집었다. 아직 완전히 낫지 않은 오른손이었다.<\/p>\n<h2>6. 이어지는 검<\/h2>\n<p>남학생이 먼저 공격했다.<\/p>\n<p>“봤지? 먼저 검을 들었어!”<\/p>\n<p>주변의 증인들에게 들으라는 목소리였다.<\/p>\n<p>서율은 정파의 기본 방어식을 떠올렸다. 그러나 몸은 정해진 자세로 돌아가지 않았다. 발이 반 걸음 옆으로 미끄러지고, 상대의 검이 지나간 빈 공간으로 자신의 검이 들어갔다.<\/p>\n<p>탁.<\/p>\n<p>상대의 손목이 흔들렸다.<\/p>\n<p>“뭐야?”<\/p>\n<p>두 번째 공격. 서율은 첫 번째 검의 끝에서 곧바로 움직였다. 검끝이 내려가는 동안 발이 돌고, 발이 돌아가는 동안 손목이 따라왔다. 부상 중 빈손으로 익힌 걸음이 끊어지지 않았다.<\/p>\n<p>세 번째 걸음. 네 번째 걸음.<\/p>\n<p><em>왜 나한테 하지 않고 소윤이한테.<\/em><\/p>\n<p>분노가 머릿속을 가득 채웠다. 목검 끝에서 희미한 떨림이 일었다. 몸 안의 내력이 검끝으로 몰리는 듯했다. 창고 벽에 기댄 마른 나뭇가지가 떨렸다.<\/p>\n<p>그것은 아직 검기가 아니었다. 상위 무인이라면 검기로 이어질 수 있는 불안정한 기운의 응집임을 알아볼지도 몰랐다. 서율은 그것을 통제할 줄 몰랐다.<\/p>\n<p>“전서율!”<\/p>\n<p>누군가 불렀지만 그는 듣지 못했다.<\/p>\n<h2>7. 진하연의 검<\/h2>\n<p>붉은 옷자락이 옆에서 날아들었다.<\/p>\n<p>쾅!<\/p>\n<p>목검 두 자루가 부딪쳤다. 서율의 몸이 밀려나며 검끝에 모인 기운이 흩어졌다. 오른손에서 통증이 올라왔다.<\/p>\n<p>“검 내려.”<\/p>\n<p>진하연이었다. 그녀는 서율과 남학생 사이에 섰다.<\/p>\n<p>“비켜.”<\/p>\n<p>“안 돼.”<\/p>\n<p>“저 사람들이 소윤이를…….”<\/p>\n<p>“알아.”<\/p>\n<p>“알면서 왜!”<\/p>\n<p>“지금 네가 하려는 건 비무가 아니야.”<\/p>\n<p>“그럼 저 사람들은!”<\/p>\n<p>“내가 봤어. 그러니까 지금은 검 내려.”<\/p>\n<p>하연은 방금 서율의 검끝에 모였던 기운을 보았다. 정파의 정형화된 초식과도, 자신이 익힌 사파의 검과도 다른 흐름. 서율이 빈손으로 반복하던 움직임의 연장선이었다.<\/p>\n<p><em>지금 이걸 저 사람들 앞에서 보여 주면 안 돼.<\/em><\/p>\n<p>“나를 봐, 전서율. 네 손 아직 다 낫지 않았잖아. 그리고 네가 방금 뭘 했는지도 모르지?”<\/p>\n<p>서율은 대답하지 못했다.<\/p>\n<p>“그럼 여기서 멈춰.”<\/p>\n<p>한참 뒤 서율의 목검이 바닥에 떨어졌다.<\/p>\n<h2>8. 보았다는 사람들<\/h2>\n<p>“잘 봤습니다.”<\/p>\n<p>정파 대표와 가까운 남학생이 크게 말했다.<\/p>\n<p>“정파 수련생 전서율이 금지된 무공을 사용하려 했고, 사파 대표 진하연이 그것을 막았습니다.”<\/p>\n<p>“무슨 헛소리지?” 하연이 돌아봤다.<\/p>\n<p>“방금 검끝에서 기운이 일어나는 걸 봤습니다. 정파 기본 검식도 아닌 저 움직임은 뭡니까?”<\/p>\n<p>“내력이 움직인다고 모두 금기무공이 되는 건 아니야.”<\/p>\n<p>“그런데 사파 대표가 나타나자마자 막았군요. 마치 미리 알고 있었던 것처럼.”<\/p>\n<p>하연은 이제야 이해했다. 소윤을 건드린 이유, 서율이 분노하도록 만든 이유, 검을 들게 한 이유. 처음부터 서율이 무언가 잘못하기를 기다린 것이다.<\/p>\n<p>“나는 전서율에게 검을 가르친 적 없어.”<\/p>\n<p>“그건 조사하면 알겠지요.”<\/p>\n<p>소윤이 일어섰다. “거짓말이에요! 저 사람들이 먼저 저를 여기로 불렀어요. 제 물건을 빼앗고, 저를 밀고, 옷까지…….”<\/p>\n<p>그녀는 말을 끝내지 못했다. 하연이 겉옷을 여며 주었다.<\/p>\n<p>“괜찮아. 억지로 다 말하지 않아도 돼.”<\/p>\n<p>하연은 남학생을 노려봤다. “이 일은 학관에 그대로 알릴 거야.”<\/p>\n<p>“저희도 본 것을 그대로 알리겠습니다.”<\/p>\n<h2>9. 남겨진 상처<\/h2>\n<p>그날 저녁, 서율은 다시 의원실에 앉아 있었다. 다행히 뼈가 다시 부러진 것은 아니었지만 손가락에 무리가 갔다. 의원은 며칠간 검을 잡지 말라고 했다.<\/p>\n<p>“내가 경고했지.”<\/p>\n<p>“죄송합니다.”<\/p>\n<p>문밖에서 태경이 물었다. “그놈들 어디 있어? 내가 찾아가서—”<\/p>\n<p>“태경아. 소윤이부터 봐 줘.”<\/p>\n<p>태경이 입을 다물었다.<\/p>\n<p>“내가 화내는 동안 소윤이가 얼마나 무서웠는지 제대로 못 봤어. 그리고 오늘 내가 무슨 검을 썼는지도 모르겠어.”<\/p>\n<p>“네가 계속 연습하던 거 아니야?”<\/p>\n<p>“그런데 그때는 달랐어. 내가 움직인 것 같지가 않았어.”<\/p>\n<p>태경은 웃지 않았다. “그럼 더 조심해야지. 다음부터는 혼자 화내지 마. 우리도 있잖아.”<\/p>\n<h2>10. 두 사람의 저녁<\/h2>\n<p>소윤은 생활관 뒤편 작은 정자에 앉아 있었다. 손목에는 누군가 붙잡았던 자국이 희미하게 남아 있었다.<\/p>\n<p>“소윤아.”<\/p>\n<p>서율이 다가왔다.<\/p>\n<p>“손은?”<\/p>\n<p>“괜찮아. 조금 쉬면 된대.”<\/p>\n<p>“거짓말.”<\/p>\n<p>“조금은 아파.”<\/p>\n<p>서율은 조금 떨어진 자리에 앉았다. 한동안 둘 다 말하지 않았다.<\/p>\n<p>“미안해.”<\/p>\n<p>“뭐가?”<\/p>\n<p>“네가 그런 일을 당하는 동안 몰랐어.”<\/p>\n<p>“네 잘못 아니야.”<\/p>\n<p>“그래도…….”<\/p>\n<p>“서율아. 오늘 네가 왔을 때 무서웠어.”<\/p>\n<p>“내가?”<\/p>\n<p>“네가 다칠까 봐. 그 사람들이 일부러 너를 기다렸다는 걸 알았거든.”<\/p>\n<p>소윤의 목소리가 작아졌다. “네가 검을 들었을 때 평소의 네가 아닌 것 같았어.”<\/p>\n<p>“나도 무서웠어. 화가 나니까 아무것도 생각이 안 났어. 네가 울고 있는 것만 보였어.”<\/p>\n<p>“바보. 너는 왜 항상 네가 다치는 건 괜찮다고 생각해?”<\/p>\n<p>서율은 대답하지 못했다. 소윤이 그의 붕대 감긴 손을 조심스럽게 잡았다.<\/p>\n<p>“다음부터는 그러지 마. 나 때문에 네가 다치는 거 싫어.”<\/p>\n<p>“나도 네가 다치는 거 싫어.”<\/p>\n<p>소윤은 울다가 웃었다. “우리는 맨날 똑같은 말만 하네.”<\/p>\n<p>둘은 한동안 손을 놓지 않았다. 익숙한 친밀함이었지만, 소윤은 그날 처음으로 이 시간이 영원하지 않을 수도 있다는 생각을 했다.<\/p>\n<h2>11. 닿을 수 없는 자리<\/h2>\n<p>정자에서 조금 떨어진 회랑에 진하연이 서 있었다. 서율의 손이 괜찮은지 확인하러 왔다가 발걸음을 멈췄다.<\/p>\n<p>소윤이 서율의 손을 잡고 있었다. 서율은 고개를 숙여 무언가 말했고, 소윤은 울다가 웃었다. 두 사람 사이에는 설명이 필요 없는 시간이 쌓여 있었다.<\/p>\n<p><em>나는 그 애의 검을 먼저 알아봤어. 그 애가 무엇을 하려는지, 어떤 움직임을 찾고 있는지.<\/em><\/p>\n<p>하지만 그것만으로는 알 수 없는 것들이 있었다. 그가 힘들 때 누구를 먼저 찾는지, 아무 말 없이 곁에 앉아 있어도 편안한 사람이 누구인지.<\/p>\n<p><em>나는 저 자리에 앉을 수 있을까.<\/em><\/p>\n<p>사파 대표인 자신은 비무대에서 누구의 눈도 피하지 않았다. 그런데 정자 하나를 향해 걸어가는 일이 어려웠다.<\/p>\n<p><em>그 애가 다치지 않았으면 좋겠어. 그 애가 웃었으면 좋겠어. 그런데 그 웃음이 꼭 나를 향해야 하는 걸까.<\/em><\/p>\n<p>하연은 조용히 몸을 돌렸다. 서율은 그녀가 왔다 간 사실을 알지 못했다.<\/p>\n<h2>12. 일기장의 고백<\/h2>\n<p>그날 밤 소윤은 창고 뒤뜰에서 구겨졌던 기록들을 정리하다 일기장을 펼쳤다.<\/p>\n<p>처음에는 자신의 수업과 태경의 농담, 세 사람이 함께 겪은 일이 고르게 적혀 있었다. 그런데 어느 순간부터 서율의 이름이 점점 많아졌다.<\/p>\n<p><em>서율이가 오늘도 손을 아파했다.<\/em><\/p>\n<p><em>서율이가 혼자 연무장에 남았다.<\/em><\/p>\n<p><em>서율이가 진하연 언니의 검을 보고 웃었다.<\/em><\/p>\n<p><em>서율이가 네 번째 걸음까지 갔다.<\/em><\/p>\n<p>소윤은 한참 동안 붓을 들고 있다가 적었다.<\/p>\n<p><em>오늘 나는 무서웠다. 그 사람들이 나를 둘러쌌을 때도 무서웠지만, 서율이가 검을 들었을 때는 더 무서웠다. 서율이가 나 때문에 다칠까 봐.<\/em><\/p>\n<p><em>친구니까 당연하다고 생각했다. 우리는 처음부터 셋이 함께였고, 앞으로도 그럴 거라고 생각했다.<\/em><\/p>\n<p><em>그런데 오늘 서율이가 내 손을 놓지 않았을 때, 조금 더 오래 그렇게 있고 싶었다.<\/em><\/p>\n<p>그녀는 얼굴을 붉혔다. 일기장을 덮었다가 다시 펼쳤다.<\/p>\n<p><em>나는 서율이가 좋다.<\/em><\/p>\n<p><em>아마 친구로서만 좋은 건 아닌 것 같다.<\/em><\/p>\n<p>그 문장을 지우지 않았다. 다만 그 마음의 깊이와 이별의 의미까지 온전히 깨달은 것은 아니었다. 아직은 서율이 무사히 웃는 모습을 보는 것만으로 충분하다고 믿었다.<\/p>\n<h2>13. 금기의 이름<\/h2>\n<p>정파 수련관의 깊은 방에서는 다른 기록이 작성되고 있었다.<\/p>\n<p>“전서율이 정체를 알 수 없는 검술을 사용했습니다.”<\/p>\n<p>정파 대표가 물었다. “검기였나?”<\/p>\n<p>“확실하지 않습니다.”<\/p>\n<p>“그럼 검기라고 쓰지 마. 확실하지 않은 걸 확실하다고 적으면 반박당한다.”<\/p>\n<p>그는 잠시 생각했다. “정파의 정식 교육 과정에서 확인되지 않은 기운이 검끝에 응집되었다고 써. 사파 대표가 개입한 사실도.”<\/p>\n<p>“내통 의혹을 제기하면 되겠습니까?”<\/p>\n<p>“아직 단정하지 마. 의혹으로 남겨 두는 편이 오래간다.”<\/p>\n<p>정파 대표는 보고서에 적힌 전서율의 이름을 바라봤다.<\/p>\n<p>“학관의 금기무공 심의 규정부터 찾아봐.”<\/p>\n<p>그날 밤, 서로 다른 방에서 두 종류의 기록이 완성됐다. 하나는 백소윤이 누구에게도 보여 주지 않을 일기였다. 다른 하나는 전서율을 모두의 의심 앞에 세우기 위한 보고서였다.<\/p>\n<p>두 기록 모두 같은 이름을 담고 있었다.<\/p>\n<p><strong>전서율.<\/strong><\/p>\n<p><strong>— 제15장 「사파 대표의 비밀」 끝.<\/strong><\/p>\n"}, {"n": 16, "title": "제16장. 정사의 자존심", "body": "<h1>제16장. 정사의 자존심<\/h1>\n<h2>1. 익숙했던 길<\/h2>\n<p>학관의 아침은 평소와 다르지 않았다. 종이 울리고, 학도생들이 강론당으로 향했다. 회랑에는 밤새 내린 비가 남긴 습기가 배어 있었다.<\/p>\n<p>전서율은 윤태경, 백소윤과 나란히 걷고 있었다. 오른손에는 다시 얇은 붕대가 감겨 있었다. 창고 뒤뜰에서 무리하게 검을 사용한 탓에 의원에게 또 한 번 꾸지람을 들었다.<\/p>\n<p>“그러니까 네가 며칠만 더 참았으면 됐잖아.”<\/p>\n<p>“알아.”<\/p>\n<p>“알면 좀 참아.”<\/p>\n<p>“알겠어.”<\/p>\n<p>“맨날 알겠다고만 하지.”<\/p>\n<p>서율은 멋쩍게 웃었다. “그럼 뭐라고 해야 하는데?”<\/p>\n<p>“앞으로 윤태경 대협의 말을 잘 듣겠습니다, 정도?”<\/p>\n<p>“그건 좀 어려운데.”<\/p>\n<p>소윤이 작게 웃었다. 며칠 전 일이 있고 난 뒤로 소윤은 예전보다 말수가 줄었다. 식당에서는 주변을 먼저 살폈고, 사람이 적은 복도를 지날 때면 무의식적으로 걸음을 빨리했다. 태경은 그런 소윤을 볼 때마다 일부러 더 떠들었다.<\/p>\n<p>“오늘은 나 혼자 서고에 다녀올 거야.” 소윤이 말했다.<\/p>\n<p>“혼자?” 태경이 즉시 돌아봤다.<\/p>\n<p>“책 빌리러 가는데 무슨 호위까지 필요해?”<\/p>\n<p>“그놈들이 또—”<\/p>\n<p>“태경아. 나도 혼자 걸을 수 있어.”<\/p>\n<p>서율은 잠시 소윤을 바라보다가 고개를 끄덕였다. “알았어. 대신 무슨 일 있으면 바로 말해 줘.”<\/p>\n<p>“응.”<\/p>\n<p>세 사람은 회랑 모퉁이를 돌았다. 그리고 맞은편에서 걸어오는 붉은 옷자락을 발견했다.<\/p>\n<h2>2. 모르는 사람처럼<\/h2>\n<p>진하연이었다. 그녀의 곁에는 한서린과 사파 학도생 둘이 함께 있었다.<\/p>\n<p>평소 같았으면 하연이 먼저 서율을 불렀을 것이다. 손은 괜찮은지 물었을 것이고, 아직도 혼자 이상한 발걸음을 연구하느냐며 웃었을 것이다.<\/p>\n<p>서율도 그렇게 생각했다. 그래서 자연스럽게 손을 들었다.<\/p>\n<p>“하연아.”<\/p>\n<p>하연의 발걸음이 멈췄다. 아주 잠깐 반가운 기색이 스쳤지만, 곧 표정이 달라졌다.<\/p>\n<p>“전서율. 정파 수련생이 수업은 안 듣고 여기서 뭐 해?”<\/p>\n<p>서율은 손을 내렸다. “강론당 가는 길인데.”<\/p>\n<p>“그럼 빨리 가야지. 요즘 네 이름이 여기저기서 들리던데, 한가한가 봐?”<\/p>\n<p>태경의 눈썹이 치켜올라갔다. “뭐?”<\/p>\n<p>“검도 제대로 못 쥐면서 자꾸 소란을 일으킨다며.”<\/p>\n<p>서율의 표정이 굳었다. “그건…….”<\/p>\n<p>“그리고 내가 한 번 막아 줬다고 해서 앞으로도 그런 일이 있을 거라 생각하지 마.”<\/p>\n<p>“하연아?” 한서린이 그녀를 돌아봤다.<\/p>\n<p>하연은 말을 멈추지 않았다. “나는 사파 대표야. 정파 내부에서 무슨 일이 일어나든 내 일이 아니라고.”<\/p>\n<p>회랑의 공기가 조용해졌다.<\/p>\n<p>서율은 하연을 바라봤다. 며칠 전 분노에 휩싸인 자신을 막아 준 사람, 자신의 검이 향하려는 곳을 처음으로 알아본 사람이었다. 그런데 지금은 처음부터 아무런 관계도 없었던 사람처럼 말하고 있었다.<\/p>\n<p>“……알겠어.”<\/p>\n<p>하연의 손가락이 소매 안에서 움찔했다. “알았으면 됐어.”<\/p>\n<p>서율은 잠시 더 바라보다 말을 삼켰다. “가자.”<\/p>\n<p>태경이 한 걸음 앞으로 나섰다. “야, 진하연. 네가 무슨 사정이 있는지는 모르겠는데 말은 좀—”<\/p>\n<p>“태경아. 그냥 가자.”<\/p>\n<p>소윤은 아무 말 없이 하연을 바라봤다. 하연은 소윤의 시선을 피했다. 세 사람은 그녀의 곁을 지나갔다. 서율은 끝내 돌아보지 않았다.<\/p>\n<h2>3. 지나간 자리<\/h2>\n<p>“너 지금 뭐 한 거야?” 세 사람이 멀어지자 한서린이 물었다.<\/p>\n<p>“들었잖아.”<\/p>\n<p>“들은 게 문제가 아니라, 네가 그런 말을 할 사람이 아니잖아.”<\/p>\n<p>하연은 회랑 끝을 바라봤다. 서율의 뒷모습이 점점 작아지고 있었다.<\/p>\n<p>“요즘 정파에서 무슨 소문이 도는지 알아?”<\/p>\n<p>“전서율이 금기무공을 익혔다는 이야기?”<\/p>\n<p>“그것만이 아니야. 내가 그 애에게 사파의 검술을 가르쳤다는 말도 있어. 창고 뒤뜰에서 일부러 검을 맞댄 건 미리 짜 놓은 행동이었다는 소문까지.”<\/p>\n<p>“말도 안 되는 소리잖아.”<\/p>\n<p>“말이 되는지는 중요하지 않아. 그 애를 몰아붙일 이유가 필요한 사람들이니까.”<\/p>\n<p>한서린이 입술을 깨물었다. “그래서 일부러 저렇게 말한 거야?”<\/p>\n<p>“적어도 내가 그 애 편에 서 있다는 말은 줄어들겠지.”<\/p>\n<p>“그럼 서율이는? 서율이가 네 말을 믿으면?”<\/p>\n<p>하연은 대답하지 못했다.<\/p>\n<p>“……그게 낫겠지.”<\/p>\n<p>그러나 목소리는 전혀 그렇게 들리지 않았다.<\/p>\n<p><em>미안해. 너를 싫어해서 그런 게 아니야. 네가 나 때문에 더 다치는 걸 보고 싶지 않아.<\/em><\/p>\n<p>그녀는 자신의 선택이 옳았는지 확신하지 못했다. 자신이 멀어진다고 그들이 서율을 가만둘 보장은 없었다.<\/p>\n<h2>4. 눈치챈 사람<\/h2>\n<p>“뭐야, 저 여자.” 태경이 불만스럽게 말했다. “갑자기 왜 저래? 네가 무슨 잘못했어?”<\/p>\n<p>“아니. 나도 모르겠어.”<\/p>\n<p>서율은 붕대를 만지작거렸다. <em>내가 한 번 막아 줬다고 해서 앞으로도 그런 일이 있을 거라 생각하지 마.<\/em> 그 말이 이상하게 마음에 남았다.<\/p>\n<p>자신은 하연에게 무엇을 기대했던 걸까. 자신의 검을 알아봐 주기를. 다시 만나면 반갑게 웃어 주기를. 적어도 자신을 귀찮은 사람처럼 대하지 않기를.<\/p>\n<p>“앞으로 안 그러면 되지.” 서율이 말했다.<\/p>\n<p>“뭘?”<\/p>\n<p>“괜히 말 걸고 그러는 거.”<\/p>\n<p>“야, 그건 네가 잘못한 게 아니잖아.”<\/p>\n<p>“알아. 그냥…….”<\/p>\n<p>소윤은 조금 전 하연의 얼굴을 떠올렸다. 서율이 등을 돌렸을 때, 하연은 붙잡고 싶은 사람을 스스로 밀어낸 듯한 얼굴이었다.<\/p>\n<p><em>하연 언니도…….<\/em><\/p>\n<p>그녀가 서율을 좋아하는 것일까. 가능성이 떠오르자 가슴 한쪽이 조여 왔다. 하지만 소윤은 아무 말도 하지 않았다. 하연의 마음을 자신이 대신 말할 수는 없었다. 무엇보다 자신조차 자기 마음을 제대로 설명할 수 없었다.<\/p>\n<h2>5. 남궁의 이름<\/h2>\n<p>정파 수련관의 별채. 남궁현우는 탁자 위에 놓인 보고서를 읽고 있었다. 결승에서 패배한 뒤부터 그의 얼굴에는 불쾌함이 가시지 않았다.<\/p>\n<p>문이 열리고 한 남학생이 들어왔다.<\/p>\n<p>“남궁 공자.”<\/p>\n<p>“차윤겸. 늦었군.”<\/p>\n<p>차윤겸은 조용히 문을 닫았다. 그는 명문가 직계는 아니었지만 누가 누구와 가까운지, 어떤 교두가 어느 가문과 관계가 있는지, 어떤 말이 어느 자리에서 퍼지기 쉬운지를 잘 알았다.<\/p>\n<p>그가 진하연을 처음 본 것은 입관식이었다. 그 뒤로 그녀가 비무대에서 웃는 모습을 지켜봤다. 하지만 그녀가 전서율과 이야기할 때 보이던 표정은 달랐다. 그 사실이 견딜 수 없었다.<\/p>\n<p>“진하연이 오늘 전서율을 공개적으로 냉대했습니다.”<\/p>\n<p>현우가 눈을 들었다. “정말인가?”<\/p>\n<p>“회랑에서 여러 사람이 들었습니다.”<\/p>\n<p>“이제 와서 선을 긋겠다?” 현우가 비웃었다. “하지만 늦었어.”<\/p>\n<p>윤겸이 고개를 끄덕였다. “이미 두 사람이 자주 만났다는 증언이 있습니다. 전서율이 정파 기본 검식과 다른 움직임을 연구했다는 기록도 확보했습니다.”<\/p>\n<p>“그 검이 사파의 것이란 증거는?”<\/p>\n<p>“아직 없습니다.”<\/p>\n<p>“금기무공이란 증거는?”<\/p>\n<p>“그것도 없습니다.”<\/p>\n<p>현우의 표정이 차가워졌다. “그럼 네가 가져온 건 소문뿐이군.”<\/p>\n<p>“소문을 조사할 이유로 만들 수는 있습니다.”<\/p>\n<p>윤겸은 이어 말했다. “전서율의 출신과 입관 이전 행적을 조사해 보겠습니다. 어디서 무공을 배웠는지, 누구와 접촉했는지. 설명되지 않는 부분이 있다면 정파의 교육 질서를 어겼다는 의혹을 키울 수 있습니다.”<\/p>\n<p>“누가 조사하지?”<\/p>\n<p>윤겸은 남궁가의 문양이 찍힌 작은 봉투를 꺼냈다. “가문에서 이미 답을 보내왔습니다.”<\/p>\n<h2>6. 그림자 속의 서찰<\/h2>\n<p>남궁가에는 공식적으로 이름을 내걸지 않는 정보망이 있었다. 상단의 거래 기록을 살피고, 객잔의 소문을 모으며, 가문과 관계된 인물의 행적을 확인하는 사람들이었다.<\/p>\n<p>그들은 스스로를 문파라 부르지 않았다. 무공을 익힌 자도, 장부를 다루는 사람도, 먼 지방의 객잔에서 평범한 손님처럼 지내는 사람도 있었다. 가문 내부에서는 그 연락망을 <strong>은서방(隱書房)<\/strong>이라 불렀다.<\/p>\n<p>그날 밤 은서방에 전서율이라는 이름이 처음 올라왔다.<\/p>\n<blockquote>\n<p>정파 학관 제삼 수련반 소속.\n명문
