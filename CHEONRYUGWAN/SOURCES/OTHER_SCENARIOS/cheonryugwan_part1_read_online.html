가 후원 관계 확인되지 않음.\n정파 정식 검식과 다른 검로를 독자적으로 연구 중.\n사파 대표 진하연과 반복 접촉.\n최근 충돌에서 정체불명의 기운 응집 현상 목격 주장.\n금기무공 또는 외부 무공 접촉 가능성 조사 요청.<\/p>\n<\/blockquote>\n<p>담당자는 마지막 두 줄을 오래 바라봤다.<\/p>\n<p>“가능성이라…… 확인된 건 아무것도 없군.”<\/p>\n<p>“그럼 돌려보낼까요?”<\/p>\n<p>“아니. 남궁가에서 직접 요청한 일이야. 출신부터 확인해. 다만 정파 학관의 정식 기록에는 남기지 마라.”<\/p>\n<p>조사는 시작되지만, 조사받는 사람에게는 알려지지 않을 것이었다.<\/p>\n<p>전서율은 그날 밤 청운관에서 태경과 함께 다음 날 수업 준비를 하고 있었다. 자신의 이름이 먼 곳으로 향하는 서찰에 적혔다는 사실은 알지 못했다.<\/p>\n<h2>7. 소문이 건너는 경계<\/h2>\n<p>소문은 처음부터 마교를 향해 보내진 것이 아니었다.<\/p>\n<p>학관의 학도생들 사이에서 시작된 이야기는 객잔으로 옮겨 갔고, 객잔의 이야기는 상단의 행상인들에게 전해졌다.<\/p>\n<p>“정파 학관에 이상한 검을 쓰는 애가 있다더군.”<\/p>\n<p>“사파 대표가 직접 막았다던데?”<\/p>\n<p>“마공을 썼다는 말도 있어.”<\/p>\n<p>“정파 안에서?”<\/p>\n<p>누군가는 웃으며 넘겼다. 누군가는 이야기를 부풀렸다. 그리고 누군가는 그 말을 기억했다.<\/p>\n<p>정파 학관에서 마공을 사용한 학도생이 있다는 이야기는 단순한 학원 소문이 아니었다. 사실이라면 정파의 교육 체계에 균열이 있다는 뜻일 수도, 거짓이라면 누군가 내부에서 정치적 음모를 꾸미고 있다는 뜻일 수도 있었다.<\/p>\n<p>며칠 뒤, 마교의 외곽 정보망에 짧은 보고가 들어왔다.<\/p>\n<blockquote>\n<p>정파 학관 내부에서 마공 사용 의혹 발생.\n대상은 전서율이라는 하급 수련생.\n실제 마공 사용 여부 확인되지 않음.\n사파 대표 진하연이 현장에 개입했다는 증언 존재.<\/p>\n<\/blockquote>\n<p>보고를 받은 흑의 사내는 종이를 내려다봤다.<\/p>\n<p>“전서율?” 처음 듣는 이름이었다.<\/p>\n<p>출신도, 무공의 계보도 확인되지 않았다.<\/p>\n<p>“정파 학관에서 마공이라……. 재미있는 소문이군.”<\/p>\n<p>그는 보고서를 불태우지 않고 다른 서류 아래에 넣었다.<\/p>\n<p>“당장 움직일 필요는 없다. 누가 이 이름을 다시 언급하는지 지켜봐.”<\/p>\n<p>그렇게 전서율의 이름은 마교의 정보망에 처음 남았다. 아직 누구도 그를 만나려 하지 않았고, 어떤 검을 쓰는지도 몰랐다.<\/p>\n<h2>8. 말하지 않은 마음<\/h2>\n<p>그날 저녁, 소윤은 청운관 뒤편 작은 정자에 앉아 있었다. 서율은 조금 늦게 도착했다.<\/p>\n<p>“기다렸어?”<\/p>\n<p>“조금.”<\/p>\n<p>“오늘 하연 언니 일 때문에 기분 안 좋지?” 소윤이 물었다.<\/p>\n<p>서율은 놀란 얼굴로 그녀를 바라봤다. “티 났어?”<\/p>\n<p>“조금.”<\/p>\n<p>“내가 뭘 잘못했나 싶어서.”<\/p>\n<p>소윤은 고개를 저었다. “네가 잘못한 건 없을 거야.”<\/p>\n<p>“어떻게 알아?”<\/p>\n<p>소윤은 하연이 서율을 바라보던 눈빛을 떠올렸다. 하지만 그것은 자신의 마음이 아니었다.<\/p>\n<p>“그냥 그렇게 생각해.”<\/p>\n<p>“너는 가끔 아무 근거 없이 확신하더라.”<\/p>\n<p>“근거가 없지는 않아.”<\/p>\n<p>“뭔데?”<\/p>\n<p>“비밀.”<\/p>\n<p>한참 뒤, 서율이 말했다.<\/p>\n<p>“하연이가 내 검을 처음 알아봐 줬거든. 내가 뭘 하려는지 나도 잘 몰랐는데, 그 사람은 알아본 것 같았어. 그래서 좀 기뻤나 봐.”<\/p>\n<p>소윤은 조용히 들었다. 서율이 하연을 특별하게 생각한다는 사실이 느껴졌다. 그 특별함이 검술 때문인지, 다른 마음 때문인지는 알 수 없었다.<\/p>\n<p>“그런데 오늘은 괜히 내가 혼자 친하다고 생각한 건가 싶더라.”<\/p>\n<p>“서율아. 누군가 갑자기 차갑게 굴었다고 해서, 그동안 네가 느낀 게 전부 거짓이 되는 건 아니잖아.”<\/p>\n<p>서율은 한동안 말이 없었다. “……그렇네. 고마워.”<\/p>\n<p>소윤은 웃었다. 따뜻함 속에 작은 슬픔이 섞여 있었다.<\/p>\n<h2>9. 일기장에 쓰지 못한 말<\/h2>\n<p>밤이 깊었다. 소윤은 일기장을 펼쳤다.<\/p>\n<p><em>오늘 진하연 언니가 서율이에게 차갑게 말했다.<\/em><\/p>\n<p><em>서율이는 아무렇지 않은 척했지만, 하루 종일 조금 조용했다.<\/em><\/p>\n<p><em>나는 하연 언니가 왜 그렇게 말했는지 조금 알 것 같다.<\/em><\/p>\n<p><em>하연 언니는 서율이를 싫어하지 않는다. 오히려 그 반대일지도 모른다.<\/em><\/p>\n<p>소윤은 그 문장을 한참 바라봤다.<\/p>\n<p><em>그 사실을 알아차린 내가 조금 싫었다.<\/em><\/p>\n<p><em>하연 언니는 서율이의 검을 처음 알아본 사람이다. 나는 서율이가 다쳤을 때 곁에 있었고, 태경이와 함께 밥을 먹고, 매일 같은 길을 걸었다.<\/em><\/p>\n<p><em>그런데 그것만으로 내가 서율이를 더 잘 안다고 말할 수 있을까.<\/em><\/p>\n<p><em>오늘 서율이가 하연 언니 이야기를 할 때 조금 슬펐다.<\/em><\/p>\n<p><em>나는 그 애가 웃었으면 좋겠다. 그런데 가끔은 그 웃음이 나 때문에 생겼으면 좋겠다.<\/em><\/p>\n<p>소윤은 붓을 내려놓았다. 그 문장을 지우지 않았다.<\/p>\n<h2>10. 혼자 남은 사람<\/h2>\n<p>사파 생활관의 불은 대부분 꺼져 있었다. 진하연은 혼자 회랑에 서 있었다.<\/p>\n<p>한서린은 조금 전까지 그녀를 붙잡고 있었다.<\/p>\n<p>“너 오늘 하루 종일 이상했어.”<\/p>\n<p>“알아.”<\/p>\n<p>“서율이한테 사과할 거야?”<\/p>\n<p>하연은 대답하지 않았다. 한서린이 한숨을 쉬고 먼저 방으로 들어갔다.<\/p>\n<p><em>전서율. 오늘은 많이 화났겠지.<\/em><\/p>\n<p>그가 반갑게 자신을 부르던 얼굴, 차갑게 말하자 굳어 가던 표정이 떠올랐다.<\/p>\n<p><em>나는 네가 다치지 않았으면 좋겠어. 그런데 왜 네가 다치지 않게 하려고 한 말이, 결국 네 마음을 다치게 했을까.<\/em><\/p>\n<p>정파의 정치에 사파 대표가 깊이 개입하면 서율에게 더 큰 화가 닥칠 수 있었다. 하지만 자신이 멀어진다고 해서 그들이 서율을 가만두리라는 보장도 없었다.<\/p>\n<p>“정말 바보 같네.”<\/p>\n<p>그녀는 낮게 중얼거렸다. 누구를 향한 말인지 스스로도 알 수 없었다.<\/p>\n<p>하연은 서율이 검을 잡고 웃던 모습을 떠올렸다. 그가 자신의 검을 완성하는 날을 보고 싶었다. 다치지 않고 그날까지 갔으면 좋겠다고 생각했다. 그리고 그날 자신이 그의 곁에 있을 수 있다면 좋겠다고도 생각했다.<\/p>\n<p>하지만 마지막 바람은 누구에게도 말하지 않았다.<\/p>\n<hr />\n<p>같은 밤, 남궁가의 은서방에서는 전서율의 출신을 확인하라는 서찰이 다시 봉해졌다. 정파 학관에서는 금기무공 의혹에 관한 비공식 증언이 모이고 있었다. 먼 곳, 마교의 정보망에서는 아직 이름뿐인 하급 수련생의 기록이 조용히 보관되었다.<\/p>\n<p>전서율은 그 모든 일을 알지 못했다.<\/p>\n<p>그는 청운관의 작은 방에서 잠들기 전 오른손을 천천히 쥐었다 폈다. 아직 손가락은 뻣뻣했다. 하지만 눈을 감으면 검이 지나갈 길이 보였다.<\/p>\n<p>첫 번째 걸음. 두 번째 걸음. 그리고 더는 멈추지 않는 세 번째 걸음.<\/p>\n<p>그 길이 어디로 이어질지는 아직 알 수 없었다.<\/p>\n<p><strong>— 제16장 「정사의 자존심」 끝.<\/strong><\/p>\n"}, {"n": 17, "title": "제17장. 흔들리는 검", "body": "<h1>제17장. 흔들리는 검<\/h1>\n<h2>1. 남겨진 말<\/h2>\n<p>전서율은 사흘째 진하연을 보지 못했다.<\/p>\n<p>보지 못한 것인지, 서로 보지 않으려 한 것인지는 알 수 없었다. 강론당 앞 회랑에서 마주친 날 이후로 그는 사파 수련관 쪽 길을 일부러 피했다. 한 번쯤 이유를 묻고 싶었지만, 묻는 일조차 상대에게 폐가 될지 모른다는 생각이 들었다.<\/p>\n<p>‘나는 사파 대표야. 정파 내부에서 무슨 일이 일어나든 내 일이 아니라고.’<\/p>\n<p>그 말이 이상하게 오래 남았다.<\/p>\n<p>“또 손 보고 있네.”<\/p>\n<p>윤태경이 그의 손목을 툭 쳤다. 서율은 황급히 손을 내렸다.<\/p>\n<p>“그냥 좀 뻣뻣해서.”<\/p>\n<p>“의원님이 뭐랬어?”<\/p>\n<p>“세게 부딪치지만 않으면 가벼운 연습은 해도 된다고.”<\/p>\n<p>“그 말을 왜 그렇게 신나게 해석하는데? 가벼운 연습이라잖아.”<\/p>\n<p>백소윤은 말없이 서율의 손을 보았다. 붕대는 얇아졌고 손가락의 부기도 거의 가라앉았다. 하지만 창고 뒤뜰에서 목검을 휘두르던 그의 얼굴이 아직 눈앞에 선했다.<\/p>\n<p>“서율아. 지금은 검보다 네가 먼저야.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“알아.”<\/p>\n<p>소윤은 그 말이 안심이 되지 않았다. 서율은 언제나 남의 걱정을 먼저 덜어 주려 했고, 그러느라 자신이 무슨 생각을 하는지는 잘 말하지 않았다.<\/p>\n<p>그날 아침 강론당에는 새로운 공고가 붙었다. ‘정파 학도생의 수련 규율 및 외부 무공 접촉 실태 확인.’ 이름은 적혀 있지 않았지만, 공고 앞에 모인 학생들은 모두 누구를 가리키는지 알고 있는 듯했다.<\/p>\n<p>“금기무공이라며?”<\/p>\n<p>“사파 대표가 검을 막았다던데.”<\/p>\n<p>“막은 건지, 맞춰 본 건지 누가 알아.”<\/p>\n<p>서율이 다가가자 속삭임이 멎었다.<\/p>\n<p>태경은 당장 따지고 싶었으나 서율이 먼저 공고를 읽었다. 공고에는 금기무공을 썼다는 확정 판정이 없었다. 단지 확인 절차에 협조하라는 말뿐이었다. 하지만 사람들이 그의 얼굴을 보며 물러서는 모습은 이미 판정이 내려진 것 같았다.<\/p>\n<p>“이상하지.” 서율이 중얼거렸다.<\/p>\n<p>“뭐가?”<\/p>\n<p>“아직 아무것도 확인되지 않았는데 다들 내가 무슨 검을 썼는지 아는 것처럼 말해.”<\/p>\n<p>소윤은 대답하지 못했다. 그날 창고에서 자신에게 무슨 일이 있었는지 묻는 사람은 거의 없었다.<\/p>\n<h2>2. 설명할 수 없는 것<\/h2>\n<p>제삼 수련반의 노교두는 서율을 따로 불렀다.<\/p>\n<p>“네 검이 어디에서 왔느냐.”<\/p>\n<p>“정파의 기본 검식을 배우며 생각했습니다.”<\/p>\n<p>“누가 가르쳤지?”<\/p>\n<p>“아무도 가르쳐 주지 않았습니다.”<\/p>\n<p>교두는 그를 한참 바라봤다.<\/p>\n<p>“그 말은 사실이겠지. 하지만 사실이라는 것과 남에게 증명할 수 있다는 것은 다르다.”<\/p>\n<p>서율은 고개를 숙였다.<\/p>\n<p>교두는 탁자에 펼쳐 둔 기록을 가리켰다. 제14장부터 문제였던 출석 및 보충 수련 기록의 사본이었다. 몇 군데는 서율이 기억하는 날짜와 맞지 않았다.<\/p>\n<p>“이 기록도 원본이 아직 나오지 않았다. 내가 네 보법을 보았다는 사실은 증언할 수 있다. 하지만 네가 창고 뒤뜰에서 어떤 기운을 일으켰는지까지 증언할 수는 없어. 나는 그 자리에 없었으니까.”<\/p>\n<p>“그럼 어떻게 해야 합니까?”<\/p>\n<p>“네가 모르는 것을 안다고 말하지 마라. 반대로 하지 않은 일을 했다고 인정하지도 말고.”<\/p>\n<p>교두는 조금 목소리를 낮췄다.<\/p>\n<p>“정파의 도리는 검을 바르게 쓰는 데만 있지 않다. 사실을 바로잡는 데도 있다. 다만 그 일이 오래 걸릴 수 있다.”<\/p>\n<p>서율은 교두에게 깊이 고개를 숙였다.<\/p>\n<p>나오면서 그는 처음으로 자신이 사용한 검을 말로 설명해야 한다는 사실을 절감했다. 단순히 빠르게 움직인 것이 아니었다. 막고 멈추고 다시 베는 사이의 빈 곳을 없애려 했을 뿐이었다. 그런데 창고에서는 자신도 모르는 기운이 검끝에 모였다.<\/p>\n<p>그것이 자신의 생각에서 비롯된 것인지, 분노가 만든 우연인지조차 알지 못했다.<\/p>\n<p><em>내가 한 일을 내가 설명하지 못한다면, 다른 사람이 마음대로 이름 붙이게 되는 걸까.<\/em><\/p>\n<p>그날부터 서율은 다른 사람의 눈을 피해 움직임을 다시 확인하기로 했다.<\/p>\n<h2>3. 사람 없는 연무장<\/h2>\n<p>밤이 깊자 학관 북쪽의 폐쇄된 옛 연무장에는 바람만 남았다. 공식 수련장은 아니었지만 출입이 금지된 곳도 아니었다. 오래된 기둥과 평평한 흙바닥이 있을 뿐, 수업이 끝난 뒤에는 아무도 찾지 않았다.<\/p>\n<p>서율은 그곳에 등잔 하나와 목검, 얇은 종이 묶음을 가져왔다.<\/p>\n<p>첫 장에는 정파 기본 검식의 이름을 적었다. 이어지는 장에는 각 초식이 끝나는 순간 발과 어깨가 어디에 놓이는지 그렸다. 부상 중에 빈손으로 걸었던 궤적도 작은 선으로 옮겨 놓았다.<\/p>\n<p>그는 목검을 쥐었다.<\/p>\n<p>첫 번째 초식. 손목을 돌려 검을 거둔다.<\/p>\n<p>원래라면 자세를 바로잡은 다음 두 번째 초식이 시작된다.<\/p>\n<p>서율은 그 사이에 걸음을 넣었다. 검을 거두는 힘이 발끝의 회전으로 이어지고, 몸이 돌아가는 동안 검끝이 다음 방향을 향하도록 했다.<\/p>\n<p>목검이 어둠 속에서 둥근 선을 그렸다.<\/p>\n<p>이번에는 멈추지 않았다.<\/p>\n<p>서율은 놀라면서도 호흡을 유지했다. 두 번째, 세 번째 걸음. 검을 쥔 손보다 발이 먼저 움직였다. 그동안 머릿속에서 따로 흩어져 있던 생각들이 하나의 길을 찾는 듯했다.<\/p>\n<p>그러나 네 번째 걸음에서 균형이 무너졌다.<\/p>\n<p>“윽.”<\/p>\n<p>오른손이 욱신거렸다. 서율은 즉시 검을 내렸다. 며칠 전의 일을 되풀이하고 싶지는 않았다.<\/p>\n<p>그는 종이에 적었다.<\/p>\n<p><em>검이 먼저 가면 발이 늦는다. 발이 먼저 가도 어깨가 굳으면 검이 끊긴다.<\/em><\/p>\n<p>한참 생각하다 다음 줄을 덧붙였다.<\/p>\n<p><em>이어지는 것은 검이 아니라 몸 전체의 움직임일지도 모른다.<\/em><\/p>\n<p>서율은 다시 빈손으로 걸었다. 검을 쥐지 않은 상태에서는 훨씬 부드러웠다. 하지만 실제로 목검을 잡으면 그 무게만큼 길이 달라졌다.<\/p>\n<p>그는 자신이 아직 아무것도 완성하지 못했다는 사실을 분명히 알았다.<\/p>\n<p>그런데도 이상하게 기뻤다.<\/p>\n<p>실패한 이유를 처음으로 조금 설명할 수 있게 되었기 때문이다.<\/p>\n<h2>4. 우연히 발견한 사람<\/h2>\n<p>“그렇게 걸으면 네 검이 먼저 넘어지겠는데.”<\/p>\n<p>익숙한 목소리가 어둠 속에서 들렸다.<\/p>\n<p>서율은 몸을 돌렸다. 연무장 입구에 진하연이 서 있었다. 어깨에는 가벼운 겉옷이 걸쳐져 있었고, 한 손에는 작은 등잔이 들려 있었다.<\/p>\n<p>“……하연아?”<\/p>\n<p>하연은 잠시 그의 오른손을 바라봤다.<\/p>\n<p>“의원 말은 잘 듣는 편이야?”<\/p>\n<p>“세게 부딪치는 건 안 했어.”<\/p>\n<p>“그 말이 제일 못 미더운데.”<\/p>\n<p>평소처럼 툭 던지는 말이었다. 하지만 서율은 웃지 않았다.<\/p>\n<p>“여긴 왜 왔어?”<\/p>\n<p>하연은 잠깐 입술을 깨물었다.<\/p>\n<p>“한서린이 놓고 간 물건 찾으러 왔다가 불빛이 보여서.”<\/p>\n<p>거짓말은 아니었다. 한서린이 낮에 이곳에 두고 간 끈 장식을 찾으러 온 길이었다. 다만 불빛을 본 뒤 곧장 돌아갈 수도 있었는데, 발이 저절로 안쪽을 향한 것까지 설명하지는 않았다.<\/p>\n<p>서율은 목검을 내려놓았다.<\/p>\n<p>“지난번 말대로라면 정파 수련생 일은 네 일이 아니잖아.”<\/p>\n<p>하연의 얼굴이 잠깐 굳었다.<\/p>\n<p>“……그 말 아직 기억해?”<\/p>\n<p>“기억하지.”<\/p>\n<p>서율은 시선을 피했다.<\/p>\n<p>“내가 괜히 아는 척한 거라면 미안해. 앞으로는 조심할게.”<\/p>\n<p>하연은 예상보다 더 아팠다. 자신이 밀어낸 거리를 서율이 정말로 지키려 하고 있었다.<\/p>\n<p>“그런 뜻은 아니었어.”<\/p>\n<p>“그럼 무슨 뜻이었는데?”<\/p>\n<p>하연은 대답하려다 멈췄다. 누군가 듣고 있을지도 모른다는 경계가 먼저 올라왔다. 하지만 지금 눈앞의 서율은 더 이상 그녀의 변명을 기다릴 것 같지 않았다.<\/p>\n<p>“사람들 앞에서 네 이름이 내 이름과 함께 오르내리는 게 싫었어.”<\/p>\n<p>서율의 얼굴이 굳자 하연은 급히 덧붙였다.<\/p>\n<p>“네가 싫었다는 게 아니라, 그 사람들이 네게 그걸 빌미로 삼는 게 싫었다고.”<\/p>\n<p>서율은 천천히 그녀를 바라봤다.<\/p>\n<p>“그럼 그렇게 말해 주지.”<\/p>\n<p>하연은 웃지 못했다.<\/p>\n<p>“……그러게.”<\/p>\n<p>둘 사이에 긴 침묵이 흘렀다. 밤바람이 등잔 불꽃을 흔들었다.<\/p>\n<p>하연은 검을 바라보며 먼저 말을 돌렸다.<\/p>\n<p>“아까 네가 하던 거, 다시 보여 줄래? 손이 아프면 빈손으로.”<\/p>\n<p>서율은 잠시 망설였다. 그러다 목검을 내려놓고 첫 걸음을 내디뎠다.<\/p>\n<h2>5. 검의 끝에서 시작되는 것<\/h2>\n<p>하연은 서율의 발끝을 보았다.<\/p>\n<p>그녀는 처음 서율이 빈손으로 연습하던 밤을 기억했다. 그때는 불필요한 멈춤을 없애려는 생각만 보였다. 지금은 달랐다. 무게가 옮겨 가는 순서와 몸의 회전이 조금씩 맞아 들어가고 있었다.<\/p>\n<p>“정파 검식을 버리려는 건 아니구나.”<\/p>\n<p>서율이 고개를 들었다.<\/p>\n<p>“왜 버려?”<\/p>\n<p>“남들은 네가 다른 검술을 만들려고 정파의 가르침을 무시한다고 하니까.”<\/p>\n<p>“그게 제일 답답해.”<\/p>\n<p>서율은 종이를 펼쳤다.<\/p>\n<p>“여기 봐. 정파 기본 검식에는 이유가 있잖아. 손목을 보호하고, 상대의 반격을 막고, 다음 자세를 안정시키려고 동작을 끝내는 거잖아.”<\/p>\n<p>“맞아.”<\/p>\n<p>“그런데 상대가 기다려 주지 않으면 어떡하지? 내가 자세를 완성하는 동안 상대는 이미 움직이고 있을 텐데.”<\/p>\n<p>하연의 눈빛이 깊어졌다.<\/p>\n<p>“그래서 멈추지 않는 길을 찾는 거야?”<\/p>\n<p>“응. 그렇다고 무작정 빨라지면 몸이 먼저 무너져. 처음에는 검을 계속 휘두르면 되는 줄 알았어. 그런데 손을 다치고 검을 놓으니까 오히려 발이 보이더라.”<\/p>\n<p>서율은 종이 위에 선을 그었다.<\/p>\n<p>“검이 끝나는 자리가 다음 검의 시작이 될 수 있다면, 그 사이에 굳이 몸을 세울 필요가 없을지도 몰라.”<\/p>\n<p>하연은 그의 설명을 끊지 않았다.<\/p>\n<p>“그런데 그건 상대가 하나의 길로만 들어올 때 이야기야.” 그녀가 말했다. “상대가 네 회전 반대쪽으로 파고들면?”<\/p>\n<p>서율은 잠시 생각했다.<\/p>\n<p>“그때는…….”<\/p>\n<p>그는 바닥에 그려진 발자국을 바라봤다.<\/p>\n<p>“내가 또 멈춰야겠지.”<\/p>\n<p>“그럼 네가 없애려는 멈춤이 다시 생기잖아.”<\/p>\n<p>“그러니까 아직 안 되는 거야.”<\/p>\n<p>서율이 웃었다. 이상하게도 오랜만에 편한 웃음이었다.<\/p>\n<p>“누군가한테 이 이야기를 이렇게 길게 해 본 건 처음이야. 태경이는 들어 주다가 졸고, 소윤이는 내가 무리할까 봐 먼저 손을 보거든.”<\/p>\n<p>하연도 작게 웃었다.<\/p>\n<p>“둘 다 맞는 반응 같은데.”<\/p>\n<p>“그렇긴 하지.”<\/p>\n<p>서율은 다시 진지해졌다.<\/p>\n<p>“하연아. 네가 보기엔 이게 틀린 생각이야?”<\/p>\n<p>하연은 서둘러 대답하지 않았다.<\/p>\n<p>“틀렸다고는 생각 안 해. 다만 네가 찾아낸 건 하나의 답이 아니라 질문에 더 가까워.”<\/p>\n<p>“질문?”<\/p>\n<p>“어디서 멈추지 않을 것인가. 그리고 언제는 반드시 멈춰야 하는가.”<\/p>\n<p>그녀는 서율의 오른손을 가리켰다.<\/p>\n<p>“그 둘을 구분하지 못하면, 네 검은 상대보다 먼저 너를 다치게 할 거야.”<\/p>\n<p>서율은 그 말을 오래 생각했다.<\/p>\n<p>하연은 그의 발을 직접 옮겨 놓거나 검로를 대신 정해 주지 않았다. 단지 그가 놓친 위험을 물었을 뿐이었다. 답을 찾아야 하는 사람은 여전히 서율 자신이었다.<\/p>\n<h2>6. 그날 창고에서<\/h2>\n<p>“하나만 더 물어봐도 돼?”<\/p>\n<p>서율이 말했다.<\/p>\n<p>“오늘 질문이 많네.”<\/p>\n<p>“그날 창고에서…… 내가 무슨 짓을 한 거야?”<\/p>\n<p>하연의 웃음이 사라졌다.<\/p>\n<p>“기억이 안 나?”<\/p>\n<p>“소윤이가 넘어져 있었어. 사람들이 웃고 있었고. 그다음에는 화가 나서…… 검이 어디로 가는지만 보였어. 네가 막았을 때 정신이 들었어.”<\/p>\n<p>그는 한참 망설이다 물었다.<\/p>\n<p>“그때 정말 마공 같은 걸 쓴 걸까?”<\/p>\n<p>“아니.”<\/p>\n<p>하연은 단호하게 대답했다.<\/p>\n<p>“적어도 내가 본 것만으로는 마공이라고 할 근거가 없어.”<\/p>\n<p>“그럼 검기였어?”<\/p>\n<p>“그것도 아니야. 검기라 부르기엔 형태가 불안정했고, 네가 의도해서 모은 기운도 아니었어. 내력이 검끝으로 한꺼번에 쏠리는 징후는 있었지.”<\/p>\n<p>서율은 숨을 삼켰다.<\/p>\n<p>“그런데 왜 막았어?”<\/p>\n<p>하연은 그를 똑바로 바라봤다.<\/p>\n<p>“네가 상대를 해칠까 봐. 그리고 네 손이 다시 망가질까 봐.”<\/p>\n<p>“…….”<\/p>\n<p>“무엇보다 네가 그걸 제어하지 못하고 있었으니까.”<\/p>\n<p>서율은 목검을 내려다봤다.<\/p>\n<p>“나는 그때 내 검이 완성된 줄 알았어. 아주 잠깐이지만.”<\/p>\n<p>“그랬겠지. 네가 오래 찾던 흐름이 갑자기 이어졌으니까.”<\/p>\n<p>하연은 조금 부드럽게 말했다.<\/p>\n<p>“하지만 서율아. 분노 때문에 한 번 열린 길을 네 검이라고 믿으면 안 돼. 네가 평온할 때도 그 길을 이해하고, 멈출 수 있어야 비로소 네 것이 되는 거야.”<\/p>\n<p>서율은 천천히 고개를 끄덕였다.<\/p>\n<p>“그럼 내가 찾아야 하는 건 더 강한 검이 아니라…… 내가 멈출 수 있는 검이네.”<\/p>\n<p>하연은 그 말에 미소를 지었다.<\/p>\n<p>“그건 네가 찾아낸 답이야.”<\/p>\n<p>서율은 한동안 말이 없었다.<\/p>\n<p>“고마워.”<\/p>\n<p>“뭘.”<\/p>\n<p>“그날 막아 준 거. 그리고 지금 이야기 들어 준 거.”<\/p>\n<p>하연은 시선을 돌렸다.<\/p>\n<p>“다시는 그렇게 무모하게 굴지 마.”<\/p>\n<p>“노력할게.”<\/p>\n<p>“노력 말고 약속.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“……약속할게.”<\/p>\n<h2>7. 묻고 싶었던 것<\/h2>\n<p>밤이 더 깊어졌다.<\/p>\n<p>하연은 돌아가야 한다고 생각하면서도 쉽게 일어나지 못했다. 서율이 종이를 정리하는 동안 몇 번이나 입을 열었다 닫았다.<\/p>\n<p>“서율아.”<\/p>\n<p>“응?”<\/p>\n<p>“소윤이는 좀 어때?”<\/p>\n<p>서율의 표정이 가라앉았다.<\/p>\n<p>“많이 나아졌다고는 하는데, 혼자 걸을 때마다 뒤를 돌아봐. 그걸 보면 마음이 안 좋아.”<\/p>\n<p>“……그렇구나.”<\/p>\n<p>“그날 네가 소윤이한테 겉옷 여며 준 것도 고마워.”<\/p>\n<p>하연은 고개를 끄덕였다.<\/p>\n<p>“그 애는 강해 보여도 많이 놀랐을 거야.”<\/p>\n<p>“응. 태경이랑 내가 옆에 있다고 다 해결되는 것도 아니고.”<\/p>\n<p>하연은 바닥을 보았다.<\/p>\n<p>“너희 셋은 참 가까워.”<\/p>\n<p>“그렇지. 학관에 와서 제일 잘한 일이 둘을 만난 거야.”<\/p>\n<p>그 대답은 서율답게 솔직했다.<\/p>\n<p>하연은 잠깐 웃었지만 가슴이 저렸다.<\/p>\n<p>“소윤이는…… 너한테 어떤 사람이야?”<\/p>\n<p>서율은 질문을 곱씹었다.<\/p>\n<p>“소윤이?”<\/p>\n<p>“응. 그냥 궁금해서.”<\/p>\n<p>“같이 있으면 편한 사람. 내가 말하지 않아도 아픈 데부터 알아채고, 태경이랑 싸우면 중간에서 말리고. 나한테는 정말 소중한 친구야.”<\/p>\n<p>하연은 그가 덧붙일 말을 기다렸다. 하지만 서율은 더 말하지 않았다.<\/p>\n<p>“그럼…….”<\/p>\n<p>하연은 스스로도 놀랄 만큼 조심스럽게 물었다.<\/p>\n<p>“나는?”<\/p>\n<p>서율이 고개를 들었다.<\/p>\n<p>“네가 뭐?”<\/p>\n<p>“너한테 나는 어떤 사람이냐고.”<\/p>\n<p>질문을 던진 뒤 하연은 후회했다. 평소 같았으면 웃으며 놀렸을 텐데, 오늘은 농담으로 돌릴 수도 없었다.<\/p>\n<p>서율은 한참 생각했다.<\/p>\n<p>“처음에는 어려운 사람이었어.”<\/p>\n<p>“내가?”<\/p>\n<p>“입관식 때부터 잘하는 사람 같았고, 검도 엄청나게 잘 쓰잖아. 내가 모르는 세상이 있는 것 같았어.”<\/p>\n<p>“지금은?”<\/p>\n<p>“내가 하는 이상한 이야기를 끝까지 들어 주는 사람.”<\/p>\n<p>하연은 숨을 멈췄다.<\/p>\n<p>서율이 말을 이었다.<\/p>\n<p>“남들은 내가 정파 검식을 무시한다고 하는데, 너는 왜 그러는지 먼저 물어봐 줬어. 그게 정말 좋았어.”<\/p>\n<p>“……정말?”<\/p>\n<p>“응. 그래서 지난번에 네가 모르는 사람처럼 굴었을 때 좀 서운했어.”<\/p>\n<p>하연의 얼굴에서 웃음이 사라졌다.<\/p>\n<p>“미안해.”<\/p>\n<p>“아냐. 네가 왜 그랬는지 이제 조금은 알 것 같아.”<\/p>\n<p>서율은 잠시 망설였다.<\/p>\n<p>“그래도 다음에는 그냥 말해 줘. 내가 알아듣지 못할 수도 있지만, 적어도 혼자 오해하진 않게.”<\/p>\n<p>하연은 그를 바라봤다.<\/p>\n<p>그가 자신을 특별하게 생각하는 방식은 자신이 바라는 대답과 같지 않을지도 몰랐다. 하지만 적어도 아무 의미 없는 사람이 아니라는 것은 알 수 있었다.<\/p>\n<p><em>아직은…….<\/em><\/p>\n<p>하연은 속으로 생각했다.<\/p>\n<p><em>아직은 내게도 자리가 있는 걸까.<\/em><\/p>\n<p>그 작은 희망이 부끄러울 만큼 반가웠다.<\/p>\n<p>그러나 두 사람은 알지 못했다.<\/p>\n<p>연무장 바깥, 오래된 담장과 대나무 그림자가 맞닿은 곳에 차윤겸이 서 있었다.<\/p>\n<p>윤겸은 처음부터 둘을 따라온 것이 아니었다. 북쪽 옛 연무장에 불빛이 있다는 말을 듣고, 서율의 야간 수련을 확인하려고 왔다. 그러다 익숙한 목소리를 들었다.<\/p>\n<p>진하연이었다.<\/p>\n<p>그는 돌아가야 한다고 생각했다. 사파 대표가 사적인 자리에서 누구를 만나든 자신이 따질 자격은 없었다. 하지만 발이 움직이지 않았다.<\/p>\n<p>담장 너머로 보이는 것은 두 사람의 어깨와 등잔불뿐이었다. 검술에 관한 긴 대화는 바람에 흩어져 제대로 들리지 않았다. 그가 분명히 들은 것은 하연이 조심스럽게 던진 질문이었다.<\/p>\n<p>“나는? 너한테 나는 어떤 사람이냐고.”<\/p>\n<p>윤겸은 숨을 멈췄다.<\/p>\n<p>조금 뒤 서율이 웃으며 대답했다.<\/p>\n<p>“내가 하는 이상한 이야기를 끝까지 들어 주는 사람.”<\/p>\n<p>그 뒤의 말은 희미했지만, 하연의 얼굴은 보였다. 비무대에서 남궁현우를 무너뜨릴 때도 흔들리지 않던 사람이, 고작 그 말 한마디에 시선을 내리고 있었다.<\/p>\n<p><em>나한테는 한 번도 저런 얼굴을 보여 준 적 없으면서.<\/em><\/p>\n<p>윤겸의 손톱이 손바닥을 파고들었다.<\/p>\n<p>그는 입관식 때부터 하연을 바라보았다. 그녀의 검을 칭찬했고, 먼발치에서라도 눈에 들고 싶어 했다. 하지만 하연은 그의 마음을 알지 못했다. 아니, 알 필요조차 없었다. 윤겸은 그 사실을 인정할 수 없었다.<\/p>\n<p><em>전서율이 대체 뭐라고.<\/em><\/p>\n<p>그는 잠시 뒤 두 사람이 나란히 서서 검로가 그려진 종이를 살피는 모습까지 보았다. 하연이 서율의 손을 걱정하며 목소리를 낮추자, 윤겸의 눈에는 그것마저 둘만의 비밀을 나누는 장면처럼 비쳤다.<\/p>\n<p>윤겸은 모든 말을 듣지 못했다. 하연이 서율의 검을 대신 완성해 준 것도 아니었다. 그러나 그는 자신이 본 것 가운데 가장 아픈 장면만 골라 마음속에 새겼다.<\/p>\n<p><em>낮에는 모르는 사람처럼 굴더니, 밤에는 이렇게 만난다?<\/em><\/p>\n<p>그 순간부터 윤겸에게 필요한 것은 진실이 아니었다. 둘이 다시는 저런 표정으로 마주 보지 못하게 만들 이유였다.<\/p>\n<p>그는 발소리를 죽여 담장 뒤로 물러났다. 등잔불 아래에서 두 사람은 아직 서로의 이야기에 몰두해 있었다.<\/p>\n<h2>8. 문밖의 압박<\/h2>\n<p>그 시각, 제삼 수련반 생활관에는 학관 행정 담당자가 찾아왔다.<\/p>\n<p>윤태경은 문 앞에 선 사람의 손에서 통지서를 받아 들었다.<\/p>\n<p>“전서율의 비공식 수련 장소와 시간, 동행인을 확인한다?”<\/p>\n<p>“조사에 필요한 절차다.”<\/p>\n<p>“아직 잘못한 것도 없는데 왜 밤에 어디 갔는지까지 써야 합니까?”<\/p>\n<p>담당자는 표정을 바꾸지 않았다.<\/p>\n<p>“협조하지 않으면 조사 불응으로 기록될 수 있다.”<\/p>\n<p>태경은 종이를 구겼다가 다시 폈다.<\/p>\n<p>“그럼 창고에서 백소윤을 괴롭힌 사람들은 조사했습니까?”<\/p>\n<p>“그 건은 별도 진술을 받고 있다.”<\/p>\n<p>“누구한테요? 소윤이한테는 같은 말을 세 번이나 물었으면서 가해자들은 수업 잘 듣고 다니던데.”<\/p>\n<p>담당자는 대답하지 않았다.<\/p>\n<p>잠시 뒤 소윤에게도 별도의 통지가 전달되었다. 피해 경위를 다시 진술하되, ‘사실과 추정을 구분하고 사적인 감정을 배제하라’는 문구가 굵게 적혀 있었다.<\/p>\n<p>소윤은 종이를 읽다가 손을 멈췄다.<\/p>\n<p>자신이 겪은 일을 말할 때마다 누군가는 감정적이라고 했고, 서율을 보호하려고 거짓말하는 것이 아니냐고 물었다. 정작 자신을 둘러쌌던 학생들이 왜 그곳에 모여 있었는지는 제대로 묻지 않았다.<\/p>\n<p>“나 때문에 서율이한테 또 일이 생기는 걸까?”<\/p>\n<p>소윤이 중얼거렸다.<\/p>\n<p>태경이 즉시 고개를 저었다.<\/p>\n<p>“그런 말 하지 마. 너 때문이 아니야. 저 사람들이 일부러 그런 거야.”<\/p>\n<p>그는 한숨을 쉬었다.<\/p>\n<p>“내가 화만 내면 저놈들이 좋아할 테니까, 이번에는 제대로 적자. 날짜, 장소, 누가 무슨 말을 했는지.”<\/p>\n<p>소윤은 잠시 태경을 바라봤다.<\/p>\n<p>“너도 많이 달라졌네.”<\/p>\n<p>“뭐가?”<\/p>\n<p>“예전 같았으면 벌써 달려갔을 텐데.”<\/p>\n<p>태경은 씁쓸하게 웃었다.<\/p>\n<p>“서율이 손 다친 거 보고 배웠지. 화내는 것만으로는 못 지키는 게 있더라.”<\/p>\n<p>둘은 등잔을 켜고 기억나는 사실을 나누어 적기 시작했다. 소윤의 일기장은 그날의 마음을 기록한 개인 물건으로 남겨 두었다. 공식 진술에는 날짜와 목격자, 물건이 흩어진 위치와 당시의 말을 따로 정리했다.<\/p>\n<h2>9. 빌미가 되는 밤<\/h2>\n<p>차윤겸은 남궁현우의 별채로 향하는 동안 여러 번 걸음을 멈췄다.<\/p>\n<p>자신이 본 것은 두 사람이 밤에 만나 이야기를 나누는 모습이었다. 검술의 비밀을 주고받았는지는 알 수 없었다. 금기무공을 가르치는 장면도 없었다.<\/p>\n<p>하지만 하연이 서율을 바라보던 눈빛은 분명했다.<\/p>\n<p>윤겸은 그것이 견딜 수 없었다.<\/p>\n<p>남궁현우의 책상 위에는 은서방이 보내온 첫 회신이 놓여 있었다. 전서율의 출신과 입관 이전 무공 계보는 아직 확인 중이었다. 마교 접촉 기록도, 금기무공을 배웠다는 증거도 없었다.<\/p>\n<p>“이 정도로는 부족합니까?” 윤겸이 물었다.<\/p>\n<p>“부족하지.” 현우는 회신을 접었다. “확실한 게 없으니까.”<\/p>\n<p>“그럼 제가 본 건 어떻습니까?”<\/p>\n<p>현우가 고개를 들었다.<\/p>\n<p>“북쪽 옛 연무장에서 전서율과 진하연이 단둘이 만났습니다. 서율은 검로를 그린 종이를 펼쳤고, 하연은 그걸 보며 오래 이야기를 나눴습니다.”<\/p>\n<p>“직접 봤나?”<\/p>\n<p>“예.”<\/p>\n<p>“검을 가르치는 것도?”<\/p>\n<p>윤겸은 이를 악물었다.<\/p>\n<p>“거기까지는 보지 못했습니다.”<\/p>\n<p>현우는 잠시 그를 살폈다.<\/p>\n<p>“그런데 왜 이렇게 화가 나 있지?”<\/p>\n<p>“정파의 수련생이 사파 대표와 밤마다 만나는 게 옳습니까?”<\/p>\n<p>“그게 네가 화난 이유의 전부인가?”<\/p>\n<p>윤겸은 대답하지 않았다. 현우는 그 침묵을 이해한 듯 입꼬리를 올렸다.<\/p>\n<p>“좋아. 네 감정은 보고서에서 빼. 네가 본 시간, 장소, 두 사람이 한 행동만 적어.”<\/p>\n<p>“그럼 내통 의혹은요?”<\/p>\n<p>“우리가 단정할 필요가 있나? 출처가 불분명한 검술을 수련하는 학도가, 그 검술을 조사받는 중에 사파 대표와 밤에 만났다. 그것만으로도 학관은 물어볼 게 많겠지.”<\/p>\n<p>윤겸은 고개를 숙였다. 그러나 물러나려다 다시 입을 열었다.<\/p>\n<p>“남궁 공자. 이번에는 단순한 주의나 보충 수련으로 끝내지 마십시오.”<\/p>\n<p>현우의 눈빛이 차가워졌다.<\/p>\n<p>“선을 넘지 마라.”<\/p>\n<p>“그 아이가 학관에 있는 한 진하연은 계속…….”<\/p>\n<p>윤겸은 말을 삼켰다.<\/p>\n<p>현우는 한참 뒤 말했다.<\/p>\n<p>“조사에서 사실을 확인할 거다. 다만 그 사실이 어떤 처분으로 이어질지는 학관이 결정하겠지.”<\/p>\n<p>윤겸은 그 말을 허락으로 받아들였다. 그는 돌아가자마자 자신이 목격한 장면을 적고, 은서방이 수집 중인 서율의 행적 자료와 대조해 달라는 요청을 덧붙였다.<\/p>\n<p>그가 밤의 대화를 온전히 들은 것은 아니었다. 그러나 기록에는 두 사람이 함께 있었다는 사실과, 두 사람 사이에 무언가 감춰진 것이 있다는 자신의 추측이 나란히 놓였다.<\/p>\n<p>그날부터 윤겸은 소문을 퍼뜨리는 데 만족하지 않기로 했다. 서율이 학관에 남아 있는 한 하연의 마음이 자신을 향할 일은 없으리라는, 누구도 약속한 적 없는 결론에 사로잡혔기 때문이다.<\/p>\n<h2>10. 지켜야 할 사람<\/h2>\n<p>옛 연무장에서 돌아갈 채비를 마친 하연은 서율에게 먼저 등잔을 건넸다.<\/p>\n<p>“이 길은 어두워. 조심해서 가.”<\/p>\n<p>서율은 웃었다.<\/p>\n<p>“너도.”<\/p>\n<p>“그리고 오늘 이야기한 거, 다른 사람한테 함부로 보여 주지 마.”<\/p>\n<p>“내가 적은 종이?”<\/p>\n<p>“응. 지금은 네가 무슨 말을 해도 이상하게 들으려는 사람들이 있어.”<\/p>\n<p>서율은 종이 묶음을 품속에 넣었다.<\/p>\n<p>“하지만 언젠가는 제대로 설명하고 싶어. 이게 정파의 검을 부정하는 게 아니라는 걸.”<\/p>\n<p>하연은 그를 바라봤다.<\/p>\n<p>“그 마음은 버리지 마.”<\/p>\n<p>그녀는 잠시 망설이다 덧붙였다.<\/p>\n<p>“다만 설명할 사람을 잘 골라.”<\/p>\n<p>둘은 연무장 문턱에서 헤어졌다.<\/p>\n<p>서율이 몇 걸음 가다가 돌아봤다.<\/p>\n<p>“하연아.”<\/p>\n<p>“왜?”<\/p>\n<p>“오늘 만나서 좋았어.”<\/p>\n<p>하연은 아무 말도 하지 못했다.<\/p>\n<p>서율은 가볍게 손을 흔들고 어둠 속으로 걸어갔다.<\/p>\n<p>그의 발소리가 멀어진 뒤에도 하연은 한동안 같은 자리에 서 있었다.<\/p>\n<p><em>오늘 만나서 좋았어.<\/em><\/p>\n<p>그 짧은 말이 가슴에 남았다.<\/p>\n<p>하연은 웃으려다 그만두었다. 학관이 서율을 몰아붙이고 있다는 사실을 잊을 수 없었다. 자신이 거리를 두면 그가 안전해질 것이라고 믿었던 생각도 이제는 확신할 수 없었다.<\/p>\n<p>그녀는 서율이 놓고 간 발자국을 내려다봤다.<\/p>\n<p><em>네 검은 네가 완성해야 해.<\/em><\/p>\n<p><em>나는 그 길을 대신 걸어 줄 수 없어.<\/em><\/p>\n<p>그녀는 천천히 고개를 들었다.<\/p>\n<p><em>하지만 그 길을 걷기도 전에 너를 꺾으려는 사람들까지 그냥 보고 있지는 않을 거야.<\/em><\/p>\n<p>하연은 정파 학관의 불빛이 보이는 쪽을 바라봤다.<\/p>\n<p>이제 필요한 것은 남들 앞에서 서율과 모르는 사이인 척하는 일이 아니었다. 누가 소문을 만들고, 누가 기록을 바꾸고, 누가 그것을 이용하는지 알아내는 일이었다.<\/p>\n<p>사파 대표라는 자리는 그저 비무대에서 이긴 사람에게 주어지는 이름이 아니었다. 자신이 책임질 수 있는 일과 없는 일을 구분하고, 책임질 수 있는 일에는 물러서지 않는 자리였다.<\/p>\n<p>하연은 처음으로 그 이름을 서율을 위해 써야겠다고 생각했다.<\/p>\n<p>그것이 서율을 더 위험하게 만들지 않도록, 이번에는 서두르지 않기로 했다.<\/p>\n<h2>11. 다른 두 개의 기록<\/h2>\n<p>소윤은 그날 밤 일기장에 짧게 적었다.<\/p>\n<p><em>오늘 태경이와 함께 진술서를 썼다. 같은 일을 몇 번이나 다시 적어야 하는지 모르겠다. 하지만 이번에는 날짜와 말을 하나도 빼지 않으려고 했다.<\/em><\/p>\n<p><em>서율이는 밤늦게 돌아왔다. 손이 조금 아픈 것 같았지만 얼굴은 며칠 만에 편안해 보였다.<\/em><\/p>\n<p><em>무슨 좋은 일이 있었느냐고 묻자, 오래 생각하던 문제를 누군가와 이야기했다고 했다.<\/em><\/p>\n<p>소윤은 잠시 붓을 멈췄다.<\/p>\n<p><em>누군지 묻지 않았다. 어쩐지 알 것 같았다.<\/em><\/p>\n<p><em>나는 서율이가 웃어서 좋았다. 그리고 그 웃음을 내가 만든 게 아니라는 생각에 조금 쓸쓸했다.<\/em><\/p>\n<p>그녀는 마지막 문장을 읽고 조용히 일기장을 덮었다.<\/p>\n<p>한편 학관의 다른 방에서는 차윤겸이 목격 보고서를 다시 펼치고 있었다.<\/p>\n<p><em>전서율, 북쪽 옛 연무장에서 야간 비공식 수련.<\/em><\/p>\n<p><em>진하연, 같은 장소에 동석. 검로를 그린 종이를 함께 살피며 대화하는 장면 직접 목격.<\/em><\/p>\n<p>여기까지는 사실이었다. 윤겸은 그 아래에 새 문장을 적었다.<\/p>\n<p><em>사파 무공 전수 또는 금기무공 관련 사전 교감 가능성. 추가 조사 필요.<\/em><\/p>\n<p>그것은 자신이 확인한 사실이 아니라 추측이었다. 윤겸은 두 문장 사이에 선을 긋지 않았다. 읽는 사람이 두 내용을 자연스럽게 이어 받아들이기를 바랐기 때문이다.<\/p>\n<p>그는 서찰을 봉하면서 낮게 중얼거렸다.<\/p>\n<p>“이번에는 네가 빠져나가지 못하게 할 거다, 전서율.”<\/p>\n<p>이 기록이 어떤 처분을 불러올지는 아직 아무도 몰랐다. 그러나 윤겸은 더 이상 단순한 목격자가 아니었다. 자신이 본 것을 이용해 한 사람을 몰아세우기로 선택한 사람이었다.<\/p>\n<p>같은 밤 전서율은 자신의 종이에 또 하나의 문장을 남겼다.<\/p>\n<p><em>흐름은 멈추지 않는 데 있는 것이 아니다. 멈춰야 할 때 멈출 수 있어야 다음으로 이어진다.<\/em><\/p>\n<p>그는 그것을 검술의 해답이라고 생각하지 않았다.<\/p>\n<p>다만 처음으로 자신이 걸어갈 방향을 조금 알 것 같았다.<\/p>\n<p><strong>— 제17장 「흔들리는 검」 끝.<\/strong><\/p>\n"}, {"n": 18, "title": "제18장. 패배자의 분노", "body": "<h1>제18장. 패배자의 분노<\/h1>\n<h2>1. 부러진 검의 기억<\/h2>\n<p>남궁현우는 검을 닦을 때마다 같은 장면을 떠올렸다.<\/p>\n<p>진하연의 검끝이 목 앞에서 멈추던 순간이었다. 상대가 자신을 죽일 수 있었으나 죽이지 않았다는 사실보다, 그것을 수백 명이 보았다는 사실이 더 견디기 어려웠다. 비무대에서 내려오던 날, 누구도 대놓고 비웃지 않았다. 그래서 더 참을 수 없었다. 사람들이 말을 아낄 때마다 그 침묵 속에 웃음이 숨어 있는 것 같았다.<\/p>\n<p>그는 깨끗한 검신을 다시 문질렀다.<\/p>\n<p>“공자.”<\/p>\n<p>문밖에서 집안의 사자가 불렀다. 사자는 학관 안에 머무는 사람이 아니었다. 남궁가에서 중요한 일이 생길 때만 나타나는 중년인이었다.<\/p>\n<p>“가주께서 전하라 하셨습니다. 학관의 이름으로 입은 수치는 학관 안에서 바로잡으라고.”<\/p>\n<p>현우의 손이 멎었다.<\/p>\n<p>“그게 전부인가?”<\/p>\n<p>“남궁의 이름이 더는 비무대의 이야깃거리가 되지 않게 하라는 말씀도 있었습니다.”<\/p>\n<p>사자가 물러난 뒤에도 현우는 검을 내려놓지 않았다. 아버지는 진하연에게 다시 도전하라고 하지 않았다. 오히려 그 패배가 왜 생겼는지 설명할 수 있는 이야기를 요구했다.<\/p>\n<p>현우는 책상 위의 낡은 비무 기록을 펼쳤다. 전서율의 이름 옆에 ‘우수 부상’이라고 적혀 있었다. 자신이 상대의 검을 떨어뜨린 뒤에도 공격을 멈추지 않았다는 대목은 없었다.<\/p>\n<p>그날은 잘 정리되었다고 생각했다.<\/p>\n<p>그러나 최근 소윤의 피해 사건과 함께 그 부상이 다시 입에 오르기 시작했다. 어떤 교두가 이전 비무의 경위를 재확인해야 한다고 말했다는 소문도 들렸다.<\/p>\n<p>“또 전서율인가.”<\/p>\n<p>현우는 기록을 접었다.<\/p>\n<p>자신이 잘못했다는 말은 한 번도 떠올리지 않았다. 대신 전서율이 없었다면 진하연이 자신을 그토록 노골적으로 적대하지 않았을 것이라고 생각했다.<\/p>\n<p>그것은 사실이 아니라, 현우가 견디기 편한 설명이었다.<\/p>\n<h2>2. 본 것과 적은 것<\/h2>\n<p>차윤겸은 해가 지기 전에 별채에 도착했다.<\/p>\n<p>그는 전날 밤 북쪽 옛 연무장에서 본 장면을 아직도 떨쳐 내지 못했다. 등잔 아래에서 서율의 설명을 듣던 하연의 얼굴. 검을 보던 눈이 어느 순간 사람을 향하던 모습. 그녀가 자신에게는 한 번도 보여 준 적 없는 표정이었다.<\/p>\n<p>“증언을 다시 써 왔습니다.”<\/p>\n<p>윤겸이 종이를 내밀었다.<\/p>\n<p>현우는 첫 줄을 읽었다.<\/p>\n<p>“진하연이 전서율에게 비전의 검로를 전수하는 것으로 추정된다.”<\/p>\n<p>그는 종이를 내려놓았다.<\/p>\n<p>“네가 초식을 직접 보았나?”<\/p>\n<p>“둘이 종이를 펼쳐 놓고 검술을 논했습니다.”<\/p>\n<p>“전수하는 모습을 봤느냐고.”<\/p>\n<p>“……아닙니다.”<\/p>\n<p>“그럼 왜 전수라고 썼지?”<\/p>\n<p>윤겸의 얼굴이 굳었다. 현우가 서율을 감싸는 것처럼 들려서였다.<\/p>\n<p>“그 둘이 어떤 사이인지 아시지 않습니까?”<\/p>\n<p>“내가 묻는 건 네 기분이 아니다.”<\/p>\n<p>현우는 붓을 들었다. ‘전수’라는 글자에 줄을 긋고 ‘비공식 접촉 중 무공 관련 대화’라고 고쳤다. 그리고 다음 줄에 ‘교육 과정 외 검로의 출처 확인 필요’라고 적었다.<\/p>\n<p>“이게 더 오래간다.”<\/p>\n<p>윤겸이 이해하지 못한 표정을 짓자 현우는 말했다.<\/p>\n<p>“네 말이 거짓으로 드러나면 끝이야. 하지만 출처를 확인하자고 하면 누가 반대하겠느냐.”<\/p>\n<p>윤겸은 종이를 내려다봤다. 자신이 본 사실과 믿고 싶은 추측의 경계가 사라지고 있었다. 그런데 이상하게도 문장은 오히려 더 그럴듯해졌다.<\/p>\n<p>“제가 원하는 건 그자가 다시 진하연 곁에 서지 못하는 겁니다.”<\/p>\n<p>“나는 그놈이 누구 곁에 서든 관심 없어.”<\/p>\n<p>현우는 차갑게 웃었다.<\/p>\n<p>“내 앞에서 다시는 검을 들지 못하게 하면 그만이지.”<\/p>\n<p>둘은 잠시 서로를 바라봤다. 같은 사람을 미워하면서도 미워하는 이유가 다르다는 것을 확인한 순간이었다.<\/p>\n<p>현우는 수정한 보고서를 봉투에 넣었다.<\/p>\n<p>“학관 규율원에 접수해. 그리고 목격자 명부를 만들어라. 누가 무엇을 보았는지, 그들이 정말 봤는지는 내가 따로 확인하겠다.”<\/p>\n<p>윤겸은 고개를 숙였다. ‘정말 봤는지’라는 말이 무엇을 뜻하는지 그에게는 중요하지 않았다. 필요한 말을 하게 만들 수 있다면 그걸로 충분했다.<\/p>\n<h2>3. 서고의 빈자리<\/h2>\n<p>백소윤은 서고의 대출대 앞에서 자신의 이름이 적힌 종이를 보았다.<\/p>\n<p>‘임시 열람 제한.’<\/p>\n<p>“제가 책을 훼손한 적은 없는데요.”<\/p>\n<p>서고 담당 학도생은 난처한 얼굴이었다.<\/p>\n<p>“훼손 때문이 아니야. 조사에 관련된 학도생은 기록실 출입을 잠시 제한하라는 지시가 왔어.”<\/p>\n<p>“어떤 조사요?”<\/p>\n<p>“나도 자세한 건 몰라.”<\/p>\n<p>소윤은 종이 아래에 찍힌 작은 인장을 확인했다. 규율원의 인장이었다. 그 옆에는 담당자의 서명이 없었다.<\/p>\n<p>“이 지시를 내린 사람을 알려 주세요.”<\/p>\n<p>“소윤아, 나까지 곤란해져.”<\/p>\n<p>그녀는 더 묻지 않았다. 대신 종이의 날짜와 인장 모양을 기억했다.<\/p>\n<p>밖으로 나오자 윤태경이 기다리고 있었다.<\/p>\n<p>“책은?”<\/p>\n<p>“못 빌렸어.”<\/p>\n<p>“왜?”<\/p>\n<p>소윤은 종이를 가리켰다. 태경의 얼굴이 붉어졌다.<\/p>\n<p>“이젠 네가 책 빌리는 것까지 막아?”<\/p>\n<p>“소리 낮춰.”<\/p>\n<p>“이게 말이 돼?”<\/p>\n<p>“안 되지. 그러니까 확인해야 해.”<\/p>\n<p>소윤은 전날 작성한 진술서 사본을 꺼냈다. 창고 뒤뜰에서 누가 자신을 불러냈는지, 누가 가방을 빼앗았는지, 누가 팔과 옷자락을 붙잡았는지를 가능한 한 정확히 적은 문서였다. 기억이 불확실한 부분에는 불확실하다고 썼다.<\/p>\n<p>“서고 출입 제한도 날짜를 적어 둘 거야.”<\/p>\n<p>태경은 그녀를 바라봤다.<\/p>\n<p>“무섭지 않아?”<\/p>\n<p>소윤은 대답하기까지 조금 시간이 걸렸다.<\/p>\n<p>“무서워. 혼자 다닐 때는 아직도 뒤를 돌아봐.”<\/p>\n<p>그녀는 종이를 반듯하게 접었다.<\/p>\n<p>“그런데 내가 아무 말도 안 하면, 그날 일은 정말 없었던 일이 되잖아.”<\/p>\n<p>태경은 더는 화를 내지 않았다. 대신 그녀의 서책을 받아 들었다.<\/p>\n<p>“그럼 같이 확인하자. 내가 본 것도 적을게. 못 본 건 못 봤다고 쓰고.”<\/p>\n<p>소윤이 웃었다.<\/p>\n<p>“그게 제일 중요해.”<\/p>\n<h2>4. 바뀐 입<\/h2>\n<p>창고 뒤뜰에서 소윤을 불러냈던 여학생은 조사실 앞에서 손톱을 물어뜯고 있었다.<\/p>\n<p>전날 그녀를 찾아온 상급 수련생이 했던 말이 귓가에 남아 있었다.<\/p>\n<p>‘네가 먼저 건드렸다고 인정하면 너희 수련반 전체가 불이익을 받을 수 있어. 그냥 말다툼이었다고 해. 다친 사람도 없잖아.’<\/p>\n<p>그녀는 정말로 누군가의 수련반이 벌을 받는지 알지 못했다. 다만 자신이 잘못했다는 사실이 알려지면 집안에도 소식이 갈까 두려웠다.<\/p>\n<p>규율원 서기가 물었다.<\/p>\n<p>“백소윤의 물건을 빼앗았습니까?”<\/p>\n<p>“서로 실랑이가 있었습니다.”<\/p>\n<p>“옷을 잡아당긴 일은?”<\/p>\n<p>여학생은 입술을 깨물었다.<\/p>\n<p>“그건…… 잘 모르겠습니다. 사람이 많아서.”<\/p>\n<p>“전서율이 검을 들었습니까?”<\/p>\n<p>“예. 그건 분명히 봤습니다.”<\/p>\n<p>서기는 마지막 대답만 또렷하게 적었다.<\/p>\n<p>복도에서 기다리던 다른 여학생은 그녀에게 물었다.<\/p>\n<p>“뭐라고 했어?”<\/p>\n<p>“그냥 다툼이었다고.”<\/p>\n<p>“잘했어.”<\/p>\n<p>그러나 잘했다는 말을 듣고도 마음이 편해지지 않았다. 소윤이 옷자락을 붙들고 그만하라고 외치던 목소리가 기억났기 때문이다.<\/p>\n<p>그녀는 그 일을 잊고 싶었다.<\/p>\n<p>잊고 싶다는 마음이 거짓말을 쉽게 만들었다.<\/p>\n<h2>5. 검을 든 이유<\/h2>\n<p>제삼 수련반의 노교두는 규율원에서 온 질문지를 두 번 읽었다.<\/p>\n<p>‘전서율은 정파 기본 검식을 벗어난 움직임을 반복적으로 시도하였는가.’<\/p>\n<p>‘전서율은 다른 학도생에게 위협적인 행동을 보인 적이 있는가.’<\/p>\n<p>‘전서율이 사파 대표와 사적으로 교류한 사실을 알고 있는가.’<\/p>\n<p>노교두는 붓을 들었다.<\/p>\n<p>첫 번째 질문에는 그렇다고 썼다. 다만 정파 기본 보법을 바탕으로 연결 동작을 연구한 것이며, 외부 무공 전수 사실은 자신이 확인하지 못했다고 덧붙였다.<\/p>\n<p>두 번째 질문에는 직접 목격한 사실이 없다고 썼다.<\/p>\n<p>세 번째 질문에는 학도생 사이의 교류 자체가 금지된 규정은 없다는 문장을 적었다.<\/p>\n<p>서기가 난처한 얼굴로 물었다.<\/p>\n<p>“교두님, 질문에만 답하시면 됩니다.”<\/p>\n<p>“답했네.”<\/p>\n<p>“설명이 길어지면 심의가 복잡해집니다.”<\/p>\n<p>“사람을 심의한다면서 복잡한 사실은 빼겠다는 건가?”<\/p>\n<p>서기는 입을 다물었다.<\/p>\n<p>노교두는 종이 한 장을 더 꺼냈다. 서율의 출석 기록에 관해 이전에 제기한 원본 확인 요청이었다. 제14장에서 사라졌던 원본은 여전히 나오지 않았다.<\/p>\n<p>“이것도 함께 올려 주게. 잘못된 출석 기록을 근거로 성실성을 문제 삼는다면, 그 기록부터 검증해야지.”<\/p>\n<p>“그건 별도 절차입니다.”<\/p>\n<p>“그럼 별도 절차가 끝나기 전에는 확정된 사실처럼 쓰지 말라고 적어 주게.”<\/p>\n<p>서기는 한숨을 쉬었다.<\/p>\n<p>노교두는 마지막으로 문장을 추가했다.<\/p>\n<p>‘창고 뒤뜰 사건의 발단과 피해자 진술을 검토하지 않고 전서율의 검 사용만 평가하는 것은 부당함.’<\/p>\n<p>그는 정파의 규율을 믿었다. 그래서 더욱 그 규율이 누군가의 편의를 위해 잘려 나가는 모습을 두고 볼 수 없었다.<\/p>\n<h2>6. 사라진 첫 문장<\/h2>\n<p>서율에게 처음 도착한 문서는 ‘사실 확인 요청’이었다.<\/p>\n<p>그는 질문지를 읽다가 고개를 들었다.<\/p>\n<p>“소윤이에 대한 일은 어디 있습니까?”<\/p>\n<p>규율원 담당자는 종이를 정리하며 말했다.<\/p>\n<p>“그 건은 별도 확인 중이다.”<\/p>\n<p>“그런데 이 문서에는 제가 다른 학도생을 위협했다고만 적혀 있습니다.”<\/p>\n<p>“검을 들었지 않느냐.”<\/p>\n<p>“들었습니다.”<\/p>\n<p>“그럼 사실이군.”<\/p>\n<p>서율은 잠시 말을 멈췄다.<\/p>\n<p>“왜 들었는지도 사실입니다.”<\/p>\n<p>담당자가 눈을 들었다.<\/p>\n<p>“전서율. 지금은 네 행동을 확인하는 자리다.”<\/p>\n<p>“제 행동을 확인하시려면 그 전에 있었던 일도 보셔야 합니다.”<\/p>\n<p>“조사에 협조하라.”<\/p>\n<p>서율은 자신의 오른손을 바라봤다. 손가락은 아직 오래 힘을 주면 욱신거렸다.<\/p>\n<p>“저는 검을 들었습니다. 그리고 제어하지 못했습니다. 그건 잘못했습니다.”<\/p>\n<p>그는 고개를 들었다.<\/p>\n<p>“하지만 소윤이가 당한 일을 없던 일로 만들지는 않겠습니다.”<\/p>\n<p>담당자는 아무 말도 하지 않았다.<\/p>\n<p>서율은 질문지 끝에 직접 적었다.<\/p>\n<p>‘검을 사용한 사실은 인정함. 다만 동료 학도생 백소윤이 다수에게 둘러싸여 물리적 침해를 당하는 상황에서 개입하였으며, 사건 발단에 대한 별도 조사 결과와 함께 판단해 주기를 요청함.’<\/p>\n<p>그는 종이를 돌려주었다.<\/p>\n<p>담당자는 그 문장을 지우지 않았다. 그러나 그것이 심의자들의 눈에 온전히 들어갈지는 알 수 없었다.<\/p>\n<h2>7. 한서린이 가져온 소식<\/h2>\n<p>한서린은 사파 수련관 뒤뜰에서 진하연을 찾았다.<\/p>\n<p>“네가 말한 대로 알아봤어.”<\/p>\n<p>하연이 검을 거두었다.<\/p>\n<p>“어때?”<\/p>\n<p>“창고 뒤뜰에서 소윤을 불러낸 애들 중 하나가 어제 규율원에 갔대. 그리고 차윤겸이 그 애들이랑 몇 번 만난 것도 봤다는 사람이 있어.”<\/p>\n<p>“누가?”<\/p>\n<p>“사파 쪽 후배. 하지만 그 애를 바로 증인으로 세우지는 마. 정파 내부 일에 사파가 사람을 심었다는 말이 나올 수도 있어.”<\/p>\n<p>하연은 고개를 끄덕였다.<\/p>\n<p>“확인된 건?”<\/p>\n<p>“만났다는 것뿐이야. 무슨 말을 했는지는 몰라.”<\/p>\n<p>하연은 잠시 생각했다.<\/p>\n<p>“그럼 그 사실만 남겨 둬.”<\/p>\n<p>한서린은 놀란 얼굴이었다.<\/p>\n<p>“네가 그렇게 조심스럽게 말하는 건 처음 보는 것 같네.”<\/p>\n<p>“누군가의 말 한마디가 전서율을 여기까지 몰았잖아.”<\/p>\n<p>하연은 검집을 내려놓았다.<\/p>\n<p>“나까지 확인하지 않은 말을 보태면 안 되지.”<\/p>\n<p>한서린은 그녀를 바라보다 조용히 물었다.<\/p>\n<p>“그 애가 그렇게 걱정돼?”<\/p>\n<p>하연은 대답하지 않았다.<\/p>\n<p>한서린은 더 묻지 않았다. 대신 작은 쪽지를 내밀었다.<\/p>\n<p>“규율원에 외부 무공 접촉 확인 절차가 생겼대. 정파 수련반에서 올린 건데, 사파 대표에게도 사실 확인 요청이 갈 수 있대.”<\/p>\n<p>하연은 쪽지를 읽었다.<\/p>\n<p>“좋아.”<\/p>\n<p>“뭐가 좋아?”<\/p>\n<p>“이제 나도 공식적으로 대답할 수 있겠네.”<\/p>\n<p>그녀의 눈빛이 달라졌다.<\/p>\n<p>“전서율이 내게서 무공을 배웠는지 묻겠다면, 누가 그런 말을 했는지도 함께 물을 거야.”<\/p>\n<h2>8. 서로 다른 싸움<\/h2>\n<p>저녁 무렵, 태경은 식당 뒤편에서 서율을 붙잡았다.<\/p>\n<p>“소윤이 서고 출입 막힌 거 들었어?”<\/p>\n<p>“뭐?”<\/p>\n<p>“조사 관련자라서 안 된대.”<\/p>\n<p>서율은 곧바로 걸음을 돌리려 했다. 태경이 그의 팔을 잡았다.<\/p>\n<p>“어디 가?”<\/p>\n<p>“규율원에—”<\/p>\n<p>“그래서 또 네가 소리치면 그 사람들 좋아하겠지.”<\/p>\n<p>서율이 멈췄다.<\/p>\n<p>태경은 숨을 고르고 말을 이었다.<\/p>\n<p>“나도 화나. 근데 소윤이가 지금은 날짜부터 확인하자더라. 누가 지시했는지, 규정에 있는 건지.”<\/p>\n<p>서율은 천천히 고개를 끄덕였다.<\/p>\n<p>“……맞아.”<\/p>\n<p>“너만 싸우는 거 아니야.”<\/p>\n<p>그 말에 서율은 태경을 바라봤다.<\/p>\n<p>태경은 웃지 않았다.<\/p>\n<p>“네가 검을 들고 앞에 서는 동안, 소윤이는 자기 일 다시 말해야 했어. 몇 번이나. 그게 얼마나 싫겠냐.”<\/p>\n<p>서율은 대답하지 못했다.<\/p>\n<p>“그러니까 이번엔 네가 다 해결하려 하지 마. 나도 할 수 있는 게 있고, 소윤이도 있어.”<\/p>\n<p>서율은 한참 뒤 말했다.<\/p>\n<p>“미안해.”<\/p>\n<p>“사과는 나중에. 오늘은 밥이나 먹어.”<\/p>\n<p>“네가 사 주는 거야?”<\/p>\n<p>“그건 아니고.”<\/p>\n<p>둘은 그제야 조금 웃었다.<\/p>\n<p>하지만 식당 안으로 들어서자 몇몇 학생이 자리에서 일어났다. 서율을 보고 피한 것인지, 원래 나갈 시간이었는지는 알 수 없었다.<\/p>\n<p>태경은 그 모습을 보며 이를 악물었다.<\/p>\n<p>서율은 빈자리에 앉았다. 누가 일어나든 자신이 밥을 먹을 권리까지 없어지는 것은 아니었다.<\/p>\n<h2>9. 심의의 문턱<\/h2>\n<p>사흘 뒤, 규율원 회의실에 세 장의 서류가 올라왔다.<\/p>\n<p>첫째는 창고 뒤뜰에서 전서율이 검을 들었다는 다수의 진술이었다. 서로 다른 필체였지만, ‘먼저 위협적인 태도를 보였다’는 표현은 이상할 만큼 같았다.<\/p>\n<p>둘째는 차윤겸의 야간 목격 보고였다. 진하연과 전서율이 북쪽 옛 연무장에서 무공에 관해 이야기한 사실에, 출처를 알 수 없는 검로를 논의했다는 추정이 덧붙어 있었다.<\/p>\n<p>셋째는 남궁가에서 전달한 외부 무공 계보 확인 요청이었다. 은서방이 조사 중이라는 사실은 문서 어디에도 적혀 있지 않았다. 다만 ‘입관 이전 수련 이력의 추가 검증이 필요하다’는 말이 들어 있었다.<\/p>\n<p>서류를 읽던 젊은 교두가 물었다.<\/p>\n<p>“백소윤의 피해 진술은 어디 있습니까?”<\/p>\n<p>규율원 서기가 답했다.<\/p>\n<p>“별도 사건으로 분류했습니다.”<\/p>\n<p>“같은 날 같은 장소에서 벌어진 일인데요?”<\/p>\n<p>“피해 사실과 금기무공 의혹은 심의 항목이 다릅니다.”<\/p>\n<p>“그렇다면 검을 든 이유를 어떻게 판단합니까?”<\/p>\n<p>회의실 한쪽에 앉아 있던 상급 교두가 헛기침했다.<\/p>\n<p>“일단 규율 위반 가능성부터 살피자는 것이오. 누구에게도 죄가 확정된 것은 아니니.”<\/p>\n<p>젊은 교두는 더 말하려 했으나 옆의 노교두가 조용히 손을 들었다.<\/p>\n<p>“확정되지 않았다면, 서류 제목에도 ‘금기무공 사용’이 아니라 ‘사용 의혹’이라고 적어야겠지요.”<\/p>\n<p>상급 교두는 불편한 얼굴로 고개를 끄덕였다.<\/p>\n<p>노교두는 계속했다.<\/p>\n<p>“그리고 내가 요청한 출석 기록 원본은 아직도 오지 않았습니다. 확인되지 않은 기록을 서율의 평소 행실에 관한 증거로 쓰지 마십시오.”<\/p>\n<p>그의 말은 회의록에 남았다.<\/p>\n<p>그러나 그날 회의의 끝에서 결정된 것은 서율에게 유리한 조치가 아니었다.<\/p>\n<p>‘정식 심의에 앞서 관련 학도생의 무공 수련 경위와 외부 접촉 여부를 조사한다.’<\/p>\n<p>문구는 온건했다.<\/p>\n<p>하지만 누군가의 이름을 공식적인 조사 대상으로 올리는 데는 그것으로 충분했다.<\/p>\n<h2>10. 사파 대표의 답변<\/h2>\n<p>진하연에게도 서찰이 도착했다.<\/p>\n<p>‘전서율과의 사적 접촉 및 무공 교류 여부를 확인하고자 하니, 사파 대표의 입장에서 사실관계를 회신 바람.’<\/p>\n<p>하연은 종이를 끝까지 읽었다.<\/p>\n<p>한서린이 물었다.<\/p>\n<p>“뭐라고 쓸 거야?”<\/p>\n<p>“사실대로.”<\/p>\n<p>하연은 붓을 들었다.<\/p>\n<p>‘전서율과 대화한 사실이 있음. 정파 기본 검식과 보법의 연결에 관한 그의 독자적인 질문을 들었음. 본인은 전서율에게 사파의 초식이나 비전 무공을 전수한 사실이 없음.’<\/p>\n<p>잠시 붓을 멈췄다.<\/p>\n<p>그리고 한 문장을 더 썼다.<\/p>\n<p>‘창고 뒤뜰에서 본인은 전서율의 통제되지 않은 공격을 제지하였음. 해당 기운의 성질을 확정할 수 없으며, 이를 마공으로 단정할 근거를 보지 못했음.’<\/p>\n<p>한서린은 그 문장을 읽었다.<\/p>\n<p>“이렇게 쓰면 네가 서율 편이라는 걸 또 문제 삼을 거야.”<\/p>\n<p>“내가 본 걸 썼을 뿐이야.”<\/p>\n<p>“그 사람들은 그 차이를 구분하지 않을 수도 있어.”<\/p>\n<p>하연은 붓을 내려놓았다.<\/p>\n<p>“그럼 더 분명하게 적어야지.”<\/p>\n<p>그녀는 마지막 줄을 덧붙였다.<\/p>\n<p>‘동일 사건에서 백소윤이 당한 물리적 침해의 경위를 함께 확인하지 않는다면, 검 사용의 동기와 위험성을 공정하게 평가하기 어려움.’<\/p>\n<p>하연은 서찰을 접었다.<\/p>\n<p>서율을 위해 일부러 차갑게 굴었던 날이 떠올랐다. 그때는 멀어지는 것이 보호라고 생각했다.<\/p>\n<p>지금은 달랐다.<\/p>\n<p>그의 곁에 서는 것이 위험하더라도, 거짓말 앞에서 물러나는 것이 더 위험하다는 걸 알았다.<\/p>\n<h2>11. 분노의 값<\/h2>\n<p>남궁현우는 규율원에서 보낸 중간 보고를 읽었다.<\/p>\n<p>정식 심의가 열리기로 했다는 문장에 그는 만족했다. 그러나 노교두의 반대 의견과 진하연의 사실 확인 요청이 첨부되었다는 대목에서 표정이 굳었다.<\/p>\n<p>“아직도 그 여자야.”<\/p>\n<p>차윤겸이 옆에 서 있었다.<\/p>\n<p>“진하연이 직접 회신했다고 합니다.”<\/p>\n<p>“내용은?”<\/p>\n<p>“전서율에게 무공을 가르치지 않았고, 마공이라고 단정할 수 없다고 했답니다.”<\/p>\n<p>현우는 보고서를 내려놓았다.<\/p>\n<p>“그럼 지금까지 우리가 모은 말들이 전부 무너질 수도 있겠군.”<\/p>\n<p>윤겸은 고개를 저었다.<\/p>\n<p>“오히려 더 의심스럽습니다. 왜 그렇게까지 감싸겠습니까?”<\/p>\n<p>현우는 그를 바라봤다.<\/p>\n<p>“그 말을 심의 자리에서 해 봐라. 감싸는 게 곧 내통의 증거냐고 되물을 거다.”<\/p>\n<p>윤겸은 입을 다물었다.<\/p>\n<p>현우는 잠시 뒤 다른 종이를 꺼냈다. 남궁가의 사자가 남기고 간 짧은 문서였다.<\/p>\n<p>‘정파 학관의 명예와 교육 질서를 훼손한 사안은 가볍게 처리하지 말 것.’<\/p>\n<p>그 문장은 직접적인 명령이 아니었다. 하지만 누가 보냈는지 아는 사람에게는 충분한 압력이었다.<\/p>\n<p>현우는 문서를 다시 접었다.<\/p>\n<p>“증거가 없으면 증거를 찾게 만들면 된다.”<\/p>\n<p>“어떻게 하시겠습니까?”<\/p>\n<p>“정식 심의에서 검로의 출처를 밝히라고 요구하지. 못 밝히면 왜 못 밝히는지 설명해야 할 거다.”<\/p>\n<p>윤겸은 웃으려다 멈췄다.<\/p>\n<p>현우가 덧붙였다.<\/p>\n<p>“그리고 네가 데려온 증인들. 말을 맞춘 흔적이 보이면 네 책임이다.”<\/p>\n<p>윤겸의 얼굴이 굳었다.<\/p>\n<p>“공자께서도—”<\/p>\n<p>“나는 사실을 확인하라고 했어.”<\/p>\n<p>현우는 차갑게 말했다.<\/p>\n<p>“네가 무엇을 했는지는 네가 알겠지.”<\/p>\n<p>윤겸은 그제야 깨달았다. 남궁현우는 자신을 동료로 생각하지 않았다. 필요할 때 쓰고, 일이 잘못되면 잘라 낼 수 있는 사람이었다.<\/p>\n<p>그런데도 윤겸은 물러서지 않았다.<\/p>\n<p>하연이 서율에게 웃던 얼굴이 다시 떠올랐기 때문이다.<\/p>\n<h2>12. 정파의 이름으로<\/h2>\n<p>공식 통보는 저녁 강론이 끝난 뒤 도착했다.<\/p>\n<p>서율은 태경과 소윤이 지켜보는 앞에서 봉투를 열었다.<\/p>\n<p>‘정파 학관 규율원 예비 심의 출석 통지.’<\/p>\n<p>그 아래 세 가지 항목이 적혀 있었다.<\/p>\n<p>첫째, 정식 교육 과정에서 확인되지 않은 무공 및 기운 운용 의혹.<\/p>\n<p>둘째, 사파 대표와의 비공식 무공 교류 및 외부 전수 가능성.<\/p>\n<p>셋째, 동료 학도생에 대한 무력 사용과 학관 질서 위반.<\/p>\n<p>서율은 세 번째 항목을 읽고 한동안 움직이지 않았다.<\/p>\n<p>소윤이 조용히 물었다.<\/p>\n<p>“뭐라고 적혀 있어?”<\/p>\n<p>서율은 종이를 건넸다.<\/p>\n<p>태경이 먼저 소리쳤다.<\/p>\n<p>“소윤이 일은?”<\/p>\n<p>서율은 통지문을 다시 보았다.<\/p>\n<p>어디에도 없었다.<\/p>\n<p>창고 뒤뜰에 소윤을 불러낸 사람도, 가방을 빼앗은 사람도, 옷을 붙잡고 놓아주지 않았던 사람도 적혀 있지 않았다.<\/p>\n<p>그저 서율이 검을 들었다는 문장만 있었다.<\/p>\n<p>“이건 잘못됐어.” 태경이 말했다.<\/p>\n<p>소윤은 종이를 내려다봤다. 그녀는 울지 않았다. 대신 물었다.<\/p>\n<p>“내 진술서는 접수됐대?”<\/p>\n<p>“별도 조사라고 했어.”<\/p>\n<p>“그럼 접수 번호를 확인하자.”<\/p>\n<p>태경이 그녀를 돌아봤다.<\/p>\n<p>“지금 그게 중요해?”<\/p>\n<p>“중요해.”<\/p>\n<p>소윤의 목소리는 조용했지만 단단했다.<\/p>\n<p>“내가 당한 일을 누가 마음대로 지울 수는 없으니까.”<\/p>\n<p>서율은 그녀를 바라봤다.<\/p>\n<p>얼마 전까지만 해도 자신이 검을 들고 앞에 서면 친구들을 지킬 수 있다고 생각했다. 그러나 그날 검을 든 뒤에도 소윤은 계속 같은 일을 설명해야 했고, 태경은 친구들의 말을 기록하며 뛰어다녔다.<\/p>\n<p>서율은 통지문을 반듯하게 접었다.<\/p>\n<p>“나도 갈게.”<\/p>\n<p>“어디?” 태경이 물었다.<\/p>\n<p>“규율원. 내 심의에 참석하겠다고 말하러.”<\/p>\n<p>“당연히 참석해야지.”<\/p>\n<p>“그리고 소윤이 사건을 같은 자리에서 확인해 달라고 요구할 거야.”<\/p>\n<p>태경은 서율의 얼굴을 살폈다. 지난번처럼 화가 치밀어 검을 찾는 얼굴이 아니었다.<\/p>\n<p>서율은 오른손을 천천히 폈다.<\/p>\n<p>그 손으로 무엇을 할 수 있는지 아직 알지 못했다. 자신이 찾는 검의 길도 완성되지 않았다.<\/p>\n<p>하지만 오늘만큼은 분명히 알았다.<\/p>\n<p>검을 뽑지 않고도 물러서지 않는 방법이 있다는 것을.<\/p>\n<p>소윤이 그의 옆에 섰다. 태경도 반대편에 섰다.<\/p>\n<p>세 사람은 함께 회랑으로 걸어 나갔다.<\/p>\n<p>그들이 향하는 곳은 연무장이 아니었다.<\/p>\n<p>그러나 그날 밤 학관에서 가장 치열한 싸움은, 아직 검 한 자루 뽑히지 않은 곳에서 시작되고 있었다.<\/p>\n<p><strong>— 제18장 「패배자의 분노」 끝.<\/strong><\/p>\n"}, {"n": 19, "title": "제19장. 질투의 씨앗", "body": "<h1>제19장. 질투의 씨앗<\/h1>\n<h2>1. 눈을 들어 준 사람<\/h2>\n<p>차윤겸이 진하연을 처음 본 것은 전서율이 학관에 들어오기보다 두 해 전이었다.<\/p>\n<p>그때 윤겸은 정파 학관의 정식 학도가 아니었다. 외당의 잡무를 거들며 다음 선발 시험을 준비하는 예비생이었다. 좋은 검을 쓸 형편도, 이름을 대면 알아주는 사문도 없었다. 하루에 몇 차례씩 물을 길어 나르는 사이, 정식 학도들의 수련을 회랑 너머로 훔쳐보는 것이 그의 유일한 즐거움이었다.<\/p>\n<p>가을 끝자락, 정사 교류 비무가 열린 날이었다.<\/p>\n<p>윤겸은 다른 예비생들과 함께 비무장 뒤편에서 목검과 물통을 정리했다. 그가 잘못 세워 둔 검대 하나가 넘어졌고, 남궁가의 문양을 단 상급생이 소리쳤다.<\/p>\n<p>“손도 제대로 못 쓰는 놈이 무슨 검을 배우겠다고 여기까지 왔느냐.”<\/p>\n<p>윤겸은 허리를 숙여 검을 주웠다. 주위의 웃음이 들렸다. 잘못은 자신의 것이었으므로 반박할 말이 없었다. 그러나 검대를 세운 뒤에도 그 상급생은 그의 손등을 발끝으로 밀어 버렸다.<\/p>\n<p>“비켜. 네가 만진 검은 다시 닦아야겠군.”<\/p>\n<p>그때 누군가 말했다.<\/p>\n<p>“그럼 네 손부터 닦아야겠네.”<\/p>\n<p>붉은 수련복을 입은 어린 여학도였다. 그녀는 사파 측에서 교류 비무에 참가한 진하연이었다.<\/p>\n<p>상급생의 얼굴이 굳었다.<\/p>\n<p>“사파의 계집이 정파 일에 끼어들어?”<\/p>\n<p>“넘어진 검대를 주웠잖아. 더 시킬 일이 있으면 네가 먼저 검대를 넘어뜨려 봐.”<\/p>\n<p>하연은 웃고 있었다. 상대를 비웃기 위해서가 아니라, 정말로 그 말이 우스운 것처럼.<\/p>\n<p>“네가 누군지 알고 이러느냐?”<\/p>\n<p>“알아야 해?”<\/p>\n<p>하연은 검대의 기울어진 다리를 바로 세웠다. 그러고는 윤겸에게 떨어진 목검 하나를 건넸다.<\/p>\n<p>“손 괜찮아?”<\/p>\n<p>윤겸은 고개를 끄덕였다.<\/p>\n<p>“그럼 다음에는 아래부터 받쳐. 이건 윗부분이 무거워서 혼자 들면 또 넘어져.”<\/p>\n<p>그녀는 그것으로 말을 끝내고 비무장으로 돌아갔다. 이름도 묻지 않았다.<\/p>\n<p>윤겸은 한동안 목검을 쥔 채 서 있었다.<\/p>\n<p>누군가 자신을 사람으로 대하는 일은 드물지 않았을 것이다. 그런데 그날의 윤겸에게는 그것이 특별했다. 모두가 자기 잘못을 구경할 때, 그녀만은 더 이상 웃지 말라고 말해 주었다.<\/p>\n<p>그날 비무에서 하연은 자신보다 나이가 많은 상대에게도 물러서지 않았다. 이긴 뒤에는 패자의 손을 잡아 일으켰다. 윤겸은 그녀의 검보다, 검을 내려놓은 뒤의 얼굴을 더 오래 기억했다.<\/p>\n<p>그 뒤로 그는 사파 교류 일정이 게시될 때마다 이름을 확인했다.<\/p>\n<p>진하연.<\/p>\n<p>처음에는 고마움이었다. 다음에는 동경이었다. 그리고 어느 날부터는 그녀가 자신을 알아봐 주었으면 좋겠다는 바람이 되었다.<\/p>\n<p>하지만 하연은 윤겸을 기억하지 못했다.<\/p>\n<p>그것은 그녀의 잘못이 아니었다.<\/p>\n<p>윤겸도 처음에는 알고 있었다.<\/p>\n<h2>2. 혼자 키운 약속<\/h2>\n<p>학관에 정식으로 들어온 뒤, 윤겸은 하연과 몇 번 마주쳤다.<\/p>\n<p>한 번은 교류 수업에서 목검을 건네주었고, 한 번은 사파 수련반이 지나가는 길에 서 있었다. 그녀는 그때마다 고맙다고 말하거나 가볍게 고개를 끄덕였다.<\/p>\n<p>윤겸은 그 작은 인사를 오래 간직했다.<\/p>\n<p>그녀가 좋아할 만한 차를 알아보고, 사파 학도들이 어느 연무장을 쓰는지 외웠다. 그러나 정작 하연에게 직접 말을 걸면 목소리가 나오지 않았다. 그는 마음을 전하지 않은 채, 언젠가 자신이 정파의 이름 있는 무인이 되면 그녀도 자신을 보게 될 것이라고 믿었다.<\/p>\n<p>그 믿음은 누구와도 나눈 적 없는 약속이었다.<\/p>\n<p>그리고 전서율이 나타났다.<\/p>\n<p>명문가 출신도 아니고, 비무에서 두각을 드러낸 것도 아닌 학도. 남궁현우에게 패하고 손가락까지 다친 학생이었다.<\/p>\n<p>하연은 그런 서율을 찾아갔다.<\/p>\n<p>윤겸은 처음 목격했을 때 단순한 호기심이라고 여겼다. 하연이 원래 남의 일에 쉽게 등을 돌리지 않는 사람이라는 것을 알고 있었으니까.<\/p>\n<p>그러나 북쪽 옛 연무장의 밤은 달랐다.<\/p>\n<p>그녀는 서율의 말이 끝날 때까지 기다렸다. 흙바닥에 그린 검로를 함께 살폈다. 그가 어설픈 설명을 할 때도 비웃지 않았다. 그리고 서율이 자신을 바라보자, 윤겸이 오랫동안 바라던 그 표정으로 웃었다.<\/p>\n<p>윤겸은 그 장면을 떠올릴 때마다 목구멍이 막혔다.<\/p>\n<p><em>그날 나를 일으켜 준 건 너였잖아.<\/em><\/p>\n<p>생각은 어느새 다른 문장으로 바뀌었다.<\/p>\n<p><em>그런데 왜 나를 보지 않는 거야.<\/em><\/p>\n<p>그는 책상 위에 놓인 증언서를 움켜쥐었다.<\/p>\n<p>하연은 윤겸에게 어떤 약속도 하지 않았다. 그를 기다리게 한 적도, 자신을 좋아해 달라고 부탁한 적도 없었다.<\/p>\n<p>그럼에도 윤겸은 자신의 오랜 기다림을 그녀가 갚아야 할 빚처럼 여기기 시작했다.<\/p>\n<p>그것이 질투의 가장 비겁한 모습이라는 사실을, 그는 끝내 인정하지 않았다.<\/p>\n<h2>3. 심의실에 들어온 봉투<\/h2>\n<p>학관 규율원에서는 전서율의 예비 심의를 앞두고 서류를 분류하고 있었다.<\/p>\n<p>서기 두 사람이 사건을 나누었다. 하나는 창고 뒤뜰에서의 무력 행사, 하나는 교육 과정 외 무공 사용 의혹이었다. 백소윤의 피해 신고는 별도 사건철에 들어가 있었다.<\/p>\n<p>그날 오후, 남궁가의 봉인이 찍힌 봉투가 도착했다.<\/p>\n<p>규율원 부원주는 봉투를 열어 보고 미간을 좁혔다.<\/p>\n<p>“은서방?”<\/p>\n<p>그 옆의 서기가 물었다.<\/p>\n<p>“공식 문서입니까?”<\/p>\n<p>“아니다. 가문의 참고 자료다.”<\/p>\n<p>서류에는 서율의 입관 이전 행적이 정리되어 있었다. 지방에서 배운 기초 보법, 이름 없는 무인들에게서 들은 검술 이야기, 정파 입관을 준비한 기간. 몇몇 항목에는 출처가 표시되어 있었지만, 상당수는 ‘전언’ 또는 ‘확인 중’이라는 말로 끝났다.<\/p>\n<p>특히 눈에 띄는 것은 마지막 장이었다.<\/p>\n<p>‘정식 계보가 확인되지 않는 검술적 탐구 성향. 학관 입관 후 사파 대표와 반복 접촉. 검끝의 기운 응집 현상과의 관련성 확인 필요.’<\/p>\n<p>부원주는 종이를 내려놓았다.<\/p>\n<p>“검술을 독자적으로 생각했다는 게 무슨 혐의가 되지?”<\/p>\n<p>서기가 대답하지 못하자 그는 다음 문장을 읽었다.<\/p>\n<p>‘학관의 대외 신뢰와 정사 교류 질서에 미칠 파장을 고려한 신중한 조치 요청.’<\/p>\n<p>그 말은 사실상 압력이었다. 그러나 어느 누구에게도 직접적인 명령을 내리지 않았으므로, 나중에 문제가 생겨도 남궁가는 참고 의견을 냈을 뿐이라고 말할 수 있었다.<\/p>\n<p>부원주는 서류를 덮었다.<\/p>\n<p>“정식 증거 목록에 넣지 마라.”<\/p>\n<p>서기가 안도하려는 순간 그가 덧붙였다.<\/p>\n<p>“다만 심의위원들이 검토할 수 있도록 별도 참고철에 넣어 둬.”<\/p>\n<p>서기는 잠시 붓을 멈췄다.<\/p>\n<p>공식 증거가 아닌 자료가, 공식 판단을 내릴 사람들의 눈에는 들어가게 되는 순간이었다.<\/p>\n<h2>4. 서로 다른 세 가지 사실<\/h2>\n<p>제삼 수련반의 노교두는 심의 준비 회의에 참석했다.<\/p>\n<p>탁자 위에는 세 장의 문서가 펼쳐져 있었다.<\/p>\n<p>첫째, 서율이 정파의 기본 초식 사이를 잇는 독자적인 보법을 연구했다는 기록.<\/p>\n<p>둘째, 진하연과 서율이 밤의 옛 연무장에서 검술을 논의했다는 차윤겸의 목격 진술.<\/p>\n<p>셋째, 창고 뒤뜰에서 서율의 검끝에 설명되지 않은 기운이 모였다는 복수의 진술.<\/p>\n<p>노교두는 문서를 하나씩 살폈다.<\/p>\n<p>“첫 번째는 수련의 내용이다. 두 번째는 만난 사실이고. 세 번째는 아직 정체를 확인하지 못한 현상이지.”<\/p>\n<p>규율원 부원주가 말했다.<\/p>\n<p>“세 사실을 함께 검토해야 한다는 의견이 있습니다.”<\/p>\n<p>“함께 검토하는 것과 하나의 혐의로 묶는 것은 다르네.”<\/p>\n<p>“외부 무공 유입 가능성을 배제할 수 없지 않습니까?”<\/p>\n<p>“가능성을 배제하지 못한다고 해서 사실이 되는가?”<\/p>\n<p>회의장 끝에 앉아 있던 교두 하나가 말을 보탰다.<\/p>\n<p>“정파의 검식을 벗어난 움직임은 위험합니다. 다른 수련생에게 영향을 줄 수도 있고요.”<\/p>\n<p>노교두가 그를 바라봤다.<\/p>\n<p>“검식의 원리를 이해하고 연결 동작을 연구하는 것까지 금한다면, 우리가 가르치는 것은 검술이 아니라 순서 암기일 걸세.”<\/p>\n<p>“그렇다고 학도생이 멋대로 내력을 폭발시켜도 된다는 말씀입니까?”<\/p>\n<p>“그건 별도로 다뤄야지. 나 역시 전서율이 제어하지 못한 힘을 사용한 일은 위험했다고 생각하네.”<\/p>\n<p>노교두는 잠시 말을 멈췄다.<\/p>\n<p>“그러나 그날 왜 검을 들었는지, 누가 먼저 백소윤을 둘러쌌는지, 왜 피해자 진술이 별도 철에만 들어 있는지는 묻지 않을 셈인가?”<\/p>\n<p>침묵이 흘렀다.<\/p>\n<p>부원주는 서류를 정리했다.<\/p>\n<p>“그 부분은 다른 조사에서 확인 중입니다.”<\/p>\n<p>“그럼 전서율에 대한 판단도 그 조사가 끝날 때까지 미뤄야 하네.”<\/p>\n<p>“그럴 수 없다는 의견이 상부에서 내려왔습니다. 학관의 대외 신뢰가 걸린 사안이라고 합니다.”<\/p>\n<p>노교두는 누구의 의견인지 묻지 않았다.<\/p>\n<p>이미 알고 있는 듯한 얼굴이었다.<\/p>\n<h2>5. 지워지지 않는 날짜<\/h2>\n<p>백소윤은 규율원 앞에서 자신의 진술서가 어느 사건철에 들어갔는지 확인하려 했다.<\/p>\n<p>서기는 처음에 알려 줄 수 없다고 했다. 소윤이 접수번호를 제시하자 그제야 장부를 펼쳤다.<\/p>\n<p>“창고 뒤뜰 사건은 조사 중입니다.”<\/p>\n<p>“그런데 전서율의 심의에는 왜 제 진술이 들어가지 않나요?”<\/p>\n<p>“서로 다른 사건으로 분류됐으니까요.”<\/p>\n<p>“같은 날 같은 장소에서 일어났는데요.”<\/p>\n<p>서기는 난처한 표정을 지었다.<\/p>\n<p>“규정상 그렇습니다.”<\/p>\n<p>소윤은 잠시 침묵했다.<\/p>\n<p>“그러면 두 사건이 같은 장소에서 일어났다는 사실을 적은 확인서를 받을 수 있을까요?”<\/p>\n<p>“그런 확인서는…….”<\/p>\n<p>“없다면 접수 장부의 날짜와 장소만 대조해 주세요. 제가 따로 적어 제출하겠습니다.”<\/p>\n<p>그녀는 목소리를 높이지 않았다. 오히려 차분했다.<\/p>\n<p>태경은 그 옆에서 입술을 깨물고 있었다. 소윤이 같은 설명을 몇 번째 하는지 알고 있었기 때문이다.<\/p>\n<p>밖으로 나온 뒤 그가 말했다.<\/p>\n<p>“이렇게까지 해야 해?”<\/p>\n<p>“안 하면 저 사람들 종이에는 다른 사건으로 남아.”<\/p>\n<p>“그날 네가 무슨 일을 당했는지 다 아는데.”<\/p>\n<p>“아는 것과 적어 두는 건 다른가 봐.”<\/p>\n<p>소윤은 서류를 품에 넣었다.<\/p>\n<p>그녀의 손은 조금 떨리고 있었다.<\/p>\n<p>태경은 그것을 보았지만 모른 척했다. 대신 무거운 서책을 받아 들었다.<\/p>\n<p>“내일은 내가 먼저 와서 줄 서 있을게.”<\/p>\n<p>소윤이 웃었다.<\/p>\n<p>“너는 줄 서다 배고프다고 도망갈 거잖아.”<\/p>\n<p>“그럼 밥을 싸 오면 되지.”<\/p>\n<p>오랜만에 둘이 함께 웃었다.<\/p>\n<p>그 웃음이 모든 두려움을 없애 주지는 않았다. 그러나 소윤은 자신이 혼자 서 있지 않다는 것을 다시 확인했다.<\/p>\n<h2>6. 전서율이 말할 수 있는 것<\/h2>\n<p>서율은 심의에 앞서 서면 소명서를 작성했다.<\/p>\n<p>첫 장에는 자신이 검을 들었던 사실을 적었다. 다음 장에는 소윤이 집단으로 괴롭힘을 당하던 상황을 적었다. 마지막 장에는 자신의 검술에 관해 썼다.<\/p>\n<p><em>정파의 기본 검식을 부정하려는 것이 아닙니다.<\/em><\/p>\n<p>그는 한동안 붓을 멈췄다.<\/p>\n<p><em>배운 초식은 각각의 목적이 분명합니다. 다만 초식이 끝난 뒤 다시 처음 자세를 만드는 동안, 이미 만들어진 힘과 걸음이 끊기는 이유를 알고 싶었습니다.<\/em><\/p>\n<p>그가 쓴 글은 검술의 완성된 이론이 아니었다. 자신이 무엇을 의심했고 무엇을 시도했는지 설명하려는 기록이었다.<\/p>\n<p><em>빈손으로 보법을 반복했고, 오른손의 부상이 나은 뒤 제한적으로 목검을 쥐었습니다. 창고 뒤뜰에서 발생한 기운은 저도 설명하지 못합니다. 의도적으로 그런 힘을 만들거나 조절할 방법을 알고 있지 않습니다.<\/em><\/p>\n<p>그는 마지막 문장을 쓰는 데 오래 걸렸다.<\/p>\n<p><em>진하연에게 무공을 전수받지 않았습니다. 다만 제가 무엇을 찾으려 하는지 물어봐 준 적이 있습니다.<\/em><\/p>\n<p>서율은 그 문장을 읽었다.<\/p>\n<p>하연이 밤의 연무장에서 했던 말이 떠올랐다.<\/p>\n<p>‘어디서 멈추지 않을 것인가. 그리고 언제는 반드시 멈춰야 하는가.’<\/p>\n<p>서율은 손을 내려다봤다. 상처는 많이 아물었지만, 검을 오래 쥐면 여전히 뻣뻣했다.<\/p>\n<p>그는 자신이 옳다는 증거를 아직 갖고 있지 않았다. 그래서 더더욱 모르는 것을 안다고 쓰지 않기로 했다.<\/p>\n<p>문이 열리고 태경이 들어왔다.<\/p>\n<p>“다 썼어?”<\/p>\n<p>“거의.”<\/p>\n<p>“너무 길지 않아?”<\/p>\n<p>“줄이면 중요한 게 빠질 것 같아서.”<\/p>\n<p>태경은 종이를 대충 훑었다.<\/p>\n<p>“이거 읽는 사람은 네가 이상한 검을 좋아한다는 건 확실히 알겠다.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“그건 맞잖아.”<\/p>\n<p>“맞지. 그런데 이상한 검을 좋아한다고 사람을 내쫓을 수는 없잖아.”<\/p>\n<p>서율은 대답하지 않았다.<\/p>\n<p>그 말이 정말 맞기를 바랐다.<\/p>\n<h2>7. 질투가 원하는 대답<\/h2>\n<p>차윤겸은 사파 수련관 바깥에서 한서린을 만났다.<\/p>\n<p>“진하연에게 전할 말이 있습니다.”<\/p>\n<p>한서린은 윤겸의 얼굴을 살폈다.<\/p>\n<p>“무슨 말인데?”<\/p>\n<p>“전서율과 관련된 일입니다.”<\/p>\n<p>“그럼 네가 왜 나한테 와?”<\/p>\n<p>윤겸은 잠시 말이 막혔다.<\/p>\n<p>“하연이 위험해질 수 있습니다. 그 사람은 정파의 금기무공 의혹을 받는 학도와—”<\/p>\n<p>“잠깐.”<\/p>\n<p>한서린의 목소리가 차가워졌다.<\/p>\n<p>“하연이가 누구랑 이야기하는 게 왜 네 허락을 받아야 하는 일이야?”<\/p>\n<p>“허락을 받으라는 게 아닙니다. 걱정돼서…….”<\/p>\n<p>“그 걱정이 왜 전서율을 해치는 쪽으로만 움직이는데?”<\/p>\n<p>윤겸의 얼굴이 붉어졌다.<\/p>\n<p>한서린은 한 걸음 물러났다.<\/p>\n<p>“하연이한테 전할 말이 있으면 직접 말해. 다만 네가 만든 소문을 내가 대신 옮겨 주지는 않을 거야.”<\/p>\n<p>그녀가 돌아서려는 순간 윤겸이 물었다.<\/p>\n<p>“진하연은 전서율을 좋아합니까?”<\/p>\n<p>한서린의 걸음이 멈췄다.<\/p>\n<p>윤겸은 그 침묵을 대답으로 받아들이려 했다.<\/p>\n<p>“그런 겁니까?”<\/p>\n<p>한서린은 돌아보았다.<\/p>\n<p>“그걸 네가 알아서 뭘 할 건데?”<\/p>\n<p>윤겸은 아무 말도 하지 못했다.<\/p>\n<p>“누군가를 좋아하는 마음이 네 마음대로 사람을 괴롭혀도 된다는 허락은 아니야.”<\/p>\n<p>한서린은 그를 남겨 두고 떠났다.<\/p>\n<p>윤겸은 오래 서 있었다.<\/p>\n<p>그녀의 말은 옳았다.<\/p>\n<p>그런데 옳은 말을 들었다고 해서, 자신의 감정을 거두고 싶은 마음은 생기지 않았다.<\/p>\n<p>오히려 그는 다른 결론을 내렸다.<\/p>\n<p><em>저들이 모두 전서율 편이구나.<\/em><\/p>\n<p>그 순간 윤겸은 자신이 무엇을 잃었는지 생각하지 않았다.<\/p>\n<p>애초에 자신이 소유한 적 없는 마음을 빼앗겼다고 믿고 있었다.<\/p>\n<h2>8. 남궁현우의 계산<\/h2>\n<p>그날 밤 윤겸은 남궁현우를 찾아갔다.<\/p>\n<p>“심의가 지연될 수도 있다고 들었습니다.”<\/p>\n<p>현우는 서찰을 접으며 말했다.<\/p>\n<p>“노교두가 반대하고 있어.”<\/p>\n<p>“그 교두까지 막아야 하지 않겠습니까?”<\/p>\n<p>“교두 하나를 적으로 만들면 학관이 시끄러워진다.”<\/p>\n<p>“그럼 가만히 기다립니까?”<\/p>\n<p>현우는 윤겸을 바라봤다.<\/p>\n<p>“넌 왜 그렇게 서두르지?”<\/p>\n<p>윤겸은 대답하지 않았다.<\/p>\n<p>현우는 웃지 않았다.<\/p>\n<p>“진하연 때문인가?”<\/p>\n<p>윤겸의 손이 굳었다.<\/p>\n<p>“그 여자는 널 좋아하지 않아.”<\/p>\n<p>“……알고 있습니다.”<\/p>\n<p>“모르는 것 같은데.”<\/p>\n<p>현우는 탁자 위의 은서방 보고서를 밀었다.<\/p>\n<p>“이것 봐. 전서율의 출신을 뒤져도 마공을 배웠다는 증거는 안 나와. 그 애가 진하연에게 검을 배웠다는 증거도 없어.”<\/p>\n<p>“그럼 끝입니까?”<\/p>\n<p>“아니. 증거가 없으면 의심을 지울 수 없다는 사람도 있지.”<\/p>\n<p>윤겸은 서류를 내려다봤다.<\/p>\n<p>현우는 낮게 말했다.<\/p>\n<p>“가문에서는 학관의 체면을 세울 방법을 원해. 학관은 사건을 오래 끌고 싶어 하지 않아. 그리고 너는 전서율이 진하연 곁에서 사라지길 바라지.”<\/p>\n<p>“공자께서는요?”<\/p>\n<p>“내 패배를 입에 올릴 이유가 사라졌으면 좋겠어.”<\/p>\n<p>그는 종이를 두드렸다.<\/p>\n<p>“전서율을 단죄할 근거가 부족하다면, 학관이 그 아이를 계속 품고 있어야 하는지부터 묻게 만들면 된다.”<\/p>\n<p>윤겸은 그 말을 곱씹었다.<\/p>\n<p>“퇴관입니까?”<\/p>\n<p>“아직은 아니야. 누가 먼저 그 말을 꺼내는지 보자.”<\/p>\n<p>현우는 문밖을 바라봤다.<\/p>\n<p>“네가 할 일은 하나다. 새로운 거짓말을 만들어 오지 마. 이미 있는 사실을 사람들이 가장 불편해하는 순서로 늘어놓아.”<\/p>\n<p>윤겸은 고개를 숙였다.<\/p>\n<p>그는 현우가 자신보다 훨씬 차갑다는 사실을 깨달았다.<\/p>\n<p>그리고 그 차가움이 지금 자신에게 필요하다고 생각했다.<\/p>\n<h2>9. 끝내 지우지 못한 사실<\/h2>\n<p>사흘째 이어진 예비 심의의 마지막 날, 노교두는 두 권의 장부를 탁자 위에 올려놓았다.<\/p>\n<p>하나는 학관의 출입 기록이었다. 다른 하나는 의무당의 진료 장부였다.<\/p>\n<p>“먼저 순서를 바로잡겠습니다.”<\/p>\n<p>그는 서율이 남궁현우에게 손가락을 다쳤던 날의 기록을 펼쳤다. 두 손가락의 골절 위치, 진료를 받은 시각, 대련이 끝난 뒤에 가해진 힘에 관한 당시 교두의 진술이 남아 있었다.<\/p>\n<p>“이것은 전서율이 무공을 잘못 사용했다는 소문보다 먼저 일어난 일입니다. 그런데도 이번 조사에서는 줄곧 뒤로 밀렸지요.”<\/p>\n<p>남궁가와 가까운 심의위원이 불쾌한 기색을 보였다.<\/p>\n<p>“그 사건은 이미 정리된 것으로 압니다.”<\/p>\n<p>“정리된 것과 없었던 일은 다릅니다.”<\/p>\n<p>노교두는 다른 장부를 펼쳤다.<\/p>\n<p>“그리고 창고 뒤편 사건입니다. 백소윤의 피해 신고는 전서율의 무력 행사 신고보다 먼저 접수되었습니다. 두 신고를 분리한 뒤, 나중 신고만 가지고 이 아이의 위험성을 논하는 건 옳지 않습니다.”<\/p>\n<p>소윤이 직접 작성한 진술서, 태경이 확인한 시간표, 서로 어긋나는 가해 학생들의 진술이 차례로 검토되었다. 하연이 제출한 교류 수련 기록에는 전서율에게 사파 무공을 가르친 적이 없다는 내용과, 북쪽 연무장에서 함께 살핀 것이 검로의 원리에 관한 대화였다는 설명이 있었다.<\/p>\n<p>차윤겸이 밤에 두 사람을 보았다는 사실은 남았다. 그러나 목격한 것은 만남이지 전수가 아니었다.<\/p>\n<p>“검 끝에 기운이 모였다는 증언은요?”<\/p>\n<p>한 위원이 물었다.<\/p>\n<p>“그런 현상이 있었다는 말과, 그것이 마공이었다는 판단은 다릅니다.”<\/p>\n<p>의무당의 의원이 대답했다.<\/p>\n<p>“다친 손으로 무리하게 검을 쥐었다는 사실은 확인됩니다. 기운의 성질을 감정한 사람은 없습니다. 당시 현장을 본 사람들끼리도 묘사가 다릅니다.”<\/p>\n<p>부원주는 한동안 말이 없었다.<\/p>\n<p>은서방의 참고철은 여전히 탁자 한쪽에 놓여 있었다. 하지만 출처가 없는 전언과 서로 맞지 않는 증언을 묶어 놓았다고 해서 그것이 증거가 되지는 않았다.<\/p>\n<p>“정리하겠습니다.”<\/p>\n<p>부원주가 말했다.<\/p>\n<p>“전서율 학도에 대한 금기무공 사용 및 사파 무공 불법 전수 의혹은 입증되지 않았습니다. 창고 뒤편의 무력 행사 역시 피해 구호의 경위와 분리하여 징계할 수 없으므로, 본 심의에서는 징계 사유로 채택하지 않습니다.”<\/p>\n<p>회의실 뒤편에서 누군가 길게 숨을 내쉬었다.<\/p>\n<p>“그렇다면 전서율의 수련 자격은요?”<\/p>\n<p>“유지합니다. 이번 건을 근거로 퇴관이나 외부 파견을 권고하지 않습니다.”<\/p>\n<p>노교두는 그제야 굳었던 어깨를 조금 내렸다.<\/p>\n<p>다만 모든 일이 끝난 것은 아니었다. 백소윤의 피해에 대한 별도 조사는 남아 있었고, 남궁현우가 서율의 손을 부러뜨린 사건을 다시 살펴야 한다는 의견도 회의록에 붙었다. 그러나 적어도 오늘, 학관은 서율을 죄인으로 만들지 못했다.<\/p>\n<p>그 사실만큼은 분명했다.<\/p>\n<h2>10. 드디어 웃어도 되는 날<\/h2>\n<p>소식을 가장 먼저 전해 들은 것은 태경이었다.<\/p>\n<p>그는 심의실 밖에서 기다리던 서율과 소윤에게 달려오다가 돌계단 두 칸을 한꺼번에 뛰어내렸다.<\/p>\n<p>“끝났어!”<\/p>\n<p>“뭐가?”<\/p>\n<p>서율이 묻자 태경이 그의 양어깨를 붙잡았다.<\/p>\n<p>“너한테 뒤집어씌우던 거! 안 된대! 증거가 없대!”<\/p>\n<p>“그러니까 정확히 말해.”<\/p>\n<p>소윤이 태경의 팔을 잡아 내렸다.<\/p>\n<p>“징계 사유가 성립하지 않는다고 했어. 수련 자격도 그대로고.”<\/p>\n<p>서율은 두 사람의 얼굴을 번갈아 보았다.<\/p>\n<p>“정말?”<\/p>\n<p>“정말.”<\/p>\n<p>소윤이 대답했다.<\/p>\n<p>서율은 입술을 열었다가 다시 다물었다. 무슨 말을 해야 할지 몰랐다. 지난 며칠 동안 잠들기 전에 떠올리던 것은 검의 움직임이 아니라, 자신이 이곳에서 쫓겨나면 두 사람에게 어떤 말을 남겨야 할까 하는 생각이었다.<\/p>\n<p>그런데 이제 내일도 같은 자리에 앉아 수업을 들을 수 있었다.<\/p>\n<p>“다행이다.”<\/p>\n<p>그가 겨우 말했다.<\/p>\n<p>태경이 헛웃음을 쳤다.<\/p>\n<p>“그게 끝이야? 나는 네가 여기서 울 줄 알았는데.”<\/p>\n<p>“네가 대신 울어 줄 것 같아서.”<\/p>\n<p>“야, 누가 운다고!”<\/p>\n<p>태경의 눈가가 이미 붉었다.<\/p>\n<p>소윤은 두 사람을 보다가 결국 웃음을 터뜨렸다. 며칠 만에 아무것도 참지 않고 웃는 얼굴이었다.<\/p>\n<p>그날 저녁 세 사람은 평소보다 조금 비싼 국수를 사 먹기로 했다. 태경이 두 그릇을 시키겠다고 우기자 소윤이 세 사람의 돈을 다시 계산했고, 서율은 그 모습을 보며 웃었다.<\/p>\n<p>학관의 벽이 처음 입관하던 날처럼 높아 보이지 않았다.<\/p>\n<h2>11. 소윤의 작은 작전<\/h2>\n<p>저녁을 먹고 나오자 태경은 후식으로 떡을 사겠다며 먼저 달려갔다.<\/p>\n<p>“저 녀석은 방금 두 그릇 먹었잖아.”<\/p>\n<p>소윤이 중얼거렸다.<\/p>\n<p>“기뻐서 그런가 봐.”<\/p>\n<p>서율이 대답했다.<\/p>\n<p>둘만 남자 소윤은 괜히 옷소매를 만졌다. 오늘은 아침부터 머리를 여러 번 묶었다 풀었다. 평소와 달리 작은 비녀도 꽂았다. 태경은 알아보지 못했고, 서율은 아직 아무 말도 하지 않았다.<\/p>\n<p><em>오늘만큼은 조금 용기를 내 보자.<\/em><\/p>\n<p>소윤은 마음속으로 되뇌었다.<\/p>\n<p>“서율아.”<\/p>\n<p>“응?”<\/p>\n<p>“나 오늘 좀 달라 보이지 않아?”<\/p>\n<p>서율이 그녀를 빤히 보았다.<\/p>\n<p>소윤의 심장이 조금 빨라졌다.<\/p>\n<p>“얼굴이 안 좋아?”<\/p>\n<p>“……아니.”<\/p>\n<p>“며칠 동안 잠을 못 자서 그런가 했어.”<\/p>\n<p>소윤은 입술을 꾹 다물었다.<\/p>\n<p><em>그렇게 걱정해 주는 건 좋은데, 그게 아니잖아.<\/em><\/p>\n<p>“머리.”<\/p>\n<p>“머리?”<\/p>\n<p>“머리를 좀 바꿨다고.”<\/p>\n<p>그제야 서율이 비녀를 발견했다.<\/p>\n<p>“아, 그거. 잘 어울린다.”<\/p>\n<p>아주 평범한 말이었다.<\/p>\n<p>그런데 소윤은 그 말을 듣자마자 며칠 동안 쌓였던 긴장이 엉뚱한 방향으로 풀리는 걸 느꼈다.<\/p>\n<p>“진작 말하지.”<\/p>\n<p>“몰랐으니까.”<\/p>\n<p>“그런 건 좀 알아봐 줘도 되거든.”<\/p>\n<p>서율이 어리둥절한 표정을 짓자 소윤은 슬쩍 그의 왼쪽 소매를 잡았다.<\/p>\n<p>“그럼 다음부터는 잘 봐. 나도 네가 무슨 생각하는지 열심히 보고 있으니까.”<\/p>\n<p>서율은 소매를 내려다봤다. 그러고는 웃었다.<\/p>\n<p>“알았어. 고마워.”<\/p>\n<p>소윤은 그의 시선을 피했다.<\/p>\n<p><em>고맙다는 말 말고 다른 말도 있잖아.<\/em><\/p>\n<p>그녀가 다음 말을 고르려는 순간, 뒤에서 익숙한 목소리가 들렸다.<\/p>\n<p>“둘이 뭐 해?”<\/p>\n<h2>12. 진하연의 정면 승부<\/h2>\n<p>진하연이었다.<\/p>\n<p>한서린과 함께 회랑을 지나던 하연은 서율을 보자 걸음을 바꾸었다. 서율의 얼굴이 밝아진 것을 확인한 뒤에야 그녀도 안도한 표정을 지었다.<\/p>\n<p>“결과 들었어.”<\/p>\n<p>“응. 네가 써 준 답변서도 도움이 됐대.”<\/p>\n<p>“그 정도는 해야지.”<\/p>\n<p>하연은 태연하게 대답했지만, 며칠 동안 서율의 일이 어떻게 될지 몰라 밤잠을 설친 것은 사실이었다.<\/p>\n<p>소윤은 아직 서율의 소매를 잡고 있었다. 하연의 눈길이 그곳에 잠깐 머물렀다.<\/p>\n<p>“손은?”<\/p>\n<p>“많이 좋아졌어.”<\/p>\n<p>서율이 오른손을 들어 보이려 하자 하연이 먼저 다가와 그의 손목을 가볍게 받쳤다.<\/p>\n<p>“그렇게 갑자기 움직이지 마. 다 나은 건 아니잖아.”<\/p>\n<p>그녀는 손가락을 억지로 펴 보지 않고, 손등의 붓기가 가라앉았는지만 살폈다. 서율은 가까워진 거리에 잠깐 말을 잊었다.<\/p>\n<p>“……응. 조심할게.”<\/p>\n<p>“말로만?”<\/p>\n<p>“이번에는 진짜.”<\/p>\n<p>하연이 웃었다.<\/p>\n<p>그 미소를 본 소윤은 서율의 소매를 놓지 않은 채 한 걸음 앞으로 나왔다.<\/p>\n<p>“그건 제가 매일 확인하고 있어요.”<\/p>\n<p>“그래?”<\/p>\n<p>“네. 서율이는 자기가 괜찮다고 생각하면 무리하거든요.”<\/p>\n<p>“그건 나도 알아.”<\/p>\n<p>하연은 자연스럽게 서율의 옷깃에 붙은 작은 낙엽을 떼어 주었다.<\/p>\n<p>“그리고 이 애는 자기 옷에 뭐가 묻었는지도 잘 모르고.”<\/p>\n<p>소윤의 눈썹이 아주 조금 올라갔다.<\/p>\n<p>“그런 건 제가 잘 챙겨요.”<\/p>\n<p>“아까는 낙엽이 붙어 있었는데?”<\/p>\n<p>“……그건 지금 막 붙은 거예요.”<\/p>\n<p>서율은 두 사람을 번갈아 보았다.<\/p>\n<p>“나 뭐 묻었어?”<\/p>\n<p>“이제 없어.”<\/p>\n<p>둘이 동시에 대답했다.<\/p>\n<p>잠깐 정적이 흘렀다.<\/p>\n<p>한서린이 옆에서 고개를 돌렸다. 웃음을 참느라 어깨가 떨렸다.<\/p>\n<p>하연은 서율에게 시선을 돌렸다.<\/p>\n<p>“내일 저녁에 시간 있어? 지난번에 네가 그렸던 검로, 아직 궁금한 게 남았거든.”<\/p>\n<p>소윤이 재빨리 끼어들었다.<\/p>\n<p>“내일 저녁은 저랑 약속이 있어요.”<\/p>\n<p>“무슨 약속?”<\/p>\n<p>서율이 물었다.<\/p>\n<p>소윤은 한순간 멈칫했다.<\/p>\n<p>“……공부.”<\/p>\n<p>“내일은 쉬는 날인데?”<\/p>\n<p>“쉬는 날에도 공부는 할 수 있지!”<\/p>\n<p>하연이 입술을 가리고 웃었다.<\/p>\n<p>“그럼 공부 끝나고 잠깐 빌려 가도 돼?”<\/p>\n<p>“서율이는 물건이 아닌데요.”<\/p>\n<p>“그러네. 그럼 본인한테 물어봐야겠다.”<\/p>\n<p>하연이 서율 쪽으로 몸을 기울였다.<\/p>\n<p>“서율아, 나랑 잠깐 걸을래?”<\/p>\n<p>서율은 당황한 채 소윤을 보았다. 소윤은 웃고 있었지만 그 웃음은 조금 단단했다.<\/p>\n<p>“내일 공부부터 하자.”<\/p>\n<p>“……응.”<\/p>\n<p>“그리고 걷는 건,”<\/p>\n<p>서율은 하연을 향해 말했다.<\/p>\n<p>“둘 다 같이 걸으면 안 돼?”<\/p>\n<p>한서린이 더는 참지 못하고 웃음을 터뜨렸다.<\/p>\n<p>“얘는 진짜 아무것도 모르네.”<\/p>\n<p>“뭘?”<\/p>\n<p>“아니야. 몰라도 돼.”<\/p>\n<p>하연은 한숨을 쉬는 척하면서도 웃고 있었다. 소윤은 고개를 숙여 미소를 감췄다.<\/p>\n<p>그날만큼은 누구도 서율을 두고 혐의를 논하지 않았다. 누가 그의 곁에서 걷고 싶은지만 조금씩 다투었을 뿐이었다.<\/p>\n<p>잠시 뒤 떡을 들고 돌아온 태경이 네 사람을 보고 물었다.<\/p>\n<p>“왜 다들 얼굴이 빨개?”<\/p>\n<p>“너나 먹어.”<\/p>\n<p>소윤과 하연이 이번에도 동시에 말했다.<\/p>\n<p>한서린은 결국 회랑 기둥을 붙잡고 웃었다.<\/p>\n<h2>13. 웃음이 끝나는 곳<\/h2>\n<p>그날 밤, 차윤겸은 학관의 징계가 무산되었다는 소식을 들었다.<\/p>\n<p>그는 낮에 서율이 소윤과 함께 웃는 모습을 보았다. 조금 뒤에는 진하연이 서율의 손목을 받쳐 들고 웃는 모습도 보았다.<\/p>\n<p>두 해 전 자신에게 목검을 건네던 그 손이었다.<\/p>\n<p>그가 오래도록 혼자 간직한 친절을, 하연은 서율에게 너무도 자연스럽게 베풀고 있었다.<\/p>\n<p><em>저 녀석만 없으면.<\/em><\/p>\n<p>익숙한 생각이 다시 고개를 들었다.<\/p>\n<p>그러나 오늘은 그 생각을 붙잡고 있을 시간이 없었다. 심의 결과가 뒤집히지 않는 한, 정파 학관에서 서율을 몰아낼 길은 닫혔다.<\/p>\n<p>남궁현우는 윤겸의 보고를 듣고 잠시 아무 말도 하지 않았다.<\/p>\n<p>“결국 실패했군.”<\/p>\n<p>“아직 방법이—”<\/p>\n<p>“학관 안에서 같은 말을 반복하면 이번에는 우리 쪽이 조사를 받겠지.”<\/p>\n<p>현우는 탁자 위에 놓인 은서방의 봉투를 밀어 냈다. 그 안에는 전서율의 출신지와 수련 이력, 그가 독자적인 검로를 연구했다는 정보가 있었다. 금기무공을 입증할 증거는 한 장도 없었다.<\/p>\n<p>“그러니 학관 밖에서 답을 받아야 한다.”<\/p>\n<p>윤겸이 눈을 들었다.<\/p>\n<p>“어디서 말입니까?”<\/p>\n<p>현우는 잠시 머뭇거리다가 한 글자를 말했다.<\/p>\n<p>“마교.”<\/p>\n<p>윤겸의 표정이 굳었다.<\/p>\n<p>정파와 마교 사이에는 공식적인 교류가 거의 없었다. 그러나 국경의 분쟁과 실종 사건, 무공 유출 문제를 다루기 위해 오래전부터 중립 상단을 통한 문서 교환 통로만은 남아 있었다. 서로를 믿어서가 아니라, 믿지 못하기 때문에 만들어 둔 통로였다.<\/p>\n<p>남궁가는 그 통로를 이용할 수 있었다.<\/p>\n<p>“마교가 왜 전서율을 부르겠습니까?”<\/p>\n<p>“우리가 부르라고 명령할 수는 없지.”<\/p>\n<p>현우가 낮게 말했다.<\/p>\n<p>“하지만 저들이 관심을 가질 만한 질문을 건넬 수는 있어. 계보를 알 수 없는 검로, 검 끝에 모인 기운, 정파 학관이 끝내 규명하지 못한 현상. 그리고 그 아이가 지금 학관 안에 있다는 사실.”<\/p>\n<p>윤겸은 그제야 이해했다.<\/p>\n<p>“마교가 직접 확인하겠다고 나선다면…….”<\/p>\n<p>“그때는 우리 말이 아니라 저들의 요구가 되겠지.”<\/p>\n<p>현우는 붓을 들었다.<\/p>\n<p>은서방의 조사철을 바탕으로 작성된 밀서는 남궁가의 이름을 드러내지 않았다. 중립 상단에 전달된 문서는 ‘무공 계보 확인을 위한 문의’라는 형식을 취했다. 확인되지 않은 소문은 의혹이라는 단서를 달고 있었지만, 가장 눈에 띄는 곳에 배치되었다.<\/p>\n<p>그것은 마교와 남궁가가 손을 잡았다는 뜻은 아니었다. 현우는 마교의 뜻을 알지 못했고, 마교 역시 남궁가를 신뢰하지 않았다.<\/p>\n<p>다만 누군가가 미끼를 던졌다.<\/p>\n<p>그리고 며칠 뒤, 그 미끼를 문 쪽에서 답이 왔다.<\/p>\n<h2>14. 검은 봉인의 공문<\/h2>\n<p>학관에 도착한 문서는 검은 봉랍으로 봉해져 있었다.<\/p>\n<p>사절은 중립 상단의 문서 운송인으로, 정파 학관의 정문에서 수령 확인을 요구했다. 봉랍에는 마교 외무당의 문양과 문서 번호가 찍혀 있었다. 학관의 문서 담당 교두는 봉인을 확인하고 부원주에게 전달했다.<\/p>\n<p>공문에는 전서율의 이름이 적혀 있었다.<\/p>\n<p><strong>「마교 외무당 공식 소환 통지」<\/strong><\/p>\n<p><em>귀 학관 소속 전서율의 검로 및 내공 발현에 관하여 본교가 확인할 사안이 발생하였음. 해당인을 본교 관할 접경 조사처로 출석시키도록 요청함. 회신 기한과 호송 방식은 별첨 협의서에 따름.<\/em><\/p>\n<p><em>본 통지는 귀 학관의 징계 판정과 무관하며, 불출석 시의 후속 조치는 양측 문서 교환 절차에 따라 별도 통고함.<\/em><\/p>\n<p>부원주는 공문을 두 번 읽었다.<\/p>\n<p>“마교가…… 우리 학도를?”<\/p>\n<p>노교두가 문서를 받아 들었다. 그의 얼굴이 어두워졌다.<\/p>\n<p>“마교의 공문이 정파 학관에 곧바로 명령이 될 수는 없습니다. 저들은 우리 학도의 신병을 마음대로 요구할 권한이 없습니다.”<\/p>\n<p>“압니다.”<\/p>\n<p>부원주가 대답했다.<\/p>\n<p>“하지만 거절하면 접경의 교류 협약 문제로 번질 수 있습니다. 원주께 보고해야겠습니다.”<\/p>\n<p>“무엇보다 먼저, 누가 저들에게 전서율의 이름과 수련 내용을 보냈는지 확인해야 합니다.”<\/p>\n<p>부원주는 답하지 않았다.<\/p>\n<p>서율은 아직 이 공문을 알지 못했다.<\/p>\n<p>그 시각 그는 소윤과 태경에게 내일 무엇을 먹을지 묻고 있었다. 진하연은 한서린에게 서율의 검로를 다시 살필 때 어떤 질문부터 해야 할지 이야기하고 있었다.<\/p>\n<p>조금 전까지 모두가 한숨을 돌렸다.<\/p>\n<p>누군가는 서율이 머물 수 있게 된 학관의 내일을 생각했고, 누군가는 그에게 한 걸음 더 다가갈 용기를 생각했다.<\/p>\n<p>그런데 그들의 웃음이 닿지 않는 방에서, 마교의 검은 봉인이 탁자 위에 놓였다.<\/p>\n<p>학관의 징계는 끝났다.<\/p>\n<p><strong>하지만 전서율을 데려가겠다는 이름의 공문은 이제 막 도착했다.<\/strong><\/p>\n<p><strong>— 제19장 「질투의 씨앗」 끝.<\/strong><\/p>\n"}, {"n": 20, "title": "제20장. 마교의 이름", "body": "<h1>제20장. 마교의 이름<\/h1>\n<h2>1. 검은 봉인의 다음 날<\/h2>\n<p>“마교에서 전서율을 부른대!”<\/p>\n<p>누군가가 식당 문을 열어젖히며 소리쳤다.<\/p>\n<p>그 한마디에 수저 부딪치는 소리가 뚝 끊겼다. 서율은 막 집어 든 만두를 내려놓았다. 맞은편의 윤태경이 먼저 얼굴을 찌푸렸다.<\/p>\n<p>“누가 그래?”<\/p>\n<p>“원주실에 공문이 왔어. 검은 봉인까지 찍혀 있었다니까!”<\/p>\n<p>“봉인 봤다고 내용까지 봤냐?”<\/p>\n<p>“그럼 네 친구가 마교에 안 간다는 거야?”<\/p>\n<p>식당 구석에서 웃음이 터졌다.<\/p>\n<p>“이상한 검 쓰더니 결국 갈 데를 찾아가는군.”<\/p>\n<p>“정파에서 배운 검을 마교에 팔아먹는 건 아니겠지?”<\/p>\n<p>“그런 말 하지 마!”<\/p>\n<p>소윤이 벌떡 일어났다. 의자가 뒤로 밀리며 마룻바닥을 긁었다.<\/p>\n<p>“서율이는 그런 적 없어! 심의에서도 밝혀졌잖아!”<\/p>\n<p>“심의가 마교의 공문까지 없애 주냐?”<\/p>\n<p>상대는 비웃었다. 소윤의 얼굴이 새빨개졌다. 태경이 일어나려는 그녀의 팔을 붙잡았다.<\/p>\n<p>“소윤아. 저 말에 다 대답해 주면 밥도 못 먹어.”<\/p>\n<p>“그렇다고 가만히 듣고 있으라고?”<\/p>\n<p>서율이 천천히 일어섰다. 오른손에는 아직 보호대가 감겨 있었다.<\/p>\n<p>“내 이름으로 온 공문이면 내가 먼저 확인할게.”<\/p>\n<p>태경이 그의 빈 그릇을 가리켰다.<\/p>\n<p>“밥은?”<\/p>\n<p>“나중에.”<\/p>\n<p>“너 또 그러지! 다친 놈이 밥까지 거르면—”<\/p>\n<p>“태경아.”<\/p>\n<p>서율은 억지로 웃었다.<\/p>\n<p>“이번엔 정말 배가 안 고파.”<\/p>\n<p>그 말을 듣고 태경은 더 이상 붙잡지 못했다.<\/p>\n<h2>2. 웃지 않는 승자<\/h2>\n<p>남궁현우는 그날 아침 처음으로 느긋하게 차를 마셨다.<\/p>\n<p>심의실에서 전서율을 내쫓지 못한 뒤로 가문의 문책이 끊이지 않았다. 그런데 마교의 공문이 도착했다. 그가 은서방을 통해 흘린 정보가 마침내 바깥의 힘을 불러들인 것이다.<\/p>\n<p>차윤겸은 방문을 닫자마자 물었다.<\/p>\n<p>“정말로 마교가 움직였습니까?”<\/p>\n<p>“공문이 왔다더군.”<\/p>\n<p>“그럼 끝난 겁니까?”<\/p>\n<p>현우가 찻잔을 내려놓았다.<\/p>\n<p>“끝? 이제 시작이지.”<\/p>\n<p>“학관이 거절하면요?”<\/p>\n<p>“거절하기 어렵게 만들면 된다.”<\/p>\n<p>현우는 가문의 문양이 찍힌 서신 세 통을 내밀었다. 하나는 학관 운영에 영향력을 가진 문중 원로에게, 하나는 교류 업무를 맡은 후원회에, 마지막 하나는 정파 학도들의 대표 모임에 보낼 것이었다.<\/p>\n<p>“학관이 무혐의라고 했다고 해서 마교의 의문까지 사라지는 건 아니잖아. 우리는 조사에 협조하라고 권할 뿐이야.”<\/p>\n<p>윤겸은 서신을 받지 않았다.<\/p>\n<p>“하연이가 알면…….”<\/p>\n<p>현우의 눈이 가늘어졌다.<\/p>\n<p>“아직도 그 여자 눈치나 보나?”<\/p>\n<p>“그런 뜻이 아닙니다!”<\/p>\n<p>“네가 원하는 게 뭔지 똑바로 봐. 전서율이 여기 남으면 진하연은 계속 그놈 곁에 있겠지.”<\/p>\n<p>윤겸의 손이 떨렸다.<\/p>\n<p>“……학도들 사이의 일은 제가 맡겠습니다.”<\/p>\n<p>“그래. 네가 가장 잘하는 일이잖아. 사람들이 듣고 싶어 하는 말을 골라 주는 것.”<\/p>\n<p>윤겸은 서신을 품에 넣었다. 방을 나서면서도 스스로에게 되뇌었다.<\/p>\n<p><em>나는 하연이를 위해 이러는 거야.<\/em><\/p>\n<p>하지만 복도 끝에서 하연이 서율을 향해 달려가는 모습을 본 순간, 그 말은 순식간에 분노로 바뀌었다.<\/p>\n<p><em>왜 또 저놈이야!<\/em><\/p>\n<h2>3. 모두의 불안이라는 이름<\/h2>\n<p>오후가 되자 게시판에 익명의 글이 붙었다.<\/p>\n<p><strong>「학관의 명예를 위하여 외부 조사에 협조해야 한다」<\/strong><\/p>\n<p>글은 교묘했다. 서율을 마공 사용자라고 단정하지 않았다. 오히려 무혐의 판정을 존중한다는 말로 시작했다. 그러면서도 ‘조사를 피하면 학관 전체가 의심받는다’, ‘일개 학도의 사정보다 정사의 신뢰가 우선이다’라는 문장을 굵게 적었다.<\/p>\n<p>차윤겸은 그 앞에서 일부러 큰 소리로 말했다.<\/p>\n<p>“난 서율이가 죄 있다고 말한 적 없어. 다만 떳떳하면 가서 설명하면 되는 것 아니냐고!”<\/p>\n<p>“맞아! 우리까지 마교의 의심을 받을 이유가 없잖아!”<\/p>\n<p>“정파의 이름을 달고 배웠으면 책임도 져야지!”<\/p>\n<p>처음부터 서율을 싫어하던 학도들은 기다렸다는 듯 동조했다. 정통 초식을 중시하던 이들은 그의 검로를 불편해했고, 남궁가의 눈치를 보는 이들은 침묵 대신 박수를 택했다. 소문만 들은 학도들은 정말로 마교와의 분쟁이 벌어질까 두려워했다.<\/p>\n<p>그렇다고 모두가 같은 생각인 것은 아니었다.<\/p>\n<p>“무혐의라며? 왜 그 애 혼자 책임져야 해?”<\/p>\n<p>“조사에 협조하는 것과 사람을 넘기는 건 다르잖아.”<\/p>\n<p>누군가 반박했지만, 목소리는 곧 야유에 묻혔다.<\/p>\n<p>소윤은 게시판 앞에서 종이를 뜯으려다 손을 멈췄다. 떼어 내면 저들이 오히려 자신들을 증거를 숨기는 사람으로 몰 것이다.<\/p>\n<p>“비겁해…….”<\/p>\n<p>그녀의 입술이 떨렸다.<\/p>\n<p>“정말 비겁해!”<\/p>\n<p>태경은 게시판에 적힌 글을 뚫어져라 보았다.<\/p>\n<p>“저놈들, 서율이한테 직접 말도 못 하면서.”<\/p>\n<p>“직접 말할 거야.”<\/p>\n<p>소윤이 낮게 대답했다.<\/p>\n<p>“이제는 사람들 앞에서, 아주 당당하게.”<\/p>\n<h2>4. 원주실의 두 목소리<\/h2>\n<p>원주실의 긴 탁자에는 검은 봉인의 공문과 학도 대표들의 연명서가 나란히 놓였다.<\/p>\n<p>외사 교두가 먼저 말했다.<\/p>\n<p>“마교의 외무당은 우리 학도에게 직접 명령할 권한이 없습니다. 그 점은 명확합니다.”<\/p>\n<p>“그러나 공식 요청을 무시할 수도 없소.”<\/p>\n<p>남궁가와 가까운 운영 원로가 탁자를 두드렸다.<\/p>\n<p>“접경의 교류와 상단 통행이 걸린 일입니다. 학도 하나 때문에 전체가 위험해지면 누가 책임집니까?”<\/p>\n<p>노교두가 의자를 밀고 일어났다.<\/p>\n<p>“학도 하나라니요! 전서율은 이 학관이 무혐의라고 판단한 아이입니다!”<\/p>\n<p>“무혐의와 조사 협조는 별개의 문제요.”<\/p>\n<p>“그 별개의 문제를 왜 징계처럼 다루십니까!”<\/p>\n<p>원로의 얼굴이 붉어졌다.<\/p>\n<p>“노교두, 언성을 낮추시오!”<\/p>\n<p>“먼저 아이를 물건처럼 부르지 마십시오!”<\/p>\n<p>원주가 손을 들어 둘을 말렸다. 탁자 위의 연명서에는 백 명이 넘는 학도의 이름이 적혀 있었다. 일부는 두려워서, 일부는 가문의 눈치를 보느라, 일부는 기꺼이 서명했을 것이다.<\/p>\n<p>원주는 그 차이를 알았다. 그러나 이름들이 한 장에 모이자, 그 종이는 실제 힘이 되었다.<\/p>\n<p>“당장 신병을 넘기지는 않겠네.”<\/p>\n<p>그가 말했다.<\/p>\n<p>“하지만 외무당의 공식 요청에 대한 협의는 시작한다. 당사자에게도 내용을 알리고, 학관의 결정 경로를 공개하겠네.”<\/p>\n<p>노교두는 이를 악물었다.<\/p>\n<p>“협의가 아이를 몰아내기 위한 형식이 되어선 안 됩니다.”<\/p>\n<p>“그 말도 기록하게.”<\/p>\n<p>원주는 서기에게 지시했다.<\/p>\n<p>결정은 아직 내려지지 않았다. 그러나 원주실 바깥에서는 이미 결정이 내려진 것처럼 소문이 퍼지고 있었다.<\/p>\n<h2>5. 마주 선 사람들<\/h2>\n<p>서율은 원주실에서 공문을 읽었다.<\/p>\n<p>‘검로 및 내공 발현 확인.’<\/p>\n<p>자신이 그날 창고 뒤에서 검 끝에 기운을 모았던 일을 누가 알았는지, 마교는 무엇을 확인하려는지 알 수 없었다. 다만 그 기운이 완성된 검기가 아니라는 사실만은 분명했다.<\/p>\n<p>“제가 마공을 배웠다는 뜻입니까?”<\/p>\n<p>“그렇게 단정한 문서는 아니다.”<\/p>\n<p>노교두가 대답했다.<\/p>\n<p>“그리고 네가 배웠다는 증거도 없다.”<\/p>\n<p>“그럼 왜…….”<\/p>\n<p>서율은 말을 끝내지 못했다.<\/p>\n<p>원주는 잠시 눈을 감았다.<\/p>\n<p>“학관 바깥의 일이 되었다. 그 사실이 네 잘못은 아니다.”<\/p>\n<p>문밖에서 기다리던 하연은 서율이 나오자마자 그의 얼굴을 살폈다.<\/p>\n<p>“뭐래?”<\/p>\n<p>“마교가 내 검을 확인하고 싶대.”<\/p>\n<p>“네 검을?”<\/p>\n<p>하연의 눈썹이 치켜올라갔다.<\/p>\n<p>“그 사람들이 네 검을 언제 봤다고!”<\/p>\n<p>서율은 대답하지 못했다. 하연은 곧바로 자신의 목소리를 낮췄다.<\/p>\n<p>“미안. 너한테 화낸 거 아니야.”<\/p>\n<p>“알아.”<\/p>\n<p>그 말에 하연은 오히려 더 속이 상했다. 서율은 늘 이렇게 말했다. 자신이 다친 일에도, 억울한 일을 당한 뒤에도.<\/p>\n<p>“서율아. 이번엔 혼자 견디려고 하지 마.”<\/p>\n<p>그가 하연을 바라봤다.<\/p>\n<p>“혼자 아니야.”<\/p>\n<p>멀리서 태경이 달려오고 있었다. 소윤은 그의 뒤에서 숨을 고르며 손을 흔들었다.<\/p>\n<p>하연은 그 모습을 보고 잠깐 웃었다. 그러나 게시판 앞에서 서율을 향해 쏟아진 야유를 떠올리자 웃음이 금세 사라졌다.<\/p>\n<p><em>저 애가 돌아가려는 곳이, 저 애를 밀어내고 있어.<\/em><\/p>\n<h2>6. 검으로 증명할 수 없는 것<\/h2>\n<p>학관은 마교에 보낼 기술 의견서를 작성하기 위해 제한된 검증 대련을 열었다. 상대는 상급생 강도겸이었다. 태경을 비무에서 이긴 적 있는, 기본기가 단단한 무인이었다.<\/p>\n<p>의원은 서율의 오른손 보호대를 직접 확인했다.<\/p>\n<p>“통증이 오면 즉시 중단한다. 검을 쥐는 힘을 억지로 주지 마라.”<\/p>\n<p>“예.”<\/p>\n<p>“대답만 하지 말고 지켜!”<\/p>\n<p>목검이 맞부딪쳤다.<\/p>\n<p>도겸의 첫 세 초식은 짧고 단단했다. 서율은 정면에서 받지 않고 옆으로 빠졌다. 정파 기본 보법의 발끝이 다음 발끝으로 이어졌다. 끊어져야 할 곳에서 끊어지지 않는 움직임. 도겸의 눈빛이 달라졌다.<\/p>\n<p>“재미있군.”<\/p>\n<p>도겸이 한 박자 빠르게 파고들었다. 서율은 검끝을 돌려 빈 곳을 찾았지만 오른손의 통증이 먼저 올라왔다.<\/p>\n<p><em>아직은 안 돼.<\/em><\/p>\n<p>그는 목검을 놓았다.<\/p>\n<p>검이 바닥에 떨어졌다. 도겸의 검끝이 그의 목 앞에서 멈췄다.<\/p>\n<p>“승부 끝!”<\/p>\n<p>주위에서 웃음과 야유가 섞여 터졌다.<\/p>\n<p>“저게 무슨 검술이야!”<\/p>\n<p>“마교가 가져가서 가르치면 되겠네!”<\/p>\n<p>도겸은 웃지 않았다.<\/p>\n<p>“왜 놓았지?”<\/p>\n<p>“이대로 쥐면 손이 다시 다칠 것 같았습니다. 그리고…… 다음 동작도 제대로 보이지 않았습니다.”<\/p>\n<p>도겸은 잠시 그를 보다가 목검을 내렸다.<\/p>\n<p>“잘 멈췄다. 다만 아직 검이 완성됐다고 착각하지 마라.”<\/p>\n<p>“예.”<\/p>\n<p>의견서는 분명했다. 정파 기본 검식에 뿌리를 둔 미완성의 연결 검로. 마공이나 사파 전수의 증거 없음. 재현되지 않은 기운 응집만으로 계보를 판단할 수 없음.<\/p>\n<p>하지만 게시판에는 그 결과가 붙기도 전에 다른 말이 돌았다.<\/p>\n<p>‘전서율, 검증 대련에서 패배.’<\/p>\n<p>그 뒤에는 누군가 붉은 먹으로 덧썼다.<\/p>\n<p>‘그러니 보내라.’<\/p>\n<h2>7. 종이 뒤의 사람<\/h2>\n<p>밤이 되자 차윤겸은 새 연명서에 서명을 받았다. 처음 서명한 학도 중 몇은 이름을 지워 달라고 했지만, 윤겸은 듣지 않았다.<\/p>\n<p>“이미 제출된 의견이야.”<\/p>\n<p>“나는 마교로 보내라는 뜻으로 쓴 게 아니었어!”<\/p>\n<p>“그럼 지금은 반대한다는 거야?”<\/p>\n<p>윤겸이 웃었다.<\/p>\n<p>“남궁가에서도 관심을 갖는 일인데?”<\/p>\n<p>학도는 입을 다물었다.<\/p>\n<p>그 광경을 본 한서린이 회랑 기둥에 기대 섰다.<\/p>\n<p>“이야, 사람 마음을 참 쉽게 고치는구나.”<\/p>\n<p>윤겸이 돌아섰다.<\/p>\n<p>“사파 사람은 정파 학관 일에 끼어들지 마.”<\/p>\n<p>“그 말, 하연 앞에서도 해 봐.”<\/p>\n<p>윤겸의 표정이 일그러졌다.<\/p>\n<p>한서린은 그 얼굴을 놓치지 않았다.<\/p>\n<p>“네가 정말 걱정하는 게 학관의 명예야? 아니면 하연이 마음이야?”<\/p>\n<p>“닥쳐!”<\/p>\n<p>윤겸의 고함이 회랑에 울렸다. 한서린은 눈 하나 깜빡하지 않았다.<\/p>\n<p>“소리만 크다고 네 말이 옳아지는 건 아니야.”<\/p>\n<p>윤겸은 대답하지 못했다. 한서린이 떠난 뒤에도 한동안 주먹을 풀지 못했다.<\/p>\n<h2>8. 보내라는 목소리<\/h2>\n<p>다음 날 아침, 연무장 앞에는 전날보다 더 많은 학도가 모였다.<\/p>\n<p>“전서율은 마교의 조사에 응하라!”<\/p>\n<p>“학관의 명예를 지켜라!”<\/p>\n<p>구호는 처음에는 어색했다. 그러나 누군가 박자를 맞추자 금세 하나의 목소리처럼 커졌다.<\/p>\n<p>서율은 회랑 위에서 그들을 내려다봤다.<\/p>\n<p>태경이 이를 갈았다.<\/p>\n<p>“저 사람들, 네가 뭘 잘못했는지 하나라도 말해 보라 그래!”<\/p>\n<p>소윤은 두 손을 꼭 쥐었다.<\/p>\n<p>“서율아. 저게 전부 학관 사람들의 생각은 아니야.”<\/p>\n<p>“알아.”<\/p>\n<p>서율은 아래를 바라봤다. 구호를 외치지 않는 학도도 있었다. 고개를 숙인 사람도, 못마땅하게 무리를 바라보는 사람도 있었다.<\/p>\n<p>그런데도 목소리는 한쪽에서만 들렸다.<\/p>\n<p>하연이 그들 곁으로 왔다. 그녀는 서율의 얼굴보다 먼저 그가 감춘 오른손을 봤다.<\/p>\n<p>“손은?”<\/p>\n<p>“괜찮아.”<\/p>\n<p>“거짓말.”<\/p>\n<p>“조금 아파.”<\/p>\n<p>“그럼 아프다고 말해.”<\/p>\n<p>하연의 목소리가 흔들렸다.<\/p>\n<p>“왜 자꾸 괜찮다고만 해…….”<\/p>\n<p>서율이 그녀를 바라봤다. 하연은 더 말하지 않고 돌아섰다.<\/p>\n<p>그날 밤, 그녀는 한서린을 찾아갔다.<\/p>\n<p>“사파의 보호 규약, 전부 가져와 줘.”<\/p>\n<p>“하연아.”<\/p>\n<p>“부탁이야.”<\/p>\n<p>그녀의 눈은 붉어져 있었다.<\/p>\n<p>“저 애를 저 사람들 사이에 그냥 둘 수 없어.”<\/p>\n<p><strong>— 제20장 「마교의 이름」 끝.<\/strong><\/p>\n"}, {"n": 21, "title": "제21장. 나랑 사파로 가자", "body": "<h1>제21장. 나랑 사파로 가자<\/h1>\n<h2>1. 누가 누구를 보호하는가<\/h2>\n<p>한서린은 보호 규약을 펼치며 한숨을 쉬었다.<\/p>\n<p>“하연아. 네가 마음먹었다고 정파 학도를 데려올 수 있는 건 아니야.”<\/p>\n<p>“알아.”<\/p>\n<p>“모르는 얼굴인데?”<\/p>\n<p>“알아! 그러니까 방법을 찾는 거잖아!”<\/p>\n<p>하연은 목소리를 높였다가 곧 고개를 숙였다.<\/p>\n<p>“……미안.”<\/p>\n<p>한서린은 종이를 밀어 주었다.<\/p>\n<p>사파의 보호를 받을 수 있는 길은 세 가지였다. 신변에 즉각적인 위험이 있음을 증명하거나, 정파 학관이 보호를 요청하거나, 본인이 정파 소속을 정리하고 자발적으로 사파에 들어오는 것.<\/p>\n<p>첫 번째는 지금의 위험을 모두 입증하기 어려웠다. 두 번째는 학관이 쉽게 허락할 리 없었다. 남은 것은 세 번째뿐이었다.<\/p>\n<p>“서율이가 싫다고 하면?”<\/p>\n<p>한서린이 물었다.<\/p>\n<p>하연은 대답하지 못했다.<\/p>\n<p>“그럼 그 애 선택을 존중해야 해.”<\/p>\n<p>“나도 알아.”<\/p>\n<p>하연은 접힌 문서의 모서리를 만지작거렸다.<\/p>\n<p>“그런데 린. 저 사람들이 서율이를 바라보는 눈을 봤어? 마교가 부른다는 이유 하나로, 마치 처음부터 죄인이었던 것처럼…….”<\/p>\n<p>“봤어.”<\/p>\n<p>“나는 그걸 보고도 아무렇지 않은 척 못 하겠어.”<\/p>\n<p>한서린의 표정이 부드러워졌다.<\/p>\n<p>“그럼 아무렇지 않은 척하지 마. 다만 그 애 마음까지 대신 결정하지는 말고.”<\/p>\n<h2>2. 이름을 지우는 손<\/h2>\n<p>차윤겸은 서율과 함께 수업을 듣던 학도들에게도 서명을 요구했다.<\/p>\n<p>“그 애가 여기 있으면 수업이 제대로 되겠어? 매일 마교 얘기뿐인데.”<\/p>\n<p>“그건 네가 떠들어서 그렇잖아.”<\/p>\n<p>한 학도가 불쑥 대꾸했다.<\/p>\n<p>윤겸이 얼굴을 굳혔다.<\/p>\n<p>“뭐?”<\/p>\n<p>“서율이가 우리한테 무슨 피해를 줬는데? 이상한 질문을 좀 했을 뿐이잖아.”<\/p>\n<p>“학관 전체가 위험해질 수 있다는 말 못 들었어?”<\/p>\n<p>“그건 아직 결정된 일도 아니야!”<\/p>\n<p>주변에서 웅성거림이 일었다. 모두가 윤겸에게 동조하는 것은 아니었다. 그러나 윤겸은 반대하는 사람을 오래 붙잡지 않았다. 그는 곧장 다른 무리로 옮겨 갔다. 찬성하는 열 사람의 목소리가 반대하는 한 사람을 덮는다는 것을 알고 있었기 때문이다.<\/p>\n<p>소윤은 그 모습을 멀리서 지켜봤다.<\/p>\n<p>“일부러 그러는 거야.”<\/p>\n<p>태경이 물었다.<\/p>\n<p>“뭘?”<\/p>\n<p>“서율이를 싫어하는 사람들만 모아서 모두가 싫어하는 것처럼 보이게 하는 거.”<\/p>\n<p>소윤은 이를 악물었다.<\/p>\n<p>“그냥 두지 않을 거야.”<\/p>\n<h2>3. 작은 반대의 목소리<\/h2>\n<p>소윤은 노교두에게 공개 의견서를 낼 수 있는지 물었다. 노교두는 허락했지만 한 가지를 당부했다.<\/p>\n<p>“너희도 상대를 협박하거나 거짓말을 쓰면 안 된다.”<\/p>\n<p>“그럴 생각 없어요.”<\/p>\n<p>“알고 있다. 그래도 분노는 사람을 쉽게 닮게 만든다.”<\/p>\n<p>소윤은 종이를 펼쳤다.<\/p>\n<p><strong>「전서율의 무혐의 판단과 학도 보호를 요청합니다」<\/strong><\/p>\n<p>첫 서명은 태경이었다. 두 번째는 소윤 자신이었다. 세 번째를 받기까지는 오래 걸렸다.<\/p>\n<p>“미안해. 남궁가가 알면 우리 집이 곤란해져.”<\/p>\n<p>“난 서율이 잘못 없다고 생각해. 그래도 이름은 못 적겠어.”<\/p>\n<p>소윤은 거절당할 때마다 웃으려 했다. 그러나 열 번째 거절을 들었을 때는 결국 복도 모퉁이에 기대 섰다.<\/p>\n<p>“왜 이렇게 어려운 거야…….”<\/p>\n<p>태경이 옆에 앉았다.<\/p>\n<p>“그만할까?”<\/p>\n<p>“싫어.”<\/p>\n<p>소윤은 눈물을 훔쳤다.<\/p>\n<p>“저쪽은 사람 하나 내보내겠다고 그렇게 쉽게 모이는데, 우린 잘못 없다고 말하는 것조차 무서워해야 해?”<\/p>\n<p>“그러게.”<\/p>\n<p>태경은 잠시 생각하다 웃었다.<\/p>\n<p>“그럼 나부터 더 크게 말할게. 내 목소리 큰 거 알잖아.”<\/p>\n<p>소윤이 울면서 웃었다.<\/p>\n<p>“그건 알아.”<\/p>\n<p>그날 저녁, 의견서에는 열일곱 명의 이름이 모였다. 백 명이 넘는 연명서에 비하면 적었다. 그래도 소윤은 그 종이를 품에 안고 오래 서 있었다.<\/p>\n<h2>4. 검보다 빠른 손<\/h2>\n<p>하연은 사파 수련반의 문서함 앞에서 낯선 두 사람을 발견했다.<\/p>\n<p>둘은 정파 학도의 표식을 달고 있었지만, 걸음이 지나치게 조심스러웠다. 한 사람이 문서함의 잠금쇠를 건드렸다.<\/p>\n<p>“거기서 뭐 해?”<\/p>\n<p>하연의 목소리에 둘이 동시에 돌아섰다.<\/p>\n<p>“문서 전달을…….”<\/p>\n<p>“정파 학도가 사파 문서함을?”<\/p>\n<p>대답 대신 한 사람이 그녀의 손목을 잡으려 했다. 하연은 한 발을 비켜 서며 팔을 흘렸다. 상대가 몸을 숙이는 순간 손바닥으로 어깨를 밀었다. 남자는 문기둥에 등을 부딪쳤다.<\/p>\n<p>다른 하나가 단도를 꺼냈다.<\/p>\n<p>“비켜!”<\/p>\n<p>하연의 눈빛이 차가워졌다.<\/p>\n<p>“칼까지 들었어?”<\/p>\n<p>그녀는 검을 뽑지 않았다. 단도가 지나가는 손목 바깥으로 파고들어 팔꿈치를 눌렀다. 단도가 돌바닥에 떨어졌다. 이어 무릎 뒤를 걷어 상대를 주저앉혔다.<\/p>\n<p>“누가 보냈어?”<\/p>\n<p>남자는 이를 악물었다. 그때 멀리서 경비의 발소리가 들렸다. 두 침입자는 서로 눈짓을 나누더니 연막 가루를 뿌리고 담을 넘었다.<\/p>\n<p>하연은 쫓아가려다 멈췄다. 바닥에 떨어진 문서에는 서율의 이름이 적혀 있었다. 사파 보호 절차에 관한 비공식 문의서였다.<\/p>\n<p>한서린이 달려왔다.<\/p>\n<p>“괜찮아?”<\/p>\n<p>“응. 그런데…….”<\/p>\n<p>하연은 문서를 들어 보였다.<\/p>\n<p>“누군가 이걸 없애려고 했어.”<\/p>\n<p>“남궁가?”<\/p>\n<p>“몰라. 증거 없이 단정하지 않을 거야.”<\/p>\n<p>하연은 이를 꽉 물었다.<\/p>\n<p>“하지만 이제 서율이만 노리는 게 아니야.”<\/p>\n<h2>5. 돌아가고 싶은 곳<\/h2>\n<p>서율은 의원의 지시에 따라 검을 놓고 보법만 익혔다. 오른손의 통증은 전보다 덜했지만 무리하면 다시 부어올랐다.<\/p>\n<p>태경이 마당에 앉아 그를 지켜봤다.<\/p>\n<p>“너 진짜 사파로 가면 편할 것 같긴 해.”<\/p>\n<p>“갑자기?”<\/p>\n<p>“하연이가 있잖아. 거긴 적어도 네 검을 이상하다고 욕하진 않을 거고.”<\/p>\n<p>서율은 발을 멈췄다.<\/p>\n<p>“그럴 수도 있지.”<\/p>\n<p>“그런데 왜 안 가?”<\/p>\n<p>서율은 흙바닥에 남은 발자국을 바라봤다.<\/p>\n<p>“여기서 배운 것들이 전부 거짓말은 아니니까.”<\/p>\n<p>“사람들은 널 내보내라는데?”<\/p>\n<p>“그 사람들이 정파의 전부는 아니잖아.”<\/p>\n<p>태경은 한동안 말이 없었다.<\/p>\n<p>“너 진짜 고집 세다.”<\/p>\n<p>“너도.”<\/p>\n<p>“나는 너 때문에 고집 세진 거거든!”<\/p>\n<p>서율이 웃었다. 태경도 웃었지만 금세 입을 다물었다.<\/p>\n<p>“서율아. 그래도 너무 버티지는 마.”<\/p>\n<p>그 말은 걱정이었다. 서율은 알았다.<\/p>\n<h2>6. 달빛 아래의 제안<\/h2>\n<p>그날 밤, 하연은 서율을 작은 돌다리로 불렀다.<\/p>\n<p>달빛이 물 위에 길게 누워 있었다. 평소 같으면 먼저 장난을 걸었을 하연이 오늘은 말없이 난간에 기대 있었다.<\/p>\n<p>“하연아?”<\/p>\n<p>“왔네.”<\/p>\n<p>“무슨 일 있어?”<\/p>\n<p>“있어.”<\/p>\n<p>하연은 서율을 보지 않았다.<\/p>\n<p>“좋은 일로 만들고 싶어서.”<\/p>\n<p>그녀가 품에서 접힌 문서를 꺼냈다. 몇 번이나 펼쳤다 접었는지 모서리가 부드러워져 있었다.<\/p>\n<p>“사파의 보호 규약이야.”<\/p>\n<p>서율은 문서를 읽었다. 끝부분에서 시선이 멈췄다.<\/p>\n<p>“정파를 나와야 하는구나.”<\/p>\n<p>“응.”<\/p>\n<p>하연은 숨을 들이켰다. 수많은 비무에서 검을 맞댈 때도 이렇게 숨이 막히지는 않았다.<\/p>\n<p>“서율아.”<\/p>\n<p>“응?”<\/p>\n<p>“나랑 사파로 가자.”<\/p>\n<p>물소리만 들렸다.<\/p>\n<p>하연은 서율이 문서를 다시 내려다보는 것을 기다렸다. 그 침묵이 너무 길어, 먼저 웃으려 했다.<\/p>\n<p>“거기 가면 네 검 얘기 하루 종일 해도 돼. 왜 초식이 중간에서 끊기는지, 다음 발이 어디로 가야 하는지…… 내가 들어 줄게. 질리면 질린다고도 말하고.”<\/p>\n<p>“하연아…….”<\/p>\n<p>“그리고.”<\/p>\n<p>그녀는 서율의 오른손을 보았다.<\/p>\n<p>“아침마다 네가 오늘은 또 어디서 다칠지 걱정하지 않아도 되잖아.”<\/p>\n<p>마지막 말은 거의 속삭임이었다.<\/p>\n<p>서율이 조심스럽게 물었다.<\/p>\n<p>“그럼 네가 곤란해지지 않아?”<\/p>\n<p>하연은 눈을 크게 떴다.<\/p>\n<p>“지금 그게 먼저 걱정돼?”<\/p>\n<p>“네가 나 때문에 사파에서 곤란해지는 건 싫어.”<\/p>\n<p>“바보야.”<\/p>\n<p>그녀는 웃었지만 눈가가 뜨거워졌다.<\/p>\n<p>“나는 네가 곤란한 게 싫다고!”<\/p>\n<p>그제야 서율이 그녀를 똑바로 보았다.<\/p>\n<h2>7. 거절하고도 놓지 못하는 손<\/h2>\n<p>“고마워.”<\/p>\n<p>서율이 말했다.<\/p>\n<p>“정말 고마워, 하연아. 그런데…… 난 여기서 더 배우고 싶어.”<\/p>\n<p>하연은 고개를 숙였다.<\/p>\n<p>“알아.”<\/p>\n<p>“노교두님 같은 분도 계시고, 태경이랑 소윤이도 있어. 내가 믿었던 정파의 길을, 여기서 끝까지 확인해 보고 싶어.”<\/p>\n<p>“알아.”<\/p>\n<p>같은 대답이었지만 두 번째는 조금 떨렸다.<\/p>\n<p>서율이 한 발 다가왔다.<\/p>\n<p>“화났어?”<\/p>\n<p>“아니.”<\/p>\n<p>“하연아.”<\/p>\n<p>“조금은!”<\/p>\n<p>하연이 고개를 들었다. 눈에 물기가 고여 있었다.<\/p>\n<p>“네가 싫다고 할 줄 알았어. 알고 왔는데도…… 막상 들으니까 속상하잖아!”<\/p>\n<p>그녀는 입술을 깨물었다.<\/p>\n<p>“검을 들고 싸우는 건 안 무서운데, 네가 내 손을 안 잡아 줄까 봐 무서웠어.”<\/p>\n<p>서율은 다치지 않은 왼손을 뻗었다. 하연의 손등에 조심스럽게 손을 얹었다.<\/p>\n<p>“싫어서 그러는 게 아니야.”<\/p>\n<p>“알아.”<\/p>\n<p>“너랑 같이 있으면 좋아. 내 검 얘기를 끝까지 들어 주는 것도 좋고.”<\/p>\n<p>하연은 젖은 눈으로 그를 올려다봤다.<\/p>\n<p>“그럼 그냥 오면 되잖아.”<\/p>\n<p>서율은 아무 말도 하지 못했다.<\/p>\n<p>하연은 잠깐 웃었다. 이번에는 애써 만든 웃음이 아니었다.<\/p>\n<p>“……그런 대답을 할 사람이라서 내가 좋아하는 거겠지.”<\/p>\n<p>“하연아?”<\/p>\n<p>“못 들은 척하지 마.”<\/p>\n<p>그녀는 그의 손을 조금 더 꼭 잡았다.<\/p>\n<p>“나, 너 좋아해. 불쌍해서 돕는 것도 아니고, 네 검이 신기해서만 찾아오는 것도 아니야. 그냥 네가 좋아.”<\/p>\n<p>서율의 귀가 붉어졌다.<\/p>\n<p>“나는…….”<\/p>\n<p>“지금 대답 안 해도 돼.”<\/p>\n<p>하연은 한 걸음 다가와 잠깐 그의 어깨에 이마를 기댔다.<\/p>\n<p>“대신 약속해. 네가 어떤 결정을 하든, 네 마음을 남들이 대신 정하게 두지 않겠다고.”<\/p>\n<p>“응. 약속할게.”<\/p>\n<p>하연은 고개를 들었다.<\/p>\n<p>“그리고 또 다치면 나 정말 화낼 거야!”<\/p>\n<p>“그건 좀 무섭네.”<\/p>\n<p>“무서워하라고 하는 말이야!”<\/p>\n<p>두 사람은 함께 웃었다. 하지만 하연은 그 웃음이 오래가지 못할지도 모른다는 사실을 알고 있었다.<\/p>\n<h2>8. 멀리서 본 장면<\/h2>\n<p>소윤은 돌다리 반대편에서 두 사람을 보았다.<\/p>\n<p>하연이 서율의 어깨에 잠시 기댄 순간, 소윤은 발을 멈췄다. 손에 들고 있던 작은 약봉지가 바스락거렸다.<\/p>\n<p><em>아…….<\/em><\/p>\n<p>자신이 무슨 말을 하고 싶었는지 갑자기 기억나지 않았다.<\/p>\n<p>서율이 다친 손에 바를 약을 가져다주려던 길이었다. 그가 아플까 봐 걱정했다. 그런데 지금은 다른 곳이 아팠다.<\/p>\n<p>“소윤아?”<\/p>\n<p>뒤따라오던 태경이 그녀의 얼굴을 보았다.<\/p>\n<p>“왜 그래?”<\/p>\n<p>“아무것도 아니야.”<\/p>\n<p>“너 우는데?”<\/p>\n<p>“안 울어!”<\/p>\n<p>소윤은 급히 눈가를 훔쳤다. 태경은 다리 쪽을 보았다가 아무 말 없이 돌아섰다.<\/p>\n<p>“가자. 약은 내일 줘도 돼.”<\/p>\n<p>“……응.”<\/p>\n<p>소윤은 마지막으로 한 번만 뒤를 돌아봤다.<\/p>\n<p>하연이 서율에게 웃어 보이고 있었다. 소윤은 그 웃음을 미워하고 싶지 않았다. 하연도 서율을 위해 싸워 준 사람이었으니까.<\/p>\n<p>그 사실이 더 서러웠다.<\/p>\n<h2>9. 한서린의 질문<\/h2>\n<p>하연이 돌아오자 한서린은 침상 위에 앉아 기다리고 있었다.<\/p>\n<p>“말했어?”<\/p>\n<p>“응.”<\/p>\n<p>“뭐래?”<\/p>\n<p>“안 간대.”<\/p>\n<p>한서린이 조용히 하연의 얼굴을 살폈다.<\/p>\n<p>“울었어?”<\/p>\n<p>“안 울었어.”<\/p>\n<p>“눈 빨간데?”<\/p>\n<p>“바람 때문이야!”<\/p>\n<p>“그래, 바람이 아주 질투가 많았나 보네.”<\/p>\n<p>하연은 베개를 집어 던졌다. 한서린은 웃으며 받았다.<\/p>\n<p>한참 뒤 하연이 말했다.<\/p>\n<p>“나, 그 애 좋아해.”<\/p>\n<p>“알아.”<\/p>\n<p>“정말 좋아해.”<\/p>\n<p>“그것도 알아.”<\/p>\n<p>“그러니까…… 그 애가 싫다고 한 건 지킬 거야. 대신 저 사람들이 억지로 보내는 건 막을 거야.”<\/p>\n<p>한서린은 웃음을 거뒀다.<\/p>\n<p>“그럼 우리도 증거를 모아야겠네. 누가 학도들 사이에 불을 붙였는지.”<\/p>\n<h2>10. 작은 종이 두 장<\/h2>\n<p>다음 날, 학관의 게시판에는 두 장의 종이가 나란히 붙었다.<\/p>\n<p>한 장은 전서율의 외부 조사 출석을 요구하는 학도 연명서였다. 다른 한 장은 백소윤과 윤태경이 모은 학도 보호 의견서였다.<\/p>\n<p>두 번째 종이는 훨씬 작았다. 이름도 적었다.<\/p>\n<p>하지만 서율은 그 종이 앞에서 오래 서 있었다.<\/p>\n<p>“너희가 이걸…….”<\/p>\n<p>태경이 어깨를 으쓱했다.<\/p>\n<p>“글씨는 소윤이가 썼어. 나는 사람들 붙잡고 떠들었고.”<\/p>\n<p>소윤이 말했다.<\/p>\n<p>“네가 남고 싶다고 했으니까. 그 말을 혼자 하게 두고 싶지 않았어.”<\/p>\n<p>서율은 종이 끝을 손끝으로 눌렀다.<\/p>\n<p>“고마워.”<\/p>\n<p>소윤은 웃으려다 고개를 돌렸다.<\/p>\n<p>“그런 말 말고, 다치지나 마.”<\/p>\n<p>멀리서 다른 학도들이 웅성거렸다.<\/p>\n<p>“저렇게까지 감싸는 이유가 뭐야?”<\/p>\n<p>“마교에서 부른 사람인데.”<\/p>\n<p>서율은 그 목소리를 들었다. 예전 같으면 왜 자신을 오해하는지 설명하려 애썼을 것이다.<\/p>\n<p>하지만 오늘은 자신을 믿는 열일곱 개의 이름을 먼저 보았다.<\/p>\n<p>그 이름들이 학관 전체보다 작다는 사실도, 그렇다고 아무것도 아니라는 뜻은 아니라는 사실도 알았다.<\/p>\n<p><strong>— 제21장 「나랑 사파로 가자」 끝.<\/strong><\/p>\n"}, {"n": 22, "title": "제22장. 돌아올 곳", "body": "<h1>제22장. 돌아올 곳<\/h1>\n<h2>1. 한 장의 연명서가 만드는 소리<\/h2>\n<p>“전서율을 보내라!”<\/p>\n<p>구호가 연무장 담을 넘어 교실까지 들렸다.<\/p>\n<p>서율은 붓을 내려놓았다. 책상 위에는 정파 검식의 기본 원리가 적힌 교본이 펼쳐져 있었다. 지난 몇 달 동안 그는 이 글자들을 외우고, 질문하고, 틀리고, 다시 익혔다.<\/p>\n<p>오늘은 글자가 눈에 들어오지 않았다.<\/p>\n<p>창가에 앉은 학도가 일부러 크게 말했다.<\/p>\n<p>“마교에서 부른다는데 아직도 수업을 듣네.”<\/p>\n<p>“갈 사람한테 자리 내주라는 것도 아니고, 뭘.”<\/p>\n<p>다른 학도가 웃었다.<\/p>\n<p>소윤이 책을 탁 덮었다.<\/p>\n<p>“그만 좀 해!”<\/p>\n<p>교실이 조용해졌다.<\/p>\n<p>“서율이가 무슨 잘못을 했는데? 너희도 심의 결과 봤잖아!”<\/p>\n<p>“우리가 죄인이라고 했어? 학관을 위해 가라는 거지.”<\/p>\n<p>“그게 어떻게 같은 말이 아니야!”<\/p>\n<p>태경이 자리에서 일어났다.<\/p>\n<p>“소윤아, 앉아. 내가 말할게.”<\/p>\n<p>“둘 다 앉아.”<\/p>\n<p>서율의 목소리는 크지 않았다. 하지만 소윤과 태경은 그를 바라봤다.<\/p>\n<p>“지금 싸우면 저 사람들 말대로 되는 거잖아.”<\/p>\n<p>태경이 이를 갈았다.<\/p>\n<p>“그럼 언제까지 참아!”<\/p>\n<p>서율은 대답하지 못했다.<\/p>\n<p>그도 화가 났다. 소윤이 대신 모욕을 듣고, 태경이 자신 때문에 주먹을 쥐는 모습을 볼 때마다 속이 타들어 갔다. 다만 오른손의 보호대를 내려다볼 때면, 분노가 먼저 움직인 끝에 무엇을 잃을 수 있는지 떠올랐다.<\/p>\n<h2>2. 남궁가의 체면<\/h2>\n<p>원주실에 남궁가의 대리인이 들어온 것은 정오였다.<\/p>\n<p>그는 정중하게 인사했다. 지나치게 정중해서 오히려 서늘했다.<\/p>\n<p>“남궁가는 학관의 무혐의 판단을 존중합니다.”<\/p>\n<p>노교두의 눈빛이 날카로워졌다.<\/p>\n<p>“그렇다면 더 할 말이 없겠군요.”<\/p>\n<p>“다만 마교 외무당의 공식 조사 요청까지 거부하면 정파 전체가 의심받을 수 있다는 우려를 전달하러 왔습니다.”<\/p>\n<p>대리인은 후원 문중들이 공동으로 서명한 의견서를 내려놓았다.<\/p>\n<p>“학생 한 사람의 의혹을 명확히 하는 일이 학관의 명예를 회복하는 길이라고 믿습니다.”<\/p>\n<p>노교두가 탁자를 짚었다.<\/p>\n<p>“의혹은 학관이 검토했습니다! 마공의 증거가 없다는 기술 의견서까지 나왔습니다!”<\/p>\n<p>“그 의견을 마교에도 설명하면 되지 않겠습니까?”<\/p>\n<p>“설명은 문서로도 할 수 있습니다.”<\/p>\n<p>“그들이 당사자의 출석을 요청한다면요?”<\/p>\n<p>대리인은 미소를 잃지 않았다.<\/p>\n<p>“정파의 검이 떳떳하다면, 왜 그 검을 보여 주는 일을 두려워합니까?”<\/p>\n<p>원주는 그 말을 듣고도 곧장 대답하지 않았다. 그는 대리인의 뒤에 선 두 원로를 보았다. 후원금, 교류 수련, 상단의 통행 협약. 학관이 한 사람의 뜻만으로 움직일 수 없는 이유들이 그들의 옷자락에 매달려 있었다.<\/p>\n<p>“요청은 접수하겠소.”<\/p>\n<p>원주가 말했다.<\/p>\n<p>“그러나 남궁가의 의견이 곧 학관의 결정은 아니오.”<\/p>\n<p>대리인은 허리를 숙였다.<\/p>\n<p>“물론입니다.”<\/p>\n<p>그가 돌아선 뒤, 노교두는 원주를 향해 물었다.<\/p>\n<p>“정말 그렇습니까?”<\/p>\n<p>원주는 대답하지 못했다.<\/p>\n<h2>3. 질투가 붙인 불<\/h2>\n<p>차윤겸은 서율이 연무장으로 향하는 시간을 알고 있었다.<\/p>\n<p>그는 그 길목에 서명한 학도들을 모았다. 모두가 서율을 미워하는 것은 아니었다. 그러나 윤겸은 그 차이를 지우고 싶었다.<\/p>\n<p>“오늘은 본인에게 직접 물어봅시다. 정파를 위해 무엇을 할 생각인지!”<\/p>\n<p>“그래!”<\/p>\n<p>“피하지 말고 대답하라!”<\/p>\n<p>서율이 나타나자 사람들이 길을 막았다.<\/p>\n<p>“전서율! 마교 조사에 응할 거냐?”<\/p>\n<p>서율은 걸음을 멈췄다.<\/p>\n<p>“아직 학관의 결정도 나지 않았어.”<\/p>\n<p>“그럼 네 생각은?”<\/p>\n<p>“나는 여기서 배우고 싶어.”<\/p>\n<p>잠깐 정적이 흘렀다. 윤겸이 그 틈을 놓치지 않았다.<\/p>\n<p>“들었지? 모두가 불안해하는데 자기 수련만 생각한대!”<\/p>\n<p>“그런 뜻이 아니야.”<\/p>\n<p>“그럼 무슨 뜻인데? 하연이 뒤에 숨겠다는 거야?”<\/p>\n<p>서율의 눈이 윤겸에게 향했다.<\/p>\n<p>“하연이를 끌어들이지 마.”<\/p>\n<p>윤겸의 얼굴이 일그러졌다.<\/p>\n<p>“왜? 네가 특별해서 그 여자가 따라다니는 줄 알아?”<\/p>\n<p>“차윤겸!”<\/p>\n<p>태경이 사람들 사이를 헤치고 나왔다.<\/p>\n<p>“네가 하고 싶은 말이 그거였어? 학관 명예가 아니라 하연이 얘기?”<\/p>\n<p>윤겸은 순간 말문이 막혔다.<\/p>\n<p>“닥쳐!”<\/p>\n<p>“찔렸냐?”<\/p>\n<p>태경이 한 걸음 더 다가섰다.<\/p>\n<p>“서율이를 보내고 싶으면 네 이유부터 똑바로 말해!”<\/p>\n<p>윤겸은 주먹을 움켜쥐었다. 주위의 시선이 자신에게 모이는 것을 느끼자 급히 손을 내렸다.<\/p>\n<p>“난 모두를 대신해 묻는 거다.”<\/p>\n<p>그때 뒤에서 누군가 소리쳤다.<\/p>\n<p>“우릴 멋대로 대신하지 마!”<\/p>\n<p>소윤이었다. 그녀의 손에는 열일곱 명의 서명이 적힌 의견서가 들려 있었다.<\/p>\n<p>“여기에도 학도가 있어! 서율이를 죄인처럼 몰지 말라는 사람들도 있다고!”<\/p>\n<p>군중이 웅성거렸다. 그러나 맨 앞줄의 상급생들은 물러서지 않았다.<\/p>\n<h2>4. 부러지지 않은 검<\/h2>\n<p>“비켜.”<\/p>\n<p>상급생 하나가 태경의 어깨를 밀었다.<\/p>\n<p>“너부터.”<\/p>\n<p>태경이 버텼다.<\/p>\n<p>“서율이한테 손대지 마.”<\/p>\n<p>상대는 비웃으며 멱살을 잡았다. 태경은 손목을 쳐내고 한 발 물러났다. 그러나 옆에서 다른 학도가 팔을 뻗었다. 두 사람의 힘이 동시에 밀려왔다.<\/p>\n<p>“태경아!”<\/p>\n<p>소윤이 외쳤다.<\/p>\n<p>태경은 어깨를 맞고 뒤로 비틀거렸다. 누군가 소윤의 의견서를 낚아챘다.<\/p>\n<p>“이딴 종이로 뭘 바꾸겠다고!”<\/p>\n<p>종이가 찢어지는 소리가 났다.<\/p>\n<p>소윤의 얼굴이 하얗게 질렸다.<\/p>\n<p>“돌려줘!”<\/p>\n<p>그녀가 달려들자 상대가 팔을 휘둘렀다. 서율이 사이로 들어갔다. 오른손은 몸 가까이 붙인 채 왼발을 비스듬히 내디뎠다. 손이 뻗어 오는 길을 비우고 소윤을 뒤로 물렸다.<\/p>\n<p>“소윤아, 물러서!”<\/p>\n<p>“하지만 저건……!”<\/p>\n<p>“알아. 내가 주울게.”<\/p>\n<p>상급생이 서율의 옷깃을 잡으려 했다. 서율은 정면에서 힘을 맞받지 않았다. 발을 옮기고 어깨를 틀었다. 기초 보법의 다음 걸음이 자연스럽게 이어졌다. 상대의 팔이 허공을 갈랐다.<\/p>\n<p>“이 자식!”<\/p>\n<p>또 다른 사람이 달려들었다. 서율은 물러났지만 뒤에는 소윤이 있었다. 더는 피할 자리가 없었다.<\/p>\n<p>그 순간 태경이 몸을 던져 상대의 팔을 붙잡았다.<\/p>\n<p>“서율아, 뒤로 가!”<\/p>\n<p>“태경아!”<\/p>\n<p>태경은 벽에 어깨를 부딪쳤다. 숨이 턱 막혔다. 서율의 오른손이 반사적으로 움켜쥐어졌다. 통증이 손끝에서 팔목까지 치솟았다.<\/p>\n<p><em>검이 있었다면.<\/em><\/p>\n<p>그 생각이 스쳤다.<\/p>\n<p><em>아니. 지금 필요한 건 검이 아니야.<\/em><\/p>\n<p>그는 왼손을 들었다.<\/p>\n<p>“그만해!”<\/p>\n<p>이번에는 소리가 크게 울렸다.<\/p>\n<p>“우리가 뭘 잘못했다고 이러는 거야! 너희가 화난 이유를 말해! 내가 마공을 썼다는 증거가 있어? 아니면 그냥 내가 싫은 거야!”<\/p>\n<p>군중이 잠깐 조용해졌다.<\/p>\n<p>상급생 하나가 이를 드러냈다.<\/p>\n<p>“그런 태도가 싫은 거다!”<\/p>\n<p>그가 다시 덤비려는 순간, 뒤에서 날카로운 목소리가 터졌다.<\/p>\n<p>“거기서 멈춰!”<\/p>\n<p>진하연이었다.<\/p>\n<p>그녀는 사람들 사이를 가르며 걸어왔다. 손은 검자루에 닿지도 않았다. 그런데도 맨 앞의 학도들이 저절로 길을 비켰다. 결승 비무에서 남궁현우를 무너뜨린 광경을 모두 기억하고 있었기 때문이다.<\/p>\n<p>하연은 먼저 서율의 손을 살폈다.<\/p>\n<p>“다쳤어?”<\/p>\n<p>“아니. 조금…….”<\/p>\n<p>“조금도 다친 거야!”<\/p>\n<p>그녀의 목소리가 갈라졌다. 곧바로 소윤과 태경을 돌아봤다.<\/p>\n<p>“너희는?”<\/p>\n<p>“괜찮아.”<\/p>\n<p>태경이 어깨를 붙잡은 채 대답했다.<\/p>\n<p>하연은 군중을 향해 돌아섰다.<\/p>\n<p>“검을 배우러 온 사람들이 세 명을 둘러싸고 이게 무슨 짓이야!”<\/p>\n<p>차윤겸이 앞으로 나섰다.<\/p>\n<p>“진하연. 정파 학관의 일이다. 네가—”<\/p>\n<p>“내가 뭐?”<\/p>\n<p>하연이 한 걸음 다가갔다.<\/p>\n<p>“네가 저 사람들 불러 모았어?”<\/p>\n<p>윤겸은 입술을 깨물었다.<\/p>\n<p>“난 폭력을 지시하지 않았다.”<\/p>\n<p>“그럼 네가 키운 불이 사람을 태우는데도 네 책임은 없다는 거야?”<\/p>\n<p>그는 대답하지 못했다.<\/p>\n<p>순찰 교두들이 달려왔다. 노교두의 호통이 연무장을 뒤흔들었다.<\/p>\n<p>“전원 무기를 내려놓고 물러서라! 지금 당장!”<\/p>\n<h2>5. 다수라는 말의 무게<\/h2>\n<p>조사실에는 서로 다른 진술이 쌓였다.<\/p>\n<p>누군가는 서율이 먼저 시비를 걸었다고 했다. 누군가는 태경이 주먹을 들었다고 했다. 그러나 소윤의 의견서를 찢은 학도, 먼저 멱살을 잡은 학도를 봤다는 증언도 있었다.<\/p>\n<p>노교두는 진술을 하나씩 대조했다.<\/p>\n<p>“여론이 있다고 해서 폭력이 허용되는 건 아니다.”<\/p>\n<p>상급생이 불만스럽게 말했다.<\/p>\n<p>“하지만 대부분이 서율의 출석을 원합니다!”<\/p>\n<p>“대부분이라는 말로 네 손이 한 짓까지 지울 수 있느냐!”<\/p>\n<p>노교두의 고함에 방이 조용해졌다.<\/p>\n<p>원주는 찢어진 의견서를 바라봤다. 종이 한쪽에는 소윤의 글씨가 남아 있었다.<\/p>\n<p><em>학도는 무혐의 판정을 받았으며…….<\/em><\/p>\n<p>그 뒤는 찢겨 나갔다.<\/p>\n<p>“전서율.”<\/p>\n<p>원주가 불렀다.<\/p>\n<p>“네 생각은 변함없느냐?”<\/p>\n<p>서율은 고개를 들었다.<\/p>\n<p>“저는 정파에서 배우고 싶습니다.”<\/p>\n<p>“이런 일을 겪고도?”<\/p>\n<p>“……네.”<\/p>\n<p>서율은 손을 꽉 쥐려다 멈췄다.<\/p>\n<p>“하지만 저 사람들이 하는 일이 정파의 가르침이라고 생각하지는 않습니다.”<\/p>\n<p>노교두의 눈이 잠깐 흔들렸다.<\/p>\n<p>“저는 여기서 배운 검을 좋아합니다. 사람을 지키라고 배웠으니까요. 그런데 오늘은 그 검을 배우는 사람들이 친구들을 다치게 했습니다.”<\/p>\n<p>서율의 목소리가 떨렸다.<\/p>\n<p>“그게 너무 화납니다.”<\/p>\n<p>원주는 대답하지 못했다.<\/p>\n<h2>6. 원주가 내린 결정<\/h2>\n<p>그날 저녁, 학관 운영회의가 다시 열렸다.<\/p>\n<p>남궁가의 의견서, 학도들의 연명서, 마교의 공식 공문, 기술 검증 보고서가 한 탁자에 놓였다. 노교두는 서율의 무혐의 기록을 가장 위에 올려놓았다.<\/p>\n<p>“이 아이는 죄가 없습니다. 이 사실을 회의록 첫 줄에 적으십시오.”<\/p>\n<p>서기가 붓을 들었다.<\/p>\n<p>한 원로가 말했다.<\/p>\n<p>“죄가 없다는 것과 외무당 조사에 협조하는 것은 별개요.”<\/p>\n<p>“그 별개라는 말로 아이를 내쫓으려 하지 마십시오!”<\/p>\n<p>“접경 교류가 끊어지면 그 책임은 누가 집니까?”<\/p>\n<p>“남궁가가 요구한다고 우리 학도가 물건이 되는 겁니까!”<\/p>\n<p>언성이 높아졌다. 원주는 한참 동안 듣고만 있었다.<\/p>\n<p>마침내 그가 입을 열었다.<\/p>\n<p>“학관은 전서율에 대한 기존 무혐의 판단을 유지한다.”<\/p>\n<p>회의실이 조용해졌다.<\/p>\n<p>“동시에 마교 외무당의 공식 요청에 응하여, 학관 명의의 기술 확인 사절단을 파견한다.”<\/p>\n<p>노교두가 자리에서 벌떡 일어났다.<\/p>\n<p>“원주!”<\/p>\n<p>“전서율을 징계하거나 마교에 이적시키는 것이 아니다. 학관 소속으로 출석시키는 것이다. 호위 교두를 붙이고, 조사 범위와 귀환 기한을 문서로 확정한다. 강제 수련이나 구속은 허용하지 않는다.”<\/p>\n<p>“당사자는 아직 동의하지 않았습니다!”<\/p>\n<p>원주는 고개를 끄덕였다.<\/p>\n<p>“그래서 지금 이 결정을 서율에게 통보하겠네. 학관이 파견을 승인했다고 해서, 그 아이가 스스로 어떤 선택을 할지는 아직 남아 있다.”<\/p>\n<p>원로 하나가 불쾌한 얼굴을 했다.<\/p>\n<p>“그럼 또 지체되는 것 아닙니까?”<\/p>\n<p>원주가 그를 똑바로 바라봤다.<\/p>\n<p>“이 이상은 학관의 이름으로 학생을 팔 수 없소.”<\/p>\n<p>회의실에 침묵이 내려앉았다.<\/p>\n<p>결정은 내려졌다. 그러나 그것이 정의로운 결정인지는 누구도 쉽게 말하지 못했다.<\/p>\n<h2>7. 기쁜 사람과 울고 싶은 사람<\/h2>\n<p>남궁현우는 파견 승인 소식을 듣고 웃었다.<\/p>\n<p>“드디어.”<\/p>\n<p>차윤겸은 그 옆에 서 있었다.<\/p>\n<p>“하연이는 사파로 데려가려고 했습니다.”<\/p>\n<p>현우의 웃음이 옅어졌다.<\/p>\n<p>“그래서?”<\/p>\n<p>“서율이가 거절했답니다.”<\/p>\n<p>“그럼 더 좋군. 이제 어디에도 숨지 못하겠어.”<\/p>\n<p>윤겸은 따라 웃지 않았다. 서율이 떠나면 하연이 자신을 바라볼 것이라고 믿어 왔다. 그런데 지금은 그 믿음이 전보다 더 불안했다.<\/p>\n<p><em>저 애가 떠나면, 하연이는 울까?<\/em><\/p>\n<p>그 생각을 하자 가슴이 서늘해졌다. 자신이 원한 것은 하연이 웃는 얼굴로 자신을 보는 것이었지, 서율을 그리워하며 우는 모습이 아니었다.<\/p>\n<p>그러나 이미 너무 멀리 왔다.<\/p>\n<h2>8. 돌아올 곳<\/h2>\n<p>서율은 소윤과 태경에게 회의 결과를 전했다.<\/p>\n<p>“학관이 사절단을 보내기로 했어.”<\/p>\n<p>태경이 벌떡 일어났다.<\/p>\n<p>“뭐? 네가 죄도 없는데 왜!”<\/p>\n<p>“조사에 협조한다는 거야. 학관 소속으로, 돌아오는 조건을 붙여서.”<\/p>\n<p>“말은 좋지!”<\/p>\n<p>태경의 눈이 붉어졌다.<\/p>\n<p>“너 하나 보내 놓고 여기 사람들은 편해지겠지! 그게 무슨 정파야!”<\/p>\n<p>서율은 대답하지 않았다.<\/p>\n<p>소윤은 조용히 물었다.<\/p>\n<p>“넌 어떻게 하고 싶어?”<\/p>\n<p>서율은 두 친구를 바라봤다.<\/p>\n<p>“아직 모르겠어.”<\/p>\n<p>그 말이 입 밖으로 나오자 비로소 두려움이 느껴졌다.<\/p>\n<p>“여기 남고 싶어. 정말이야. 그런데 학관이 나를 보내기로 했다는 말을 들으니까…… 내가 여기 있어도 되는 사람인지 모르겠어.”<\/p>\n<p>“그런 말 하지 마!”<\/p>\n<p>소윤이 그의 손을 붙잡았다. 다친 오른손을 피해 왼손을 꼭 쥐었다.<\/p>\n<p>“네가 여기 있어도 되는 사람인지, 저 사람들이 결정하는 거 아니야!”<\/p>\n<p>그녀의 목소리가 떨렸다.<\/p>\n<p>“네가 우리 친구인 것도, 우리가 널 기다리는 것도, 아무도 못 바꿔!”<\/p>\n<p>태경은 고개를 돌려 눈을 훔쳤다.<\/p>\n<p>“맞아. 네 자리 내가 지킬 거야. 누가 치우려고 하면 싸울 거고.”<\/p>\n<p>“싸우지는 마.”<\/p>\n<p>“그럼 소리라도 지를 거야!”<\/p>\n<p>서율은 울다가 웃을 뻔했다.<\/p>\n<p>그날 밤, 태경은 서율의 침상 옆에 작은 나무패를 걸었다. 서툰 글씨로 세 글자가 새겨져 있었다.<\/p>\n<p><strong>돌아올 곳.<\/strong><\/p>\n<p>“왜 이걸…….”<\/p>\n<p>“혹시 가게 되더라도 네 자리니까.”<\/p>\n<p>소윤은 작은 바느질 주머니를 내밀었다.<\/p>\n<p>“옷이 찢어지면 직접 꿰매. 그리고…… 꼭 돌아와.”<\/p>\n<p>서율은 주머니를 받았다. 손끝이 떨렸다.<\/p>\n<p>“나 아직 가겠다고 한 것도 아닌데.”<\/p>\n<p>“알아.”<\/p>\n<p>소윤이 웃었다. 눈물이 뺨을 타고 흘렀다.<\/p>\n<p>“그래도 미리 말하고 싶었어.”<\/p>\n<p>문밖에서는 하연이 그들의 웃음과 울음을 들었다. 그녀는 문을 열지 않았다. 대신 주먹을 꼭 쥐었다가 천천히 폈다.<\/p>\n<p><em>서율아. 네가 어디로 가든, 네가 선택할 수 있는 길만은 빼앗기지 않게 할게.<\/em><\/p>\n<p>그녀는 돌아섰다. 내일 아침 원주를 만나, 사절단의 안전 보장에 사파 측 참관인을 추가할 수 있는지 물을 생각이었다.<\/p>\n<p>학관은 마교행을 승인했다.<\/p>\n<p>하지만 전서율은 아직 대답하지 않았다.<\/p>\n<p>그의 침상 곁에는 돌아올 곳이라는 세 글자가 조용히 흔들리고 있었다.<\/p>\n<p><strong>— 제22장 「돌아올 곳」 끝.<\/strong><\/p>\n"}, {"n": 23, "title": "제23장. 마지막 인사", "body": "<h1>제23장. 마지막 인사<\/h1>\n<h2>1. 결정이 내려진 아침<\/h2>\n<p>새벽 종이 세 번 울렸다.<\/p>\n<p>전서율은 아직 잠들지 못했다. 침상 옆에 걸린 나무패가 바람에 흔들렸다.<\/p>\n<p><strong>돌아올 곳.<\/strong><\/p>\n<p>윤태경이 어젯밤 못질을 서툴게 하는 바람에 글자 하나가 비스듬했다. 서율은 그것을 바로잡으려 손을 뻗었다가 멈췄다. 저대로 두는 편이 태경다웠다.<\/p>\n<p>문밖에서 발소리가 났다.<\/p>\n<p>“전서율 학도. 원주께서 부르신다.”<\/p>\n<p>서율은 조용히 일어났다. 다친 오른손의 보호대를 다시 매고 문을 열었다.<\/p>\n<p>복도 저편에서 태경이 고개를 내밀었다.<\/p>\n<p>“야, 어디 가?”<\/p>\n<p>“원주실.”<\/p>\n<p>태경의 얼굴에서 잠기가 사라졌다.<\/p>\n<p>“나도 갈게.”<\/p>\n<p>“아직 아무 말도 안 들었어.”<\/p>\n<p>“그러니까 같이 가겠다는 거야!”<\/p>\n<p>서율은 잠깐 웃었다.<\/p>\n<p>“그럼 소윤이한테도 알려 줘.”<\/p>\n<p>태경은 벌써 달리고 있었다.<\/p>\n<h2>2. 죄가 없는데 떠나는 사람<\/h2>\n<p>원주실에는 노교두와 외사 교두, 그리고 어제까지 서율의 파견을 강하게 주장하던 원로 둘이 앉아 있었다.<\/p>\n<p>원주는 서류를 서율 앞으로 밀었다.<\/p>\n<p>“학관은 마교 외무당의 요청에 응해 공식 기술 확인 사절단을 파견하기로 결정했다.”<\/p>\n<p>서율은 서류를 내려다봤다.<\/p>\n<p>“제가 가야 한다는 말입니까?”<\/p>\n<p>“사절단의 조사 대상은 자네의 검로일세. 자네가 참여하지 않으면 파견의 실효성이 없지.”<\/p>\n<p>“그럼 제게 선택권은 없는 겁니까?”<\/p>\n<p>원주는 즉시 대답하지 못했다.<\/p>\n<p>노교두가 먼저 입을 열었다.<\/p>\n<p>“있다. 학관이 사절단을 보내기로 결정한 것과 네 몸을 마음대로 보낼 수 있다는 것은 다르다.”<\/p>\n<p>원로 하나가 불편한 기색으로 헛기침했다.<\/p>\n<p>“이렇게까지 학관을 곤란하게 만들어야겠습니까? 정파의 학도라면 공동의 명예를—”<\/p>\n<p>“그 명예 때문에 손가락이 부러진 아이입니다!”<\/p>\n<p>노교두의 호통이 방을 울렸다.<\/p>\n<p>“그때는 학관의 명예를 말씀하시더니, 이제는 그 명예를 지키려면 아이를 밖으로 보내야 한다고 하십니까!”<\/p>\n<p>“노교두!”<\/p>\n<p>“제 말이 틀렸습니까!”<\/p>\n<p>서율은 처음으로 노교두가 저렇게 화내는 모습을 보았다. 자신이 검을 쥐는 법을 처음 배웠을 때, 교두는 손목의 각도를 바로잡아 주며 서두르지 말라고 했었다. 지금도 그가 지키려는 것은 같은 것이었다.<\/p>\n<p>원주가 손을 들어 두 사람을 멈췄다.<\/p>\n<p>“전서율. 학관의 결정은 바뀌지 않을 것이다. 그러나 네 동의 없이 호송하지는 않겠다. 동의하지 않으면 이 사절단은 당사자 없는 사절단으로 떠나게 된다. 그 뒤의 외교적 책임은 학관이 감당하겠다.”<\/p>\n<p>그 말은 위로가 아니었다. 오히려 서율에게 자신이 무엇을 선택할 수 있는지 분명히 알려 주었다.<\/p>\n<p>“생각할 시간을 주십시오.”<\/p>\n<p>“오늘 해가 지기 전까지.”<\/p>\n<p>노교두가 얼굴을 굳혔다.<\/p>\n<p>“원주!”<\/p>\n<p>“나도 더 시간을 주고 싶네. 그러나 사절단의 출발 일정은 이미 공고되었어.”<\/p>\n<p>서율은 서류를 접지 않은 채 두 손으로 받았다.<\/p>\n<p>“알겠습니다.”<\/p>\n<h2>3. 웃는 사람들의 이유<\/h2>\n<p>원주실에서 나오자 학관은 평소처럼 시끄러웠다.<\/p>\n<p>그러나 서율이 회랑에 들어서는 순간, 소리의 방향이 바뀌었다.<\/p>\n<p>“저기 나온다.”<\/p>\n<p>“결국 가는 모양이지?”<\/p>\n<p>“진작 갔으면 우리도 조용히 수련했을 텐데.”<\/p>\n<p>누군가 낮게 웃었다.<\/p>\n<p>“마교 가서 자기 검이 얼마나 대단한지 보여 주라지.”<\/p>\n<p>서율은 걸음을 멈췄다.<\/p>\n<p>처음에는 화가 났다. 지난번처럼 소리치고 싶었다. 자신이 무슨 잘못을 했는지 다시 묻고 싶었다.<\/p>\n<p>그런데 돌아보니, 떠드는 학도들 뒤에 말없이 서 있는 얼굴들도 있었다. 눈이 마주치자 고개를 돌리는 사람. 미안한 표정을 짓는 사람. 웃는 무리에서 한 걸음 떨어져 있는 사람.<\/p>\n<p>모두가 같은 마음은 아니었다.<\/p>\n<p>그 사실이 이상하게 더 아팠다.<\/p>\n<p>그때 익숙한 목소리가 회랑을 갈랐다.<\/p>\n<p>“남의 일로 그렇게 신났으면 오늘 수련은 다 끝났나 보지?!”<\/p>\n<p>태경이었다. 숨을 몰아쉬며 달려온 그의 뒤에 소윤이 있었다.<\/p>\n<p>“태경아.”<\/p>\n<p>“아니, 내가 틀린 말 했어? 며칠째 사람 하나 붙잡고 떠들어 대는 게 그렇게 재미있냐고!”<\/p>\n<p>소윤은 태경의 소매를 붙잡았다.<\/p>\n<p>“그만해. 지금은 서율이 얘기부터 들어야 해.”<\/p>\n<p>태경이 이를 악물고 서율을 돌아봤다.<\/p>\n<p>“어떻게 됐어?”<\/p>\n<p>서율은 한동안 입을 열지 못했다.<\/p>\n<p>“학관이 사절단을 보내기로 했어.”<\/p>\n<p>“그건 알고 있어. 너는?”<\/p>\n<p>“아직 결정 안 했어.”<\/p>\n<p>태경의 어깨에서 힘이 조금 빠졌다.<\/p>\n<p>“그럼 됐어. 아직 결정 안 한 거면 됐어.”<\/p>\n<p>소윤은 아무 말 없이 서율의 왼손을 잡았다. 서율은 그 손이 차갑다는 것을 느꼈다.<\/p>\n<h2>4. 남궁현우의 승리<\/h2>\n<p>남궁현우는 높은 누각에서 연무장을 내려다봤다.<\/p>\n<p>차윤겸이 옆에서 웃었다.<\/p>\n<p>“결국 우리가 이겼군.”<\/p>\n<p>“아직 전서율이 동의하지 않았다.”<\/p>\n<p>“동의하지 않아도 끝난 거 아닙니까? 남으면 학관 전체의 원망을 받을 테니까.”<\/p>\n<p>현우는 찻잔을 내려놓았다.<\/p>\n<p>“그런 말을 밖에서는 하지 마라.”<\/p>\n<p>윤겸이 눈살을 찌푸렸다.<\/p>\n<p>“왜요? 우리가 한 일이 틀렸습니까?”<\/p>\n<p>“틀렸는지가 아니라, 누가 들을지가 문제다.”<\/p>\n<p>현우의 목소리는 차가웠다.<\/p>\n<p>“우리는 학관의 명예를 위해 공식 조사를 요청한 사람들이다. 그 이상도 이하도 아니야.”<\/p>\n<p>윤겸은 대답하지 않았다. 그의 눈은 연무장 반대편, 사파 수련반의 처마를 향해 있었다.<\/p>\n<p>“하연은 어떻게 할 생각일까요?”<\/p>\n<p>현우가 피식 웃었다.<\/p>\n<p>“아직도 그 여자 얘기냐?”<\/p>\n<p>“…….”<\/p>\n<p>“전서율이 떠나면 네게 돌아올 거라고 생각하나?”<\/p>\n<p>윤겸의 손이 찻잔을 움켜쥐었다.<\/p>\n<p>“그런 뜻이 아닙니다!”<\/p>\n<p>“그럼 그 얼굴부터 치워라. 네 감정이 드러나면 우리가 쌓아 올린 명분도 무너진다.”<\/p>\n<p>윤겸은 창밖을 노려봤다.<\/p>\n<p>서율이 사라지면 모든 것이 예전으로 돌아갈 줄 알았다. 그러나 하연이 자신을 바라보던 마지막 눈빛은 떠올릴수록 차가웠다.<\/p>\n<p>그는 처음으로 불안해졌다.<\/p>\n<p><em>정말 저 녀석만 없어지면 되는 걸까?<\/em><\/p>\n<h2>5. 노교두가 건넨 것<\/h2>\n<p>오후 수련 시간이 끝날 무렵, 노교두가 서율을 연무장 뒤편으로 불렀다.<\/p>\n<p>낡은 나무 의자 위에 작은 책 한 권이 놓여 있었다. 모서리가 닳은 정파 기본 검식 교본이었다.<\/p>\n<p>“이건 제가 이미 가지고 있습니다.”<\/p>\n<p>“알고 있다.”<\/p>\n<p>노교두는 책을 펼쳤다. 빽빽한 여백마다 손으로 쓴 메모가 있었다.<\/p>\n<p>“내가 젊었을 때 적어 둔 것들이다. 어떤 동작은 잘못 이해했고, 어떤 것은 아직도 답을 못 찾았지.”<\/p>\n<p>서율은 낯익은 글귀를 발견했다.<\/p>\n<p><em>검이 멈추는 까닭을 먼저 물을 것.<\/em><\/p>\n
