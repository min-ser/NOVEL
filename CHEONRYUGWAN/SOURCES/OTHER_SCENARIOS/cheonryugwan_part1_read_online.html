<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>천류관 제1부 | 1~24장 웹 열람</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10141b;color:#e9e6e0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}header{position:sticky;top:0;z-index:2;background:#161c26ed;border-bottom:1px solid #374153;padding:12px max(16px,calc((100vw - 960px)/2));display:flex;align-items:center;gap:12px;flex-wrap:wrap}header strong{color:#f5d4a2;font-size:18px}select,button{background:#273142;color:#f6f1e9;border:1px solid #546073;border-radius:7px;padding:9px;cursor:pointer}select{flex:1;min-width:160px}button:disabled{opacity:.35;cursor:default}.wrap{max-width:780px;margin:0 auto;padding:35px 24px 70px}.content{font-family:Georgia,"Noto Serif KR",serif;font-size:18px;line-height:2.05;word-break:keep-all}.content h1,.content h2,.content h3{font-family:system-ui,"Noto Sans KR",sans-serif;line-height:1.45;color:#f5d4a2;margin:1.7em 0 .9em}.content p{margin:0 0 1.2em}.content hr{border:0;border-top:1px solid #3b4350;margin:2em 0}.content blockquote{border-left:3px solid #a98759;margin-left:0;padding-left:20px;color:#bfc7d0}.bottom{display:flex;justify-content:space-between;gap:12px;margin-top:48px;border-top:1px solid #3c4550;padding-top:22px}.muted{font-size:13px;color:#a5aeba}a{color:#e3bd88}@media(max-width:550px){header{gap:8px}.wrap{padding:22px 18px}.content{font-size:17px;line-height:1.95}header strong{width:100%}}</style></head><body><header><strong>천류관 · 제1부 《돌아올 곳》</strong><select id="chapters" aria-label="장 선택"></select><button id="prev">이전</button><button id="next">다음</button></header><main class="wrap"><div class="muted" id="counter"></div><article class="content" id="story"></article><nav class="bottom"><button id="prev2">← 이전 장</button><button id="next2">다음 장 →</button></nav></main><script>const chapters=[{"n": 1, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제1장. 입관(入館)<\/h2>\n<blockquote>\n<p>개정 원고 v0.2 · 전서율 중심 3인칭 · <strong>초고 / 최종 검수 전<\/strong><\/p>\n<\/blockquote>\n<h3>1. 산문이 열리는 날<\/h3>\n<p>검을 배우겠다고 마음먹은 사람이라면 누구나 한 번쯤 꿈꾸는 곳이 있다.<\/p>\n<p>이름난 무림세가의 후계자든, 변방의 작은 문파에서 올라온 제자든, 아직 검을 제대로 쥐어 본 적 없는 평범한 소년이든. 적어도 입관을 앞둔 날만큼은 모두 같은 꿈을 꾼다.<\/p>\n<p>언젠가 자신도 강호에 이름을 떨칠 수 있을 거라는 꿈.<\/p>\n<p>그리고 전서율도 그중 한 사람이었다.<\/p>\n<p>“……와.”<\/p>\n<p>소년의 입에서 짧은 감탄이 흘러나왔다. 산 아래에서 보았을 때만 해도 그저 커다란 건물이라고 생각했다. 그런데 가까이 와서 보니 이야기가 달랐다.<\/p>\n<p>하늘을 찌를 듯 솟은 기와지붕, 여러 겹으로 이어진 누각, 산허리를 따라 뻗은 회랑, 정문 양옆에 세워진 거대한 석검. 무엇보다 놀라운 것은 정문 앞에 모인 사람들의 숫자였다.<\/p>\n<p>“사람이 이렇게 많다고?”<\/p>\n<p>전서율은 품속의 입관패를 꺼냈다. 손바닥만 한 검은 목패에는 <strong>전서율(全瑞律)<\/strong>이라는 이름이 새겨져 있었다. 몇 번을 확인했는지 모른다. 그런데도 다시 한번 이름을 읽고 나서야 실감이 났다.<\/p>\n<p>정말로 이곳에 들어온 것이다.<\/p>\n<p>“거기! 신입 학도생! 길 막지 말고 앞으로 이동하세요!”<\/p>\n<p>“아, 네!”<\/p>\n<p>황급히 입관패를 집어넣은 전서율은 사람들 뒤를 따라 걸었다. 흰색과 청색을 바탕으로 한 정파의 제복, 검정과 붉은색을 섞은 사파의 제복. 허리춤의 검집도 제각각이었다.<\/p>\n<p>‘저 검은 왜 저렇게 길지? 무게가 다르면 휘두르는 방법도 달라질 텐데.’<\/p>\n<p>그렇게 생각하며 걷다가 앞사람의 등에 부딪혔다.<\/p>\n<p>퍽.<\/p>\n<p>“악!”<\/p>\n<p>“아, 미안!”<\/p>\n<p>전서율이 황급히 상대의 팔을 붙잡았다. 소년은 균형을 되찾자마자 돌아봤다. 짙은 갈색 머리카락이 이마 위로 삐죽하게 솟았고, 시원한 눈매와 마른 체격을 지녔다. 단정하게 입으려 애쓴 듯한 제복의 깃은 한쪽만 삐뚤어져 있었다.<\/p>\n<p>“야, 너 뭐냐?”<\/p>\n<p>“미안. 다른 데 보고 있었어.”<\/p>\n<p>“사람이 이렇게 많은데 앞을 안 보면 어떡해?”<\/p>\n<p>“그러게. 내가 잘못했어.”<\/p>\n<p>소년은 잠시 노려보더니 금세 표정을 풀었다.<\/p>\n<p>“……근데 너도 신입이냐?”<\/p>\n<p>“응.”<\/p>\n<p>“정파?”<\/p>\n<p>“응.”<\/p>\n<p>“오, 나도. <strong>윤태경<\/strong>. 앞으로 강호에 이름을 떨칠 사람이니까 기억해 둬라.”<\/p>\n<p>전서율은 잠시 생각하다가 물었다.<\/p>\n<p>“……벌써?”<\/p>\n<p>“뭐가?”<\/p>\n<p>“아직 입관도 안 했잖아.”<\/p>\n<p>“꿈은 크게 가지는 거야!”<\/p>\n<p>“그건 맞지.”<\/p>\n<p>전서율이 웃으며 손을 내밀었다.<\/p>\n<p>“전서율이야.”<\/p>\n<p>윤태경은 손을 덥석 잡았다.<\/p>\n<p>“좋아. 나중에 내가 유명해지면 오늘 일을 기억해라.”<\/p>\n<p>“부딪힌 거?”<\/p>\n<p>“그거 말고!”<\/p>\n<p>두 사람이 웃음을 터뜨렸을 때, 뒤에서 작은 목소리가 들렸다.<\/p>\n<p>“저기…….”<\/p>\n<p>어깨 아래로 내려오는 흑갈색 머리카락을 반쯤 묶은 소녀가 서 있었다. 맑은 갈색 눈동자, 단정한 정파 제복. 그녀의 손에는 안내도와 작은 수첩이 들려 있었다.<\/p>\n<p>“혹시 두 분도 입관식 장소로 가시는 건가요?”<\/p>\n<p>“그런데?” 윤태경이 대답했다.<\/p>\n<p>“그럼 대연무장이 어디인지 아세요?”<\/p>\n<p>전서율과 윤태경이 동시에 서로 다른 방향을 가리켰다.<\/p>\n<p>“저쪽.” “저쪽.”<\/p>\n<p>소녀의 안도한 미소가 멈췄다.<\/p>\n<p>“야, 너 왜 거길 가리켜?”<\/p>\n<p>“안내원이 저쪽이라고 했잖아.”<\/p>\n<p>“정문에서 왼쪽이라고 했지!”<\/p>\n<p>“그게 왼쪽이잖아.”<\/p>\n<p>소녀는 두 사람을 번갈아 보다가 조심스럽게 말했다.<\/p>\n<p>“저…… 그냥 저기 표지판을 보면 되지 않을까요?”<\/p>\n<p>세 사람이 돌아본 곳에는 커다란 글씨가 있었다.<\/p>\n<p><strong>대연무장 ←<\/strong><\/p>\n<p>“…….”<\/p>\n<p>윤태경이 헛기침했다.<\/p>\n<p>“알고 있었어.”<\/p>\n<p>“방금은 몰랐잖아.”<\/p>\n<p>“조용히 해.”<\/p>\n<p>소녀가 결국 웃음을 터뜨렸다. 전서율도 따라 웃었다.<\/p>\n<p>“난 전서율이야.”<\/p>\n<p>“윤태경이다.”<\/p>\n<p>“저는 <strong>백소윤<\/strong>이에요.”<\/p>\n<p>백소윤은 수첩을 펼쳐 두 사람의 이름을 적었다.<\/p>\n<p>“잊어버리면 안 되니까.”<\/p>\n<p>윤태경이 어깨너머로 들여다봤다.<\/p>\n<p><strong>윤태경 — 말이 많음.<\/strong><\/p>\n<p>“야!”<\/p>\n<p>“틀린 말은 아니잖아.”<\/p>\n<p>전서율이 배를 잡고 웃었다. 그렇게 세 사람은 나란히 대연무장으로 향했다.<\/p>\n<h3>2. 두 개의 깃발<\/h3>\n<p>대연무장은 전서율의 상상보다 훨씬 컸다. 중앙에는 백석 비무대가 자리했고 수천 명이 앉을 만한 관람석이 둘러싸고 있었다. 단상 양옆에는 청백색과 흑적색 깃발이 펄럭였다.<\/p>\n<p>정파와 사파.<\/p>\n<p>정파는 오래 전해진 무공과 도리, 사제 간의 예법을 중시했다. 사파는 개인의 선택과 실력, 자신의 무공에 대한 신념을 앞세웠다. 물론 정파인 모두가 고지식하거나 사파인 모두가 제멋대로인 것은 아니었다.<\/p>\n<p>“와, 사파 쪽은 벌써 싸우냐?”<\/p>\n<p>윤태경이 관람석을 가리켰다. 학생들이 서로 어깨를 밀치며 웃고 있었다.<\/p>\n<p>“싸우는 게 아니라 장난치는 것 같은데?” 백소윤이 대답했다.<\/p>\n<p>“저렇게 시끄러운데?”<\/p>\n<p>“우리도 충분히 시끄러워.”<\/p>\n<p>“……그건 그렇네.”<\/p>\n<p>반면 정파 관람석에서는 선배들이 줄을 맞추고 있었다.<\/p>\n<p>“명문세가 자제들은 앞줄로. 일반 입관생은 뒤편으로 이동하십시오.”<\/p>\n<p>같은 정파 학도생인데도 앉는 자리가 달랐다. 이름난 가문의 학생들은 곧장 앞자리로 안내받았다.<\/p>\n<p>“뭐야. 자리에도 급이 있어?” 윤태경이 투덜거렸다.<\/p>\n<p>“관례인가 봐.” 백소윤이 안내문을 확인했다.<\/p>\n<p>“관례라. 편리한 말이네.”<\/p>\n<p>전서율은 뒤쪽 관람석에서 비무대를 내려다봤다.<\/p>\n<p>“그래도 여기서 전체가 더 잘 보이잖아.”<\/p>\n<p>윤태경이 어이없다는 듯 웃었다.<\/p>\n<p>“너 진짜 긍정적이다.”<\/p>\n<p>“아니, 진짜로.”<\/p>\n<p>백소윤도 고개를 끄덕였다.<\/p>\n<p>“그건 맞네.”<\/p>\n<p>“……너희 둘 원래 이렇게 생각이 비슷해?”<\/p>\n<p>“오늘 처음 만났는데?”<\/p>\n<p>둥—.<\/p>\n<p>종소리가 울렸다. 청색 도포를 입은 노인이 단상 중앙에 올랐다.<\/p>\n<p>“제군들.”<\/p>\n<p>목소리는 크지 않았는데 뒤편까지 또렷하게 들렸다.<\/p>\n<p>“천하의 무공은 하나의 길에서 시작되지 않았으며, 하나의 길로 끝나지도 않는다.”<\/p>\n<p>전서율은 눈을 깜빡였다.<\/p>\n<p>‘어떻게 저렇게 작게 말하는데 다 들리지?’<\/p>\n<p>“야, 저거 내공으로 목소리 보내는 거지?” 윤태경이 속삭였다.<\/p>\n<p>“그런 것 같아.”<\/p>\n<p>백소윤은 이미 수첩에 노인의 말을 적고 있었다.<\/p>\n<p>“……설마 저것도 적어?”<\/p>\n<p>“좋은 말씀이잖아.”<\/p>\n<p>“우리 큰일 났다.”<\/p>\n<p>“왜?” 전서율이 물었다.<\/p>\n<p>“쟤랑 친하게 지내야겠어. 수업 필기 다 해 줄 것 같아.”<\/p>\n<p>“다 들려.” 백소윤이 수첩에서 눈을 떼지 않고 말했다.<\/p>\n<p>전서율은 웃음을 참았다.<\/p>\n<p>노인은 말을 이어 갔다.<\/p>\n<p>“이곳에서 배울 것은 단순히 검을 더 빠르게 휘두르는 방법만이 아니다. 자신이 믿는 무(武)가 무엇인지, 그것을 어떻게 지켜 나갈 것인지 배워야 한다.”<\/p>\n<p>전서율은 힘껏 박수를 쳤다. 무공은 단순히 상대를 이기는 기술이 아니라는 말. 그가 배우고 싶었던 것과 비슷했다.<\/p>\n<h3>3. 정파의 검<\/h3>\n<p>“이어서 각 세력 대표 학도생들의 무공 시연이 있겠습니다!”<\/p>\n<p>“드디어!” 윤태경이 벌떡 일어나려다 백소윤에게 소매를 잡혔다.<\/p>\n<p>“앉아. 뒤에 있는 사람 안 보이잖아.”<\/p>\n<p>“아, 미안.”<\/p>\n<p>정파 측에서 검과 창, 도를 든 세 명의 학도생이 비무대에 올랐다. 검을 든 선배가 앞으로 나섰다.<\/p>\n<p>“정파 검술의 기본은 형(形)을 지키는 데 있다.”<\/p>\n<p>촤악!<\/p>\n<p>은빛 궤적이 허공을 갈랐다. 첫 번째 베기, 두 번째 찌르기, 세 번째 회전. 발과 검의 방향이 빈틈없이 맞아떨어졌다. 이어 창과 도가 합류하자 비무대에서 금속성 울림이 터졌다.<\/p>\n<p>“봤냐? 검기가 진짜로 나와!” 윤태경이 흥분했다.<\/p>\n<p>“그러게.”<\/p>\n<p>“나도 저거 배울 수 있겠지?”<\/p>\n<p>“기초부터 익혀야겠지.” 백소윤이 답했다.<\/p>\n<p>“꿈 좀 꾸게 해 주면 안 되냐?”<\/p>\n<p>“꿈은 자유지. 수련은 해야 하지만.”<\/p>\n<p>검을 든 선배가 마지막 초식을 펼쳤다. 푸른 검기가 목제 표적을 둘로 갈랐다.<\/p>\n<p>콰직!<\/p>\n<p>박수가 쏟아졌다. 전서율도 열심히 손뼉을 쳤지만 머릿속에는 다른 생각이 떠올랐다.<\/p>\n<p>‘마지막 동작에서 굳이 발을 멈출 필요가 있었을까?’<\/p>\n<p>힘을 온전히 싣기 위해 멈춘다는 것은 배운 적이 있었다. 하지만 상대가 그 공격을 피하면? 움직임이 끊긴 다음 공격은 어떻게 이어질까?<\/p>\n<p>전서율은 무릎 위에서 손가락을 검처럼 움직였다.<\/p>\n<p>“뭐 해?” 백소윤이 물었다.<\/p>\n<p>“마지막에 발을 멈추지 않고 방향을 바꾸면 어떨까 생각했어.”<\/p>\n<p>“그러면 힘이 분산되지 않을까? 균형도 무너질 수 있고.”<\/p>\n<p>“맞아. 그래서 생각만 해 봤어.”<\/p>\n<p>윤태경이 끼어들었다.<\/p>\n<p>“아직 제대로 배우지도 않았는데 벌써 새로운 검술을 만들 생각을 하냐?”<\/p>\n<p>“그냥 궁금해서.”<\/p>\n<p>“이상한 놈이네. 근데 재미있긴 하다. 나중에 진짜 해 봐.”<\/p>\n<p>“응. 궁금하네.” 백소윤도 고개를 끄덕였다.<\/p>\n<p>전서율은 두 사람을 바라봤다. 자신의 엉뚱한 생각을 가볍게 받아 주는 사람이 있다는 것이 조금 신기했다.<\/p>\n<p>그때 사회자가 외쳤다.<\/p>\n<p>“다음은 사파 대표 학도생의 시연입니다!”<\/p>\n<p>그리고 전서율은 처음으로 그녀를 보았다.<\/p>\n<h3>4. 진하연<\/h3>\n<p>한 소녀가 홀로 비무대에 올라왔다. 긴 머리카락이 걸음에 맞춰 흔들렸다. 어두운 색감의 사파 제복은 화려하면서도 움직임을 방해하지 않을 만큼 간결했다. 허리에는 검 한 자루가 매달려 있었다.<\/p>\n<p>그녀는 관람석을 향해 손을 흔들었다.<\/p>\n<p>“안녕.”<\/p>\n<p>“진하연!” “하연아! 보여 줘!”<\/p>\n<p>소녀가 웃었다.<\/p>\n<p>“괜히 힘 빼지 말고 빨리 끝내!”<\/p>\n<p>“그럼 재미없잖아.”<\/p>\n<p>“저 선배 유명한 사람이래.” 윤태경이 속삭였다.<\/p>\n<p>“누군데?”<\/p>\n<p>“<strong>진하연<\/strong>. 사파에서 손꼽히는 유망주래. 실전 비무에서도 거의 진 적이 없다던데.”<\/p>\n<p>“나도 이름은 들어 봤어.” 백소윤이 말했다.<\/p>\n<p>전서율은 다시 비무대를 바라봤다. 맞은편에는 무기를 든 선배 세 명이 올라왔다.<\/p>\n<p>“혼자서 셋을 상대한다고?”<\/p>\n<p>“준비됐어?” 진하연이 물었다.<\/p>\n<p>“네가 먼저 준비해야 하는 거 아니냐?”<\/p>\n<p>“난 됐는데.”<\/p>\n<p>“그럼 간다!”<\/p>\n<p>세 방향에서 공격이 들어왔다. 그런데 진하연은 움직이지 않는 것처럼 보였다.<\/p>\n<p>검끝이 어깨에 닿기 직전, 툭. 발끝이 바닥을 스치고 몸이 반 걸음 옆으로 비켜났다. 도날이 날아오자 허리를 조금 틀었다. 세 번째 공격에는 검집을 들어 상대의 손목을 밀었다.<\/p>\n<p>채앵!<\/p>\n<p>방향이 바뀐 무기가 동료의 검과 부딪혔다.<\/p>\n<p>“야, 조심해!” “네가 거기로 들어왔잖아!”<\/p>\n<p>진하연이 웃었다.<\/p>\n<p>“둘이 싸울 거면 난 내려가도 돼?”<\/p>\n<p>관람석에서 웃음이 터졌다.<\/p>\n<p>“저거 완전히 가지고 노는 거 아니냐?” 윤태경이 중얼거렸다.<\/p>\n<p>“상대의 힘을 그대로 이용하고 있어.” 백소윤은 진하연의 발끝을 바라봤다.<\/p>\n<p>전서율은 아무 말도 하지 못했다.<\/p>\n<p>‘이상하다.’<\/p>\n<p>정파의 검은 정확하고 빠르고 강했다. 하지만 진하연의 움직임은 달랐다. 상대가 휘두른 검을 반드시 막을 필요가 없었다. 상대가 전진한다고 반드시 물러날 필요도 없었다. 아주 조금만 움직여도 공격은 빗나갔다.<\/p>\n<p>‘움직임을 멈추지 않는 것…….’<\/p>\n<p>전서율은 무릎 위에서 손가락을 움직였다.<\/p>\n<p>챙!<\/p>\n<p>진하연이 마침내 검을 뽑았다. 세 명이 다시 달려들었다. 그녀는 한 사람의 공격을 비껴 지나가며 검을 들어 올리고, 그 움직임을 이어 두 번째 상대의 무기를 밀어냈다. 발을 돌리는 순간 검끝이 방향을 바꾸었다.<\/p>\n<p>스윽.<\/p>\n<p>세 번째 상대의 목 바로 앞에서 검이 멈췄다.<\/p>\n<p>“끝.”<\/p>\n<p>순간 정적이 흘렀다. 이내 환호가 터졌다.<\/p>\n<p>“진하연!” “저걸 어떻게 막냐!”<\/p>\n<p>윤태경은 자리에서 벌떡 일어났다.<\/p>\n<p>“와아! 미쳤다!”<\/p>\n<p>백소윤도 손뼉을 쳤다.<\/p>\n<p>“정말 대단하다…….”<\/p>\n<p>전서율 역시 손바닥이 얼얼해질 때까지 박수를 쳤다.<\/p>\n<p>“너 아까부터 그 말만 한다.” 윤태경이 웃었다.<\/p>\n<p>“그럴 만하잖아.”<\/p>\n<p>“그건 인정.”<\/p>\n<p>백소윤이 전서율을 살폈다.<\/p>\n<p>“서율아, 너 또 무슨 생각하고 있지?”<\/p>\n<p>“그냥…… 검이 꼭 정해진 순서대로만 움직여야 하는 건 아니구나 싶어서.”<\/p>\n<p>“난 그냥 엄청 강하다는 생각밖에 안 드는데.” 윤태경이 말했다.<\/p>\n<p>“그것도 맞지.”<\/p>\n<p>진하연은 사파 측 관람석과 교두들에게 손을 흔들었다. 정파 신입생들 사이에 앉은 전서율을 볼 이유는 없었다. 그의 존재도 알지 못했다.<\/p>\n<p>하지만 전서율은 그날 그녀의 이름을 기억했다.<\/p>\n<p><strong>진하연.<\/strong><\/p>\n<p>그리고 그녀가 보여 준 검의 움직임도.<\/p>\n<h3>5. 세 번째 깃발<\/h3>\n<p>시연이 끝나자 잠시 휴식이 주어졌다.<\/p>\n<p>“나 진짜 사파 쪽으로 갈 걸 그랬나?” 윤태경이 말했다.<\/p>\n<p>“아까는 정파 검기가 멋있다며.” 전서율이 웃었다.<\/p>\n<p>“둘 다 멋있어!”<\/p>\n<p>백소윤은 작은 주머니에서 과자를 꺼냈다.<\/p>\n<p>“먹을래?”<\/p>\n<p>“오, 먹을 거!” 윤태경이 냉큼 손을 뻗었다.<\/p>\n<p>“하나씩. 손부터 닦고.”<\/p>\n<p>“……엄마냐?”<\/p>\n<p>“싫으면 안 먹어도 돼.”<\/p>\n<p>“잘 먹겠습니다.”<\/p>\n<p>세 사람은 나란히 앉아 과자를 먹었다. 아직 만난 지 반나절도 되지 않았는데 어색하지 않았다.<\/p>\n<p>입관식 마지막 순서가 시작되었다. 단상 뒤로 세 번째 깃발이 펼쳐졌다. 검은 바탕 위에 낯선 문양이 새겨져 있었다.<\/p>\n<p>“마교잖아.” 누군가 속삭였다.<\/p>\n<p>마교. 정사 양측과는 다른 길을 걷는 세력. 그들은 무공의 경지에 끝이 없다고 믿으며 자신들이 말하는 순리를 좇는다고 알려져 있었다. 그러나 내부 사정은 거의 알려져 있지 않았다.<\/p>\n<p>“본 학관은 정파와 사파의 교류를 중심으로 운영되나, 무림의 다른 세력들과도 제한적인 교류 제도를 두고 있다. 그중 하나가 마교 파견 수련이다.”<\/p>\n<p>“마교?” 윤태경이 얼굴을 찌푸렸다.<\/p>\n<p>“그게 뭔데?” 전서율이 물었다.<\/p>\n<p>“학관에서 선발한 사람을 마교로 보내는 거래. 근데 돌아온 사람이 없다고 하던데.”<\/p>\n<p>“……아무도?”<\/p>\n<p>“적어도 내가 아는 한은. 그냥 소문일 수도 있고.”<\/p>\n<p>백소윤이 조용히 말했다.<\/p>\n<p>“확실하지 않은 이야기는 함부로 믿지 않는 게 좋겠어.”<\/p>\n<p>“그래도 무섭잖아.”<\/p>\n<p>“그건 그렇지.”<\/p>\n<p>전서율은 검은 깃발을 바라봤다. 정말 아무도 돌아오지 않았다면 이상한 일이었다. 무공을 배우러 갔다면 언젠가는 돌아와야 하지 않을까?<\/p>\n<p>‘뭔가 사정이 있겠지.’<\/p>\n<p>윤태경이 선언했다.<\/p>\n<p>“난 절대 안 갈 거야.”<\/p>\n<p>“누가 너 보낸대?” 전서율이 웃었다.<\/p>\n<p>“혹시 모르잖아! 난 정파 대표가 될 거니까.”<\/p>\n<p>“아까는 사파로 갈 걸 그랬다며.”<\/p>\n<p>“……너 오늘 나한테 왜 그러냐?”<\/p>\n<p>백소윤이 웃음을 터뜨렸다.<\/p>\n<p>단상 위에서 노인의 목소리가 이어졌다.<\/p>\n<p>“제군들은 앞으로 이곳에서 많은 것을 배우고, 많은 사람을 만날 것이다. 그리고 언젠가 각자의 길을 선택하게 될 것이다.”<\/p>\n<p>전서율은 그 말을 들으며 미소 지었다.<\/p>\n<p>‘재미있을 것 같아.’<\/p>\n<p>그는 순수하게 그렇게 생각했다.<\/p>\n<h3>6. 청운관으로 가는 길<\/h3>\n<p>입관식이 끝났을 때 해는 서쪽으로 기울고 있었다. 신입생들은 생활관 배정표를 확인하느라 분주했다.<\/p>\n<p>“전서율…… 아, 찾았다.”<\/p>\n<p>정파 초급 학도생. 제삼 수련반. 생활관은 청운관.<\/p>\n<p>“야, 너 어디야?” 윤태경이 물었다.<\/p>\n<p>“청운관.”<\/p>\n<p>“나도 청운관인데?”<\/p>\n<p>“오, 잘됐다.”<\/p>\n<p>백소윤도 명부를 훑었다.<\/p>\n<p>“나는 청운관 동편이네. 여학생 생활동이래.”<\/p>\n<p>“그럼 우리 셋 다 가까운 데서 지내겠네.” 전서율이 웃었다.<\/p>\n<p>윤태경이 손뼉을 쳤다.<\/p>\n<p>“좋아! 이 정도면 운명 아니냐?”<\/p>\n<p>“운명이라고 하기엔 그냥 같은 수련반 배정인데?”<\/p>\n<p>“야, 분위기 좀 맞춰 줘.”<\/p>\n<p>백소윤이 잠시 생각하는 척했다.<\/p>\n<p>“정말 놀라운 운명이네.”<\/p>\n<p>전서율이 웃음을 터뜨렸다. 윤태경은 한숨을 쉬었다.<\/p>\n<p>“……너희 둘, 나 놀리는 거지?”<\/p>\n<p>“아니.” “아니야.”<\/p>\n<p>두 사람의 대답이 겹쳤다.<\/p>\n<p>청운관으로 가는 길에 윤태경이 자신은 검술보다 도술을 좋아한다고 말했다.<\/p>\n<p>“검은 너무 얌전하잖아.”<\/p>\n<p>“아까 진하연 선배는 검을 썼는데?” 전서율이 물었다.<\/p>\n<p>“……그건 좀 다르지.”<\/p>\n<p>“태경이는 말이 자주 바뀌네.” 백소윤이 지적했다.<\/p>\n<p>“야!”<\/p>\n<p>전서율은 웃으며 물었다.<\/p>\n<p>“소윤이는 왜 학관에 왔어?”<\/p>\n<p>백소윤은 수첩을 내려다봤다.<\/p>\n<p>“내가 배운 무공이 정말 맞는지 확인하고 싶어서. 이론은 이해하는데 실전에서는 몸이 잘 안 따라주거든.”<\/p>\n<p>“나도 그래.” 전서율이 대답했다. “아직 검을 잘 못 써.”<\/p>\n<p>윤태경이 팔짱을 꼈다.<\/p>\n<p>“그럼 우리 셋 다 비슷한 수준이라는 거네. 좋아, 같이 강해지면 되겠다.”<\/p>\n<p>“괜찮네.”<\/p>\n<p>“응. 나도 좋아.” 백소윤이 미소 지었다.<\/p>\n<p>그 말은 대단한 맹세도 거창한 약속도 아니었다. 입관 첫날 만난 세 신입생이 나눈 평범한 대화였다.<\/p>\n<h3>7. 첫날의 저녁<\/h3>\n<p>청운관에 도착하자 윤태경이 두 팔을 벌렸다.<\/p>\n<p>“드디어 도착했다!”<\/p>\n<p>“남학생은 서편, 여학생은 동편이래.” 백소윤이 안내문을 읽었다.<\/p>\n<p>“그럼 저녁 먹을 때 다시 만나자.”<\/p>\n<p>“식당 위치는 알아?”<\/p>\n<p>전서율과 윤태경이 동시에 대답했다.<\/p>\n<p>“아니.” “몰라.”<\/p>\n<p>백소윤이 한숨을 쉬었다.<\/p>\n<p>“……내가 데리러 올게.”<\/p>\n<p>“역시 소윤이밖에 없다!”<\/p>\n<p>“고마워.” 전서율도 웃었다.<\/p>\n<p>그날 밤 세 사람은 다시 만나 식당에서 저녁을 먹었다. 윤태경은 반찬을 더 가져오겠다며 두 번이나 자리를 비웠고, 백소윤은 내일 수업 시간표를 정리했다. 전서율은 두 사람의 이야기를 들으며 밥을 먹었다.<\/p>\n<p>처음에는 그저 낯선 곳이었다. 산처럼 높은 누각도, 수많은 학도생도, 엄격한 교두도 모두 낯설었다. 하지만 이제는 조금 달랐다.<\/p>\n<p>적어도 함께 밥을 먹을 사람이 생겼으니까.<\/p>\n<p>“야, 우리 내일부터 진짜 열심히 하자.” 윤태경이 젓가락을 들었다.<\/p>\n<p>“응.” 백소윤이 고개를 끄덕였다.<\/p>\n<p>“좋아.” 전서율도 웃었다.<\/p>\n<p>“언젠가 우리 셋 다 강호에 이름을 떨치는 거야!”<\/p>\n<p>“그럼 태경이가 제일 먼저 유명해지겠네?” 백소윤이 말했다.<\/p>\n<p>“당연하지!”<\/p>\n<p>전서율이 덧붙였다.<\/p>\n<p>“말이 많아서?”<\/p>\n<p>“야, 전서율!”<\/p>\n<p>세 사람은 또다시 웃음을 터뜨렸다.<\/p>\n<p>식당 창밖으로 밤이 내려앉고 있었다. 청운관 처마 끝에는 작은 등불이 하나둘 밝혀졌다. 멀리 수련장에서 목검 부딪히는 소리가 들렸다.<\/p>\n<p>전서율은 아직 몰랐다.<\/p>\n<p>자신이 처음으로 발을 들인 이 학관을, 훗날 그토록 간절히 돌아오고 싶은 곳으로 기억하게 되리라는 사실을.<\/p>\n<p><strong>— 제1장 「입관」 끝.<\/strong><\/p>\n"}, {"n": 2, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제2장. 세 사람(三人)<\/h2>\n<blockquote>\n<p>라이트 노벨 원고 · 초고 v0.1 · 제1장 「입관」 직후<\/p>\n<\/blockquote>\n<h3>1. 청운관의 아침<\/h3>\n<p>전서율은 누군가 어깨를 흔드는 감각에 눈을 떴다.<\/p>\n<p>“일어나.”<\/p>\n<p>“조금만…….”<\/p>\n<p>“그 조금만이 벌써 세 번째거든?”<\/p>\n<p>침상 옆에는 윤태경이 서 있었다. 짙은 갈색 머리카락이 사방으로 뻗쳐 있었고, 청백색 제복의 앞섶은 비뚤어져 있었다.<\/p>\n<p>“태경아…… 왜?”<\/p>\n<p>“왜긴. 아침 먹으러 가야지. 무림에서 살아남으려면 가장 중요한 게 뭔지 아냐?”<\/p>\n<p>“무공?”<\/p>\n<p>“아니. 아침밥이다.”<\/p>\n<p>전서율은 이불을 머리끝까지 끌어올렸다.<\/p>\n<p>“다섯 분만 더 잘래.”<\/p>\n<p>그때 문밖에서 노크 소리가 들렸다.<\/p>\n<p>“서율아, 태경아. 일어났어?”<\/p>\n<p>백소윤이었다. 어깨 아래로 내려오는 흑갈색 머리카락을 단정하게 반쯤 묶었고, 맑은 갈색 눈에는 이른 아침인데도 졸음기가 없었다. 손에는 어제 보았던 작은 수첩이 들려 있었다.<\/p>\n<p>“서율아. 오늘 아침에 따뜻한 만두가 나온대. 늦으면 없을 수도 있다던데.”<\/p>\n<p>이불이 움직였다.<\/p>\n<p>“……만두?”<\/p>\n<p>전서율이 벌떡 일어났다.<\/p>\n<p>“씻고 올게.”<\/p>\n<p>“아니, 내가 그렇게 깨울 때는 안 일어나더니!”<\/p>\n<p>백소윤이 작게 웃었다.<\/p>\n<p>“역시 밥이 중요하긴 한가 봐.”<\/p>\n<p>청운관의 첫 아침은 그렇게 시작되었다.<\/p>\n<p>식당으로 향하는 회랑에는 밤새 맺힌 이슬이 반짝였다. 멀리 연무장에서는 벌써 목검이 부딪히는 소리가 들렸다.<\/p>\n<p>“우리도 내일부터 일찍 일어나서 수련할까?” 전서율이 물었다.<\/p>\n<p>윤태경은 잠시 침묵했다.<\/p>\n<p>“그건 아침 먹고 생각하자.”<\/p>\n<p>백소윤은 수첩을 펼쳤다.<\/p>\n<p>“오늘은 수련복 지급, 무기 점검, 기초 체력 측정, 오후에는 수련반 안내가 있어.”<\/p>\n<p>“그럼 만두는 언제 먹냐?”<\/p>\n<p>“지금.”<\/p>\n<p>“좋아!”<\/p>\n<p>윤태경이 앞장서 달리기 시작했지만 세 걸음도 못 가 백소윤에게 소매를 붙잡혔다.<\/p>\n<p>“반대쪽이야.”<\/p>\n<p>“……알고 있었어.”<\/p>\n<p>전서율은 웃음을 터뜨렸다. 어제부터 벌써 몇 번째인지 모를 말이었다.<\/p>\n<h3>2. 세 사람의 실력<\/h3>\n<p>오전의 기초 체력 측정은 예상보다 훨씬 고됐다.<\/p>\n<p>“헉…… 신입생 환영 행사 아니었냐……?”<\/p>\n<p>윤태경은 연무장 가장자리에 주저앉았다. 백소윤은 무릎에 손을 짚고 숨을 골랐다.<\/p>\n<p>“환영 행사라는 말은 아무도 안 했어.”<\/p>\n<p>전서율 역시 숨이 턱까지 차올라 있었다.<\/p>\n<p>세 사람 모두 뛰어난 성적을 내지 못했다. 윤태경은 단거리에서 선전했지만 지구력이 부족했다. 백소윤은 순서를 정확히 기억했지만 힘과 속도가 모자랐다. 전서율은 자세가 나쁘지 않았으나 움직일 때마다 생각이 많아 동작이 늦어졌다.<\/p>\n<p>오후에는 목검이 지급되었다.<\/p>\n<p>“드디어 진짜 무림인이다!”<\/p>\n<p>윤태경이 검을 어깨에 걸쳤다.<\/p>\n<p>“목검인데?” 백소윤이 물었다.<\/p>\n<p>“목검도 검이야.”<\/p>\n<p>윤태경은 자신 있게 휘둘렀다가 균형을 잃고 엉덩방아를 찧었다.<\/p>\n<p>“웃지 마.”<\/p>\n<p>“안 웃었어.”<\/p>\n<p>“입꼬리가 올라갔잖아!”<\/p>\n<p>백소윤이 먼저 웃음을 터뜨렸고, 전서율도 참지 못했다.<\/p>\n<p>기초 검술 측정은 세 가지 초식을 연결하는 시험이었다. 백소윤은 순서가 정확했으나 마지막 베기에서 손목이 흔들렸다. 윤태경은 힘은 좋았지만 세 번째 동작을 잊어버렸다.<\/p>\n<p>“여기서 다시 처음으로 돌아가면 안 됩니까?”<\/p>\n<p>“안 된다.”<\/p>\n<p>마지막은 전서율이었다. 그는 기본 초식을 따라 하다가 어제 보았던 정파 선배와 진하연의 움직임을 떠올렸다.<\/p>\n<p>'마지막에 발을 멈추지 않으면…….'<\/p>\n<p>발을 옮기는 타이밍이 늦었다. 목검이 어색하게 흔들렸다.<\/p>\n<p>“기본 초식에 집중해라. 아직 변형 동작을 시도할 단계가 아니다.”<\/p>\n<p>“……네.”<\/p>\n<p>담당 선배의 말은 틀리지 않았다. 전서율은 아직 기본조차 제대로 익히지 못했다. 그래도 작은 궁금증이 남았다.<\/p>\n<p>'언젠가는 할 수 있을까?'<\/p>\n<p>측정이 끝나자 윤태경이 말했다.<\/p>\n<p>“결론이 났네. 우리 셋 다 아직 멀었다는 거.”<\/p>\n<p>“그건 확실하네.” 전서율이 웃었다.<\/p>\n<p>“그럼 지금부터 시작하면 되지.”<\/p>\n<p>“지금?”<\/p>\n<p>“아직 해도 안 졌잖아.”<\/p>\n<p>백소윤도 고개를 끄덕였다. “나도 같이할게.”<\/p>\n<p>전서율은 목검을 다시 쥐었다. “그럼 나도.”<\/p>\n<h3>3. 셋이서 배우는 검<\/h3>\n<p>해가 서쪽으로 기울 무렵 연무장에는 세 사람만 남아 있었다.<\/p>\n<p>“열.” 윤태경이 목검을 내렸다.<\/p>\n<p>“아홉 번이야.” 백소윤이 말했다.<\/p>\n<p>“뭐?”<\/p>\n<p>“여섯 다음에 바로 여덟이라고 했어.”<\/p>\n<p>“……그런 것까지 세고 있었냐?”<\/p>\n<p>전서율은 웃다가 자신의 목검을 들었다. 백소윤은 그의 자세를 살폈다.<\/p>\n<p>“서율아, 오른쪽 어깨가 조금 올라갔어.”<\/p>\n<p>“여기?”<\/p>\n<p>“응. 힘을 너무 주는 것 같아.”<\/p>\n<p>전서율이 어깨를 내리고 다시 검을 휘두르자 조금 더 편해졌다.<\/p>\n<p>“오. 진짜네.”<\/p>\n<p>“나도 봐 줘.” 윤태경이 끼어들었다.<\/p>\n<p>“태경이는 검을 너무 크게 휘둘러. 빈틈이 커져.”<\/p>\n<p>“크게 휘두르면 강한 줄 알았는데.”<\/p>\n<p>윤태경이 동작을 줄이자 백소윤이 고개를 끄덕였다.<\/p>\n<p>“훨씬 나아.”<\/p>\n<p>“역시 소윤 선생님.”<\/p>\n<p>“선생님은 무슨.”<\/p>\n<p>“아니, 진짜로. 너 설명 잘한다.”<\/p>\n<p>백소윤의 귀 끝이 조금 붉어졌다.<\/p>\n<p>“그런데 정작 나는 잘 못하잖아.”<\/p>\n<p>“그건 앞으로 연습하면 되지.” 전서율이 말했다. “네가 우리 자세를 봐 주고, 우리는 네 수련을 도와주면 되잖아.”<\/p>\n<p>“그럼 나는 뭘 하면 되냐?” 윤태경이 물었다.<\/p>\n<p>전서율은 잠시 생각했다. “분위기 담당?”<\/p>\n<p>“야!”<\/p>\n<p>세 사람의 목검이 다시 움직였다. 동작은 서툴렀고 자세도 자주 무너졌다. 그런데 혼자 수련할 때보다 덜 힘들었다. 누군가 실수하면 함께 웃었고, 잘되면 서로 칭찬했다.<\/p>\n<p>수련을 마치고 윤태경은 연무장 바닥에 대자로 누웠다.<\/p>\n<p>“나 죽는다.”<\/p>\n<p>“죽을 정도는 아니잖아.”<\/p>\n<p>“내 팔이 안 움직여.”<\/p>\n<p>전서율이 그의 팔을 살짝 건드렸다.<\/p>\n<p>“이건 움직이는데?”<\/p>\n<p>“아악! 건드리지 마!”<\/p>\n<p>세 사람은 웃다가 한동안 붉어진 하늘을 바라봤다.<\/p>\n<p>“그런데 오늘 재미있지 않았어?” 전서율이 물었다. “혼자였으면 중간에 그만뒀을 것 같아.”<\/p>\n<p>백소윤이 고개를 끄덕였다. “나도.”<\/p>\n<p>윤태경은 몸을 일으켰다.<\/p>\n<p>“그럼 내일도 할까?”<\/p>\n<p>“좋아.”<\/p>\n<p>“응. 나도.”<\/p>\n<p>윤태경이 손을 내밀었다. 전서율이 그 위에 손을 올렸고, 백소윤도 잠시 망설이다 손을 포갰다.<\/p>\n<p>“내일도.”<\/p>\n<p>“내일도.”<\/p>\n<p>“그리고 모레도!”<\/p>\n<p>“모레는 쉬면 안 돼?”<\/p>\n<p>“야, 전서율!”<\/p>\n<p>그날 세 사람은 처음으로 함께할 내일을 정했다.<\/p>\n<h3>4. 백소윤의 수첩<\/h3>\n<p>며칠이 지나자 학관의 일상은 빠르게 익숙해졌다. 윤태경은 아침마다 전서율을 깨웠고, 백소윤은 두 사람이 길을 잃지 않도록 수업 장소를 확인했다. 식사 시간에는 자연스럽게 같은 자리에 앉았다.<\/p>\n<p>어느 날 저녁 윤태경이 백소윤의 수첩을 가리켰다.<\/p>\n<p>“그거 좀 보여 줘. 내가 어떻게 적혀 있는지 궁금해서.”<\/p>\n<p>“싫어. 개인적인 내용도 있거든.”<\/p>\n<p>“그럼 내 이름 적힌 부분만!”<\/p>\n<p>“그것도 싫어.”<\/p>\n<p>“서율아, 너도 궁금하지?”<\/p>\n<p>“궁금하긴 한데, 싫다잖아.”<\/p>\n<p>“너는 왜 맨날 저쪽 편이냐?”<\/p>\n<p>백소윤은 웃더니 한 페이지만 펼쳐 보였다.<\/p>\n<p><strong>전서율 — 궁금한 것이 많음. 남의 말을 잘 듣고, 가끔 엉뚱한 생각을 함.<\/strong><\/p>\n<p><strong>윤태경 — 말이 많음. 겁이 없다고 주장하지만 의외로 잘 놀람. 그래도 먼저 나서는 편.<\/strong><\/p>\n<p><strong>백소윤 — 아직 부족한 것이 많음. 조금 더 용감해질 것.<\/strong><\/p>\n<p>“겁이 없다고 주장하지만?” 윤태경이 항의했다.<\/p>\n<p>“어제 창고에서 쥐 보고 소리 지른 건 누구였지?”<\/p>\n<p>“갑자기 튀어나왔잖아!”<\/p>\n<p>전서율은 웃다가 마지막 줄을 가리켰다.<\/p>\n<p>“소윤아. 조금 더 용감해진다는 건 무슨 뜻이야?”<\/p>\n<p>백소윤은 손끝으로 종이 모서리를 만졌다.<\/p>\n<p>“나는 자꾸 망설이거든. 틀릴까 봐 걱정하다가 결국 아무것도 못 할 때가 있어.”<\/p>\n<p>윤태경은 평소와 달리 장난치지 않았다.<\/p>\n<p>“그럴 수도 있지. 나도 실수하잖아.”<\/p>\n<p>“태경이는 실수를 너무 많이 하는 것 같은데.”<\/p>\n<p>“그건 굳이 말 안 해도 되거든?”<\/p>\n<p>전서율은 웃으며 말했다.<\/p>\n<p>“그럼 다음에 무서우면 우리한테 먼저 말해. 같이 해 보자고.”<\/p>\n<p>“……뭐라고?”<\/p>\n<p>“우리도 잘하는 건 없잖아. 그러니까 같이 실수하면 되지.”<\/p>\n<p>윤태경이 손뼉을 쳤다.<\/p>\n<p>“좋아! 실수라면 내가 전문이거든.”<\/p>\n<p>“그건 자랑이 아니라니까.”<\/p>\n<p>그날 백소윤은 수첩 마지막 줄 아래에 문장을 하나 더 적었다.<\/p>\n<p><em>혼자 하지 않아도 된다.<\/em><\/p>\n<p>두 사람에게 보여 주지는 않았다.<\/p>\n<h3>5. 서율의 이상한 검<\/h3>\n<p>며칠 뒤, 전서율은 수련이 끝난 연무장에 남아 목검을 들었다.<\/p>\n<p>기본 초식의 마지막 동작. 발을 멈추고 검을 내리치는 자세.<\/p>\n<p>그는 검을 거두지 않았다. 대신 왼발을 옆으로 옮기고, 허리를 돌려 내려간 검을 다시 들어 올리려 했다.<\/p>\n<p>휙.<\/p>\n<p>몸의 중심이 무너졌다.<\/p>\n<p>“……또 실패네.”<\/p>\n<p>“야, 너 아까부터 뭐 하냐?” 윤태경이 다가왔다.<\/p>\n<p>백소윤도 그의 발밑을 바라봤다. “기본 초식이랑 조금 다른데?”<\/p>\n<p>“응. 내려친 다음에 멈추지 않고 다음 동작으로 넘어가면 어떨까 싶어서.”<\/p>\n<p>“왜?” 윤태경이 물었다.<\/p>\n<p>“상대는 내가 자세를 다시 잡을 때까지 기다려 주지 않잖아.”<\/p>\n<p>백소윤이 조용히 물었다.<\/p>\n<p>“계속 움직이면서 공격하고 싶다는 거야?”<\/p>\n<p>“응. 그런 느낌.”<\/p>\n<p>전서율은 다시 목검을 휘둘렀다. 검은 오른쪽으로 돌아가는데 발은 왼쪽으로 향했다. 손목이 비틀리며 목검이 바닥에 떨어졌다.<\/p>\n<p>“방금은 검이 움직이는 방향이랑 발이 움직이는 방향이 달랐어.” 백소윤이 말했다.<\/p>\n<p>“그랬어?”<\/p>\n<p>전서율은 다시 자세를 잡았다. 이번에는 발을 조금 늦게 옮겼다. 검을 내려치고, 허리를 돌린 다음, 몸의 움직임을 따라 목검을 끌어올렸다.<\/p>\n<p>휙.<\/p>\n<p>“어?”<\/p>\n<p>윤태경의 눈이 커졌다. “오. 방금은 좀 괜찮았는데?”<\/p>\n<p>그러나 세 번째 동작에서 또 균형을 잃었다.<\/p>\n<p>“역시 아직 멀었네.”<\/p>\n<p>“그러게.” 전서율도 웃었다. “그래도 방금은 됐잖아.”<\/p>\n<p>아직 무공이라고 부를 만한 것은 아니었다. 제대로 된 초식도, 이름도 없었다. 그저 생각하던 움직임을 잠깐 성공했을 뿐이었다. 그래도 전서율은 기뻤다.<\/p>\n<p>윤태경이 그의 어깨를 툭 쳤다.<\/p>\n<p>“나중에 진짜 검술이 되면 나한테도 알려 줘. 내가 첫 번째 제자 해 줄게.”<\/p>\n<p>“아직 그런 것도 아닌데.”<\/p>\n<p>백소윤이 고개를 저었다.<\/p>\n<p>“태경이는 기본 초식부터 제대로 해야지.”<\/p>\n<p>“아니, 그건 또 왜!”<\/p>\n<p>웃음이 잦아들자 백소윤이 말했다.<\/p>\n<p>“그래도 서율아, 계속해 봐.”<\/p>\n<p>“왜?”<\/p>\n<p>“궁금하잖아. 네가 생각하는 검술이 어떤 모습일지.”<\/p>\n<p>전서율은 잠시 목검을 내려다봤다.<\/p>\n<p>“……응. 나도 궁금해.”<\/p>\n<h3>6. 내일도 함께<\/h3>\n<p>저녁 종이 울렸다. 세 사람은 연무장을 정리하고 청운관으로 돌아갔다.<\/p>\n<p>“서율아. 아까 하던 거, 내일도 할 거야?” 백소윤이 물었다.<\/p>\n<p>“아마도.”<\/p>\n<p>“그럼 내가 동작을 봐 줄게.”<\/p>\n<p>윤태경이 끼어들었다. “나는?”<\/p>\n<p>“태경이는 옆에서 기본 초식 연습.”<\/p>\n<p>“또 나만!”<\/p>\n<p>“너도 같이 보면 되잖아.” 전서율이 웃었다.<\/p>\n<p>세 사람은 웃으며 회랑을 걸었다. 청운관의 처마 끝에서는 저녁 등불이 하나둘 켜지고 있었다.<\/p>\n<p>그날도 특별한 일은 없었다. 누군가 강호에 이름을 떨친 것도, 놀라운 무공을 완성한 것도 아니었다.<\/p>\n<p>세 사람은 여전히 평범한 신입 학도생이었다. 서툴렀고, 실수도 많았으며, 배워야 할 것은 셀 수 없이 많았다.<\/p>\n<p>그러나 전서율은 하루가 짧게 느껴졌다.<\/p>\n<p>아침에 눈을 뜨면 윤태경이 찾아왔다. 식당에 가면 백소윤이 기다리고 있었다. 수련하다 실패하면 두 사람이 웃었다. 다시 시도하면 두 사람은 지켜봐 주었다.<\/p>\n<p>'내일은 오늘보다 조금 더 잘할 수 있겠지.'<\/p>\n<p>그것만으로 충분했다.<\/p>\n<p>“야! 빨리 와! 오늘 저녁에 고기 나온대!” 윤태경이 소리쳤다.<\/p>\n<p>“또 밥 이야기야?” 백소윤이 웃었다.<\/p>\n<p>“밥이 중요하다니까!”<\/p>\n<p>“기다려!”<\/p>\n<p>전서율은 두 사람을 향해 걸음을 재촉했다.<\/p>\n<p>아직 세 사람에게는 시간이 많았다. 함께 웃을 날도, 서로의 실수를 놀릴 날도, 같은 연무장에 설 날도.<\/p>\n<p>적어도 그때는 그렇게 믿었다.<\/p>\n<p>그리고 그 믿음이 있었기에, 전서율은 이곳을 조금씩 자신의 집처럼 여기기 시작했다.<\/p>\n<p><strong>— 제2장 「세 사람」 끝.<\/strong><\/p>\n"}, {"n": 3, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제3장. 정파의 가르침<\/h2>\n<blockquote>\n<p>라이트 노벨 초고 v0.1 · 제2장 직후 · 확정 전<\/p>\n<\/blockquote>\n<h3>1. 검을 쥐는 이유<\/h3>\n<p>“정파의 검은 어디를 향해야 하느냐?”<\/p>\n<p>질문이 떨어지자 강당 안이 조용해졌다.<\/p>\n<p>교두는 길고 가느다란 지시봉으로 칠판을 두드렸다. 칠판에는 큼지막하게 세 글자가 적혀 있었다.<\/p>\n<p><strong>수신(修身).<\/strong><\/p>\n<p>“누가 답해 보겠느냐?”<\/p>\n<p>앞줄의 한 학도생이 손을 들었다.<\/p>\n<p>“사악한 무리를 베고 약한 자를 지키기 위함입니다.”<\/p>\n<p>“틀리지 않다.”<\/p>\n<p>교두가 고개를 끄덕였다.<\/p>\n<p>“그러나 남을 지키겠다는 자가 제 몸과 마음 하나 다스리지 못한다면, 그 검이 과연 올바르게 쓰이겠느냐? 정파 무학의 첫걸음은 자신을 닦는 것이다.”<\/p>\n<p>전서율은 고개를 끄덕이며 필기했다.<\/p>\n<p>그 옆에서 윤태경이 입을 가리고 하품했다.<\/p>\n<p>“하아암…….”<\/p>\n<p>백소윤이 팔꿈치로 그의 옆구리를 찔렀다.<\/p>\n<p>“태경아.”<\/p>\n<p>“안 잤어.”<\/p>\n<p>“눈 감고 있었잖아.”<\/p>\n<p>“정신을 집중한 거야.”<\/p>\n<p>“그럼 방금 교두님이 뭐라고 하셨는데?”<\/p>\n<p>윤태경은 잠시 입을 다물었다.<\/p>\n<p>“……검을 잘 쓰자?”<\/p>\n<p>백소윤은 말없이 자신의 필기장을 그쪽으로 밀어 주었다.<\/p>\n<p>전서율은 웃음을 참느라 고개를 숙였다.<\/p>\n<p>입관한 지 열흘 남짓. 세 사람은 이제 같은 자리에 앉는 것이 자연스러워졌다. 아침에는 함께 식당으로 갔고, 수업이 끝나면 연무장에서 목검을 휘둘렀다. 윤태경은 여전히 수업보다 실전을 좋아했고, 백소윤의 수첩에는 하루가 다르게 빽빽한 글씨가 늘어 갔다.<\/p>\n<p>그리고 전서율에게는 한 가지 버릇이 생겼다.<\/p>\n<p>설명을 들을수록 궁금한 것이 많아지는 버릇이었다.<\/p>\n<p>“검을 쥔 자는 예를 지켜야 한다.”<\/p>\n<p>교두가 말을 이었다.<\/p>\n<p>“예는 약함의 표시가 아니다. 상대를 얕보지 않으며 자신의 검에 책임을 지겠다는 뜻이다.”<\/p>\n<p>전서율은 그 말을 마음에 새겼다.<\/p>\n<p>어릴 적 배운 가르침과도 같았다. 강자가 약자를 함부로 해치지 않는 것. 힘이 있다고 해서 마음대로 휘두르지 않는 것.<\/p>\n<p>그는 그런 정파의 도리가 좋았다.<\/p>\n<p>다만 칠판 한쪽에 그려진 검로(劍路)를 보자 또 다른 생각이 떠올랐다.<\/p>\n<p>교두는 일곱 개의 동작을 선으로 이어 놓았다. 각 동작은 분명한 시작과 끝을 가지고 있었다.<\/p>\n<p>전서율은 그 선을 한참 바라봤다.<\/p>\n<p>'여기서 다음 선으로 바로 이어지면 안 되는 걸까?'<\/p>\n<p>그가 손을 들었다.<\/p>\n<p>“교두님, 질문이 있습니다.”<\/p>\n<p>“말해 보거라.”<\/p>\n<p>“초식의 끝에서 자세를 다시 잡는 이유가 궁금합니다.”<\/p>\n<p>“다음 공격을 위한 중심을 바로잡기 위해서다.”<\/p>\n<p>“그럼 중심을 잃지 않는다면, 자세를 완전히 멈추지 않고 다음 초식으로 이어도 되는 겁니까?”<\/p>\n<p>교두의 지시봉이 멈췄다.<\/p>\n<p>주변 학생 몇 명이 고개를 돌렸다.<\/p>\n<p>“무슨 뜻이냐?”<\/p>\n<p>전서율은 당황했지만 차근차근 설명했다.<\/p>\n<p>“검을 내리친 뒤 다시 거두는 대신, 내려가는 힘을 이용해서 방향을 바꾸는 겁니다. 그러면 움직임이 끊기는 시간을 줄일 수 있지 않을까 해서요.”<\/p>\n<p>교두는 잠시 그를 바라봤다.<\/p>\n<p>“이름이 무엇이지?”<\/p>\n<p>“전서율입니다.”<\/p>\n<p>“전서율. 지금 가르치는 것은 정파의 기초 검식이다. 수많은 선대가 다듬어 전해 온 형이지.”<\/p>\n<p>“네.”<\/p>\n<p>“형을 제대로 익히기도 전에 그 이유를 의심하는 것은 순서가 잘못되었다.”<\/p>\n<p>전서율은 곧장 고개를 숙였다.<\/p>\n<p>“죄송합니다. 의심하려던 것은 아니고…….”<\/p>\n<p>“그렇다면 우선 배운 대로 익혀라. 변화를 논하는 것은 그다음이다.”<\/p>\n<p>“알겠습니다.”<\/p>\n<p>전서율은 손을 내렸다.<\/p>\n<p>교두의 설명이 아주 틀렸다고 생각하지는 않았다. 자신은 아직 기본 초식조차 서툴렀다. 다만 질문에 대한 답을 모두 들은 것 같지는 않았다.<\/p>\n<p>뒤편에서 누군가 낮게 웃었다.<\/p>\n<p>“기초도 못 하는 게 벌써 무공을 고치겠대.”<\/p>\n<p>“대단한 천재 납셨네.”<\/p>\n<p>전서율은 못 들은 척 칠판을 바라봤다.<\/p>\n<p>그때 옆에서 윤태경이 작게 중얼거렸다.<\/p>\n<p>“질문 하나 했다고 별소리를 다 하네.”<\/p>\n<p>백소윤은 수첩의 여백에 짧게 적었다.<\/p>\n<p><em>검로를 끊지 않는 방법 — 서율의 질문.<\/em><\/p>\n<p>그리고 그 아래에 작은 물음표를 그렸다.<\/p>\n<h3>2. 정해진 길<\/h3>\n<p>오후 수업은 실기였다.<\/p>\n<p>제삼 수련반의 학도생들은 연무장에 두 줄로 섰다. 교두의 지시에 맞춰 목검을 들고 같은 동작을 반복했다.<\/p>\n<p>“일식, 전진!”<\/p>\n<p>“하!”<\/p>\n<p>“이식, 회수!”<\/p>\n<p>“하!”<\/p>\n<p>“삼식, 하단 베기!”<\/p>\n<p>목검 수십 자루가 한꺼번에 허공을 갈랐다.<\/p>\n<p>전서율은 손목의 각도를 살폈다. 발을 멈추고, 검을 거두고, 다시 내리쳤다.<\/p>\n<p>이번에는 수업 시간에 질문했던 것을 떠올리지 않으려 애썼다.<\/p>\n<p>'우선 제대로 익히자.'<\/p>\n<p>그런데 머리로 이해하는 것과 몸으로 해내는 것은 달랐다.<\/p>\n<p>“전서율!”<\/p>\n<p>교두의 목소리에 그가 움찔했다.<\/p>\n<p>“검끝이 처졌다. 다시.”<\/p>\n<p>“네!”<\/p>\n<p>“윤태경! 기합만 크다고 검이 강해지는 것은 아니다!”<\/p>\n<p>“……네!”<\/p>\n<p>뒤에서 웃음이 터졌다.<\/p>\n<p>윤태경은 얼굴을 붉혔다. 그래도 다음 동작에서는 다시 누구보다 크게 기합을 넣었다.<\/p>\n<p>백소윤은 순서를 틀리지 않았지만 팔이 금세 떨렸다.<\/p>\n<p>“백소윤, 어깨 힘을 빼라.”<\/p>\n<p>“네.”<\/p>\n<p>“몸으로 익혀야 할 것을 머리로만 붙잡지 마라.”<\/p>\n<p>“알겠습니다.”<\/p>\n<p>세 사람은 각자 다른 이유로 여러 번 지적을 받았다.<\/p>\n<p>수련이 끝나자 윤태경은 목검을 내려놓으며 한숨을 쉬었다.<\/p>\n<p>“아, 오늘은 진짜 팔이 떨어지는 줄 알았다.”<\/p>\n<p>백소윤이 말했다.<\/p>\n<p>“아직 붙어 있네.”<\/p>\n<p>“그런 뜻이 아니잖아.”<\/p>\n<p>전서율은 두 사람을 보며 웃었다.<\/p>\n<p>그때 가까운 곳에서 낯선 목소리가 들렸다.<\/p>\n<p>“너, 아까 강당에서 질문한 애지?”<\/p>\n<p>세 사람이 돌아봤다.<\/p>\n<p>깔끔한 제복을 입은 남학생 둘이 서 있었다. 앞선 학생은 남궁세가의 자제 남궁현우였다. 허리에는 남궁가의 문장이 수놓인 장식이 달려 있었다.<\/p>\n<p>“네가 만든 검술이라도 있나 봐?”<\/p>\n<p>전서율이 대답했다.<\/p>\n<p>“아니. 그냥 궁금해서 물어본 거야.”<\/p>\n<p>“그럼 교두님 말씀부터 잘 듣지 그래.”<\/p>\n<p>“듣고 있어.”<\/p>\n<p>“말대꾸는 잘하네.”<\/p>\n<p>윤태경이 한 걸음 앞으로 나섰다.<\/p>\n<p>“질문한 게 말대꾸야?”<\/p>\n<p>상대가 그를 훑어봤다.<\/p>\n<p>“넌 또 뭐냐?”<\/p>\n<p>“같은 반 동기.”<\/p>\n<p>“그래서?”<\/p>\n<p>“그래서 그냥 물어본 건데.”<\/p>\n<p>순간 분위기가 딱딱해졌다.<\/p>\n<p>백소윤이 윤태경의 소매를 가볍게 잡았다.<\/p>\n<p>“태경아. 가자.”<\/p>\n<p>전서율도 고개를 끄덕였다.<\/p>\n<p>“응. 수련 끝났으니까.”<\/p>\n<p>그는 상대에게 가볍게 예를 갖췄다.<\/p>\n<p>“먼저 가 보겠습니다.”<\/p>\n<p>상대는 대꾸하지 않았다.<\/p>\n<p>세 사람이 멀어지자 뒤에서 낮은 웃음이 들렸다.<\/p>\n<p>“별 이상한 것들이 다 들어왔네.”<\/p>\n<p>윤태경의 발걸음이 멈췄다.<\/p>\n<p>“야, 방금 들었지?”<\/p>\n<p>전서율이 말했다.<\/p>\n<p>“들었어.”<\/p>\n<p>“그런데 그냥 가?”<\/p>\n<p>“싸울 일은 아니잖아.”<\/p>\n<p>“기분 나쁘잖아!”<\/p>\n<p>“응. 조금.”<\/p>\n<p>전서율은 솔직하게 인정했다.<\/p>\n<p>“그래도 저 사람들한테 잘 보이려고 학관에 온 건 아니니까.”<\/p>\n<p>윤태경은 잠시 그를 바라봤다.<\/p>\n<p>그러더니 툴툴거렸다.<\/p>\n<p>“……그렇게 말하면 내가 괜히 성질 급한 놈 같잖아.”<\/p>\n<p>백소윤이 조용히 덧붙였다.<\/p>\n<p>“조금은 맞아.”<\/p>\n<p>“소윤아!”<\/p>\n<p>전서율이 웃었다.<\/p>\n<p>세 사람은 다시 청운관 쪽으로 걸었다. 하지만 전서율은 아까 들은 말을 완전히 잊지는 못했다.<\/p>\n<p>질문을 하는 것과 예의를 지키지 않는 것은 정말 같은 일일까.<\/p>\n<p>그는 그 차이를 아직 잘 알 수 없었다.<\/p>\n<h3>3. 다른 쪽의 대답<\/h3>\n<p>며칠 뒤, 정사 합동 무학 강론이 열렸다.<\/p>\n<p>정파와 사파의 초급 학도생이 한 강당에 모여 무공의 기초 원리를 듣는 수업이었다.<\/p>\n<p>“사파 애들도 같이 듣는대.”<\/p>\n<p>윤태경이 의자에 앉으며 속삭였다.<\/p>\n<p>“그러네.”<\/p>\n<p>전서율은 반대편 좌석을 바라봤다.<\/p>\n<p>사파 학도생들은 정파 쪽보다 조금 자유로운 분위기였다. 제복의 매무새도 제각각이었고, 서로 농담을 주고받는 소리도 끊이지 않았다.<\/p>\n<p>그들 사이에 낯익은 얼굴이 보였다.<\/p>\n<p>진하연이었다.<\/p>\n<p>전서율은 저도 모르게 시선을 멈췄다.<\/p>\n<p>입관식 날 비무대에서 세 명을 상대로 웃으며 검을 휘두르던 사람.<\/p>\n<p>오늘은 검을 무릎 옆에 세워 두고 친구들과 이야기를 나누고 있었다.<\/p>\n<p>“서율아, 뭐 봐?”<\/p>\n<p>백소윤이 물었다.<\/p>\n<p>“아. 저기 진하연 선배.”<\/p>\n<p>윤태경이 고개를 홱 돌렸다.<\/p>\n<p>“어디?”<\/p>\n<p>“저쪽.”<\/p>\n<p>“오, 진짜네.”<\/p>\n<p>윤태경은 작은 목소리로 말했다.<\/p>\n<p>“오늘도 시연하면 좋겠다.”<\/p>\n<p>백소윤이 웃었다.<\/p>\n<p>“강론이잖아. 시연은 없을걸?”<\/p>\n<p>전서율은 다시 정면을 바라봤다.<\/p>\n<p>진하연은 그가 자신을 보고 있었다는 사실조차 몰랐다.<\/p>\n<p>잠시 후 교두가 강단에 올라왔다.<\/p>\n<p>“오늘은 초식과 변화에 대해 논하겠다.”<\/p>\n<p>칠판에는 원과 직선이 나란히 그려졌다.<\/p>\n<p>“정해진 형은 왜 필요한가? 그 형을 언제 바꾸어야 하는가? 정파와 사파가 서로 다른 답을 내놓는 지점이 바로 여기에 있다.”<\/p>\n<p>전서율의 눈이 반짝였다.<\/p>\n<p>'이거다.'<\/p>\n<p>교두는 먼저 정파의 설명을 이어 갔다.<\/p>\n<p>“초식은 위험한 순간에도 몸이 흔들리지 않도록 만들어진 약속이다. 충분히 익힌 형은 생각보다 먼저 움직인다.”<\/p>\n<p>전서율은 고개를 끄덕였다.<\/p>\n<p>그 말은 이해할 수 있었다.<\/p>\n<p>“그러나 상대가 그 약속을 벗어나는 순간, 어떻게 해야 할까?”<\/p>\n<p>이번에는 사파 쪽에서 손이 올라왔다.<\/p>\n<p>“그때는 형을 버려야죠.”<\/p>\n<p>강당 곳곳에서 웃음이 났다.<\/p>\n<p>교두도 희미하게 미소 지었다.<\/p>\n<p>“버린다. 간단하구나. 그렇다면 무엇을 남기지?”<\/p>\n<p>“상대의 움직임과 내 몸의 중심이요.”<\/p>\n<p>“좋다.”<\/p>\n<p>전서율은 무릎 위에 손가락을 얹었다.<\/p>\n<p>자신이 계속 생각하던 것이었다.<\/p>\n<p>그는 잠시 망설이다가 손을 들었다.<\/p>\n<p>“질문 있습니다.”<\/p>\n<p>교두가 그를 가리켰다.<\/p>\n<p>“말해 보거라.”<\/p>\n<p>“형을 익히는 이유가 중심을 잃지 않기 위해서라면, 형을 끝까지 완성하는 것보다 중심을 유지하면서 다음 움직임으로 이어 가는 게 더 나은 상황도 있습니까?”<\/p>\n<p>강당이 조용해졌다.<\/p>\n<p>전서율은 말을 조금 더 보탰다.<\/p>\n<p>“예를 들어 내려치는 검을 굳이 멈추지 않고, 상대의 회피 방향을 따라 돌려서 다시 올리는 식으로요. 아직 해 보니까 잘 안 되긴 하는데…….”<\/p>\n<p>뒤쪽 정파 좌석에서 누군가 작게 비웃었다.<\/p>\n<p>“또 저놈이네.”<\/p>\n<p>그러나 교두는 곧바로 꾸짖지 않았다.<\/p>\n<p>“가능은 하다.”<\/p>\n<p>전서율의 표정이 밝아졌다.<\/p>\n<p>“정말입니까?”<\/p>\n<p>“하지만 쉽지 않다. 끊지 않는다는 말은 무작정 이어 붙인다는 뜻이 아니다. 힘을 어디서 빼고, 어디서 다시 실을지 모르면 흐름이 아니라 빈틈이 된다.”<\/p>\n<p>“아…….”<\/p>\n<p>“형을 익히는 자는 돌아올 자리를 안다. 변화를 익히는 자는 그 자리로 돌아오지 않아도 중심을 지키는 법을 배워야 한다.”<\/p>\n<p>전서율은 한동안 말을 잇지 못했다.<\/p>\n<p>그가 찾고 있던 답의 일부가 눈앞에 나타난 듯했다.<\/p>\n<p>“감사합니다.”<\/p>\n<p>그는 진심으로 고개를 숙였다.<\/p>\n<p>그때 사파 쪽에서 낮은 웃음소리가 들렸다.<\/p>\n<p>“저런 질문도 하네.”<\/p>\n<p>“재미있는데?”<\/p>\n<p>진하연은 턱을 괴고 강단 쪽을 바라보고 있었다.<\/p>\n<p>그녀가 방금 질문한 정파 학도생의 얼굴을 유심히 살핀 것은 아니었다. 다만 질문 자체가 조금 마음에 걸렸다.<\/p>\n<p>'검을 멈추지 않고 이어 간다라.'<\/p>\n<p>생각만큼 간단하지 않은 이야기였다.<\/p>\n<p>하지만 적어도 엉뚱한 질문은 아니었다.<\/p>\n<p>진하연은 옆자리 친구에게 작게 말했다.<\/p>\n<p>“저거, 직접 해 보려면 꽤 넘어지겠는데?”<\/p>\n<p>친구가 피식 웃었다.<\/p>\n<p>“왜, 네가 가르쳐 주려고?”<\/p>\n<p>“아니.”<\/p>\n<p>진하연은 가볍게 웃었다.<\/p>\n<p>“그냥 얼마나 넘어질지 궁금해서.”<\/p>\n<p>그녀의 관심은 그 정도였다.<\/p>\n<p>전서율이라는 이름도, 그가 어떤 사람인지도 아직 알지 못했다.<\/p>\n<h3>4. 같은 질문, 다른 표정<\/h3>\n<p>강론이 끝난 뒤 세 사람은 강당을 나섰다.<\/p>\n<p>윤태경이 전서율의 등을 가볍게 쳤다.<\/p>\n<p>“야, 오늘은 대답 제대로 들었네!”<\/p>\n<p>“응.”<\/p>\n<p>전서율은 조금 들떠 있었다.<\/p>\n<p>“중심을 지키면서 이어 가야 한다는 거잖아. 그냥 검만 돌린다고 되는 게 아니고.”<\/p>\n<p>백소윤이 수첩을 펼쳤다.<\/p>\n<p>“교두님 말씀 적어 놨어. 필요하면 보여 줄게.”<\/p>\n<p>“고마워.”<\/p>\n<p>“그런데 서율아.”<\/p>\n<p>“응?”<\/p>\n<p>“아까 질문하기 전에 엄청 망설였지?”<\/p>\n<p>전서율은 잠시 멈췄다.<\/p>\n<p>“……티 났어?”<\/p>\n<p>“조금.”<\/p>\n<p>윤태경이 인상을 찌푸렸다.<\/p>\n<p>“지난번에 이상한 소리 들었으니까 그렇지.”<\/p>\n<p>전서율은 웃으려다 말았다.<\/p>\n<p>“질문하는 게 그렇게 잘못된 일인가 싶었어.”<\/p>\n<p>백소윤은 곧바로 대답하지 않았다.<\/p>\n<p>잠시 후 그녀가 말했다.<\/p>\n<p>“질문 자체가 잘못은 아니라고 생각해.”<\/p>\n<p>“그래?”<\/p>\n<p>“응. 다만 어떤 교두님은 먼저 따라 해 보길 바라시는 거겠지.”<\/p>\n<p>윤태경이 덧붙였다.<\/p>\n<p>“그리고 어떤 애들은 그냥 남이 눈에 띄는 게 싫은 거고.”<\/p>\n<p>전서율은 두 사람을 바라봤다.<\/p>\n<p>“너희는 내 질문이 이상하지 않아?”<\/p>\n<p>윤태경은 잠시 고민하는 표정을 지었다.<\/p>\n<p>“이상하긴 해.”<\/p>\n<p>“…….”<\/p>\n<p>“아니, 네가 맨날 남들은 생각도 안 하는 걸 궁금해하잖아.”<\/p>\n<p>그는 어깨를 으쓱했다.<\/p>\n<p>“근데 그게 뭐 어때서?”<\/p>\n<p>백소윤도 고개를 끄덕였다.<\/p>\n<p>“나도 가끔은 이해가 안 돼. 그래도 같이 생각해 보면 재미있어.”<\/p>\n<p>전서율은 웃었다.<\/p>\n<p>“고마워.”<\/p>\n<p>윤태경이 손을 내저었다.<\/p>\n<p>“됐어. 대신 네 검술 완성하면 내 이름도 넣어라.”<\/p>\n<p>“왜?”<\/p>\n<p>“첫 번째 제자니까.”<\/p>\n<p>백소윤이 말했다.<\/p>\n<p>“아직 검술 이름도 없는데?”<\/p>\n<p>“그럼 이름부터 지어!”<\/p>\n<p>전서율은 잠시 생각하다가 고개를 저었다.<\/p>\n<p>“아직은 됐어.”<\/p>\n<p>“왜?”<\/p>\n<p>“이름을 붙일 만큼 되는 게 없잖아.”<\/p>\n<p>그는 손에 쥔 목검을 내려다봤다.<\/p>\n<p>“조금 더 해 보고 싶어.”<\/p>\n<p>백소윤은 미소 지었다.<\/p>\n<p>“그럼 오늘도 연무장 갈 거지?”<\/p>\n<p>“응.”<\/p>\n<p>윤태경이 한숨을 쉬었다.<\/p>\n<p>“아, 또?”<\/p>\n<p>전서율이 물었다.<\/p>\n<p>“싫어?”<\/p>\n<p>“아니.”<\/p>\n<p>윤태경은 두 사람보다 먼저 걸음을 옮겼다.<\/p>\n<p>“오늘은 내가 제일 먼저 열 번 성공할 거니까 빨리 와!”<\/p>\n<p>백소윤이 웃었다.<\/p>\n<p>“어제도 그 말 했잖아.”<\/p>\n<p>“오늘은 진짜야!”<\/p>\n<p>전서율은 그 뒤를 따라 달렸다.<\/p>\n<p>강당에서 들은 여러 말이 아직 머릿속에 남아 있었다.<\/p>\n<p>선대가 남긴 형을 지켜야 한다는 말.<\/p>\n<p>그 형을 벗어나려면 중심을 잃지 않아야 한다는 말.<\/p>\n<p>그리고 질문을 하지 말라는 말.<\/p>\n<p>서로 다른 말들이었다.<\/p>\n<p>그는 아직 무엇이 가장 옳은지 알지 못했다.<\/p>\n<p>하지만 적어도 한 가지는 알고 있었다.<\/p>\n<p>궁금하다는 이유만으로 검을 내려놓고 싶지는 않았다.<\/p>\n<h3>5. 저녁의 검로<\/h3>\n<p>해 질 무렵, 제삼 연무장에는 목검 부딪히는 소리가 다시 울렸다.<\/p>\n<p>“하나!”<\/p>\n<p>윤태경이 검을 휘둘렀다.<\/p>\n<p>“둘!”<\/p>\n<p>백소윤이 그의 발 위치를 살폈다.<\/p>\n<p>“태경아, 오른발이 너무 앞으로 나갔어.”<\/p>\n<p>“알았어!”<\/p>\n<p>전서율은 조금 떨어진 곳에서 목검을 들었다.<\/p>\n<p>기본 초식의 마지막 베기.<\/p>\n<p>그는 검을 내렸다.<\/p>\n<p>그리고 멈췄다.<\/p>\n<p>'중심을 잃지 않는 것.'<\/p>\n<p>다시 검을 들어 올렸다.<\/p>\n<p>이번에는 발을 옮기지 않고 허리부터 돌려 봤다.<\/p>\n<p>검이 움직였지만 어깨가 따라가지 못했다.<\/p>\n<p>“으윽.”<\/p>\n<p>그는 자세를 풀었다.<\/p>\n<p>'이것도 아니네.'<\/p>\n<p>백소윤이 다가왔다.<\/p>\n<p>“어때?”<\/p>\n<p>“여전히 어렵네.”<\/p>\n<p>“오늘 강론에서 들은 대로 해 봤어?”<\/p>\n<p>“응. 그런데 말처럼 안 돼.”<\/p>\n<p>백소윤은 잠시 그의 자세를 살폈다.<\/p>\n<p>“검이 먼저 움직이는 것 같아.”<\/p>\n<p>“검이?”<\/p>\n<p>“응. 몸이 따라가기 전에 손부터 움직이니까 어깨가 꼬이는 거 아닐까?”<\/p>\n<p>전서율은 그녀의 말을 곱씹었다.<\/p>\n<p>그는 다시 자세를 잡았다.<\/p>\n<p>이번에는 검을 움직이기 전에 발바닥에 힘을 실었다. 허리를 천천히 돌리고, 그 움직임을 따라 목검을 옆으로 흘렸다.<\/p>\n<p>휘익.<\/p>\n<p>짧은 바람 소리가 났다.<\/p>\n<p>완벽하지는 않았다.<\/p>\n<p>검끝도 흔들렸고, 다음 동작으로 이어지지도 못했다.<\/p>\n<p>그러나 전서율은 눈을 크게 떴다.<\/p>\n<p>“……방금 봤어?”<\/p>\n<p>백소윤이 웃었다.<\/p>\n<p>“응. 아까보다 나았어.”<\/p>\n<p>윤태경이 달려왔다.<\/p>\n<p>“뭐야, 뭐야? 나만 못 봤어?”<\/p>\n<p>“아직 별거 아니야.”<\/p>\n<p>전서율은 웃으며 검을 내렸다.<\/p>\n<p>윤태경이 말했다.<\/p>\n<p>“그럼 다시 해 봐.”<\/p>\n<p>“왜?”<\/p>\n<p>“나도 보게.”<\/p>\n<p>백소윤이 고개를 끄덕였다.<\/p>\n<p>“나도 한 번 더 보고 싶어.”<\/p>\n<p>전서율은 두 사람을 번갈아 바라봤다.<\/p>\n<p>그리고 다시 목검을 들어 올렸다.<\/p>\n<p>“좋아. 대신 이번에도 넘어지면 웃지 마.”<\/p>\n<p>윤태경이 즉시 대답했다.<\/p>\n<p>“그건 약속 못 해.”<\/p>\n<p>백소윤도 미소 지었다.<\/p>\n<p>“나도.”<\/p>\n<p>“너희 정말…….”<\/p>\n<p>전서율은 어이없다는 듯 웃었다.<\/p>\n<p>그리고 검을 휘둘렀다.<\/p>\n<p>그날도 특별한 무공이 탄생하지는 않았다.<\/p>\n<p>교두들의 평가가 달라진 것도 아니었다.<\/p>\n<p>하지만 전서율에게는 작고 분명한 진전이 있었다.<\/p>\n<p>누군가는 그의 질문을 건방지다고 여겼다.<\/p>\n<p>누군가는 흥미롭다고 생각했다.<\/p>\n<p>그리고 두 친구는 여전히 그의 곁에서, 성공과 실패를 함께 지켜보고 있었다.<\/p>\n<p>전서율은 그 사실이 좋았다.<\/p>\n<p>아직은 그 정도면 충분했다.<\/p>\n<p><strong>— 제3장 「정파의 가르침」 끝.<\/strong><\/p>\n"}, {"n": 4, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제4장. 보이지 않는 서열<\/h2>\n<blockquote>\n<p>라이트 노벨 초고 v0.1 · 제3장 직후 · 확정 전<\/p>\n<\/blockquote>\n<h3>1. 이름 앞에 붙는 것<\/h3>\n<p>“전서율.”<\/p>\n<p>“네!”<\/p>\n<p>“윤태경.”<\/p>\n<p>“네!”<\/p>\n<p>“백소윤.”<\/p>\n<p>“네.”<\/p>\n<p>청운관 앞마당의 아침 점호는 평소와 같았다. 다른 점이라면 담당 선배가 명부를 덮으며 새로운 소식을 전했다는 것이었다.<\/p>\n<p>“오늘부터 수련반별 대련 상대를 배정한다. 기존 수련 경력과 각 가문의 추천을 반영하여 상위 조는 제일 연무장으로, 나머지는 제삼 연무장으로 이동한다.”<\/p>\n<p>“드디어 대련!” 윤태경이 속삭였다.<\/p>\n<p>백소윤이 그의 옆구리를 찔렀다. “아직 설명 안 끝났어.”<\/p>\n<p>전서율은 손을 들었다. “질문 있습니다. 나중에 실력이 좋아지면 상위 조로 옮길 수 있습니까?”<\/p>\n<p>“정기 평가에서 좋은 성적을 내면 가능하다.”<\/p>\n<p>“감사합니다.”<\/p>\n<p>전서율은 그 설명을 납득했다. 먼저 배운 사람과 이제 막 검을 잡은 사람이 같은 수련을 할 필요는 없을 테니까. 그러나 윤태경은 앞줄의 화려한 검집들을 바라보며 중얼거렸다.<\/p>\n<p>“추천이라. 우리 같은 애들은 추천해 줄 사람도 없잖아.”<\/p>\n<p>제삼 연무장에서는 기본 초식의 반복이 이어졌다. 윤태경이 자유 대련을 허락해 달라고 청했지만 담당 선배는 고개를 저었다.<\/p>\n<p>“아직 너희는 그 단계가 아니다.”<\/p>\n<p>그때 연무장 반대편에서 목검이 부딪히는 소리가 났다. 명문가 문양을 단 학생 두 명이 대련하고 있었다.<\/p>\n<p>“저쪽은요?” 윤태경이 물었다.<\/p>\n<p>“별도로 허락받았다.”<\/p>\n<p>전서율은 더 묻지 않았다. 다만 허락의 기준이 무엇인지 알 수 없었다.<\/p>\n<h3>2. 허락된 사람들<\/h3>\n<p>점심 식당에서도 윤태경은 투덜거렸다.<\/p>\n<p>“우리한테는 기본부터 하라면서 저쪽은 마음대로 대련하잖아.”<\/p>\n<p>“상위 조니까 다를 수도 있지.” 백소윤이 조심스럽게 말했다.<\/p>\n<p>“그럼 왜 굳이 우리 연무장에서 보여 주는데?”<\/p>\n<p>전서율이 밥을 삼키고 대답했다. “다음 평가를 준비하자. 우리 실력이 부족한 것도 사실이니까.”<\/p>\n<p>그때 식당 입구에서 날카로운 목소리가 들렸다.<\/p>\n<p>“비켜.”<\/p>\n<p>남궁가의 문장을 단 남궁현우가 들어왔다. 며칠 전 전서율의 질문을 비웃던 바로 그 학생이었다. 그가 지나갈 때마다 다른 학생들이 길을 열었다. 누구는 먼저 인사했고, 누구는 앉을 자리를 내주었다.<\/p>\n<p>“못 들었나?”<\/p>\n<p>앞을 막고 있던 신입생이 황급히 비켰다. “죄송합니다.”<\/p>\n<p>윤태경은 젓가락을 멈췄다. “난 저렇게 되고 싶진 않아.”<\/p>\n<p>“어떻게?” 전서율이 물었다.<\/p>\n<p>“강해졌다고 남한테 비키라고 하는 거.”<\/p>\n<p>“나도.” 백소윤이 말했다.<\/p>\n<p>전서율도 고개를 끄덕였다. “응. 나도.”<\/p>\n<p>강한 사람이 존중받는 것은 이상하지 않았다. 그러나 그 명성이 다른 사람을 함부로 대할 이유가 되는지는 알 수 없었다.<\/p>\n<h3>3. 세 사람의 자리<\/h3>\n<p>며칠 뒤, 수련반별 대련 명단이 게시되었다. 세 사람은 나란히 서서 자기 이름을 찾았다.<\/p>\n<p>“윤태경, 찾았다!”<\/p>\n<p>“나도 있어.” 백소윤이 명단 아래쪽을 가리켰다.<\/p>\n<p>전서율도 이름을 확인했다. “이번에는 진짜 겨루게 되겠네.”<\/p>\n<p>그때 뒤에서 웃음이 들렸다.<\/p>\n<p>“어이, 거기. 너희 셋, 항상 같이 다니더라?”<\/p>\n<p>명문가 남학생과 그 일행이었다. 남학생의 시선이 전서율에게 향했다.<\/p>\n<p>“질문만 많은 놈.”<\/p>\n<p>윤태경을 보았다.<\/p>\n<p>“허세만 가득한 놈.”<\/p>\n<p>그리고 백소윤을 훑었다.<\/p>\n<p>“수첩만 들여다보는 계집애.”<\/p>\n<p>백소윤의 얼굴이 굳었다. 윤태경이 앞으로 나섰다.<\/p>\n<p>“말 다 했냐?”<\/p>\n<p>“왜? 틀린 말 했나?”<\/p>\n<p>전서율이 윤태경의 팔을 붙잡았다. 그리고 상대에게 차분히 물었다.<\/p>\n<p>“저희가 잘못한 게 있습니까?”<\/p>\n<p>“뭐?”<\/p>\n<p>“잘못한 게 있다면 고치겠습니다. 하지만 이유 없이 친구들을 모욕하는 건 그만해 주셨으면 합니다.”<\/p>\n<p>남학생이 한 걸음 다가왔다. “네가 나한테 훈계하는 거냐?”<\/p>\n<p>“훈계하려는 게 아닙니다. 그만해 달라는 겁니다.”<\/p>\n<p>남학생의 얼굴에서 웃음이 사라졌다. 일행이 다가와 속삭였다.<\/p>\n<p>“그만해. 선배들 온다.”<\/p>\n<p>남학생은 전서율의 어깨를 거칠게 두드렸다.<\/p>\n<p>“다음에 보자.”<\/p>\n<p>그들이 사라지자 윤태경이 이를 악물었다. “저 자식 진짜…….”<\/p>\n<p>전서율은 백소윤을 바라봤다. “미안. 내가 질문했던 일 때문에 너희까지…….”<\/p>\n<p>“아니야.” 백소윤이 단호하게 말했다. “네 잘못 아니야. 그리고 다음에는 혼자 먼저 나서지 마.”<\/p>\n<p>“왜?”<\/p>\n<p>“우리 셋이 같이 있었잖아. 그러니까 같이 이야기하면 돼.”<\/p>\n<p>윤태경이 씩 웃었다. “맞아. 네가 혼자 좋은 사람처럼 굴면 우리가 뭐가 되냐?”<\/p>\n<p>그날부터 원치 않는 별명이 따라붙었다.<\/p>\n<p>“저기 그 셋이다.”<\/p>\n<p>“찐따 삼인방?”<\/p>\n<p>처음에는 작은 농담이었다. 그러나 같은 말이 반복되자 윤태경의 얼굴에서 웃음이 줄었다. 백소윤은 사람이 많은 곳에서 수첩을 꺼내기를 망설였다. 전서율은 그 변화를 알아챘다.<\/p>\n<h3>4. 웃지 않는 사람<\/h3>\n<p>저녁 연무장에서 윤태경은 평소보다 거칠게 목검을 휘둘렀다.<\/p>\n<p>“태경아. 화났지?” 전서율이 물었다.<\/p>\n<p>“안 났어.”<\/p>\n<p>탁!<\/p>\n<p>“……많이 났네.”<\/p>\n<p>윤태경은 검을 멈췄다. “우리가 뭘 그렇게 잘못했는데? 수련하고 밥 같이 먹는 게 웃긴 일이야?”<\/p>\n<p>백소윤은 조용히 고개를 저었다.<\/p>\n<p>“강하면 뭐든 해도 되는 거야?” 윤태경이 물었다.<\/p>\n<p>전서율은 곧바로 대답하지 못했다. 강자는 약자를 지켜야 한다고 배웠다. 검을 쥔 자는 예를 지켜야 한다고 배웠다. 그러나 자신들이 겪은 일은 그 가르침과 달랐다.<\/p>\n<p>“나도 잘 모르겠어.” 전서율이 말했다. “그래도 우리가 잘못한 건 아니라고 생각해. 그 사람들 때문에 우리가 하던 걸 그만두지는 말자.”<\/p>\n<p>“그냥 참자는 거야?”<\/p>\n<p>“아니. 다음에 또 그러면 선배나 교두님께 말씀드려 보자. 그래도 안 되면 다른 방법을 찾아보고.”<\/p>\n<p>“그게 통할까?”<\/p>\n<p>“모르겠어. 그래도 해 보지도 않고 포기하고 싶지는 않아.”<\/p>\n<p>백소윤은 수첩을 꺼내 글을 적었다.<\/p>\n<p><em>오늘 있었던 일 — 기억해 두기.<\/em><\/p>\n<p>그 아래에는 세 사람의 이름이 나란히 놓였다.<\/p>\n<p>“왜 적어?” 윤태경이 물었다.<\/p>\n<p>“나중에 누가 물어보면 정확히 설명하려고. 그리고 오늘 우리가 무슨 이야기를 했는지도 잊고 싶지 않아서.”<\/p>\n<p>전서율이 미소 지었다. “좋네.”<\/p>\n<p>윤태경은 목검을 다시 들었다. “좋아. 그럼 수련하자.”<\/p>\n<p>그날의 수련은 평소보다 조용했다. 그러나 누구도 먼저 연무장을 떠나지 않았다.<\/p>\n<h3>5. 보이지 않는 서열<\/h3>\n<p>청운관으로 돌아가는 길, 윤태경이 물었다.<\/p>\n<p>“서율아. 너 나중에 강해지면 뭐 할 거냐?”<\/p>\n<p>“내가 원하는 대로 검을 다룰 수 있으면 좋겠어.”<\/p>\n<p>“그거 말고. 강호에서 뭘 할 건데?”<\/p>\n<p>전서율은 밤하늘을 올려다봤다.<\/p>\n<p>“누군가 도움이 필요할 때 도와줄 수 있는 사람이 되고 싶어.”<\/p>\n<p>윤태경은 그를 바라보다가 웃었다. “너 진짜 정파 사람이네.”<\/p>\n<p>“그게 무슨 말이야?”<\/p>\n<p>“교두님이 좋아하실 대답이라고.”<\/p>\n<p>백소윤도 미소 지었다. “나도 좋은 대답이라고 생각해.”<\/p>\n<p>“그럼 태경이는?” 전서율이 물었다.<\/p>\n<p>“나는 강호에서 제일 유명한 고수가 될 거야.”<\/p>\n<p>“왜?”<\/p>\n<p>“유명하면 맛있는 것도 많이 얻어먹을 수 있잖아.”<\/p>\n<p>세 사람은 한참 동안 웃었다.<\/p>\n<p>그날 밤, 전서율은 침상에 누워 생각했다. 학관에는 눈에 보이지 않는 서열이 있었다. 어떤 사람은 태어날 때부터 좋은 자리를 얻었고, 어떤 사람은 실력을 증명해야 했다.<\/p>\n<p>그는 아직 그 차이를 제대로 이해하지 못했다. 그렇다고 정파의 도리가 틀렸다고 생각하지도 않았다.<\/p>\n<p>오히려 그 반대였다.<\/p>\n<p><em>'강한 사람이 약한 사람을 지켜야 한다면…….'<\/em><\/p>\n<p>그는 천천히 눈을 감았다.<\/p>\n<p><em>'나부터 더 강해져야겠지.'<\/em><\/p>\n<p>그것은 누군가를 쓰러뜨리기 위한 다짐이 아니었다. 친구들과 이곳에서 잘 지내고 싶다는 평범한 바람이었다.<\/p>\n<p>그러나 어떤 사람들에게는 그 소박한 바람조차 마음에 들지 않을 수 있었다.<\/p>\n<p><strong>— 제4장 「보이지 않는 서열」 끝.<\/strong><\/p>\n"}, {"n": 5, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제5장. 복도의 오해<\/h2>\n<blockquote>\n<p>라이트 노벨 초고 v0.1 · 제4장 직후 · 확정 전<\/p>\n<\/blockquote>\n<h3>1. 사라진 수첩<\/h3>\n<p>“내 수첩 못 봤어?”<\/p>\n<p>백소윤의 말에 윤태경이 만두를 씹다 말고 고개를 들었다.<\/p>\n<p>“네 손에 있는 건?”<\/p>\n<p>“이건 교재야.”<\/p>\n<p>“아.”<\/p>\n<p>전서율은 식탁 위를 살폈다. 물잔 세 개와 빈 접시, 윤태경이 가져온 간식 봉지가 전부였다.<\/p>\n<p>“어제 연무장에서 마지막으로 쓰지 않았어?”<\/p>\n<p>“응. 그런데 방에 돌아가서도 있었거든.”<\/p>\n<p>소윤은 평소처럼 웃으려 했지만 손가락이 자꾸만 교재 모서리를 문질렀다. 그 수첩에는 수업 내용만 적혀 있지 않았다. 세 사람이 처음 만난 날의 이름, 서율의 엉뚱한 검술 시도, 태경이 쥐를 보고 놀랐던 일까지 모두 들어 있었다.<\/p>\n<p>“수업 전에 찾아볼게.”<\/p>\n<p>서율이 일어서자 소윤이 손을 내저었다.<\/p>\n<p>“아니야. 내가 다녀올게. 너희는 먼저 가 있어.”<\/p>\n<p>“혼자 괜찮겠어?”<\/p>\n<p>“수첩 찾으러 가는 건데 뭘.”<\/p>\n<p>태경이 웃었다.<\/p>\n<p>“찾으면 내 얘기 적힌 부분은 지워 줘.”<\/p>\n<p>“싫어.”<\/p>\n<p>소윤이 처음으로 웃었다.<\/p>\n<p>“그건 역사적 기록이거든.”<\/p>\n<p>“야, 무슨 역사까지 나와!”<\/p>\n<p>소윤은 두 사람을 뒤로하고 식당을 나섰다. 태경의 투덜거림이 복도 끝까지 따라왔다.<\/p>\n<p>그녀는 수첩을 잃어버린 것이 아니었다.<\/p>\n<p>전날 저녁, 수련을 마치고 돌아가는 길에 누군가가 수첩을 낚아채 갔다. 손을 뻗을 틈도 없었다. 돌아보았을 때는 제복 소매에 명문가의 문양을 단 학도생 둘이 웃고 있었다.<\/p>\n<p>‘내일 서쪽 회랑으로 와. 돌려줄 테니까.’<\/p>\n<p>소윤은 그 말을 두 사람에게 하지 못했다. 서율이 알면 분명 함께 가겠다고 할 것이고, 태경은 화부터 낼 터였다.<\/p>\n<p>그저 수첩만 돌려받으면 끝날 일이라고 생각했다.<\/p>\n<p>그 생각이 틀렸다는 것을 깨닫기까지는 오래 걸리지 않았다.<\/p>\n<h3>2. 서쪽 회랑<\/h3>\n<p>서쪽 회랑은 오전 수업이 시작되면 사람이 드물었다. 한쪽으로는 오래된 무기 보관실이, 다른 쪽으로는 후원이 이어졌다. 처마 아래에는 어제 내린 비가 아직 마르지 않았다.<\/p>\n<p>소윤은 회랑 입구에서 발을 멈췄다.<\/p>\n<p>“왔네?”<\/p>\n<p>기둥에 기대 있던 남학생이 몸을 일으켰다. 제삼 수련반에서 서율에게 빈정거리던 남궁현우였다. 그의 곁에는 일행 둘이 서 있었다.<\/p>\n<p>“수첩 돌려주세요.”<\/p>\n<p>소윤은 최대한 차분하게 말했다.<\/p>\n<p>남학생은 손에 든 작은 수첩을 흔들었다.<\/p>\n<p>“이거?”<\/p>\n<p>“네. 제 물건이에요.”<\/p>\n<p>“그런데 재미있는 게 많더라.”<\/p>\n<p>소윤의 얼굴에서 핏기가 가셨다.<\/p>\n<p>“남의 물건을 함부로 보시면 안 되죠.”<\/p>\n<p>“뭐가 그렇게 대단하다고?”<\/p>\n<p>그는 아무 페이지나 펼쳤다.<\/p>\n<p>“윤태경은 말이 많음. 전서율은 궁금한 것이 많음. 하, 어린애들 일기장이냐?”<\/p>\n<p>일행이 웃었다.<\/p>\n<p>소윤은 손을 뻗었다.<\/p>\n<p>“돌려주세요.”<\/p>\n<p>남학생은 수첩을 높이 들었다.<\/p>\n<p>“왜? 이것도 적어 두려고? 누가 무슨 말을 했는지?”<\/p>\n<p>소윤은 그제야 상대가 무엇을 문제 삼는지 알았다. 며칠 전 서율과 태경을 모욕한 일을 그녀가 기록했다는 사실이었다.<\/p>\n<p>“제가 본 일을 적은 것뿐이에요.”<\/p>\n<p>“그래서 나중에 교두한테 일러바치려고?”<\/p>\n<p>“그런 뜻으로 적은 게 아니에요.”<\/p>\n<p>“그럼 지워.”<\/p>\n<p>남학생이 수첩을 펼쳐 그녀에게 내밀었다.<\/p>\n<p>“우리 이름이든, 그날 일이든. 전부.”<\/p>\n<p>소윤은 페이지를 바라봤다. 자신의 글씨가 가지런히 놓여 있었다. 잘못한 일이 있다면 정확하게 설명하자는 마음으로 적었던 문장이었다.<\/p>\n<p>“……지울 수 없어요.”<\/p>\n<p>“뭐?”<\/p>\n<p>“사실대로 적은 거니까요.”<\/p>\n<p>남학생의 미소가 사라졌다.<\/p>\n<p>“말귀를 못 알아듣네.”<\/p>\n<p>그가 수첩의 한 장을 잡아당겼다.<\/p>\n<p>찍.<\/p>\n<p>종이가 찢어지는 소리에 소윤이 움찔했다.<\/p>\n<p>“안 돼요!”<\/p>\n<p>그녀가 급히 손을 뻗었다. 그러자 옆에 있던 학도생이 앞을 막아섰다.<\/p>\n<p>“어딜 그렇게 급하게 가?”<\/p>\n<p>소윤은 뒤로 물러났다. 등 뒤에 차가운 기둥이 닿았다.<\/p>\n<p>“비켜 주세요.”<\/p>\n<p>“싫다면?”<\/p>\n<p>남학생이 다시 수첩을 흔들었다.<\/p>\n<p>“친구들한테 가서 일러 봐. 그 잘난 셋이 뭘 할 수 있나 보게.”<\/p>\n<p>소윤은 입술을 깨물었다. 무섭지 않다고 말하고 싶었지만 손끝이 떨렸다.<\/p>\n<p>그래도 시선을 내리지는 않았다.<\/p>\n<p>“그만하세요.”<\/p>\n<p>이번에는 소윤의 목소리가 아니었다.<\/p>\n<h3>3. 사파의 참견<\/h3>\n<p>회랑 끝에서 발소리가 들렸다.<\/p>\n<p>“셋이서 한 사람 붙잡고 뭐 하는데?”<\/p>\n<p>붉은빛이 감도는 사파 제복을 입은 여학생이 서 있었다. 그녀의 뒤에는 같은 세력의 동료 둘이 따라오고 있었다.<\/p>\n<p>진하연이었다.<\/p>\n<p>소윤은 입관식 때 비무대 위에서 보았던 얼굴을 알아보았다. 검집을 어깨에 가볍게 걸친 채 웃고 있었지만, 그 눈은 웃지 않았다.<\/p>\n<p>명문가 남학생이 인상을 찌푸렸다.<\/p>\n<p>“사파가 정파 일에 왜 끼어들지?”<\/p>\n<p>“정파 일?”<\/p>\n<p>하연은 주변을 둘러봤다.<\/p>\n<p>“내가 보기엔 남의 수첩 뺏고 괴롭히는 일인데. 정파에서는 그걸 따로 부르나 봐?”<\/p>\n<p>동료 하나가 작게 웃었다.<\/p>\n<p>남학생의 얼굴이 붉어졌다.<\/p>\n<p>“말조심해.”<\/p>\n<p>“그러는 너는 손조심 좀 하지.”<\/p>\n<p>하연이 수첩을 가리켰다.<\/p>\n<p>“돌려줘.”<\/p>\n<p>“싫다면?”<\/p>\n<p>“그럼 지나가던 교두한테 물어보지 뭐. 정파의 예법에는 남의 물건을 찢는 것도 들어 있느냐고.”<\/p>\n<p>남학생은 잠시 입을 다물었다.<\/p>\n<p>그가 사파의 대표 학도생을 모를 리 없었다. 입관식에서 세 명을 상대로 검을 휘두르던 모습은 아직 많은 사람의 입에 오르내리고 있었다.<\/p>\n<p>“웃기지 마. 네가 무슨 상관인데?”<\/p>\n<p>하연은 고개를 기울였다.<\/p>\n<p>“상관없는 일인데 보기 싫어서.”<\/p>\n<p>그녀가 한 걸음 다가갔다.<\/p>\n<p>“그런 이유로는 부족해?”<\/p>\n<p>남학생이 검집에 손을 올렸다. 하연의 동료들도 몸을 굳혔다.<\/p>\n<p>하지만 하연은 검을 뽑지 않았다.<\/p>\n<p>그저 남학생의 손목이 움직이는 방향을 바라보다가, 그가 수첩을 뒤로 감추려는 순간 검집 끝으로 그의 소매를 가볍게 밀었다.<\/p>\n<p>탁.<\/p>\n<p>손목이 들리며 수첩이 허공에 떠올랐다.<\/p>\n<p>“어?”<\/p>\n<p>하연은 다른 손으로 수첩을 받았다.<\/p>\n<p>순식간이었다.<\/p>\n<p>“남의 물건은 주인한테.”<\/p>\n<p>그녀는 수첩을 소윤에게 건넸다.<\/p>\n<p>소윤은 두 손으로 받아 들었다. 표지가 구겨지고 한 장이 찢겨 있었지만, 적어도 되찾았다.<\/p>\n<p>“……감사합니다.”<\/p>\n<p>“다친 데는?”<\/p>\n<p>“없어요.”<\/p>\n<p>하연은 소윤의 손끝을 힐끗 보았다.<\/p>\n<p>“많이 놀랐나 보네.”<\/p>\n<p>“괜찮아요.”<\/p>\n<p>“안 괜찮아도 돼. 저런 일을 겪었는데.”<\/p>\n<p>그 말에 소윤은 순간 대답을 잃었다.<\/p>\n<p>남학생이 분을 참지 못하고 소리쳤다.<\/p>\n<p>“진하연! 지금 날 무시하는 거냐?”<\/p>\n<p>하연이 돌아봤다.<\/p>\n<p>“아직 여기 있었어?”<\/p>\n<p>“너……!”<\/p>\n<p>그가 한 걸음 내딛자 하연의 동료가 앞으로 나섰다.<\/p>\n<p>“그만하지? 소란 커지면 네 쪽도 곤란할 텐데.”<\/p>\n<p>남학생은 이를 악물었다. 결국 일행을 데리고 회랑 반대편으로 물러났다.<\/p>\n<p>떠나기 직전, 그가 소윤을 노려봤다.<\/p>\n<p>“이걸로 끝났다고 생각하지 마!”<\/p>\n<p>소윤의 어깨가 움찔했다.<\/p>\n<p>하연이 그 앞을 가로막았다.<\/p>\n<p>“아직 할 말 남았어?”<\/p>\n<p>남학생은 대답하지 않고 돌아섰다.<\/p>\n<p>그제야 회랑에 조용한 바람 소리가 돌아왔다.<\/p>\n<h3>4. 뒤늦게 도착한 사람<\/h3>\n<p>“소윤아!”<\/p>\n<p>익숙한 목소리가 들렸다.<\/p>\n<p>소윤이 고개를 들었다.<\/p>\n<p>전서율이 회랑 입구에서 달려오고 있었다. 뒤쪽에는 윤태경도 보였다.<\/p>\n<p>“여기 있었구나. 수업 시작했는데 안 와서…….”<\/p>\n<p>서율은 말을 끝맺지 못했다.<\/p>\n<p>소윤은 기둥 앞에 서 있었다. 손에는 구겨진 수첩이 들려 있었고, 얼굴은 창백했다. 바로 앞에는 사파 제복을 입은 세 사람이 서 있었다.<\/p>\n<p>그중 한 명은 검집을 손에 들고 있었다.<\/p>\n<p>서율이 보기에 소윤은 겁에 질려 있었다.<\/p>\n<p>그리고 그녀를 둘러싼 사람들은 웃고 있었다.<\/p>\n<p>그는 조금 전 이곳에서 무슨 일이 벌어졌는지 알지 못했다.<\/p>\n<p>“소윤아.”<\/p>\n<p>서율이 곧장 그녀에게 다가갔다.<\/p>\n<p>“괜찮아?”<\/p>\n<p>“서율아, 나는…….”<\/p>\n<p>“누가 그랬어?”<\/p>\n<p>소윤이 입을 열기도 전에 서율이 몸을 돌렸다.<\/p>\n<p>그는 소윤과 사파 학도생들 사이에 섰다.<\/p>\n<p>하연의 눈썹이 살짝 올라갔다.<\/p>\n<p>“뭐야?”<\/p>\n<p>서율은 그녀의 검집을 바라봤다. 그리고 구겨진 수첩을 보았다.<\/p>\n<p>“친구한테 무슨 짓을 한 겁니까?”<\/p>\n<p>하연이 잠시 말을 잃었다.<\/p>\n<p>“……뭐?”<\/p>\n<p>“무슨 일이 있었는지는 모르겠지만, 이만 가겠습니다.”<\/p>\n<p>서율의 목소리는 평소보다 딱딱했다.<\/p>\n<p>하연은 어이가 없다는 듯 웃었다.<\/p>\n<p>“잠깐. 너 지금 나한테 하는 말이야?”<\/p>\n<p>“여기 다른 분이 있습니까?”<\/p>\n<p>하연의 동료가 발끈했다.<\/p>\n<p>“야, 너 상황을 알고나 말해!”<\/p>\n<p>서율은 검을 뽑지 않았다. 대신 소윤을 등 뒤로 감싸며 한 걸음 물러났다.<\/p>\n<p>“지금은 친구부터 데려가겠습니다.”<\/p>\n<p>그 모습에 하연의 표정이 굳었다.<\/p>\n<p>“너, 진짜 우리가 괴롭혔다고 생각해?”<\/p>\n<p>서율은 대답하지 않았다.<\/p>\n<p>침묵이 대답처럼 들렸다.<\/p>\n<p>“하.”<\/p>\n<p>하연이 짧게 웃었다.<\/p>\n<p>“대단하네. 와서 한마디 듣지도 않고.”<\/p>\n<p>소윤이 급히 말했다.<\/p>\n<p>“서율아, 그게 아니라…….”<\/p>\n<p>그러나 서율은 그녀의 떨리는 손을 보고 먼저 판단했다. 지금은 여기서 다투는 것보다 소윤을 안전한 곳으로 데려가는 게 우선이라고.<\/p>\n<p>“일단 가자.”<\/p>\n<p>“잠깐만, 저분들은…….”<\/p>\n<p>그때 윤태경이 회랑에 도착했다.<\/p>\n<p>“야! 무슨 일이야? 소윤아, 괜찮아?”<\/p>\n<p>태경이 다급하게 다가오자 소윤은 설명할 말을 잃었다. 짧은 순간에 모든 사람이 자신을 바라보고 있었다.<\/p>\n<p>서율은 하연을 향해 차갑게 시선을 주었다.<\/p>\n<p>“다시는 제 친구를 건드리지 말아 주십시오.”<\/p>\n<p>그리고 소윤의 팔을 조심스럽게 붙잡고 돌아섰다.<\/p>\n<p>“전서율, 잠깐……!”<\/p>\n<p>소윤의 목소리가 작게 흩어졌다.<\/p>\n<p>하연은 그들을 멍하니 바라봤다.<\/p>\n<p>“……뭐 저런 놈이 다 있어?”<\/p>\n<p>동료가 혀를 찼다.<\/p>\n<p>“야, 쫓아가서 말해 줘. 네가 구해 줬다고.”<\/p>\n<p>하연은 한동안 대답하지 않았다.<\/p>\n<p>그러다 검집을 허리에 걸었다.<\/p>\n<p>“됐어.”<\/p>\n<p>“그냥 둔다고?”<\/p>\n<p>“자기 눈으로 본 것만 믿겠다는데 내가 무슨 말을 더 해.”<\/p>\n<p>말은 그렇게 했지만, 그녀의 귀 끝이 분해서 붉어져 있었다.<\/p>\n<p>“아니, 적어도 사과는 하고 가야지.”<\/p>\n<p>하연은 회랑 끝을 노려봤다.<\/p>\n<p>“정파 애들은 원래 다 저래?”<\/p>\n<p>동료가 어깨를 으쓱했다.<\/p>\n<p>“다 그렇진 않겠지.”<\/p>\n<p>하연은 잠시 생각했다.<\/p>\n<p>“……그렇겠지.”<\/p>\n<p>하지만 방금 그 소년만큼은 당분간 잊기 어려울 것 같았다.<\/p>\n<h3>5. 말하지 못한 설명<\/h3>\n<p>청운관으로 돌아가는 길, 윤태경이 먼저 입을 열었다.<\/p>\n<p>“대체 무슨 일이 있었던 거야?”<\/p>\n<p>백소윤은 수첩을 가슴에 안았다.<\/p>\n<p>“그게…….”<\/p>\n<p>서율이 그녀를 바라봤다.<\/p>\n<p>“아까 그 사람들이 수첩을 뺏은 거야?”<\/p>\n<p>“아니야.”<\/p>\n<p>“그럼?”<\/p>\n<p>소윤은 숨을 골랐다.<\/p>\n<p>“수첩을 가져간 건 전에 우리한테 시비 걸었던 정파 학생들이야.”<\/p>\n<p>윤태경이 걸음을 멈췄다.<\/p>\n<p>“뭐?”<\/p>\n<p>“어제 가져갔어. 오늘 돌려준다고 해서 혼자 갔는데…….”<\/p>\n<p>그녀는 구겨진 표지를 내려다봤다.<\/p>\n<p>“거기서 나한테 적어 둔 걸 지우라고 했어.”<\/p>\n<p>윤태경의 얼굴이 굳었다.<\/p>\n<p>“그래서? 걔들이 너한테 손댔어?”<\/p>\n<p>“아니. 몸은 괜찮아.”<\/p>\n<p>소윤은 고개를 저었다.<\/p>\n<p>“그런데 수첩을 찢었어.”<\/p>\n<p>서율의 시선이 찢어진 종이로 향했다.<\/p>\n<p>“……미안해.”<\/p>\n<p>“왜 네가 미안해?”<\/p>\n<p>“그때 우리가 같이 갔어야 했는데.”<\/p>\n<p>소윤은 작게 고개를 저었다.<\/p>\n<p>“내가 말 안 했잖아.”<\/p>\n<p>윤태경이 답답하다는 듯 머리를 쓸어 넘겼다.<\/p>\n<p>“그럼 아까 그 사파 애들은?”<\/p>\n<p>소윤은 입을 열었다.<\/p>\n<p>“그분들은 사실…….”<\/p>\n<p>멀리서 수업 시작을 알리는 종이 울렸다.<\/p>\n<p>둥—.<\/p>\n<p>세 사람은 동시에 고개를 들었다.<\/p>\n<p>“아, 큰일이다.”<\/p>\n<p>윤태경이 말했다.<\/p>\n<p>“우리 또 늦겠어.”<\/p>\n<p>소윤은 입술을 깨물었다.<\/p>\n<p>“일단 수업부터 가자. 끝나고 제대로 이야기할게.”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>“응. 무리하지 말고.”<\/p>\n<p>그들은 서둘러 발걸음을 옮겼다.<\/p>\n<p>소윤은 달리는 동안에도 몇 번이나 말을 꺼내려 했다. 하지만 교실에 도착하자 교두가 이미 출석을 부르고 있었다. 수업이 끝나고 나서는 태경이 대련 준비를 하러 불려 갔고, 소윤은 찢어진 수첩을 고치기 위해 생활관으로 돌아갔다.<\/p>\n<p>설명은 그렇게 하루 뒤로 밀렸다.<\/p>\n<p>서율은 여전히 진하연이 소윤을 괴롭혔다고 생각했다. 적어도 그녀가 무슨 일에 끼어들었다는 의심을 버리지 못했다.<\/p>\n<p>그리고 소윤은 그 오해를 바로잡아야 한다는 것을 알면서도, 자신 때문에 친구들이 또 다른 다툼에 휘말릴까 봐 선뜻 말을 꺼내지 못했다.<\/p>\n<h3>6. 이름을 기억하다<\/h3>\n<p>그날 저녁, 진하연은 사파 생활동의 마루에 앉아 검집을 닦고 있었다.<\/p>\n<p>동료가 다가와 물었다.<\/p>\n<p>“아직도 화났어?”<\/p>\n<p>“안 났어.”<\/p>\n<p>“검집이 닳겠다.”<\/p>\n<p>하연은 손을 멈췄다.<\/p>\n<p>“……그렇게 티 나?”<\/p>\n<p>“엄청.”<\/p>\n<p>그녀는 검집을 내려놓았다.<\/p>\n<p>“내가 뭘 잘못했는데?”<\/p>\n<p>“아무것도.”<\/p>\n<p>“남의 수첩 뺏는 애들 말렸고, 다친 데 없는지 물어봤고, 돌려주기까지 했잖아.”<\/p>\n<p>“그랬지.”<\/p>\n<p>“그런데 갑자기 나타나서는 사람을 범인 취급하고 데려가 버려?”<\/p>\n<p>동료는 웃음을 참았다.<\/p>\n<p>“그러니까 화났네.”<\/p>\n<p>“화났다니까!”<\/p>\n<p>하연은 한숨을 내쉬었다.<\/p>\n<p>잠시 후 그녀가 물었다.<\/p>\n<p>“그런데 걔 이름이 뭐였지?”<\/p>\n<p>“누구?”<\/p>\n<p>“아까 그 정파 애.”<\/p>\n<p>“전서율이라고 부르던데.”<\/p>\n<p>“전서율…….”<\/p>\n<p>하연은 이름을 한번 입속으로 굴렸다.<\/p>\n<p>그 이름을 기억한 이유는 호감 때문이 아니었다.<\/p>\n<p>사람을 구해 줬더니 도리어 의심받은 것도 황당한데, 그 소년은 사과 한마디 없이 돌아섰다.<\/p>\n<p>그것도 자신을 똑바로 노려보면서.<\/p>\n<p>하연은 피식 웃었다.<\/p>\n<p>“좋아. 전서율.”<\/p>\n<p>동료가 물었다.<\/p>\n<p>“뭐가 좋아?”<\/p>\n<p>“다음에 마주치면 꼭 물어볼 거야.”<\/p>\n<p>“뭘?”<\/p>\n<p>“눈으로 본 게 전부냐고.”<\/p>\n<p>그녀는 검집을 들어 허리에 찼다.<\/p>\n<p>“그리고 사람 말은 끝까지 듣는 법부터 배우라고.”<\/p>\n<p>동료가 웃었다.<\/p>\n<p>“정파 교두처럼 굴려고?”<\/p>\n<p>“그건 싫어.”<\/p>\n<p>하연도 결국 웃었다.<\/p>\n<p>하지만 웃음이 가라앉은 뒤에도, 회랑에서 보았던 소년의 눈빛이 떠올랐다.<\/p>\n<p>겁먹은 친구 앞을 막아서던 모습.<\/p>\n<p>상황을 잘못 짚었으면서도 물러서지 않던 태도.<\/p>\n<p>괘씸했다.<\/p>\n<p>그런데 한편으로는 이상했다.<\/p>\n<p>자기보다 훨씬 강한 상대가 앞에 있다고 생각하면서도, 그는 검을 뽑지 않고 친구를 먼저 데려갔다.<\/p>\n<p>하연은 그 점만큼은 인정할 수밖에 없었다.<\/p>\n<p>“……이상한 애네.”<\/p>\n<p>그녀가 혼잣말처럼 중얼거렸다.<\/p>\n<p>그리고 그날, 전서율은 진하연의 이름을 다시 한번 마음속에 새겼다.<\/p>\n<p>다만 두 사람이 기억한 서로의 모습은 전혀 달랐다.<\/p>\n<p>한 사람은 친구를 괴롭힌 사파의 무인으로.<\/p>\n<p>다른 한 사람은 은혜를 원망으로 돌려준 무례한 정파 학도생으로.<\/p>\n<p>그렇게 두 사람 사이에는, 누구도 의도하지 않았던 첫 번째 오해가 남았다.<\/p>\n<p><strong>— 제5장 「복도의 오해」 끝.<\/strong><\/p>\n"}, {"n": 6, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제6장. 마주치는 사람<\/h2>\n<h3>1. 피하고 싶은 사람<\/h3>\n<p>“서율아. 너, 지금 일부러 돌아가는 거지?”<\/p>\n<p>윤태경의 물음에 전서율은 걸음을 멈췄다.<\/p>\n<p>“무슨 소리야?”<\/p>\n<p>“강당은 저쪽이잖아.”<\/p>\n<p>태경이 손가락으로 가리킨 길은 넓고 곧았다. 서율이 향하던 길은 연못을 반 바퀴 돌아야 하는 후원 쪽이었다.<\/p>\n<p>“아침에 좀 걷고 싶어서.”<\/p>\n<p>“네가?”<\/p>\n<p>“왜. 나도 산책 좋아해.”<\/p>\n<p>“아침마다 만두가 없어질까 봐 뛰어가는 네가?”<\/p>\n<p>옆에서 백소윤이 웃음을 삼켰다. 서율은 대꾸하지 못하고 괜히 옷깃을 바로잡았다.<\/p>\n<p>사실 피하고 싶은 사람이 있었다.<\/p>\n<p>서쪽 회랑에서 마주친 사파의 여학생. 진하연.<\/p>\n<p>그날 이후 서율은 그녀를 두 번 더 보았다. 한 번은 식당 입구에서, 또 한 번은 수련동 계단에서였다. 두 번 모두 하연은 그를 알아보고 눈썹을 치켜올렸다. 서율은 먼저 시선을 돌렸다.<\/p>\n<p>소윤은 그때마다 무언가 말하려 했지만, 주변에 사람이 많거나 수업 종이 울려 이야기가 끊겼다. 서율은 소윤이 그날 일을 다시 떠올리기 싫은 것이라고 짐작했다.<\/p>\n<p>“그러지 말고 그냥 가자.”<\/p>\n<p>태경이 그의 등을 밀었다.<\/p>\n<p>“늦으면 교두님한테 혼나.”<\/p>\n<p>“알았어.”<\/p>\n<p>세 사람이 회랑 모퉁이를 돌았을 때였다.<\/p>\n<p>“어라?”<\/p>\n<p>익숙한 목소리가 들렸다.<\/p>\n<p>서율은 고개를 들었다.<\/p>\n<p>진하연이 사파 동기 두 명과 함께 맞은편에서 걸어오고 있었다. 한 명은 긴 머리를 높이 묶은 여학생이었고, 다른 한 명은 짧은 머리에 눈웃음이 선명한 여학생이었다.<\/p>\n<p>하연은 서율을 보자 걸음을 늦췄다.<\/p>\n<p>“이게 누구야. 사람 말은 안 듣고 도망가는 정파 도련님 아니신가.”<\/p>\n<p>서율의 얼굴이 굳었다.<\/p>\n<p>“도망간 적 없습니다.”<\/p>\n<p>“그래? 그날은 내 말이 끝나기도 전에 가 버리던데.”<\/p>\n<p>“친구가 놀라 있었으니까요.”<\/p>\n<p>“아, 그래서 누가 놀라게 했는지 확인할 시간도 없었구나?”<\/p>\n<p>하연은 웃고 있었지만 말끝이 뾰족했다.<\/p>\n<p>태경이 두 사람을 번갈아 봤다.<\/p>\n<p>“잠깐. 너희 아는 사이야?”<\/p>\n<p>“아니.”<\/p>\n<p>“아니거든.”<\/p>\n<p>서율과 하연의 대답이 동시에 나왔다.<\/p>\n<p>짧은 머리 여학생이 웃음을 터뜨렸다.<\/p>\n<p>“호흡은 잘 맞네.”<\/p>\n<p>하연이 그녀를 흘겨봤다.<\/p>\n<p>“린, 너 조용히 해.”<\/p>\n<p>“알았어, 알았어.”<\/p>\n<p>긴 머리를 묶은 여학생도 입가를 가렸다. 하연은 두 친구의 반응이 못마땅한 듯 혀를 찼다.<\/p>\n<p>서율은 가볍게 예를 갖췄다.<\/p>\n<p>“수업이 있어서 먼저 가겠습니다.”<\/p>\n<p>“또?”<\/p>\n<p>하연이 물었다.<\/p>\n<p>“이번에는 정말 수업이야, 아니면 나 보기 싫어서?”<\/p>\n<p>서율은 잠시 망설였다.<\/p>\n<p>“……둘 다입니다.”<\/p>\n<p>태경이 헛기침을 했다. 소윤은 눈을 동그랗게 떴다.<\/p>\n<p>하연의 미소가 잠깐 멈췄다.<\/p>\n<p>“너, 생각보다 말 예쁘게 한다?”<\/p>\n<p>“물으셔서 대답했습니다.”<\/p>\n<p>“그래. 아주 정직하셔.”<\/p>\n<p>하연이 옆으로 비켜섰다.<\/p>\n<p>“가 봐. 또 지각해서 내 탓 하지 말고.”<\/p>\n<p>서율은 고개를 숙이고 지나갔다. 태경과 소윤도 뒤따랐다.<\/p>\n<p>세 사람이 멀어지자 한서린이 하연의 어깨를 툭 쳤다.<\/p>\n<p>“저 애가 그 애야?”<\/p>\n<p>“누구?”<\/p>\n<p>“네가 며칠째 욕하던 정파 애.”<\/p>\n<p>“욕한 적 없어.”<\/p>\n<p>“어제 ‘말귀가 막힌 사람’이라고 했잖아.”<\/p>\n<p>“그건 사실을 말한 거지.”<\/p>\n<p>한서린은 킥킥 웃었다.<\/p>\n<p>“그런데 왜 마주칠 때마다 네가 먼저 불러?”<\/p>\n<p>하연은 대답 대신 앞장서 걸었다.<\/p>\n<p>“수업 늦겠다.”<\/p>\n<p>“우리 수업은 아직 한참 남았는데?”<\/p>\n<p>“……그럼 산책해.”<\/p>\n<h3>2. 식당의 빈자리<\/h3>\n<p>점심 식당은 유난히 붐볐다.<\/p>\n<p>태경이 쟁반을 들고 빈자리를 찾다가 한숨을 쉬었다.<\/p>\n<p>“오늘은 왜 이렇게 사람이 많아?”<\/p>\n<p>“합동 수업이 끝나서 그런가 봐.”<\/p>\n<p>소윤이 말했다.<\/p>\n<p>서율은 창가 쪽의 작은 탁자를 발견했다.<\/p>\n<p>“저기 세 자리 있어.”<\/p>\n<p>세 사람이 앉으려는 순간, 맞은편에서 누군가 쟁반을 내려놓았다.<\/p>\n<p>“여기 비었지?”<\/p>\n<p>진하연이었다.<\/p>\n<p>서율은 잠시 굳었다.<\/p>\n<p>“……다른 자리도 많을 텐데요.”<\/p>\n<p>“어디?”<\/p>\n<p>하연이 식당을 둘러봤다. 정말로 빈자리는 거의 없었다.<\/p>\n<p>서율은 입을 다물었다.<\/p>\n<p>“없네.”<\/p>\n<p>하연이 만족스럽게 앉았다. 한서린과 긴 머리의 동기 역시 옆 탁자에 자리를 잡았다.<\/p>\n<p>태경은 상황이 재미있다는 듯 입꼬리를 올렸다.<\/p>\n<p>“서율아, 아는 사람 아니라며?”<\/p>\n<p>“아니야.”<\/p>\n<p>하연이 숟가락을 들었다.<\/p>\n<p>“맞아. 모르는 사람이야. 사람을 보자마자 죄인 취급하는 버릇이 있다는 것만 알지.”<\/p>\n<p>서율이 숟가락을 내려놓았다.<\/p>\n<p>“그날 일은…….”<\/p>\n<p>“그날 일은?”<\/p>\n<p>하연이 기다렸다는 듯 되물었다.<\/p>\n<p>소윤이 급히 입을 열었다.<\/p>\n<p>“저, 사실은…….”<\/p>\n<p>그때 식당 안쪽에서 쟁반이 바닥에 떨어졌다. 요란한 소리와 함께 사람들이 일제히 돌아봤다. 국물이 쏟아져 지나가던 학도생의 옷을 적셨다.<\/p>\n<p>태경이 벌떡 일어났다.<\/p>\n<p>“어, 저 사람 괜찮나?”<\/p>\n<p>소윤도 일어나 헝겊을 가져다주었다. 서율은 넘어질 뻔한 학생의 쟁반을 주워 주었다.<\/p>\n<p>소란이 가라앉았을 때 하연은 이미 식사를 마치고 일어서 있었다.<\/p>\n<p>“착한 일은 잘하네.”<\/p>\n<p>그녀가 서율에게 말했다.<\/p>\n<p>“남의 말도 그렇게 잘 들으면 좋을 텐데.”<\/p>\n<p>“…….”<\/p>\n<p>“다음에 보자, 정파 도련님.”<\/p>\n<p>하연은 친구들과 함께 떠났다.<\/p>\n<p>서율은 뒷모습을 바라보다가 한숨을 쉬었다.<\/p>\n<p>태경이 옆에 앉았다.<\/p>\n<p>“야. 너 저 사람이랑 진짜 무슨 일 있었냐?”<\/p>\n<p>“전에 말했잖아.”<\/p>\n<p>“그건 네가 본 거고. 소윤이는 아직 제대로 설명도 안 했는데.”<\/p>\n<p>서율이 소윤을 바라봤다.<\/p>\n<p>소윤은 수저를 가지런히 놓았다.<\/p>\n<p>“맞아. 내가 말해야 할 게 있어.”<\/p>\n<p>그녀는 잠시 숨을 골랐다.<\/p>\n<p>“그날 나를 구해 준 사람은 진하연이야.”<\/p>\n<p>서율의 눈이 커졌다.<\/p>\n<p>“……뭐?”<\/p>\n<p>“수첩을 뺏은 건 정파 학생들이고, 진하연은 그 사람들을 말렸어. 수첩도 되찾아 줬고.”<\/p>\n<p>태경이 서율을 쳐다봤다.<\/p>\n<p>“그럼 너…….”<\/p>\n<p>“응.”<\/p>\n<p>소윤이 조용히 말했다.<\/p>\n<p>“서율이가 오해한 거야.”<\/p>\n<p>서율은 한동안 아무 말도 하지 못했다.<\/p>\n<p>자신이 하연에게 했던 말이 떠올랐다.<\/p>\n<p><em>다시는 제 친구를 건드리지 말아 주십시오.<\/em><\/p>\n<p>하연의 얼굴에서 웃음기가 사라졌던 순간도.<\/p>\n<p>“왜 그때 말 안 했어?”<\/p>\n<p>질문이 튀어나오자 소윤의 표정이 조금 어두워졌다.<\/p>\n<p>서율은 곧바로 고개를 저었다.<\/p>\n<p>“아니. 미안. 네 탓을 하려던 게 아니야.”<\/p>\n<p>소윤이 고개를 숙였다.<\/p>\n<p>“나도 그때 바로 말했어야 했는데. 너무 정신이 없었어.”<\/p>\n<p>태경이 두 사람 사이에 손을 내밀었다.<\/p>\n<p>“잠깐. 그럼 지금 중요한 건 누가 늦게 말했느냐가 아니잖아.”<\/p>\n<p>서율이 그를 바라봤다.<\/p>\n<p>“네가 사과해야지.”<\/p>\n<p>“……응.”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>“맞아.”<\/p>\n<p>그는 하연이 사라진 식당 문을 바라봤다.<\/p>\n<p>이상하게 얼굴이 뜨거웠다.<\/p>\n<h3>3. 사과할 기회<\/h3>\n<p>그날 오후, 서율은 수련장으로 향하는 길에서 진하연을 발견했다.<\/p>\n<p>그녀는 회랑 난간에 기대어 한서린과 이야기하고 있었다.<\/p>\n<p>서율은 걸음을 멈췄다.<\/p>\n<p><em>'지금 말하자.'<\/em><\/p>\n<p>그가 다가가려는 순간 하연이 먼저 고개를 들었다.<\/p>\n<p>“어라. 또 만났네?”<\/p>\n<p>서율은 숨을 고르고 예를 갖췄다.<\/p>\n<p>“진하연.”<\/p>\n<p>하연의 눈썹이 올라갔다.<\/p>\n<p>“이번엔 이름도 알아?”<\/p>\n<p>“그날 일에 대해…….”<\/p>\n<p>“그날 일?”<\/p>\n<p>하연이 몸을 바로 세웠다.<\/p>\n<p>서율은 말을 이었다.<\/p>\n<p>“제가 잘못 알았습니다. 백소윤에게 들었습니다.”<\/p>\n<p>하연은 잠시 그를 바라봤다.<\/p>\n<p>“그래서?”<\/p>\n<p>“그날 친구를 도와주셨다고요.”<\/p>\n<p>“응. 그랬지.”<\/p>\n<p>“감사합니다. 그리고…….”<\/p>\n<p>그 순간 연무장 쪽에서 담당 선배의 호통이 들렸다.<\/p>\n<p>“전서율! 여기서 뭐 하고 있나! 제삼 수련반 집합이다!”<\/p>\n<p>서율이 돌아봤다.<\/p>\n<p>“아, 네! 바로 가겠습니다!”<\/p>\n<p>그는 하연을 향해 다시 고개를 숙였다.<\/p>\n<p>“죄송합니다. 나중에 다시 말씀드리겠습니다.”<\/p>\n<p>그리고 뛰어갔다.<\/p>\n<p>하연은 멀어지는 뒷모습을 멍하니 바라봤다.<\/p>\n<p>“……또 가?”<\/p>\n<p>한서린이 웃음을 터뜨렸다.<\/p>\n<p>“푸하하! 이번엔 사과하려던 것 같은데?”<\/p>\n<p>하연은 팔짱을 꼈다.<\/p>\n<p>“알아.”<\/p>\n<p>“그럼 됐네.”<\/p>\n<p>“안 됐거든.”<\/p>\n<p>“왜?”<\/p>\n<p>“끝까지 듣지도 못했잖아.”<\/p>\n<p>한서린은 하연을 빤히 바라봤다.<\/p>\n<p>“너 정말 그 애한테 사과받고 싶은 거야?”<\/p>\n<p>“당연하지.”<\/p>\n<p>“그런데 방금 거의 했잖아.”<\/p>\n<p>하연은 잠시 말이 막혔다.<\/p>\n<p>“……거의랑 한 건 다르지.”<\/p>\n<p>한서린은 더 묻지 않았다. 다만 웃음을 참느라 어깨를 들썩였다.<\/p>\n<h3>4. 한 걸음의 차이<\/h3>\n<p>며칠 뒤, 정사 합동 실기 수업이 열렸다.<\/p>\n<p>그날의 과제는 공격을 받아 흘리는 기초 보법이었다. 서로 다른 수련반의 학생들이 짝을 이루어 목검으로 가벼운 공격을 주고받았다.<\/p>\n<p>서율은 시범을 지켜보다가 자신도 모르게 몸을 앞으로 기울였다.<\/p>\n<p>공격을 피하면서 검을 거두는 동작.<\/p>\n<p>그가 며칠째 고민하던 것과 닮아 있었다.<\/p>\n<p>“전서율.”<\/p>\n<p>담당 교두가 불렀다.<\/p>\n<p>“나와서 해 보아라.”<\/p>\n<p>“네!”<\/p>\n<p>서율은 목검을 들고 앞으로 나섰다. 상대는 같은 반 학생이었다.<\/p>\n<p>첫 번째 공격은 무난히 흘렸다.<\/p>\n<p>두 번째 공격에서는 발이 늦었다.<\/p>\n<p>세 번째 공격을 피하려다 서율은 검을 거두지 않고 옆으로 돌려 보았다.<\/p>\n<p>탁!<\/p>\n<p>목검끼리 부딪혔다.<\/p>\n<p>순간 손목에 힘이 쏠렸다. 서율은 균형을 잃고 한쪽 무릎을 꿇었다.<\/p>\n<p>“그만.”<\/p>\n<p>교두가 말했다.<\/p>\n<p>“변형을 시도하려면 먼저 중심을 잡아야 한다. 공격을 피하는 것과 반격하는 것을 한꺼번에 하려다 둘 다 놓쳤다.”<\/p>\n<p>“네.”<\/p>\n<p>서율은 일어나 먼지를 털었다.<\/p>\n<p>관람하던 학생 몇 명이 웃었다.<\/p>\n<p>그때 사파 쪽에서 목소리가 들렸다.<\/p>\n<p>“발이 너무 빨랐어.”<\/p>\n<p>진하연이었다.<\/p>\n<p>교두가 그녀를 바라봤다.<\/p>\n<p>“진하연. 설명해 보겠느냐?”<\/p>\n<p>하연은 자리에서 일어났다.<\/p>\n<p>“검을 돌리기 전에 앞발부터 빠졌어요. 그러니까 몸이 검을 따라가지 못한 거죠.”<\/p>\n<p>그녀는 자신의 자리에서 한 걸음만 옮겨 보였다. 검을 들지도 않은 단순한 동작이었다.<\/p>\n<p>“저렇게 멀리 움직일 필요는 없어요. 피할 만큼만 피하면 되니까.”<\/p>\n<p>교두가 고개를 끄덕였다.<\/p>\n<p>“좋다. 정확한 지적이다.”<\/p>\n<p>서율은 그 말을 곱씹었다.<\/p>\n<p><em>'피할 만큼만.'<\/em><\/p>\n<p>하연은 다시 앉으며 그를 흘끗 봤다.<\/p>\n<p>“넘어지는 건 잘하네.”<\/p>\n<p>주변에서 작은 웃음이 났다.<\/p>\n<p>서율은 잠시 얼굴을 붉혔다가 대답했다.<\/p>\n<p>“오늘은 한 번뿐이었습니다.”<\/p>\n<p>하연이 눈을 깜빡였다.<\/p>\n<p>“뭐?”<\/p>\n<p>“지난번에는 세 번 넘어졌거든요.”<\/p>\n<p>이번에는 하연이 웃음을 터뜨렸다.<\/p>\n<p>“하하! 그게 자랑이야?”<\/p>\n<p>“나아지고 있다는 뜻입니다.”<\/p>\n<p>“그래, 그건 인정.”<\/p>\n<p>하연은 턱을 괴었다.<\/p>\n<p>“다음엔 안 넘어지는 것도 보여 줘.”<\/p>\n<p>서율은 목검을 바로 쥐었다.<\/p>\n<p>“해 보겠습니다.”<\/p>\n<p>그날 서율은 다시 같은 동작을 시도했다. 완전히 성공하지는 못했지만, 적어도 무릎을 꿇지는 않았다.<\/p>\n<p>하연은 그 모습을 잠깐 지켜보다가 시선을 돌렸다.<\/p>\n<p>한서린이 그녀의 귀에 속삭였다.<\/p>\n<p>“너, 저 애 수련까지 봐 주네?”<\/p>\n<p>“교두님이 물으셨잖아.”<\/p>\n<p>“응. 그런데 왜 웃어?”<\/p>\n<p>하연은 입가를 손등으로 가렸다.<\/p>\n<p>“안 웃었거든.”<\/p>\n<h3>5. 끝나지 않은 말<\/h3>\n<p>수업이 끝난 뒤, 서율은 일부러 회랑에서 기다렸다.<\/p>\n<p>태경이 물었다.<\/p>\n<p>“안 가?”<\/p>\n<p>“먼저 가 있어. 할 말이 있어서.”<\/p>\n<p>소윤은 그의 표정을 보고 알아차렸다.<\/p>\n<p>“진하연한테?”<\/p>\n<p>“응.”<\/p>\n<p>“이번에는 끝까지 말해.”<\/p>\n<p>태경이 웃었다.<\/p>\n<p>“종 울린다고 또 도망가지 말고.”<\/p>\n<p>“알았어.”<\/p>\n<p>두 친구가 먼저 떠났다.<\/p>\n<p>잠시 후 하연이 한서린과 함께 나타났다. 서율을 발견한 한서린이 의미심장하게 웃었다.<\/p>\n<p>“하연아, 나 먼저 갈게.”<\/p>\n<p>“왜?”<\/p>\n<p>“갑자기 할 일이 생각났어.”<\/p>\n<p>“아까는 없다고 했잖아.”<\/p>\n<p>“지금 생겼어.”<\/p>\n<p>한서린은 손을 흔들며 사라졌다.<\/p>\n<p>하연은 한숨을 쉬었다.<\/p>\n<p>“쟤는 꼭 저런다니까.”<\/p>\n<p>서율은 그녀 앞에 섰다.<\/p>\n<p>“잠깐 시간 괜찮습니까?”<\/p>\n<p>하연은 팔짱을 꼈다.<\/p>\n<p>“이번엔 몇 마디나 할 수 있는데?”<\/p>\n<p>“끝까지 하겠습니다.”<\/p>\n<p>“그래. 해 봐.”<\/p>\n<p>서율은 숨을 들이쉬었다.<\/p>\n<p>“서쪽 회랑에서 제가 잘못 판단했습니다. 친구가 놀란 모습만 보고 상황을 확인하지 않았습니다.”<\/p>\n<p>하연의 표정이 조금 누그러졌다.<\/p>\n<p>“……응.”<\/p>\n<p>“친구를 도와주셨는데도 무례하게 말씀드렸습니다. 죄송합니다.”<\/p>\n<p>서율은 허리를 숙였다.<\/p>\n<p>하연은 한동안 아무 말도 하지 않았다.<\/p>\n<p>서율이 고개를 들자 그녀가 물었다.<\/p>\n<p>“그럼 이제 내가 나쁜 사람 아닌 건 알겠네?”<\/p>\n<p>“네.”<\/p>\n<p>“다음부터는?”<\/p>\n<p>“먼저 확인하겠습니다.”<\/p>\n<p>“좋아.”<\/p>\n<p>하연은 고개를 끄덕였다.<\/p>\n<p>“그 정도면 됐어.”<\/p>\n<p>서율은 조금 안도했다.<\/p>\n<p>“감사합니다.”<\/p>\n<p>“그런데.”<\/p>\n<p>하연이 한 걸음 가까이 다가왔다.<\/p>\n<p>“너 말이야. 그날 나한테 엄청 무섭게 노려봤잖아.”<\/p>\n<p>서율은 멋쩍게 웃었다.<\/p>\n<p>“그랬습니까?”<\/p>\n<p>“그랬어. 당장이라도 검을 뽑을 것처럼.”<\/p>\n<p>“검을 뽑을 생각은 없었습니다.”<\/p>\n<p>“알아.”<\/p>\n<p>하연은 웃었다.<\/p>\n<p>“친구를 데려가려고 했던 거잖아.”<\/p>\n<p>서율은 그녀를 바라봤다.<\/p>\n<p>하연이 말을 이었다.<\/p>\n<p>“판단은 엉망이었는데, 친구 앞에 서는 건 망설이지 않더라.”<\/p>\n<p>“……그건.”<\/p>\n<p>“칭찬하는 거야. 아주 조금.”<\/p>\n<p>서율은 어쩔 줄 몰라 하다가 고개를 숙였다.<\/p>\n<p>“감사합니다.”<\/p>\n<p>하연이 피식 웃었다.<\/p>\n<p>“너는 고맙다는 말이 참 많네.”<\/p>\n<p>“도움을 받았으니까요.”<\/p>\n<p>“그럼 다음에 또 마주치면 도망가지 마.”<\/p>\n<p>“도망간 적은…….”<\/p>\n<p>서율은 말을 멈췄다.<\/p>\n<p>하연이 눈을 가늘게 떴다.<\/p>\n<p>“없다고?”<\/p>\n<p>“……조금 피하긴 했습니다.”<\/p>\n<p>하연은 소리 내어 웃었다.<\/p>\n<p>“하하! 이제야 솔직하네.”<\/p>\n<p>그녀는 손을 흔들며 돌아섰다.<\/p>\n<p>“그럼 다음에 봐, 전서율.”<\/p>\n<p>서율은 멀어지는 뒷모습을 바라봤다.<\/p>\n<p>처음 마주쳤을 때와는 다른 기분이었다.<\/p>\n<p><em>'생각보다 나쁜 사람은 아니네.'<\/em><\/p>\n<p>그는 혼자 작게 웃었다.<\/p>\n<p>한편 회랑 모퉁이를 돈 하연은 기다리고 있던 한서린과 마주쳤다.<\/p>\n<p>“어땠어?”<\/p>\n<p>“뭐가?”<\/p>\n<p>“사과.”<\/p>\n<p>“받았어.”<\/p>\n<p>“그래서 기분 좋아?”<\/p>\n<p>하연은 잠시 생각했다.<\/p>\n<p>“……속은 시원하네.”<\/p>\n<p>한서린은 그녀의 얼굴을 살폈다.<\/p>\n<p>“그런데 왜 그렇게 웃고 있어?”<\/p>\n<p>하연은 얼른 입꼬리를 내렸다.<\/p>\n<p>“내가 언제?”<\/p>\n<p>“방금.”<\/p>\n<p>“기분이 좋아서 웃을 수도 있지.”<\/p>\n<p>“그렇지. 누구 때문에 좋은지는 모르겠지만.”<\/p>\n<p>“한서린.”<\/p>\n<p>“응?”<\/p>\n<p>“너 오늘 수련 더 할래?”<\/p>\n<p>한서린은 곧장 도망쳤다.<\/p>\n<p>“아니! 나 먼저 갈게!”<\/p>\n<p>하연은 그 뒤를 쫓는 시늉을 하다가 결국 웃고 말았다.<\/p>\n<p>그날 이후 서율과 하연은 마주치면 인사를 나누게 되었다.<\/p>\n<p>물론 평범한 인사만 오간 것은 아니었다.<\/p>\n<p>“오늘은 안 넘어졌어?”<\/p>\n<p>“오늘은 아직 수련 전입니다.”<\/p>\n<p>“그럼 오후에 물어봐야겠네.”<\/p>\n<p>“굳이 그러실 필요는 없습니다.”<\/p>\n<p>두 사람의 대화는 늘 그런 식이었다.<\/p>\n<p>태경은 그 모습을 보고 고개를 저었고, 소윤은 웃으며 수첩에 짧은 문장을 남겼다.<\/p>\n<p><em>전서율과 진하연 — 이제는 서로 말이 통하는 모양.<\/em><\/p>\n<p>그날 밤, 학관 게시판에는 새로운 공지가 붙었다.<\/p>\n<p><strong>정사 대표 선발 비무 개최.<\/strong><\/p>\n<p><strong>각 수련반 참가 신청 접수.<\/strong><\/p>\n<p>아직 그 공지를 읽은 사람은 많지 않았다.<\/p>\n<p>하지만 다음 날 아침이면 학관 전체가 그 이야기로 떠들썩해질 터였다.<\/p>\n<p><strong>— 제6장 「마주치는 사람」 끝.<\/strong><\/p>\n"}, {"n": 7, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제7장. 세 사람의 약속<\/h2>\n<blockquote>\n<p>라이트 노벨 초고 v0.1 · 제6장 직후 · 최종 검수 전<\/p>\n<\/blockquote>\n<h3>1. 출전 신청서<\/h3>\n<p>“전서율!”<\/p>\n<p>윤태경이 식당 문을 박차고 들어왔다. 머리카락은 사방으로 뻗쳐 있었고 손에는 종이 한 장이 들려 있었다.<\/p>\n<p>“큰일 났어! 정사 대표 선발 비무! 다음 달에 한대! 우리도 나갈 수 있대!”<\/p>\n<p>백소윤이 수첩에서 눈을 들었다. “그건 어제 게시판에 붙었잖아.”<\/p>\n<p>“알고 있었어?”<\/p>\n<p>“응. 어제 말하려고 했는데 네가 저녁 먹자마자 잠들었어.”<\/p>\n<p>전서율이 만두를 삼키며 웃었다. “하하! 그러게 누가 그렇게 일찍 자래?”<\/p>\n<p>태경은 못 들은 척 맞은편에 앉았다. “아무튼 우리 셋 다 나가자.”<\/p>\n<p>“태경아. 대회는 구경하러 가는 게 아니야.” 소윤이 말했다.<\/p>\n<p>“알아. 싸우러 가는 거잖아.”<\/p>\n<p>“비무라고 해야지.”<\/p>\n<p>“그게 그거잖아!”<\/p>\n<p>서율은 공고문을 펼쳤다. 정파와 사파가 각자 예선을 치러 대표를 뽑고, 마지막에는 두 대표가 겨룬다. 신입생도 참가할 수 있으나 교두의 승인이 필요했다.<\/p>\n<p>‘정파 대표.’<\/p>\n<p>서율에게는 아직 먼 이름이었다. 기본 초식조차 완벽하지 않았다. 그래도 강한 사람들의 검을 직접 마주해 보고 싶었다.<\/p>\n<p>“나는 나가 보고 싶어.”<\/p>\n<p>태경이 탁자를 쳤다. “그렇지!”<\/p>\n<p>소윤은 신청서를 내려다봤다. “나는…… 잘 모르겠어. 상대가 갑자기 움직이면 머릿속이 하얘져.”<\/p>\n<p>“그럼 오늘 우리끼리 대련해 보자.” 서율이 말했다. “해 보고 결정하면 되잖아.”<\/p>\n<p>소윤은 잠시 망설이다 고개를 끄덕였다. “응. 그건 괜찮겠다.”<\/p>\n<p>“좋아! 오늘부터 특별 수련이다!”<\/p>\n<p>태경이 소리치자 지나가던 선배가 돌아봤다. “윤태경, 식당에서 조용히.”<\/p>\n<p>“……네.”<\/p>\n<p>서율과 소윤은 동시에 고개를 숙이고 웃음을 참았다.<\/p>\n<h3>2. 세 사람의 첫 대련<\/h3>\n<p>오후 수업을 마친 뒤 세 사람은 담당 선배에게 허락을 받아 보호구와 목검을 착용했다. 선배는 머리와 관절에 무리한 공격을 하지 말 것, 중지 신호에 즉시 멈출 것을 당부했다.<\/p>\n<p>첫 상대는 태경과 서율이었다.<\/p>\n<p>“친구라고 봐주지 않는다.” 태경이 선언했다.<\/p>\n<p>“나도.” 서율이 검을 세웠다.<\/p>\n<p>태경은 기합과 함께 달려들었다. 탁! 서율의 손목이 얼얼했다. 두 번째 공격에 옆으로 물러나려 했지만 발이 늦었다.<\/p>\n<p>“일점!” 소윤이 외쳤다.<\/p>\n<p>“봤냐!” 태경이 환호했다.<\/p>\n<p>서율은 웃으며 자세를 바로잡았다. “이번엔 안 당해.”<\/p>\n<p>다음 공격을 피한 서율은 검을 거두지 않고 옆으로 돌려 보았다. 하지만 생각보다 몸이 늦었다. 태경이 이미 자세를 회복해 반격했다.<\/p>\n<p>“너 또 이상한 거 하려 했지?”<\/p>\n<p>“……응.”<\/p>\n<p>“아직 안 되잖아!”<\/p>\n<p>“그러게!”<\/p>\n<p>결과는 태경의 삼 대 일 승리였다. 소윤이 수첩에 기록하자 태경이 으스댔다.<\/p>\n<p>“기록으로 남으니까 더 좋네.”<\/p>\n<p>“태경이의 첫 승리.”<\/p>\n<p>“그 말은 굳이 안 써도 돼!”<\/p>\n<p>다음은 소윤과 태경의 대련이었다. 소윤은 검이 내려오는 것을 보았다. 피해야 한다는 것도 알았다. 하지만 왼쪽으로 피할지 검으로 막을지 생각하는 동안 목검이 보호구에 닿았다.<\/p>\n<p>두 번째도, 세 번째도 비슷했다.<\/p>\n<p>“중지.” 서율이 말했다.<\/p>\n<p>소윤은 고개를 숙였다. “미안. 제대로 상대도 못 해 줬잖아.”<\/p>\n<p>“뭐가 미안해?” 태경은 목검을 어깨에 걸치려다 보호구에 걸려 낑낑댔다. “나도 맨날 실수하잖아.”<\/p>\n<p>서율이 웃음을 터뜨렸다. “그건 맞아.”<\/p>\n<p>“야!”<\/p>\n<p>소윤도 마침내 웃었다.<\/p>\n<p>서율은 그녀에게 물었다. “아까 뭘 하려고 했어?”<\/p>\n<p>“왼쪽으로 피하려고 했는데 막는 게 더 나을 것 같아서…….”<\/p>\n<p>“그럼 이번에는 피하는 것만 해 보자. 공격하지 말고 한 걸음만 움직여.”<\/p>\n<p>태경이 천천히 검을 내렸다. 소윤은 왼쪽으로 비켜섰다. 이번에는 늦지 않았다.<\/p>\n<p>“됐어!” 서율이 외쳤다.<\/p>\n<p>다시 한 번. 그리고 또 한 번. 소윤은 네 번 중 세 번을 피했다.<\/p>\n<p>“생각을 덜 하니까 오히려 움직여졌어.” 그녀가 신기한 듯 말했다.<\/p>\n<p>태경이 고개를 끄덕였다. “나는 원래 생각을 별로 안 하거든.”<\/p>\n<p>“그건 알고 있어.” 서율이 대답했다.<\/p>\n<p>“……칭찬 맞지?”<\/p>\n<h3>3. 서로 다른 장점<\/h3>\n<p>며칠 동안 세 사람의 일과가 바뀌었다. 아침에는 기초 수련, 오후에는 정규 수업, 저녁에는 특별 훈련.<\/p>\n<p>태경은 첫 공격이 빨랐지만 상대가 피하면 다음 동작이 거칠어졌다. 소윤은 초식을 정확히 기억하고 상대의 자세를 잘 읽었지만 판단을 실행하기까지 시간이 걸렸다. 서율은 상대의 움직임을 세심하게 보았으나 직접 겨루면 생각이 많아졌다.<\/p>\n<p>“서율아!”<\/p>\n<p>태경의 검이 날아왔다. 서율은 검을 흘린 뒤 다음 동작으로 이어 보려 했다. 하지만 발이 너무 멀리 나갔다.<\/p>\n<p>“으악!”<\/p>\n<p>털썩.<\/p>\n<p>“또 넘어졌어?” 태경이 웃었다.<\/p>\n<p>소윤이 손을 내밀었다. “검은 잘 돌아갔는데 몸이 따라가지 못했어.”<\/p>\n<p>“그랬어?” 서율이 손을 잡고 일어났다.<\/p>\n<p>태경은 고개를 저었다. “그냥 검을 거두고 다시 휘두르면 되잖아.”<\/p>\n<p>“그게 더 빠를 때도 있겠지. 그런데 안 거두는 게 더 빠를 때도 있을 것 같아서.”<\/p>\n<p>“너 진짜 이상한 데서 고집 세다.”<\/p>\n<p>소윤이 수첩을 펼쳤다. “그래도 오늘은 두 번 성공했어.”<\/p>\n<p>“정말?”<\/p>\n<p>“응. 첫 번째는 공격을 흘렸을 때. 두 번째는 넘어지기 직전.”<\/p>\n<p>태경이 눈을 가늘게 떴다. “넘어지는 것도 성공이야?”<\/p>\n<p>“넘어지기 전까지는 괜찮았거든.”<\/p>\n<p>서율은 목검을 바라봤다. 힘을 어디서 빼고 다시 실어야 할지 아직 몰랐다. 그렇기에 더 해 보고 싶었다.<\/p>\n<p>“내일은 세 번 성공해 볼게.”<\/p>\n<p>“그럼 나는 세 번 넘어지는지 지켜봐야겠다.”<\/p>\n<p>“야!”<\/p>\n<h3>4. 제일 연무장의 사람들<\/h3>\n<p>대회가 가까워지자 제일 연무장의 공개 대련에는 관람객이 몰렸다. 서율과 친구들도 수련을 마치고 구경하러 갔다.<\/p>\n<p>상위 조 학생들의 검은 빨랐다. 서율이 간신히 한 번 막을 시간에 세 번씩 공격이 오갔다.<\/p>\n<p>“차이가 크네.” 서율이 중얼거렸다.<\/p>\n<p>“언젠가는 따라잡을 거야.” 태경이 팔짱을 꼈다.<\/p>\n<p>환호성이 터졌다. 명문가 문양을 단 남학생이 상대의 목검을 튕겨 내고 있었다. 예전에 세 사람을 모욕했던 학생이었다. 마지막 공격이 정확히 보호구에 닿았다.<\/p>\n<p>“승!”<\/p>\n<p>서율은 그의 실력이 뛰어나다는 사실을 인정했다. 그렇기에 마음이 복잡했다. 좋은 검을 쓰는 사람이 반드시 좋은 사람인 것은 아닐까.<\/p>\n<p>그때 소윤이 그의 소매를 잡았다. “서율아. 저기.”<\/p>\n<p>사파 학도생들 사이에 진하연이 있었다. 하연은 검집을 정리하다가 관람석 쪽을 돌아봤다. 서율과 눈이 마주치자 씩 웃으며 손을 흔들었다.<\/p>\n<p>서율은 당황해 어정쩡하게 고개를 숙였다.<\/p>\n<p>태경이 어깨를 쳤다. “야, 너한테 인사한 거야?”<\/p>\n<p>“……그런 것 같은데.”<\/p>\n<p>소윤이 웃었다. “이제는 친해졌네.”<\/p>\n<p>“그 정도는 아니야.”<\/p>\n<p>소윤은 수첩에 짧게 적었다.<\/p>\n<p><em>진하연 — 서율에게 먼저 인사함.<\/em><\/p>\n<p>태경이 그걸 보고 고개를 저었다. “너 그런 것도 적어?”<\/p>\n<p>“재미있으니까.”<\/p>\n<h3>5. 참가하지 않는 이유<\/h3>\n<p>신청 마감 전날, 태경과 서율은 이미 참가 명단에 이름을 올렸다. 남은 사람은 소윤뿐이었다.<\/p>\n<p>“결정했어?” 태경이 물었다.<\/p>\n<p>소윤은 신청서를 내려다보다가 고개를 저었다. “이번에는 안 나갈래.”<\/p>\n<p>“왜? 같이 나가면 좋을 텐데.”<\/p>\n<p>“나도 그러고 싶었어. 그런데 아직 준비가 안 된 것 같아.”<\/p>\n<p>서율은 조용히 고개를 끄덕였다. “그럴 수 있지.”<\/p>\n<p>“너는 안 아쉬워?” 태경이 물었다.<\/p>\n<p>“아쉽지. 그래도 소윤이가 결정한 거잖아.”<\/p>\n<p>소윤은 두 사람을 바라봤다. “대신 너희 수련은 계속 도와줄게. 상대 초식도 정리하고, 대련도 봐 줄게.”<\/p>\n<p>그녀는 수첩을 들어 보였다. “내가 잘하는 건 그거니까.”<\/p>\n<p>“그럼 우리 셋이 같이 준비하는 거네.” 서율이 웃었다.<\/p>\n<p>“응.”<\/p>\n<p>태경도 씩 웃었다. “좋아. 두 명이 싸우고 한 명이 작전을 세우는 거다.”<\/p>\n<p>“작전이라고 할 정도는 아닌데.”<\/p>\n<p>“아주 중요해. 내가 실수하면 바로 알려 줘.”<\/p>\n<p>“그건 매번 하고 있잖아.”<\/p>\n<p>“……그러네.”<\/p>\n<p>소윤은 신청서를 접어 품에 넣었다. 함께할 방법은 하나가 아니었다. 자신이 할 수 없는 일을 억지로 해내야만 두 사람의 친구로 남는 것은 아니었다.<\/p>\n<h3>6. 세 사람의 약속<\/h3>\n<p>대회 전날 저녁, 제삼 연무장에는 늦게까지 목검 소리가 울렸다.<\/p>\n<p>탁!<\/p>\n<p>태경의 검을 막은 서율은 한 걸음 비켜선 뒤, 무리한 변형 대신 배운 대로 자세를 바로잡았다. 짧은 반격이 태경의 보호구에 닿았다.<\/p>\n<p>“일점!” 소윤이 외쳤다.<\/p>\n<p>태경이 숨을 몰아쉬었다. “야, 너 요즘 좀 잘하는데?”<\/p>\n<p>“아직 멀었어.”<\/p>\n<p>“그건 나도 알아. 그래도 처음보다 나아졌잖아.”<\/p>\n<p>소윤이 수첩을 펼쳤다. “처음엔 태경이가 삼 대 일이었는데 오늘은 서율이가 삼 대 이로 이겼어.”<\/p>\n<p>“내가 진 것까지 기록하지 마!”<\/p>\n<p>세 사람은 웃으며 연무장 가장자리에 앉았다. 하늘이 어두워지고 있었다.<\/p>\n<p>“내일은 진짜 대회네.” 태경이 말했다.<\/p>\n<p>“긴장돼?” 소윤이 물었다.<\/p>\n<p>“조금. 첫판에 지면 창피하잖아.”<\/p>\n<p>서율이 웃었다. “나도 무서워. 내가 얼마나 부족한지 직접 알게 될 테니까.”<\/p>\n<p>“그런데 왜 나가?”<\/p>\n<p>“그래도 해 보고 싶으니까.”<\/p>\n<p>태경은 잠시 생각하다 웃었다. “나도.”<\/p>\n<p>소윤이 말했다. “나는 관람석에서 볼게.”<\/p>\n<p>“응원 크게 해 줘.”<\/p>\n<p>“그건 조금 부끄러운데.”<\/p>\n<p>“우리 편이잖아.”<\/p>\n<p>소윤은 잠시 말을 멈췄다. “……응. 우리 편이지.”<\/p>\n<p>태경이 손을 내밀었다. “약속하자. 내일 누가 먼저 지더라도 놀리지 않기.”<\/p>\n<p>서율이 웃었다. “그건 네가 제일 어려울 것 같은데.”<\/p>\n<p>“야! 진지하거든!”<\/p>\n<p>소윤이 손을 올렸다. 서율도 그 위에 손을 포갰다.<\/p>\n<p>“그리고 끝나면 같이 밥 먹기.” 태경이 덧붙였다.<\/p>\n<p>“그건 매일 하잖아.”<\/p>\n<p>“대회 끝나고 먹는 밥은 다르지.”<\/p>\n<p>세 사람은 서로를 바라보며 웃었다.<\/p>\n<p>서율은 생각했다.<\/p>\n<p><em>'여기 오길 잘했다.'<\/em><\/p>\n<p>자신만의 검술은 아직 완성되지 않았다. 강호에 이름을 떨칠 날도 멀었다. 하지만 지금은 함께 밥을 먹고, 함께 수련하고, 실수하면 웃어 주는 사람들이 있었다.<\/p>\n<p>“내일 반드시 이기자!” 태경이 외쳤다.<\/p>\n<p>“그래!” 서율이 손을 들었다.<\/p>\n<p>“힘내자!” 소윤도 작게 외쳤다.<\/p>\n<p>세 사람의 웃음소리가 저녁 연무장에 퍼졌다.<\/p>\n<p>그리고 다음 날 아침, 정사 대표 선발 비무의 첫 번째 종이 울렸다.<\/p>\n<p><strong>— 제7장 「세 사람의 약속」 끝.<\/strong><\/p>\n"}, {"n": 8, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제8장. 첫 번째 패배<\/h2>\n<h3>1. 첫 번째 종<\/h3>\n<p>둥—.<\/p>\n<p>대연무장에 울린 종소리가 아침 안개를 밀어냈다.<\/p>\n<p>관람석은 벌써 학도생들로 가득했다. 정파의 푸른 깃발이 바람에 펄럭였고, 반대편 높은 처마에는 사파의 붉은 깃발이 걸려 있었다. 오늘부터 며칠 동안 각 세력은 내부 비무를 치른다. 마지막까지 남은 두 사람이 각자의 이름을 걸고 맞선다.<\/p>\n<p>윤태경은 관람석을 올려다보며 입을 벌렸다.<\/p>\n<p>“와. 진짜 사람이 이렇게 많이 와?”<\/p>\n<p>“어제도 많이 온다고 했잖아.”<\/p>\n<p>백소윤은 태경의 삐뚤어진 옷깃을 바로잡아 주었다.<\/p>\n<p>“그래도 이렇게 많을 줄은 몰랐지.”<\/p>\n<p>태경은 웃으려다가 입술을 꾹 다물었다. 목검을 쥔 손에 땀이 배어 있었다.<\/p>\n<p>전서율이 그 손을 보고 말했다.<\/p>\n<p>“긴장돼?”<\/p>\n<p>“안 돼.”<\/p>\n<p>“손이 떨리는데?”<\/p>\n<p>“추워서 그래.”<\/p>\n<p>“오늘 더운데.”<\/p>\n<p>“……너 오늘따라 말이 많다?”<\/p>\n<p>소윤이 웃었다. 그녀는 출전하지 않기로 했지만 세 사람 가운데 가장 일찍 일어났다. 상대 명단을 옮겨 적고, 물통을 챙기고, 대련 전 준비운동 순서까지 수첩에 적어 왔다.<\/p>\n<p>“태경아, 첫 상대는 제이 수련반의 도겸이라는 학생이야. 오른손잡이고 첫 공격이 빠르대.”<\/p>\n<p>“누가 그래?”<\/p>\n<p>“어제 연습하는 걸 봤어.”<\/p>\n<p>태경은 눈을 동그랗게 떴다.<\/p>\n<p>“너 언제 그런 것까지 봤냐?”<\/p>\n<p>“너희가 만두 먹을 때.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“우리가 만두를 너무 오래 먹긴 했지.”<\/p>\n<p>“야, 그 만두는 정말 맛있었다고.”<\/p>\n<p>태경은 말하면서도 자꾸 비무대 쪽을 바라봤다.<\/p>\n<p>서율은 그의 등을 가볍게 두드렸다.<\/p>\n<p>“어제 약속 기억하지?”<\/p>\n<p>“알아. 져도 놀리지 않기.”<\/p>\n<p>“응.”<\/p>\n<p>태경은 잠깐 침묵하다가 말했다.<\/p>\n<p>“……그런데 이기면 자랑해도 되지?”<\/p>\n<p>“그건 마음껏.”<\/p>\n<p>그제야 태경이 웃었다.<\/p>\n<p>두 사람의 이름이 각기 다른 비무대에 적혀 있었다. 소윤은 명단을 다시 확인한 뒤 손을 내밀었다.<\/p>\n<p>“끝나면 여기서 만나자.”<\/p>\n<p>서율이 손을 올렸다. 태경도 그 위에 손을 포갰다.<\/p>\n<p>“끝나고 밥!”<\/p>\n<p>“응. 끝나고 밥.”<\/p>\n<p>소윤은 두 사람의 손을 잠깐 더 잡고 있었다.<\/p>\n<p>종이 두 번째로 울렸다.<\/p>\n<p>이번에는 정말 시작이었다.<\/p>\n<h3>2. 윤태경의 한 걸음<\/h3>\n<p>태경의 대련은 생각보다 빨리 끝났다.<\/p>\n<p>시작부터 나빴던 것은 아니다.<\/p>\n<p>“시작!”<\/p>\n<p>심판의 손이 내려가자 태경이 먼저 뛰어들었다.<\/p>\n<p>“하아앗!”<\/p>\n<p>빠른 일격이었다. 상대가 놀라 뒤로 물러났고, 태경의 목검 끝이 상대의 어깨 보호구를 스쳤다.<\/p>\n<p>“유효!”<\/p>\n<p>관람석 아래에서 서율이 벌떡 일어났다.<\/p>\n<p>“태경아! 잘했어!”<\/p>\n<p>소윤도 두 손을 모아 박수를 쳤다.<\/p>\n<p>태경은 자신감이 붙었는지 입꼬리를 올렸다.<\/p>\n<p>“어때!”<\/p>\n<p>그러나 그 말이 끝나기도 전에 상대가 움직였다.<\/p>\n<p>도겸은 처음처럼 뒤로 물러나지 않았다. 태경이 크게 내려친 검을 옆으로 흘리고, 비어 있는 옆구리를 가볍게 쳤다.<\/p>\n<p>탁.<\/p>\n<p>“유효!”<\/p>\n<p>태경의 얼굴이 굳었다.<\/p>\n<p>다시 시작된 대련에서 그는 더 빠르게 달려들었다. 상대는 한 발 물러나며 기다렸다. 태경의 첫 공격이 빗나갔다. 두 번째 공격은 무거웠고, 세 번째 공격은 늦었다.<\/p>\n<p>탁.<\/p>\n<p>“유효!”<\/p>\n<p>한 점 뒤졌다.<\/p>\n<p>태경은 숨을 몰아쉬었다. 머릿속에서는 어제 소윤이 해 준 말이 맴돌았다.<\/p>\n<p><em>'첫 공격이 막히면 바로 자세를 잡아.'<\/em><\/p>\n<p>알고 있었다. 하지만 몸이 말을 듣지 않았다.<\/p>\n<p>마지막 교차에서 태경은 힘을 짜내 목검을 휘둘렀다. 도겸은 침착하게 검을 받아 넘긴 뒤 그의 가슴 보호구에 목검 끝을 댔다.<\/p>\n<p>“승자, 도겸!”<\/p>\n<p>종이 울렸다.<\/p>\n<p>태경은 한동안 그대로 서 있었다.<\/p>\n<p>“……아.”<\/p>\n<p>대단히 아픈 곳은 없었다. 그저 숨이 찼다. 그리고 조금 전까지 당연하게 느껴지던 승리가 갑자기 먼 곳으로 사라졌다.<\/p>\n<p>상대가 먼저 예를 갖췄다.<\/p>\n<p>“좋은 대련이었다.”<\/p>\n<p>태경은 뒤늦게 허리를 숙였다.<\/p>\n<p>“……응. 너도.”<\/p>\n<p>비무대 아래로 내려오자 서율이 물통을 건넸다.<\/p>\n<p>“첫 공격 진짜 빨랐어.”<\/p>\n<p>“졌는데 뭐.”<\/p>\n<p>“그래도 빨랐어.”<\/p>\n<p>태경은 물을 한 모금 마셨다.<\/p>\n<p>소윤이 말했다.<\/p>\n<p>“두 번째부터 상대가 네 속도를 읽은 것 같아. 다음에는 첫 공격 뒤에 한 박자 쉬어 보는 게 좋겠어.”<\/p>\n<p>“다음이라.”<\/p>\n<p>태경은 허탈하게 웃었다.<\/p>\n<p>“다음 대회는 언제인데?”<\/p>\n<p>“그건 아직 몰라.”<\/p>\n<p>소윤이 진지하게 대답하자 태경이 결국 피식 웃었다.<\/p>\n<p>“너는 진짜…….”<\/p>\n<p>서율이 그의 어깨에 손을 올렸다.<\/p>\n<p>“우리 약속했잖아. 끝나고 밥 먹자고.”<\/p>\n<p>“알아.”<\/p>\n<p>태경은 물통 뚜껑을 닫았다.<\/p>\n<p>“그러니까 너는 이기고 와. 둘 다 첫판에 지면 소윤이한테 너무 미안하잖아.”<\/p>\n<p>“왜 나한테 미안해?”<\/p>\n<p>소윤이 되물었다.<\/p>\n<p>“내가 너희한테 승리하라고 수첩을 써 준 건 아닌데.”<\/p>\n<p>태경은 대답하지 못했다.<\/p>\n<p>소윤이 웃었다.<\/p>\n<p>“다치지 말고 돌아와. 그거면 돼.”<\/p>\n<p>서율은 그 말을 들으며 목검을 고쳐 쥐었다.<\/p>\n<h3>3. 이름이 불리다<\/h3>\n<p>전서율의 차례가 가까워졌다.<\/p>\n<p>그는 비무대 옆 그늘에서 손목을 돌리고 있었다. 태경이 옆에서 끊임없이 떠들었다.<\/p>\n<p>“처음부터 너무 크게 휘두르지 마. 상대가 들어오면 옆으로 피하고. 그리고 네 그 이상한 돌리기 있잖아, 그거는…….”<\/p>\n<p>“안 할게.”<\/p>\n<p>“……내가 아직 말 안 끝냈는데?”<\/p>\n<p>“하지 말라고 할 거잖아.”<\/p>\n<p>태경이 입을 삐죽 내밀었다.<\/p>\n<p>“알면 됐어.”<\/p>\n<p>소윤은 대진표를 보고 있었다. 그녀의 손가락이 서율의 이름 옆에서 멈췄다.<\/p>\n<p>“서율아.”<\/p>\n<p>“응?”<\/p>\n<p>“상대가 바뀌었어.”<\/p>\n<p>“바뀌었다고?”<\/p>\n<p>“원래 상대가 기권해서 다른 조에서 올라온 사람이 배정됐대.”<\/p>\n<p>태경이 수첩을 들여다봤다.<\/p>\n<p>그의 얼굴에서 웃음이 사라졌다.<\/p>\n<p>“……저놈?”<\/p>\n<p>전서율은 고개를 들었다.<\/p>\n<p>비무대 건너편에서 한 남학생이 걸어오고 있었다. 반듯하게 정리된 제복, 검집에 새겨진 가문의 문양, 그리고 익숙한 비웃음.<\/p>\n<p>게시판 앞에서 세 사람을 모욕했던 그 학생이었다.<\/p>\n<p>“또 보네.”<\/p>\n<p>남학생이 말했다.<\/p>\n<p>전서율은 가볍게 예를 갖췄다.<\/p>\n<p>“잘 부탁드립니다.”<\/p>\n<p>“여기서까지 예의 바른 척이냐?”<\/p>\n<p>그는 서율의 목검을 내려다봤다.<\/p>\n<p>“오늘은 질문할 시간 없어. 알지?”<\/p>\n<p>서율은 대답하지 않았다.<\/p>\n<p>태경이 한 걸음 나서려 하자 소윤이 그의 소매를 잡았다.<\/p>\n<p>“태경아. 지금은 대련 전이야.”<\/p>\n<p>남학생은 두 사람을 힐끗 보았다.<\/p>\n<p>“친구들 응원도 받고 좋겠네.”<\/p>\n<p>그가 낮게 덧붙였다.<\/p>\n<p>“얼마나 오래 웃을 수 있을지 보자.”<\/p>\n<p>그는 먼저 비무대에 올랐다.<\/p>\n<p>태경이 이를 악물었다.<\/p>\n<p>“서율아, 저 자식은 조심해.”<\/p>\n<p>“응.”<\/p>\n<p>“실력도 있잖아. 괜히 무리하지 말고.”<\/p>\n<p>서율은 두 친구를 바라봤다.<\/p>\n<p>“알았어.”<\/p>\n<p>소윤이 마지막으로 말했다.<\/p>\n<p>“상대가 빠르더라도 네 속도로 해. 급하게 따라가지 말고.”<\/p>\n<p>“응. 고마워.”<\/p>\n<p>서율은 계단을 올랐다.<\/p>\n<p>관람석에서 누군가 남궁현우의 이름을 외쳤다. 다른 학생들이 따라 환호했다. 전서율의 이름을 부르는 목소리는 아래쪽의 두 사람뿐이었다.<\/p>\n<p>이상하게도 그것만으로 충분했다.<\/p>\n<p><em>'배운 대로 하자.'<\/em><\/p>\n<p>그는 목검을 세웠다.<\/p>\n<h3>4. 세 번의 기회<\/h3>\n<p>“시작!”<\/p>\n<p>첫 번째 공격은 보이지 않을 만큼 빨랐다.<\/p>\n<p>정확히는, 서율이 무엇을 해야 할지 정하기 전에 이미 검이 들어왔다.<\/p>\n<p>탁!<\/p>\n<p>목검이 그의 어깨 보호구를 때렸다.<\/p>\n<p>“유효!”<\/p>\n<p>서율은 두 걸음 물러났다.<\/p>\n<p><em>'빠르다.'<\/em><\/p>\n<p>상대는 그가 자세를 바로잡을 때까지 여유롭게 기다렸다.<\/p>\n<p>“왜? 생각보다 어렵나?”<\/p>\n<p>서율은 검을 다시 들었다.<\/p>\n<p>두 번째 교차에서 그는 먼저 공격했다. 가장 익숙한 기본 베기였다. 상대는 손목을 살짝 틀어 검을 흘렸다. 서율의 검이 옆으로 밀렸고, 바로 다음 순간 상대의 목검이 그의 가슴 앞에서 멈췄다.<\/p>\n<p>“유효!”<\/p>\n<p>두 점 차이.<\/p>\n<p>서율은 숨을 들이쉬었다.<\/p>\n<p>상대의 검에는 불필요한 움직임이 없었다. 그가 수업 시간에 배운 초식과 크게 다르지 않았지만, 시작과 끝이 놀랍도록 짧고 정확했다.<\/p>\n<p><em>'이게 제대로 익힌 기본 검식이구나.'<\/em><\/p>\n<p>감탄할 틈은 길지 않았다.<\/p>\n<p>“전서율! 집중해!”<\/p>\n<p>태경의 목소리가 들렸다.<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>세 번째 교차.<\/p>\n<p>이번에는 상대의 검이 내려오기 전에 서율이 한 발 옆으로 움직였다. 검을 받아 넘기는 대신 공격선을 벗어났다. 그리고 빈 공간을 향해 목검을 뻗었다.<\/p>\n<p>탁.<\/p>\n<p>상대의 옆구리 보호구에 목검 끝이 닿았다.<\/p>\n<p>“유효!”<\/p>\n<p>순간 관람석 아래에서 환호가 터졌다.<\/p>\n<p>“서율아!”<\/p>\n<p>“잘했어!”<\/p>\n<p>서율은 놀라 자신의 검끝을 바라봤다.<\/p>\n<p><em>'됐다.'<\/em><\/p>\n<p>대단한 기술은 아니었다. 소윤이 말한 대로 상대의 속도를 따라가지 않고 한 걸음 먼저 움직였을 뿐이었다.<\/p>\n<p>그러나 분명히 얻어 낸 한 점이었다.<\/p>\n<p>상대의 얼굴에서 미소가 사라졌다.<\/p>\n<p>“……재미있네.”<\/p>\n<p>그는 목검을 천천히 들어 올렸다.<\/p>\n<p>“그럼 조금 더 해 보자.”<\/p>\n<h3>5. 손가락<\/h3>\n<p>다음 공격은 어깨를 향해 오는 것처럼 보였다.<\/p>\n<p>서율은 검을 들어 막았다.<\/p>\n<p>그런데 상대의 목검이 중간에서 방향을 바꾸었다. 검날이 아니라 검을 쥔 손을 향해 내려왔다.<\/p>\n<p>딱!<\/p>\n<p>짧고 날카로운 소리.<\/p>\n<p>“윽!”<\/p>\n<p>서율의 손가락을 타고 통증이 번졌다.<\/p>\n<p>그는 반사적으로 손을 움츠렸다. 목검이 흔들렸다.<\/p>\n<p>“검을 놓치지 마라!”<\/p>\n<p>심판의 목소리가 들렸다.<\/p>\n<p>서율은 이를 악물고 손잡이를 다시 쥐었다.<\/p>\n<p><em>'잘못 맞았나?'<\/em><\/p>\n<p>손등과 손가락 마디가 욱신거렸다. 보호구가 손 전체를 감싸는 형태는 아니었다. 손잡이를 쥔 손가락 일부가 노출되어 있었다.<\/p>\n<p>상대는 그의 손을 보았다.<\/p>\n<p>“왜 그래? 벌써 아파?”<\/p>\n<p>“괜찮습니다.”<\/p>\n<p>서율은 자세를 잡았다.<\/p>\n<p>심판은 잠시 두 사람을 살폈지만 대련을 멈추지 않았다.<\/p>\n<p>“계속!”<\/p>\n<p>상대가 다시 들어왔다.<\/p>\n<p>이번에는 서율도 손을 의식했다. 검을 막을 때마다 손가락이 울렸다. 그는 공격을 피하려고 몸을 틀었다.<\/p>\n<p>그러나 상대는 기다렸다는 듯 검을 짧게 끊어 쳤다.<\/p>\n<p>딱!<\/p>\n<p>같은 손.<\/p>\n<p>“아윽!”<\/p>\n<p>서율의 목검이 크게 흔들렸다.<\/p>\n<p>관람석 아래에서 태경이 벌떡 일어났다.<\/p>\n<p>“야! 손을 노리잖아!”<\/p>\n<p>소윤도 자리에서 일어났다.<\/p>\n<p>“심판님! 방금 손가락을……!”<\/p>\n<p>심판이 손을 들어 관람석을 제지했다.<\/p>\n<p>“관람자는 정숙하라.”<\/p>\n<p>서율은 숨을 몰아쉬었다.<\/p>\n<p><em>'두 번이나 같은 곳을?'<\/em><\/p>\n<p>상대의 검술은 자신보다 훨씬 뛰어났다. 보호구에 점수를 내는 것만으로도 충분히 이길 수 있을 터였다.<\/p>\n<p>그런데 상대의 시선은 자꾸 그의 손으로 내려갔다.<\/p>\n<p>“검을 제대로 잡아.”<\/p>\n<p>남학생이 낮게 말했다.<\/p>\n<p>“정파의 검을 배우겠다며.”<\/p>\n<p>서율은 대답하지 않았다.<\/p>\n<p>손가락이 잘 구부러지지 않았다.<\/p>\n<p>그는 손잡이를 고쳐 쥐려 했다. 통증 때문에 힘이 제대로 들어가지 않았다.<\/p>\n<p><em>'여기서 그만둘까.'<\/em><\/p>\n<p>그 생각이 떠올랐다.<\/p>\n<p>하지만 아직 대련은 끝나지 않았다. 한 점을 얻은 뒤였다. 더 해 볼 수 있을지도 몰랐다.<\/p>\n<p>서율은 검을 다시 들었다.<\/p>\n<p>상대가 웃었다.<\/p>\n<p>“그래. 그렇게 해야지.”<\/p>\n<p>그리고 마지막 공격이 시작됐다.<\/p>\n<p>서율은 검을 세워 막았다. 상대의 목검이 그의 검과 맞닿았다가 미끄러졌다. 다음 순간 단단한 나무가 손잡이 바로 위를 후려쳤다.<\/p>\n<p>빠각.<\/p>\n<p>처음 두 번과는 다른 소리였다.<\/p>\n<p>“……!”<\/p>\n<p>숨이 막혔다.<\/p>\n<p>서율의 손에서 목검이 떨어졌다.<\/p>\n<p>바닥에 나무가 부딪히는 소리가 유난히 크게 울렸다.<\/p>\n<p>그는 손을 감싸 쥐고 무릎을 꿇었다. 손가락이 이상한 방향으로 꺾인 것은 아니었지만, 마디가 순식간에 부어올랐다. 손을 펴려고 해도 움직이지 않았다.<\/p>\n<p>“서율아!”<\/p>\n<p>태경의 목소리가 갈라졌다.<\/p>\n<p>소윤이 계단 쪽으로 달려갔다.<\/p>\n<p>심판이 그제야 앞으로 나왔다.<\/p>\n<p>“전서율, 계속할 수 있겠느냐?”<\/p>\n<p>서율은 대답하려고 입을 열었다.<\/p>\n<p>“저…….”<\/p>\n<p>손이 떨렸다.<\/p>\n<p>그는 바닥에 떨어진 목검을 바라봤다. 조금 전까지 그렇게 가볍게 느껴지던 나무 손잡이가 이제는 너무 멀어 보였다.<\/p>\n<p>“……못 하겠습니다.”<\/p>\n<p>심판이 고개를 끄덕였다.<\/p>\n<p>“전서율, 전투 불능. 승자—”<\/p>\n<p>남학생이 검을 내렸다.<\/p>\n<p>그의 이름이 대연무장에 울렸다.<\/p>\n<p>환호가 터졌다.<\/p>\n<p>서율은 그 소리를 듣고 있었다. 이상하게도 멀리서 들리는 것 같았다.<\/p>\n<h3>6. 약속했던 자리<\/h3>\n<p>“비켜 주세요!”<\/p>\n<p>태경이 비무대 위로 올라왔다.<\/p>\n<p>“서율아, 손 보여 줘. 야, 너 괜찮아?”<\/p>\n<p>“……태경아.”<\/p>\n<p>서율은 웃으려 했지만 얼굴이 제대로 움직이지 않았다.<\/p>\n<p>소윤은 그의 손을 보고 숨을 삼켰다.<\/p>\n<p>“움직이지 마. 손가락 잡아당기면 안 돼.”<\/p>\n<p>그녀는 떨리는 목소리를 억눌렀다.<\/p>\n<p>“의무실로 가야 해. 지금.”<\/p>\n<p>태경이 고개를 홱 돌렸다.<\/p>\n<p>승리한 남학생은 비무대 끝에서 동료들과 웃고 있었다.<\/p>\n<p>“저 자식이 일부러……!”<\/p>\n<p>태경이 일어나려 하자 서율이 그의 소매를 붙잡았다.<\/p>\n<p>“태경아.”<\/p>\n<p>“놔 봐. 저건 비무가 아니잖아!”<\/p>\n<p>“……소윤이 말부터 듣자.”<\/p>\n<p>태경은 숨을 거칠게 내쉬었다.<\/p>\n<p>소윤이 그를 똑바로 바라봤다.<\/p>\n<p>“지금은 서율이부터.”<\/p>\n<p>그제야 태경이 멈췄다.<\/p>\n<p>두 사람은 서율을 부축해 비무대 아래로 내려왔다.<\/p>\n<p>관람석에서는 이미 다음 대진을 준비하고 있었다. 심판이 다른 학생의 이름을 부르는 소리가 들렸다. 방금 무슨 일이 있었는지 모르는 사람들은 다시 자리를 잡고 웃으며 떠들었다.<\/p>\n<p>서율은 걸음을 옮길 때마다 손이 울렸다.<\/p>\n<p>“미안.”<\/p>\n<p>그가 작게 말했다.<\/p>\n<p>태경이 돌아봤다.<\/p>\n<p>“뭐?”<\/p>\n<p>“나도 첫판에 졌네.”<\/p>\n<p>태경의 표정이 일그러졌다.<\/p>\n<p>“야, 지금 그게 중요해?”<\/p>\n<p>서율은 대답하지 못했다.<\/p>\n<p>소윤이 그의 다치지 않은 손을 잡았다.<\/p>\n<p>“서율아.”<\/p>\n<p>“응.”<\/p>\n<p>“우리 어제 무슨 약속했는지 기억해?”<\/p>\n<p>“……끝나고 밥 먹기.”<\/p>\n<p>“그거 말고.”<\/p>\n<p>서율은 잠시 생각했다.<\/p>\n<p>소윤이 말했다.<\/p>\n<p>“져도 놀리지 않기.”<\/p>\n<p>“응.”<\/p>\n<p>“그런데 너 지금 너 자신을 놀리고 있잖아.”<\/p>\n<p>서율은 고개를 들었다.<\/p>\n<p>소윤의 눈가가 붉어져 있었다.<\/p>\n<p>“그러지 마.”<\/p>\n<p>그녀의 목소리가 작게 떨렸다.<\/p>\n<p>“너는 잘못한 거 없어.”<\/p>\n<p>태경은 한동안 아무 말도 하지 않았다. 그러다 서율의 다치지 않은 쪽 어깨를 감쌌다.<\/p>\n<p>“밥은 나중에 먹자.”<\/p>\n<p>“태경아, 너 배고플 텐데.”<\/p>\n<p>“지금 만두 얘기할 때냐?”<\/p>\n<p>서율이 아주 작게 웃었다.<\/p>\n<p>“……그렇네.”<\/p>\n<p>세 사람은 의무실로 향했다.<\/p>\n<p>뒤쪽에서는 다음 비무의 시작을 알리는 종이 울렸다.<\/p>\n<h3>7. 부러진 것<\/h3>\n<p>의무실의 의원은 서율의 손을 조심스럽게 살폈다.<\/p>\n<p>“여기 누르면 아프냐?”<\/p>\n<p>“……네.”<\/p>\n<p>“여기는?”<\/p>\n<p>“아!”<\/p>\n<p>의원은 더 누르지 않았다. 붓기와 압통, 손가락의 움직임을 확인한 뒤 표정이 굳어졌다.<\/p>\n<p>“골절이 의심된다. 적어도 당분간은 검을 쥐면 안 된다. 부목을 대고 움직이지 않도록 하자.”<\/p>\n<p>태경이 물었다.<\/p>\n<p>“얼마나 쉬어야 합니까?”<\/p>\n<p>“뼈 상태에 따라 다르다. 며칠 쉬고 끝날 일은 아니야. 정밀하게 확인해야 한다.”<\/p>\n<p>서율은 자신의 손을 내려다봤다.<\/p>\n<p>얇은 부목이 손가락을 받치고 붕대가 그 위를 감쌌다.<\/p>\n<p><em>'검을 못 쥔다고?'<\/em><\/p>\n<p>오늘 아침까지 그는 어떻게 하면 검을 더 자연스럽게 움직일 수 있을지만 생각했다.<\/p>\n<p>이제는 손가락 하나 제대로 굽히기 어려웠다.<\/p>\n<p>소윤이 의원에게 물었다.<\/p>\n<p>“목검에 손가락을 여러 번 맞았어요. 이런 경우 비무 기록에 남길 수 있나요?”<\/p>\n<p>의원은 잠시 그녀를 바라봤다.<\/p>\n<p>“부상 기록은 남긴다. 경기 중 어떤 일이 있었는지는 심판과 담당 교두에게 확인해야 한다.”<\/p>\n<p>소윤은 고개를 끄덕였다.<\/p>\n<p>“알겠습니다.”<\/p>\n<p>태경이 이를 악물었다.<\/p>\n<p>“확인할 것도 없는데.”<\/p>\n<p>서율은 두 사람을 바라봤다.<\/p>\n<p>“태경아, 소윤아.”<\/p>\n<p>“왜?”<\/p>\n<p>“나 때문에…….”<\/p>\n<p>“그 말 또 하면 진짜 화낸다.”<\/p>\n<p>태경이 잘랐다.<\/p>\n<p>서율은 입을 다물었다.<\/p>\n<p>소윤은 수첩을 꺼냈다. 그리고 처음으로 비무의 점수나 초식이 아닌, 일어난 일을 시간 순서대로 적기 시작했다.<\/p>\n<p>첫 번째 손 공격.<\/p>\n<p>두 번째 손 공격.<\/p>\n<p>마지막 타격과 목검 낙하.<\/p>\n<p>그녀의 글씨는 평소보다 조금 삐뚤었다.<\/p>\n<p>“소윤아.”<\/p>\n<p>서율이 불렀다.<\/p>\n<p>“응?”<\/p>\n<p>“뭐 적어?”<\/p>\n<p>“잊지 않으려고.”<\/p>\n<p>그녀는 고개를 들었다.<\/p>\n<p>“누가 물어보면 정확하게 말하려고.”<\/p>\n<p>서율은 그 말이 낯설지 않았다.<\/p>\n<p>언젠가 연무장에서 소윤이 똑같은 말을 했었다. 그때는 세 사람이 조롱당한 일을 기록했었다.<\/p>\n<p>그는 그때 웃으며 좋은 생각이라고 했었다.<\/p>\n<p>오늘은 웃음이 나오지 않았다.<\/p>\n<p>창밖에서 환호가 터졌다.<\/p>\n<p>누군가 또 한 판을 이긴 모양이었다.<\/p>\n<p>태경은 창문을 닫았다.<\/p>\n<p>“시끄러워.”<\/p>\n<p>그리고 서율의 침상 곁에 앉았다.<\/p>\n<p>“오늘 밥, 같이 먹는 건 취소 안 한 거다.”<\/p>\n<p>서율이 그를 바라봤다.<\/p>\n<p>“……응.”<\/p>\n<p>“네 손 나으면 다시 대련도 하고.”<\/p>\n<p>“응.”<\/p>\n<p>“이번에는 내가 이길 거야.”<\/p>\n<p>서율은 조금 웃었다.<\/p>\n<p>“그건 두고 봐야지.”<\/p>\n<p>태경도 겨우 웃었다.<\/p>\n<p>소윤은 수첩을 덮었다.<\/p>\n<p>세 사람은 한동안 아무 말 없이 앉아 있었다.<\/p>\n<p>그날 전서율이 잃은 것은 첫 비무의 승리만이 아니었다.<\/p>\n<p>그러나 그가 무엇을 더 잃었는지는, 아직 누구도 정확히 알지 못했다.<\/p>\n<p><strong>— 제8장 「첫 번째 패배」 끝.<\/strong><\/p>\n"}, {"n": 9, "title": "《천류관》 제1부 — 돌아올 곳", "body": "<h1>《천류관》 제1부 — 돌아올 곳<\/h1>\n<h2>제9장. 묵인<\/h2>\n<h3>1. 붕대 위의 아침<\/h3>\n<p>“움직여 봐.”<\/p>\n<p>“어느 쪽을요?”<\/p>\n<p>“안 아픈 쪽부터.”<\/p>\n<p>전서율은 왼손 손가락을 하나씩 굽혔다. 의원은 고개를 끄덕이고 붕대가 감긴 오른손을 살폈다.<\/p>\n<p>“여기는?”<\/p>\n<p>“……아픕니다.”<\/p>\n<p>“무리하지 마라. 어제보다 붓기는 조금 빠졌지만, 두 손가락의 뼈에 금이 간 것으로 보인다. 움직임을 제한하고 경과를 봐야 해.”<\/p>\n<p>서율은 부목을 내려다봤다. 어제는 손 전체가 뜨거웠다. 오늘은 손가락을 조금만 움직여도 깊숙한 곳에서 찌릿한 통증이 올라왔다.<\/p>\n<p>“검은 언제부터 잡을 수 있습니까?”<\/p>\n<p>의원은 그를 바라봤다.<\/p>\n<p>“그 질문을 할 줄 알았다.”<\/p>\n<p>“……죄송합니다.”<\/p>\n<p>“사과할 일은 아니지만, 지금 검을 쥐면 회복이 늦어질 수 있다. 적어도 당분간은 안 된다. 통증이 줄어든다고 다 나은 것도 아니고.”<\/p>\n<p>서율은 입술을 다물었다.<\/p>\n<p>침상 옆에서 윤태경이 두 팔을 꼈다.<\/p>\n<p>“들었지? 검 금지.”<\/p>\n<p>“들었어.”<\/p>\n<p>“손 씻는 것도 내가 도와줄게.”<\/p>\n<p>“그 정도는 할 수 있어.”<\/p>\n<p>“밥도 떠먹여 줄까?”<\/p>\n<p>“그건 하지 마!”<\/p>\n<p>백소윤이 작게 웃었다. 웃음은 오래가지 못했다. 그녀는 수첩을 펼쳐 의원에게 물었다.<\/p>\n<p>“어제 손을 세 번 맞았어요. 마지막에 목검을 놓쳤고요. 부상 기록에 그 경위를 적어 주실 수 있을까요?”<\/p>\n<p>의원은 잠시 펜을 멈췄다.<\/p>\n<p>“네가 직접 본 거냐?”<\/p>\n<p>“네. 관람석 바로 아래에서 봤어요.”<\/p>\n<p>“그럼 네가 본 것은 네가 따로 기록해 둬라. 나는 진찰한 상태와 치료 내용을 적겠다. 경기의 고의성은 내가 판단할 일이 아니야.”<\/p>\n<p>“알겠습니다.”<\/p>\n<p>소윤은 더 따지지 않았다. 의원이 자신의 일을 외면하고 있는 건 아니었다. 그는 실제로 서율의 손을 살폈고, 아프지 않게 부목을 다시 고정해 주었다.<\/p>\n<p>그런데 그 말이 이상하게 마음에 걸렸다.<\/p>\n<p><em>'경기의 고의성은 내 일이 아니다.'<\/em><\/p>\n<p>그렇다면 누구의 일일까.<\/p>\n<p>의무실 문을 나서자 태경이 말했다.<\/p>\n<p>“오늘 바로 찾아가자.”<\/p>\n<p>“어딜?”<\/p>\n<p>“심판이랑 교두님. 그냥 넘어가면 안 되잖아.”<\/p>\n<p>서율은 붕대 감긴 손을 옷소매 안으로 감췄다.<\/p>\n<p>“……응. 나도 물어보고 싶어.”<\/p>\n<p>태경은 뜻밖이라는 듯 그를 돌아봤다.<\/p>\n<p>“네가?”<\/p>\n<p>“내가 맞았으니까.”<\/p>\n<p>서율은 조금 멋쩍게 웃었다.<\/p>\n<p>“왜 그런 공격이 허용됐는지, 알아야 다음에 조심할 수도 있잖아.”<\/p>\n<p>태경은 한숨을 쉬었다.<\/p>\n<p>“넌 진짜 끝까지 수련 생각이냐.”<\/p>\n<p>“그럼 뭘 생각해?”<\/p>\n<p>“……됐어. 같이 가자.”<\/p>\n<p>소윤이 수첩을 품에 넣었다.<\/p>\n<p>“나도 갈게.”<\/p>\n<p>세 사람은 나란히 행정동으로 향했다.<\/p>\n<h3>2. 규칙에 없는 상처<\/h3>\n<p>비무 운영을 맡은 선배는 그들의 말을 끝까지 들었다.<\/p>\n<p>소윤은 준비해 온 기록을 펼쳤다. 첫 번째 공격이 손등에 닿은 시점, 두 번째 공격이 같은 손으로 들어온 순간, 마지막에 목검이 떨어진 경위를 차례로 설명했다.<\/p>\n<p>“세 번 모두 검을 쥔 손을 향했어요.”<\/p>\n<p>선배는 수첩과 서율의 부목을 번갈아 봤다.<\/p>\n<p>“심판이 중지시키지 않았나?”<\/p>\n<p>“마지막 공격 뒤에야 중지됐습니다.”<\/p>\n<p>“흠.”<\/p>\n<p>선배는 서랍에서 얇은 규정집을 꺼냈다.<\/p>\n<p>“비무에서는 목검으로 상대의 급소를 노리거나, 보호구 밖을 반복해서 공격하는 행위를 금한다. 특히 부상이 예상되는 공격은 심판이 중단할 수 있다.”<\/p>\n<p>태경이 곧바로 말했다.<\/p>\n<p>“그럼 규칙 위반이잖아요!”<\/p>\n<p>“잠깐.”<\/p>\n<p>선배가 손을 들었다
