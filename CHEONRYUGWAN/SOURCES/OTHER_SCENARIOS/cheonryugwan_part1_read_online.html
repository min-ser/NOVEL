<p>그는 고개를 들었다.<\/p>\n<p>“교두님도 그런 생각을 하셨습니까?”<\/p>\n<p>“네가 처음 그 질문을 했을 때 놀란 이유가 뭔 줄 아느냐?”<\/p>\n<p>노교두가 웃었다.<\/p>\n<p>“나도 젊었을 때 똑같이 물었다가 혼이 났거든.”<\/p>\n<p>서율은 웃다가 목이 메었다.<\/p>\n<p>“그런데 왜 제게 말씀하지 않으셨습니까?”<\/p>\n<p>“내 답을 네 답으로 착각할까 봐.”<\/p>\n<p>노교두는 책을 덮어 서율에게 건넸다.<\/p>\n<p>“정파는 이 건물만을 뜻하지 않는다. 남궁가의 이름도, 원로들의 회의도 정파의 전부가 아니야. 남을 해치지 않으려고 검을 멈추는 마음도 정파의 가르침이다.”<\/p>\n<p>“……예.”<\/p>\n<p>“떠나든 남든, 네가 배운 것을 부끄러워하지 마라.”<\/p>\n<p>서율은 책을 품에 안았다.<\/p>\n<p>“교두님. 제가 돌아와도 됩니까?”<\/p>\n<p>노교두의 얼굴이 일그러졌다.<\/p>\n<p>“이놈아.”<\/p>\n<p>그가 서율의 멀쩡한 어깨를 세게 두드렸다.<\/p>\n<p>“네가 돌아올 곳을 왜 남에게 허락받으려 하느냐!”<\/p>\n<p>서율은 끝내 고개를 숙였다. 눈물이 책장 위로 떨어질까 봐 서둘러 책을 닫았다.<\/p>\n<h2>6. 서율의 대답<\/h2>\n<p>해가 서쪽 담장에 걸렸을 때 서율은 다시 원주실을 찾았다.<\/p>\n<p>원주와 노교두, 외사 교두가 기다리고 있었다.<\/p>\n<p>“결정했느냐?”<\/p>\n<p>“예.”<\/p>\n<p>서율은 책상 위에 문서를 놓았다. 파견 동의서의 빈칸에는 자신의 이름이 적혀 있었다.<\/p>\n<p>노교두의 눈썹이 떨렸다.<\/p>\n<p>“서율아…….”<\/p>\n<p>“억울해서 가는 건 아닙니다.”<\/p>\n<p>서율은 원주를 똑바로 바라봤다.<\/p>\n<p>“제가 마공을 익혔다고 인정하는 것도 아니고, 저를 싫어하는 사람들 말이 옳아서 가는 것도 아닙니다.”<\/p>\n<p>원주는 아무 말도 하지 않았다.<\/p>\n<p>“제 검이 어디서 왔는지, 제가 직접 말하겠습니다. 학관에서 배운 검식에서 시작됐다는 것도요. 그리고 반드시 돌아오겠습니다.”<\/p>\n<p>“왜 굳이 네가 그 짐을 지려 하느냐?” 노교두가 물었다.<\/p>\n<p>서율은 한참 생각했다.<\/p>\n<p>“남아서 버티는 것도 제 선택입니다. 그런데 떠나서 제 말을 전하는 것도 제 선택일 수 있다는 생각이 들었습니다.”<\/p>\n<p>그는 숨을 고르고 말을 이었다.<\/p>\n<p>“여기 있는 모두가 저를 미워하는 건 아니잖아요. 제가 돌아와야 한다고 말해 주는 사람들도 있어요. 그 사람들한테 계속 제 대신 싸워 달라고만 하고 싶지는 않습니다.”<\/p>\n<p>노교두는 입술을 깨물었다.<\/p>\n<p>“그렇다고 네가 그 사람들을 위해 희생해야 한다는 뜻은 아니다.”<\/p>\n<p>“알아요. 그래서 조건을 적었습니다.”<\/p>\n<p>서율은 동의서 아래의 문장을 가리켰다.<\/p>\n<p><em>조사는 정해진 기술 확인 범위에 한정한다. 학관 호위의 동행과 귀환 시점을 문서로 보장한다. 추가 조사 또는 체류 연장은 본인의 별도 동의 없이는 허용하지 않는다. 검술 시연은 의원이 허가한 범위에서만 시행한다.<\/em><\/p>\n<p>외사 교두가 조항을 읽고 고개를 끄덕였다.<\/p>\n<p>“상대가 이를 수용한다는 확인 문서가 오기 전에는 출발시키지 않겠습니다.”<\/p>\n<p>원주가 말했다.<\/p>\n<p>“학관의 인장으로 보증하겠네.”<\/p>\n<p>서율은 고개를 숙였다.<\/p>\n<p>“그 약속, 꼭 지켜 주십시오.”<\/p>\n<p>그날 원주실을 나오는 서율의 걸음은 무겁지 않았다.<\/p>\n<p>가볍지도 않았다.<\/p>\n<p>다만 어느 쪽으로 향하는지는 스스로 알고 있었다.<\/p>\n<h2>7. 울지 않겠다는 약속<\/h2>\n<p>“뭐라고?!”<\/p>\n<p>태경의 외침에 기숙사 창문이 덜컹거렸다.<\/p>\n<p>“네가 간다고 했어? 네 발로?!”<\/p>\n<p>“응.”<\/p>\n<p>“왜! 남겠다고 했잖아!”<\/p>\n<p>“그 마음은 지금도 같아.”<\/p>\n<p>“그럼 남아! 우리가 어떻게든—”<\/p>\n<p>“태경아.”<\/p>\n<p>서율이 그를 불렀다.<\/p>\n<p>“네가 나 대신 싸워 준 거, 정말 고마웠어.”<\/p>\n<p>태경은 입을 다물었다.<\/p>\n<p>“그런데 나도 내가 해야 할 말을 하고 싶어. 그게 무서워도.”<\/p>\n<p>태경의 얼굴이 일그러졌다.<\/p>\n<p>“누가 무섭지 말랬냐…….”<\/p>\n<p>그는 고개를 돌렸다.<\/p>\n<p>“나도 무서운데.”<\/p>\n<p>소윤이 조용히 말했다.<\/p>\n<p>“언제 떠나?”<\/p>\n<p>“모레 새벽. 조건을 확인한 뒤에.”<\/p>\n<p>“모레…….”<\/p>\n<p>그녀는 그 짧은 말을 입 안에서 굴렸다. 모레는 수업이 있는 날이었다. 함께 아침을 먹고, 태경이 반찬을 더 달라고 투덜거리고, 서율이 검식에 관해 이상한 질문을 하던 평범한 날.<\/p>\n<p>그날부터 그 자리에 서율이 없다는 뜻이었다.<\/p>\n<p>소윤은 웃어 보였다.<\/p>\n<p>“그럼 내일은 우리 셋이 같이 있어야겠다.”<\/p>\n<p>태경이 훌쩍이며 말했다.<\/p>\n<p>“그래. 마지막으로 제대로 먹자.”<\/p>\n<p>“마지막이라 하지 마.”<\/p>\n<p>소윤의 목소리가 날카로워졌다.<\/p>\n<p>태경이 놀라 그녀를 바라봤다.<\/p>\n<p>“돌아올 거잖아. 마지막이라고 하지 마!”<\/p>\n<p>서율은 두 사람을 보며 고개를 끄덕였다.<\/p>\n<p>“응. 돌아올게.”<\/p>\n<h2>8. 소윤이 숨겨 둔 말<\/h2>\n<p>다음 날 저녁, 소윤은 서율을 처음 함께 공부하던 작은 정자로 불렀다.<\/p>\n<p>정자에는 아무도 없었다. 태경이 일부러 멀리 떨어져 있었다는 사실을 서율만 몰랐다.<\/p>\n<p>“무슨 일이야?”<\/p>\n<p>“줄 게 있어.”<\/p>\n<p>소윤은 작은 천 주머니를 내밀었다. 전에 주었던 바느질 주머니와 같은 천으로 만든 것이었다. 안에는 짧은 붉은 실 한 가닥이 묶여 있었다.<\/p>\n<p>“이건?”<\/p>\n<p>“옷깃 안쪽에 달아. 돌아올 때까지 잃어버리지 말고.”<\/p>\n<p>“무슨 부적이야?”<\/p>\n<p>“그냥…… 내가 알아볼 표시.”<\/p>\n<p>서율이 웃었다.<\/p>\n<p>“내 얼굴을 못 알아볼까 봐?”<\/p>\n<p>“그럴 리가 없잖아, 바보야!”<\/p>\n<p>소윤은 소리친 뒤 입술을 깨물었다. 화를 내려던 게 아니었다. 웃고 싶었는데 자꾸 울음이 올라왔다.<\/p>\n<p>“너는 정말…….”<\/p>\n<p>“소윤아?”<\/p>\n<p>“왜 그렇게 아무것도 몰라?”<\/p>\n<p>서율은 대답하지 못했다.<\/p>\n<p>소윤은 고개를 숙였다. 바닥에 떨어진 달빛이 흐릿해졌다.<\/p>\n<p>“나, 네가 하연이랑 있는 거 봤어.”<\/p>\n<p>서율의 눈이 커졌다.<\/p>\n<p>“그건—”<\/p>\n<p>“변명하지 마. 하연이가 널 얼마나 걱정하는지도 알아. 그 애가 너한테 잘해 준 것도 알고.”<\/p>\n<p>소윤은 숨을 들이마셨다.<\/p>\n<p>“그래서 더 싫었어. 하연이를 미워할 수가 없어서.”<\/p>\n<p>말을 마친 그녀의 어깨가 떨렸다.<\/p>\n<p>“나도 네가 좋아, 서율아.”<\/p>\n<p>서율의 입술이 조금 벌어졌다.<\/p>\n<p>“친구로만 좋아하는 거 아니야. 네가 수업 끝나고 나를 찾아오면 하루 종일 기분이 좋았어. 네가 다쳤을 땐 너무 무서워서 밤에 잠도 못 잤고…… 네가 다른 애랑 웃고 있으면 괜히 심술이 났어.”<\/p>\n<p>그녀는 눈물을 닦았다. 닦아도 자꾸 흘렀다.<\/p>\n<p>“이런 말 하면 네가 곤란해질까 봐 안 하려고 했는데…… 네가 떠나고 나면 언제 다시 말할 수 있을지 모르잖아!”<\/p>\n<p>“소윤아…….”<\/p>\n<p>“대답 안 해도 돼.”<\/p>\n<p>소윤은 고개를 세차게 저었다.<\/p>\n<p>“지금 대답하면 내가 그 말만 붙잡고 있을 것 같아. 그러니까 그냥 알아만 줘. 네가 돌아오길 기다리는 사람 중에…… 널 이런 마음으로 좋아하는 사람도 있다는 거.”<\/p>\n<p>서율은 한참 말이 없었다. 소윤은 그 침묵이 무서웠다.<\/p>\n<p>그때 서율이 한 걸음 다가왔다.<\/p>\n<p>“미안해. 내가 정말 몰랐어.”<\/p>\n<p>“그러니까 바보라고 했잖아.”<\/p>\n<p>소윤이 울면서 웃었다.<\/p>\n<p>“그런데 네 마음을 가볍게 듣지는 않을게.”<\/p>\n<p>그 말에 소윤은 더는 참지 못했다.<\/p>\n<p>그녀가 서율의 품으로 뛰어들었다.<\/p>\n<p>“꼭 돌아와!”<\/p>\n<p>서율은 놀라 몸을 굳혔다. 이내 다치지 않은 왼팔로 그녀의 등을 감쌌다.<\/p>\n<p>“응.”<\/p>\n<p>“아프지 말고! 혼자서 다 해결하려고 하지 말고! 이상한 검 때문에 또 다치지도 말고!”<\/p>\n<p>“알겠어.”<\/p>\n<p>“거짓말하면 진짜 화낼 거야!”<\/p>\n<p>“그것도 알겠어.”<\/p>\n<p>소윤은 한참 동안 떨어지지 않았다.<\/p>\n<p>서율도 서두르지 않았다.<\/p>\n<h2>9. 하연의 마지막 부탁<\/h2>\n<p>정자에서 돌아오는 길, 서율은 돌다리 위에 선 하연을 발견했다.<\/p>\n<p>하연은 난간에 팔을 얹고 달을 보고 있었다. 발소리를 듣고 돌아선 그녀가 먼저 웃었다.<\/p>\n<p>“울었어?”<\/p>\n<p>“내가?”<\/p>\n<p>“눈이 빨갛잖아.”<\/p>\n<p>“바람 때문이야.”<\/p>\n<p>“거짓말은 못하네.”<\/p>\n<p>서율이 머쓱하게 웃었다. 하연은 그 웃음을 잠깐 바라봤다.<\/p>\n<p>“들었어. 네가 가기로 했다며.”<\/p>\n<p>“응.”<\/p>\n<p>“정말 네가 결정한 거야?”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>“아무도 대신 결정하지 않았어.”<\/p>\n<p>하연은 그의 얼굴을 오래 살폈다. 거짓을 찾으려는 것이 아니라, 억지로 웃는 건 아닌지 확인하는 눈빛이었다.<\/p>\n<p>“그럼 말리지 않을게.”<\/p>\n<p>서율은 조금 놀랐다.<\/p>\n<p>“화 안 나?”<\/p>\n<p>“나? 엄청 나지!”<\/p>\n<p>하연이 두 손을 허리에 얹었다.<\/p>\n<p>“너 보내려고 소리친 애들한테도 화나고, 그걸 이용한 사람들한테도 화나고, 네가 다친 손으로 또 무슨 짓 할까 봐 화나!”<\/p>\n<p>그녀는 말을 멈췄다.<\/p>\n<p>“……그리고 네가 가는 게 싫어.”<\/p>\n<p>마지막 말은 작았다.<\/p>\n<p>서율이 한 걸음 가까이 다가왔다.<\/p>\n<p>“하연아.”<\/p>\n<p>“알아. 내가 전에 사파로 오라고 했을 때도 넌 남고 싶다고 했지. 그런데 이번에는 네가 직접 떠나겠다고 했으니까…….”<\/p>\n<p>하연은 웃으려다 실패했다.<\/p>\n<p>“내가 또 네 선택을 빼앗으면 안 되잖아.”<\/p>\n<p>그녀는 품속에서 작은 매듭 하나를 꺼냈다. 검붉은 실과 푸른 실이 함께 엮인 매듭이었다.<\/p>\n<p>“한서린이랑 만들었어. 사파 수련반에서 길 떠나는 사람한테 주는 거래.”<\/p>\n<p>“네가 직접 만들었어?”<\/p>\n<p>“왜, 못 믿겠어?”<\/p>\n<p>“아니. 예뻐서.”<\/p>\n<p>하연의 귀끝이 붉어졌다.<\/p>\n<p>“……그런 말은 좀 미리 예고하고 해.”<\/p>\n<p>서율이 웃자 하연도 따라 웃었다. 그러다 그녀가 그의 왼손을 잡았다.<\/p>\n<p>“서율아. 내 말 잘 들어.”<\/p>\n<p>“응.”<\/p>\n<p>“마교에 가서 누가 네 검을 이상하다고 하든, 대단하다고 하든, 그 말에 너 자신을 맞추지 마. 네가 왜 그 검을 시작했는지 잊지 마.”<\/p>\n<p>“안 잊을게.”<\/p>\n<p>“그리고 위험하면 도망쳐. 멋있게 싸우려고 하지 말고!”<\/p>\n<p>“그건 조금 어려울지도.”<\/p>\n<p>“전서율!”<\/p>\n<p>“알았어, 알았어.”<\/p>\n<p>하연은 그의 손을 더 꼭 잡았다.<\/p>\n<p>“……나, 기다려도 돼?”<\/p>\n<p>서율은 곧장 대답하지 못했다. 하연은 그가 자신을 좋아한다고 말했던 밤을 기억했다. 그러나 아직 그 마음에 어떤 이름을 붙여야 하는지 모른다는 것도 기억했다.<\/p>\n<p>“하연아. 네가 내게 해 준 말, 잊지 않았어.”<\/p>\n<p>“응.”<\/p>\n<p>“돌아와서 제대로 이야기하고 싶어. 그때는 피하지 않을게.”<\/p>\n<p>하연의 눈에 눈물이 고였다.<\/p>\n<p>“그거 약속이야?”<\/p>\n<p>“약속.”<\/p>\n<p>그녀는 웃으며 눈물을 훔쳤다.<\/p>\n<p>“좋아. 그럼 내가 먼저 가서 기다릴게.”<\/p>\n<p>“어디를?”<\/p>\n<p>“네가 돌아오는 길.”<\/p>\n<p>하연은 서율의 어깨에 이마를 잠깐 기댔다.<\/p>\n<p>“……꼭 돌아와.”<\/p>\n<p>이번에는 장난이 아니었다.<\/p>\n<p>서율은 그녀가 물러날 때까지 움직이지 않았다.<\/p>\n<h2>10. 빈자리의 주인<\/h2>\n<p>출발 전날 밤, 태경은 일부러 평소보다 시끄럽게 굴었다.<\/p>\n<p>“야, 전서율! 마교 가면 음식이 엄청 맵다던데, 너 먹을 수 있겠냐?”<\/p>\n<p>“먹어 본 적도 없으면서.”<\/p>\n<p>“소문이라는 게 있잖아!”<\/p>\n<p>“네 소문은 절반이 틀리잖아.”<\/p>\n<p>“절반은 맞는다는 뜻이네!”<\/p>\n<p>소윤이 웃음을 터뜨렸다.<\/p>\n<p>셋은 기숙사 방바닥에 둘러앉아 늦은 저녁을 먹었다. 태경은 가장 큰 떡을 서율 앞으로 밀어 놓았다.<\/p>\n<p>“먹어.”<\/p>\n<p>“네가 좋아하는 거잖아.”<\/p>\n<p>“오늘은 네가 먹어.”<\/p>\n<p>서율은 떡을 반으로 갈라 태경에게 건넸다.<\/p>\n<p>“그럼 같이 먹자.”<\/p>\n<p>태경은 한참 떡을 내려다봤다.<\/p>\n<p>“……너 진짜 짜증 나.”<\/p>\n<p>“왜?”<\/p>\n<p>“이럴 때까지 착한 척해서.”<\/p>\n<p>그의 목소리가 갈라졌다.<\/p>\n<p>서율이 아무 말도 하지 않자 태경은 손등으로 눈을 훔쳤다.<\/p>\n<p>“빨리 돌아와. 네가 없으면 내가 누구한테 졌다고 투덜대냐.”<\/p>\n<p>“도겸 선배한테 직접 투덜대면 되잖아.”<\/p>\n<p>“그건 무섭거든!”<\/p>\n<p>세 사람은 웃었다. 이번에는 웃음 끝에 울음이 따라왔다.<\/p>\n<p>밤이 깊어 소윤이 돌아간 뒤, 태경은 침상 옆 나무패를 다시 고쳐 달았다.<\/p>\n<p>“똑바로 걸어 놔야지.”<\/p>\n<p>“그대로 둬도 되는데.”<\/p>\n<p>“안 돼. 돌아왔을 때 떨어져 있으면 안 되잖아.”<\/p>\n<p>서율은 태경의 등을 바라봤다.<\/p>\n<p>“태경아.”<\/p>\n<p>“왜.”<\/p>\n<p>“내 자리, 부탁할게.”<\/p>\n<p>태경은 뒤돌아보지 않았다.<\/p>\n<p>“……알았어.”<\/p>\n<p>“고마워.”<\/p>\n<p>“고맙다는 말 그만해! 돌아와서 네가 직접 지켜!”<\/p>\n<p>서율은 웃으며 고개를 끄덕였다.<\/p>\n<p>그날 밤 그는 짐을 쌌다. 노교두의 낡은 교본, 소윤의 바느질 주머니와 붉은 실, 하연이 엮어 준 매듭. 오른손의 보호대를 고쳐 매고 작은 보퉁이를 묶었다.<\/p>\n<p>그가 마지막으로 바라본 것은 검이 아니었다.<\/p>\n<p>침상 옆의 나무패였다.<\/p>\n<p><strong>돌아올 곳.<\/strong><\/p>\n<p>창밖에서 새벽을 알리는 첫 바람이 불어왔다.<\/p>\n<p>내일이면 그는 이곳을 떠난다.<\/p>\n<p>그러나 이곳에 남겨 두는 것이 모두 슬픔인 것은 아니었다.<\/p>\n<p>돌아와야 할 이유가, 이렇게나 많았다.<\/p>\n<p><strong>— 제23장 「마지막 인사」 끝.<\/strong><\/p>\n"}, {"n": 24, "title": "《천류관》 제1부 《돌아올 곳》", "body": "<h1>《천류관》 제1부 《돌아올 곳》<\/h1>\n<h2>제24장. 떠나는 사람<\/h2>\n<h3>1. 빈자리를 남기는 새벽<\/h3>\n<p>아직 동이 트지 않았다.<\/p>\n<p>전서율은 작은 보퉁이를 어깨에 걸고 침상 앞에 섰다. 밤새 한 번도 흔들리지 않던 나무패가 문틈으로 스며든 바람에 가볍게 부딪쳤다.<\/p>\n<p><strong>돌아올 곳.<\/strong><\/p>\n<p>윤태경이 깎은 글씨는 삐뚤빼뚤했다. 어젯밤까지는 그것을 볼 때마다 웃음이 났다. 그런데 지금은 그 세 글자가 유난히 선명했다.<\/p>\n<p>서율은 나무패를 떼지 않았다.<\/p>\n<p>노교두의 낡은 교본은 보퉁이 맨 아래에, 백소윤이 준 바느질 주머니는 품 안에 넣었다. 진하연이 엮은 검붉고 푸른 매듭은 허리띠 안쪽에 달았다. 밖으로 드러내면 지나가는 사람의 눈길을 끌 것 같아 숨겼지만, 걸음을 옮길 때마다 작은 매듭이 허리에 닿았다.<\/p>\n<p>오른손의 보호대는 단단히 묶었다. 두 손가락은 아직 완전히 낫지 않았다. 의원은 어제도 검을 잡지 말라고 신신당부했다.<\/p>\n<p>“전서율.”<\/p>\n<p>등 뒤에서 목소리가 들렸다.<\/p>\n<p>태경이 침상에 앉아 있었다. 언제 깨어났는지 머리카락은 엉망이었고 눈은 붉었다.<\/p>\n<p>“왜 안 깨웠어?”<\/p>\n<p>“조금 더 자라고.”<\/p>\n<p>“누가 그런 걸 부탁했냐!”<\/p>\n<p>태경은 벌떡 일어났다. 그러더니 서율의 보퉁이를 빼앗듯 들어 올렸다.<\/p>\n<p>“가자. 문 앞까지는 내가 든다.”<\/p>\n<p>“무겁지도 않은데.”<\/p>\n<p>“알아. 그래도 내가 든다고!”<\/p>\n<p>서율은 더는 말리지 않았다.<\/p>\n<p>두 사람이 방을 나서자, 비어 있는 침상 위로 희미한 새벽빛이 번졌다. 태경은 문을 닫기 전에 한 번 뒤돌아봤다.<\/p>\n<p>“네 자리는 그대로 둘 거야.”<\/p>\n<p>“응.”<\/p>\n<p>“먼지 쌓이면 내가 닦을 거고.”<\/p>\n<p>“그건 좀 놀라운데.”<\/p>\n<p>“야!”<\/p>\n<p>서율이 웃었다. 태경도 따라 웃으려다 입술을 꽉 깨물었다.<\/p>\n<p>문이 닫혔다.<\/p>\n<h3>2. 인장 아래 적힌 약속<\/h3>\n<p>학관 정문에는 사절단이 먼저 모여 있었다.<\/p>\n<p>정파 학관의 깃발 아래 호위 무인 넷과 외사 교두가 서 있었고, 의원 한 명이 약상자를 확인하고 있었다. 마교 측의 인도인은 접경의 중립 회담소에서 합류하기로 되어 있었다. 적어도 이 문을 나서는 순간부터 마교 사람에게 신병을 넘기는 일은 없었다.<\/p>\n<p>원주가 직접 나와 봉인된 문서를 건넸다.<\/p>\n<p>“마교 외무당의 최종 수락서다. 학관의 호위 동행, 사흘 이내 기술 확인, 의원의 수련 제한, 조사 종료 후 귀환. 추가 체류는 네 별도 동의 없이는 불가능하다고 명시했다.”<\/p>\n<p>서율은 문서의 끝을 확인했다. 학관의 인장과 외무당의 인장이 나란히 찍혀 있었다.<\/p>\n<p>“이 약속이 지켜지지 않으면요?”<\/p>\n<p>원주는 눈을 피하지 않았다.<\/p>\n<p>“사절단은 조사를 중단하고 귀환을 요구할 권한이 있다. 그 요구를 거부하면 양측 협의 위반으로 기록될 것이다.”<\/p>\n<p>“그때 학관은 저를 데리러 옵니까?”<\/p>\n<p>원주의 입술이 잠깐 굳었다.<\/p>\n<p>“온다.”<\/p>\n<p>노교두가 한 걸음 앞으로 나섰다.<\/p>\n<p>“내가 먼저 오마.”<\/p>\n<p>원주가 그를 바라봤지만 말리지 않았다.<\/p>\n<p>서율은 두 사람에게 깊이 고개를 숙였다.<\/p>\n<p>“돌아와서 다시 배우겠습니다.”<\/p>\n<p>“돌아오면,” 노교두가 말했다. “교본 여백에 네 답을 적어 보여라.”<\/p>\n<p>“예.”<\/p>\n<p>“그리고 오른손!”<\/p>\n<p>“……예?”<\/p>\n<p>“허락 없이 검 잡으면 내가 직접 혼내 줄 테다!”<\/p>\n<p>서율은 웃었다.<\/p>\n<p>“알겠습니다!”<\/p>\n<h3>3. 떠나는 사람을 보는 눈<\/h3>\n<p>정문 밖에는 생각보다 많은 학도가 모여 있었다.<\/p>\n<p>누군가는 구경하러 나왔고, 누군가는 정말로 그가 떠나는지 확인하려 했다. 몇몇은 대놓고 비웃었다.<\/p>\n<p>“드디어 가네.”<\/p>\n<p>“마교에서 부른 검이 얼마나 대단한지 보자고.”<\/p>\n<p>“다시는 돌아오지 않으면 조용하겠군.”<\/p>\n<p>태경의 얼굴이 붉어졌다.<\/p>\n<p>“저 자식들이 마지막까지……!”<\/p>\n<p>서율이 그의 소매를 붙잡았다.<\/p>\n<p>“태경아.”<\/p>\n<p>“놔 봐! 한마디는 해야겠어!”<\/p>\n<p>“괜찮아.”<\/p>\n<p>“네가 괜찮다고 하면 다 괜찮은 줄 알아?!”<\/p>\n<p>태경의 목소리가 갈라졌다. 그 소리에 가까이 있던 학도들이 입을 다물었다.<\/p>\n<p>“저 녀석이 여기서 얼마나 버텼는지 너희가 알아? 손가락이 부러지고도 수업에 나왔어! 억울한 누명을 쓰고도 도망치지 않았다고! 그런데 떠나는 날까지 웃고 있어?!”<\/p>\n<p>잠시 정문 앞이 조용해졌다.<\/p>\n<p>태경은 숨을 몰아쉬었다. 서율이 그를 바라보자 눈가가 벌써 젖어 있었다.<\/p>\n<p>“……미안. 너는 조용히 가고 싶었을 텐데.”<\/p>\n<p>“아니.”<\/p>\n<p>서율은 그의 어깨에 손을 올렸다.<\/p>\n<p>“고마워.”<\/p>\n<p>그때 군중 뒤편에서 누군가 낮게 말했다.<\/p>\n<p>“돌아오면 같이 수련하자.”<\/p>\n<p>낯선 목소리였다. 서율이 돌아보자 한 학도가 황급히 고개를 숙였다. 또 다른 학도가 어색하게 손을 들어 보였다.<\/p>\n<p>“몸조심해.”<\/p>\n<p>모두가 그를 미워한 것은 아니었다.<\/p>\n<p>하지만 그 말들을 하는 사람들조차 앞으로 나서기까지는 시간이 걸렸다. 서율은 그 망설임도 기억해 두기로 했다. 누군가를 돕는 일은 생각보다 용기가 필요한 일이었다.<\/p>\n<h3>4. 웃으며 보내는 법<\/h3>\n<p>백소윤은 정문 옆 석등 아래에서 기다리고 있었다.<\/p>\n<p>오늘은 새 비녀를 꽂지 않았다. 서율이 처음 봤던 날처럼 머리를 단정히 묶었고, 두 손은 옷자락 앞에 모아 두었다.<\/p>\n<p>“늦었네.”<\/p>\n<p>“미안.”<\/p>\n<p>“네가 늦은 게 아니라 내가 일찍 온 거야.”<\/p>\n<p>소윤은 웃었다. 눈이 조금 부어 있었다.<\/p>\n<p>서율은 무엇을 말해야 할지 몰랐다. 어젯밤 그녀가 울면서 고백했던 말들이 떠올랐다. 평소처럼 아무렇지 않게 대하면 상처를 줄 것 같았고, 섣불리 답하면 자신도 모르는 마음을 거짓으로 말하게 될 것 같았다.<\/p>\n<p>소윤이 먼저 그의 품을 가리켰다.<\/p>\n<p>“주머니는?”<\/p>\n<p>“여기 있어.”<\/p>\n<p>“실은?”<\/p>\n<p>“잃어버리지 않았어.”<\/p>\n<p>“검은?”<\/p>\n<p>“안 가져왔어.”<\/p>\n<p>“잘했어.”<\/p>\n<p>그녀는 하나씩 확인하고서야 한숨을 내쉬었다.<\/p>\n<p>“정말 별걸 다 걱정하게 만든다, 너는.”<\/p>\n<p>“소윤아.”<\/p>\n<p>“응?”<\/p>\n<p>“네가 해 준 말…… 가볍게 생각하지 않을게.”<\/p>\n<p>소윤은 입술을 깨물었다.<\/p>\n<p>“그 말이면 됐어.”<\/p>\n<p>“돌아와서—”<\/p>\n<p>“알아. 돌아와서 이야기하자.”<\/p>\n<p>그녀가 한 걸음 다가왔다. 그리고 서율의 옷깃을 바로잡았다. 손끝이 떨려 매듭이 한 번에 묶이지 않았다.<\/p>\n<p>“왜 이러지…….”<\/p>\n<p>“천천히 해.”<\/p>\n<p>그 한마디에 소윤의 눈에 눈물이 차올랐다.<\/p>\n<p>“너는 정말…… 이런 때도 그렇게 말해.”<\/p>\n<p>서율은 아무 말도 하지 않았다.<\/p>\n<p>소윤은 끝내 매듭을 묶고, 손을 떼기 전에 그의 옷깃을 한 번 꼭 쥐었다.<\/p>\n<p>“돌아와. 기다리라는 말은 안 할게. 그건 내 마음이니까.”<\/p>\n<p>그녀는 눈물을 삼키며 웃었다.<\/p>\n<p>“대신 네가 돌아오면, 이번에는 내가 먼저 달려갈 거야!”<\/p>\n<p>“응.”<\/p>\n<p>“그때 모른 척하면 진짜 화낼 거야!”<\/p>\n<p>“절대 안 그럴게.”<\/p>\n<p>소윤은 고개를 끄덕이고 옆으로 물러섰다. 서율이 지나간 뒤에야 그녀는 석등을 붙잡았다. 울음이 터지는 소리를 들키고 싶지 않았다.<\/p>\n<p>태경이 조용히 다가와 그녀의 옆에 섰다. 평소 같았으면 놀렸을 것이다. 오늘은 아무 말 없이 손수건을 내밀었다.<\/p>\n<h3>5. 마지막까지 당당한 사람<\/h3>\n<p>진하연은 정문 바로 앞이 아니라, 학관으로 이어지는 돌계단의 마지막 단에 서 있었다.<\/p>\n<p>한서린이 곁에서 팔짱을 끼고 있었다.<\/p>\n<p>“왜 거기 숨어 있어?” 서율이 물었다.<\/p>\n<p>하연이 눈을 크게 떴다.<\/p>\n<p>“숨어 있긴 누가 숨어 있어! 길목을 지키고 있었거든?”<\/p>\n<p>한서린이 옆에서 중얼거렸다.<\/p>\n<p>“새벽부터 몇 번이나 내려갔다 올라왔다 했으면서.”<\/p>\n<p>“린!”<\/p>\n<p>서율이 웃자 하연은 잠깐 얼굴을 붉혔다. 그러나 곧 평소처럼 턱을 들었다.<\/p>\n<p>“마지막 확인. 다친 손은?”<\/p>\n<p>“잘 묶었어.”<\/p>\n<p>“검은?”<\/p>\n<p>“안 가져왔어.”<\/p>\n<p>“위험하면?”<\/p>\n<p>“도망칠게.”<\/p>\n<p>“그렇게 순순히 대답하니까 더 못 믿겠는데.”<\/p>\n<p>하연은 웃었다. 웃음이 오래가지 않았다.<\/p>\n<p>그녀는 서율의 허리띠 안쪽에서 살짝 보이는 매듭을 발견했다.<\/p>\n<p>“그거…… 달았네.”<\/p>\n<p>“응. 네가 준 거잖아.”<\/p>\n<p>“그냥 장식이야. 대단한 부적은 아니고.”<\/p>\n<p>“알아.”<\/p>\n<p>서율은 매듭을 손끝으로 만졌다.<\/p>\n<p>“그래도 좋아.”<\/p>\n<p>하연의 표정이 무너질 듯 흔들렸다. 그녀는 고개를 돌려 먼 산을 바라봤다.<\/p>\n<p>“정말 얄미워.”<\/p>\n<p>“내가?”<\/p>\n<p>“응. 사람 마음을 이렇게 만들어 놓고, 아무렇지도 않게 웃잖아.”<\/p>\n<p>“아무렇지 않은 건 아니야.”<\/p>\n<p>그 말에 하연이 다시 그를 바라봤다.<\/p>\n<p>서율은 한동안 말을 골랐다.<\/p>\n<p>“나도 떠나는 게 싫어. 네가 사파로 가자고 했을 때…… 같이 가면 어떨까, 잠깐 생각했어.”<\/p>\n<p>하연은 숨을 멈췄다.<\/p>\n<p>“그런데 내가 돌아오고 싶은 곳도 분명해서, 그때는 갈 수 없었어.”<\/p>\n<p>“……알아.”<\/p>\n<p>“이번에도 마찬가지야. 가고 싶어서 가는 건 아니야. 하지만 내가 직접 가서 확인하고 돌아오기로 했어.”<\/p>\n<p>하연은 그의 말을 끝까지 들었다. 그러고는 갑자기 한 발 다가와 서율을 껴안았다.<\/p>\n<p>서율의 어깨에 그녀의 이마가 닿았다.<\/p>\n<p>“정말……!”<\/p>\n<p>목소리가 떨렸다.<\/p>\n<p>“정말 돌아와야 해. 알겠어? 네가 돌아오지 않으면 내가 직접 찾으러 갈 거야!”<\/p>\n<p>“하연아…….”<\/p>\n<p>“정파든 마교든 상관없어. 어디에 있든 찾아낼 거니까!”<\/p>\n<p>서율은 멀쩡한 왼팔로 그녀를 조심스럽게 감쌌다.<\/p>\n<p>“응. 그러지 않게 돌아올게.”<\/p>\n<p>하연은 잠시 더 안겨 있다가 물러섰다. 눈가가 붉었지만 억지로 웃지 않았다.<\/p>\n<p>“좋아. 그럼 다녀와.”<\/p>\n<p>그녀는 서율의 어깨를 가볍게 밀었다.<\/p>\n<p>“네가 돌아오면, 그때는 내 말도 끝까지 들어 줘.”<\/p>\n<p>“약속할게.”<\/p>\n<p>한서린은 두 사람을 보다가 하늘을 올려다봤다.<\/p>\n<p>“이렇게까지 배웅하면 저쪽이 못 떠나겠다.”<\/p>\n<p>“너는 좀 조용히 해!”<\/p>\n<p>하연의 외침에 서율은 결국 소리 내어 웃었다.<\/p>\n<p>그 웃음이 끝나기 전에 사절단의 출발 종이 울렸다.<\/p>\n<h3>6. 남궁가가 바라던 풍경<\/h3>\n<p>학관의 높은 누각에서는 남궁현우와 차윤겸이 정문을 내려다보고 있었다.<\/p>\n<p>“떠나는군.”<\/p>\n<p>현우가 말했다.<\/p>\n<p>윤겸은 대답하지 않았다. 그의 눈은 서율이 아니라, 그를 배웅하는 하연에게 향해 있었다.<\/p>\n<p>그녀가 서율을 끌어안는 순간 윤겸의 손에서 찻잔이 깨졌다.<\/p>\n<p>쨍그랑!<\/p>\n<p>“……저 자식이!”<\/p>\n<p>피가 손바닥을 타고 흘렀다. 윤겸은 깨진 조각을 내려다보지도 않았다.<\/p>\n<p>현우가 차갑게 말했다.<\/p>\n<p>“정신 차려라. 네가 원한 대로 떠나잖아.”<\/p>\n<p>“저렇게 웃으면서 보내면 무슨 소용입니까!”<\/p>\n<p>“뭐?”<\/p>\n<p>“하연은 아직도 저 녀석만 보고 있습니다! 마교에 간다고 달라진 게 하나도 없잖습니까!”<\/p>\n<p>현우의 표정이 굳었다.<\/p>\n<p>“네 질투 때문에 일을 그르치지 말라고 했을 텐데.”<\/p>\n<p>윤겸은 숨을 거칠게 몰아쉬었다.<\/p>\n<p>현우는 정문 쪽으로 시선을 돌렸다. 서율을 실은 마차가 아니라, 서율이 직접 걸어가는 모습이 보였다. 호위 무인들 사이에서도 고개를 숙이지 않았다.<\/p>\n<p>마음에 들지 않았다.<\/p>\n<p>그는 저 소년이 쫓겨나듯 떠나기를 바랐다. 자신이 졌던 비무와 부러뜨린 손가락에 관한 소문도 함께 사라지기를 바랐다.<\/p>\n<p>그런데 서율은 친구들의 배웅을 받으며 떠나고 있었다.<\/p>\n<p>현우는 낮게 중얼거렸다.<\/p>\n<p>“아직 끝난 게 아니군.”<\/p>\n<p>윤겸이 돌아봤다.<\/p>\n<p>“무슨 뜻입니까?”<\/p>\n<p>“그 녀석이 돌아오면, 우리도 그날의 일을 다시 마주해야 한다는 뜻이다.”<\/p>\n<p>현우는 찻잔의 깨진 조각을 바라봤다.<\/p>\n<p>“그러니 돌아온 뒤를 생각해 둬야지.”<\/p>\n<p>그 말에 윤겸의 눈빛이 더욱 어두워졌다.<\/p>\n<h3>7. 학관이 보이지 않을 때까지<\/h3>\n<p>정문을 지난 뒤에도 서율은 몇 번이나 뒤돌아봤다.<\/p>\n<p>태경은 두 팔을 크게 흔들고 있었다.<\/p>\n<p>“전서율! 밥 거르지 마라!”<\/p>\n<p>“너나 거르지 마!”<\/p>\n<p>“난 절대 안 거르거든!”<\/p>\n<p>소윤은 두 손을 모은 채 서 있었다. 멀리서도 그녀가 웃고 있다는 것을 알 수 있었다. 하연은 그보다 조금 떨어진 곳에서 팔짱을 낀 채 서 있었다. 서율이 다시 돌아보자 그녀는 주먹을 들어 보였다.<\/p>\n<p><em>꼭 돌아와.<\/em><\/p>\n<p>입술이 그렇게 움직였다.<\/p>\n<p>서율도 작게 고개를 끄덕였다.<\/p>\n<p>길이 굽어 학관의 지붕이 보이지 않게 되었을 때, 그는 마지막으로 걸음을 멈췄다.<\/p>\n<p>“괜찮으냐?”<\/p>\n<p>동행한 외사 교두가 물었다.<\/p>\n<p>“예.”<\/p>\n<p>서율은 한 번 더 뒤를 바라봤다.<\/p>\n<p>“이제 가겠습니다.”<\/p>\n<p>그가 돌아선 순간, 허리띠 안쪽의 매듭이 옷깃을 스쳤다. 품속의 바느질 주머니는 따뜻했고, 보퉁이 안의 낡은 교본은 묵직했다.<\/p>\n<p>그는 혼자 떠나는 것이 아니었다.<\/p>\n<p>그렇다고 누군가가 대신 걸어 줄 수 있는 길도 아니었다.<\/p>\n<h3>8. 검을 뽑지 않는 싸움<\/h3>\n<p>해가 중천에 올랐을 무렵, 사절단은 접경으로 이어지는 좁은 협곡에 들어섰다.<\/p>\n<p>길 양옆으로 바위가 솟아 있었고, 바람이 마른 풀을 쓸었다. 호위대의 선두가 손을 들었다.<\/p>\n<p>“멈춰!”<\/p>\n<p>바위 아래에 쓰러진 짐수레 한 대가 길을 가로막고 있었다. 수레바퀴가 부러져 있었고, 그 곁에는 상인 차림의 남자가 앉아 있었다.<\/p>\n<p>“살려 주십시오! 바퀴가 부러져서 꼼짝도 못 하고 있습니다!”<\/p>\n<p>외사 교두가 앞으로 나서려 하자 호위대장이 팔을 뻗어 막았다.<\/p>\n<p>“잠깐.”<\/p>\n<p>그의 시선이 수레 아래로 향했다.<\/p>\n<p>바퀴가 부러졌다는 수레에는 끌린 흔적이 없었다. 마른 흙 위에 깊은 발자국이 여럿 찍혀 있었다.<\/p>\n<p>“전원 뒤로!”<\/p>\n<p>호위대장의 외침과 동시에 바위 위에서 쇠뇌가 울었다.<\/p>\n<p>퉁!<\/p>\n<p>첫 화살이 수레 옆 나무에 박혔다. 두 번째는 호위 무인의 어깨를 스쳤다.<\/p>\n<p>“습격이다!”<\/p>\n<p>검이 뽑혔다. 쇳소리가 협곡에 부딪쳐 울렸다.<\/p>\n<p>검은 복면을 쓴 무인 셋이 바위에서 뛰어내렸다. 수레 옆에 앉아 있던 남자도 옷 속에서 짧은 칼을 꺼냈다.<\/p>\n<p>호위대장은 서율을 뒤로 밀었다.<\/p>\n<p>“학도는 의원 뒤로! 절대 검을 잡지 마라!”<\/p>\n<p>서율은 물러났다. 오른손이 반사적으로 허리로 향했다가 멈췄다. 애초에 검은 가져오지 않았다.<\/p>\n<p>복면인 하나가 호위의 검을 받아 내며 외쳤다.<\/p>\n<p>“그 학도만 내놔라! 나머지는 다치지 않게 해 주지!”<\/p>\n<p>외사 교두가 소리쳤다.<\/p>\n<p>“누구의 명령이냐!”<\/p>\n<p>“알 필요 없다!”<\/p>\n<p>칼날이 번쩍였다. 호위 무인 한 명이 상대의 공격을 막아 내며 뒤로 밀렸다. 서율은 의원과 함께 바위 뒤로 물러났다.<\/p>\n<p>그런데 수레 뒤편에서 다섯 번째 복면인이 나타났다.<\/p>\n<p>그는 다른 무인들과 달리 검을 들지 않았다. 대신 짧은 쇠사슬을 손목에 감고 있었다.<\/p>\n<p>“찾았다.”<\/p>\n<p>그의 시선이 서율에게 꽂혔다.<\/p>\n<p>“전서율. 네가 그 검로를 만든 놈이냐?”<\/p>\n<p>서율의 등골이 서늘해졌다.<\/p>\n<p>이름만 알고 있는 게 아니었다.<\/p>\n<p>“누구십니까?”<\/p>\n<p>“대답해. 네 검 끝에서 기운이 맺혔다던데, 지금도 할 수 있나?”<\/p>\n<p>제15장 창고 뒤뜰에서 일어난 일을 말하고 있었다. 그곳에 있었던 사람과 사건을 조사한 자들 외에는 자세히 알기 어려운 내용이었다.<\/p>\n<p>서율이 대답하지 않자 복면인이 쇠사슬을 휘둘렀다.<\/p>\n<p>촤륵!<\/p>\n<p>서율은 왼발을 뒤로 빼며 몸을 낮췄다. 쇠사슬 끝이 바로 앞의 바위를 때렸다. 돌가루가 얼굴에 튀었다.<\/p>\n<p>두 번째 공격이 곧바로 이어졌다. 서율은 옆으로 몸을 틀었지만 사슬 끝이 옷소매를 걸었다.<\/p>\n<p>“윽!”<\/p>\n<p>그는 팔을 빼려다 오른손에 힘을 주었다. 부상 부위에 날카로운 통증이 올라왔다.<\/p>\n<p><em>안 돼. 억지로 당기면 다시 다친다.<\/em><\/p>\n<p>그는 소매를 붙잡으려는 충동을 억눌렀다. 대신 몸을 사슬이 당겨지는 방향으로 반 걸음 옮겼다. 팽팽해진 힘이 잠시 느슨해졌다.<\/p>\n<p>그 틈에 서율은 왼팔을 빼냈다. 옷소매가 찢어져 사슬 끝에 매달렸다.<\/p>\n<p>복면인이 비웃었다.<\/p>\n<p>“그게 네가 만든 검술이냐? 도망치는 재주밖에 없군!”<\/p>\n<p>“검술을 보여 주려고 여기 온 게 아닙니다!”<\/p>\n<p>서율은 숨을 몰아쉬며 대답했다.<\/p>\n<p>복면인이 다시 달려들었다. 이번에는 사슬이 아니라 손바닥을 뻗어 그의 목덜미를 움켜잡으려 했다.<\/p>\n<p>서율은 정파 기본 보법의 첫 걸음을 밟았다.<\/p>\n<p>정면을 비우고, 어깨를 돌리고, 발을 잇는다.<\/p>\n<p>익숙한 움직임이었다. 그러나 상대의 속도는 수련장에서 마주한 학도들과 달랐다. 서율은 세 번째 걸음을 옮기려다 발끝이 바위에 걸렸다.<\/p>\n<p>몸이 기울었다.<\/p>\n<p><em>여기서 억지로 잇지 마.<\/em><\/p>\n<p>강도겸과의 대련이 떠올랐다. 그때 그는 검을 놓았기에 더 큰 부상을 막을 수 있었다.<\/p>\n<p>이번에는 동작을 놓았다.<\/p>\n<p>서율은 무리하게 자세를 바로잡는 대신 몸을 낮춰 땅을 짚었다. 복면인의 손이 머리 위를 스쳤다. 그가 균형을 회복하기도 전에 호위대장이 뛰어들었다.<\/p>\n<p>쾅!<\/p>\n<p>검집으로 복면인의 팔을 후려친 호위대장이 서율의 앞을 막았다.<\/p>\n<p>“뒤로 가라!”<\/p>\n<p>서율은 이를 악물고 물러났다.<\/p>\n<p>자신이 이긴 싸움이 아니었다. 오히려 조금만 늦었어도 붙잡혔을 것이다.<\/p>\n<p>하지만 이번에는 무리하게 검을 쥐지 않았다. 끝까지 살아남을 자리를 찾았다.<\/p>\n<h3>9. 이름을 남기지 않은 자들<\/h3>\n<p>습격은 오래가지 않았다.<\/p>\n<p>호위대가 대열을 다시 갖추자 복면인들은 더 버티지 못했다. 둘은 바위 위로 달아났고, 쇠사슬을 쓰던 자는 호위대장의 검집에 맞아 무릎을 꿇었다.<\/p>\n<p>그러나 그가 입을 열기도 전에 바위 위에서 짧은 휘파람이 들렸다.<\/p>\n<p>복면인은 이를 악물었다. 혀 아래에 숨긴 작은 약환을 깨물려는 순간, 호위대장이 턱을 움켜쥐었다.<\/p>\n<p>“삼키지 마!”<\/p>\n<p>의원이 달려와 입 안을 확인했다. 약환은 깨지지 않았다.<\/p>\n<p>“살려 두었습니다.”<\/p>\n<p>외사 교두가 복면인 앞에 쪼그려 앉았다.<\/p>\n<p>“누가 보냈나?”<\/p>\n<p>복면인은 고개를 돌렸다.<\/p>\n<p>“마교 외무당이냐? 아니면 학관 내부 사람이냐?”<\/p>\n<p>그의 눈동자가 잠깐 흔들렸다.<\/p>\n<p>“……모른다.”<\/p>\n<p>“전서율의 이름과 검로는 어떻게 알았지?”<\/p>\n<p>복면인은 대답하지 않았다.<\/p>\n<p>호위대장이 그의 옷을 수색했다. 작은 동전 몇 닢, 닳은 가죽끈, 글자가 없는 나무패가 나왔다. 어느 세력의 표식도 없었다.<\/p>\n<p>외사 교두는 얼굴을 굳혔다.<\/p>\n<p>“이 정도로는 누구의 짓인지 단정할 수 없겠군.”<\/p>\n<p>서율은 찢어진 소매를 내려다봤다.<\/p>\n<p>“그 사람은 제가 검 끝에 기운을 모았던 일을 알고 있었습니다.”<\/p>\n<p>“그 말이 사실이냐?”<\/p>\n<p>“그런 일이 있었습니다. 하지만 제가 마음대로 만들어 낼 수 있는 기술은 아닙니다.”<\/p>\n<p>외사 교두는 잠시 생각했다.<\/p>\n<p>“학관에서 조사된 내용이 바깥으로 새어 나갔을 가능성이 있겠군. 그렇다고 이들이 남궁가의 사람인지, 마교의 사람인지는 아직 알 수 없다.”<\/p>\n<p>서율은 고개를 끄덕였다.<\/p>\n<p>짐수레는 길옆으로 치웠고, 붙잡힌 복면인은 묶인 채 사절단의 뒤쪽에 실렸다. 부상당한 호위 무인은 의원의 처치를 받았다. 큰 상처는 아니었지만 출혈이 있어 걸음을 늦춰야 했다.<\/p>\n<p>서율은 의원에게 찢어진 소매를 내밀었다.<\/p>\n<p>“실과 바늘을 써도 될까요?”<\/p>\n<p>의원이 그를 빤히 바라봤다.<\/p>\n<p>“방금 죽을 뻔했는데 옷부터 꿰매겠다고?”<\/p>\n<p>“친구가 준 거라서요.”<\/p>\n<p>의원은 한숨을 쉬고 바늘을 건넸다.<\/p>\n<p>서율은 왼손으로 천을 붙잡고 서툴게 바느질을 시작했다. 소윤이 가르쳐 준 매듭법이 생각나지 않아 두 번이나 다시 묶었다.<\/p>\n<p>세 번째에야 매듭이 고정됐다.<\/p>\n<p><em>돌아가면 이건 좀 배워야겠네.<\/em><\/p>\n<p>그 생각에 혼자 작게 웃었다.<\/p>\n<h3>10. 경계에 선 사람<\/h3>\n<p>해가 기울 무렵, 협곡을 빠져나온 사절단 앞에 넓은 강이 나타났다.<\/p>\n<p>강 건너편에는 검은 기와를 얹은 건물들이 낮게 이어져 있었다. 그중 가장 높은 누각에는 낯선 문양의 깃발이 펄럭였다.<\/p>\n<p>외사 교두가 말했다.<\/p>\n<p>“저곳이 접경의 중립 회담소다. 마교 외무당 인도인이 저기서 기다리고 있을 것이다.”<\/p>\n<p>서율은 강을 바라봤다.<\/p>\n<p>마교.<\/p>\n<p>학관에서 그 이름은 늘 경계해야 할 대상으로 불렸다. 어떤 교두는 그들을 잔혹한 자들이라고 했고, 어떤 상인은 그들과도 거래가 가능하다고 말했다. 서율은 어느 쪽이 진실인지 알지 못했다.<\/p>\n<p>다만 자신을 부른 사람들이 그곳에 있다는 사실만은 분명했다.<\/p>\n<p>강가에 도착하자 맞은편에서 작은 배 한 척이 다가왔다. 배에는 검은 옷을 입은 여인과 두 명의 무인이 타고 있었다.<\/p>\n<p>여인은 배에서 내리자마자 학관의 인장을 확인했다. 이어 외사 교두에게 정중히 포권했다.<\/p>\n<p>“마교 외무당의 인도 담당입니다. 약속한 사절단을 맞이하러 왔습니다.”<\/p>\n<p>그녀의 목소리는 예상보다 차분했다.<\/p>\n<p>“전서율 학도는 어느 분입니까?”<\/p>\n<p>서율이 앞으로 나섰다.<\/p>\n<p>“접니다.”<\/p>\n<p>여인은 그의 오른손 보호대를 한 번 보고, 찢어진 소매의 서툰 바느질을 바라봤다. 시선이 오래 머물지는 않았다.<\/p>\n<p>“먼 길 오시느라 고생하셨습니다. 조사에 앞서 쉬실 곳부터 안내하겠습니다.”<\/p>\n<p>외사 교두가 말했다.<\/p>\n<p>“먼저 확인할 것이 있습니다. 우리 학도는 정해진 기술 확인을 위해서만 왔습니다. 학관의 호위와 의원은 전 일정에 동행합니다.”<\/p>\n<p>“알고 있습니다. 외무당의 인장이 찍힌 수락서와 같은 조건입니다.”<\/p>\n<p>여인은 품에서 문서 한 장을 꺼냈다. 같은 내용, 같은 인장이었다.<\/p>\n<p>그제야 외사 교두가 고개를 끄덕였다.<\/p>\n<p>그러나 여인은 곧 서율을 향해 뜻밖의 말을 했다.<\/p>\n<p>“그리고 전서율 학도. 오시는 길에 습격을 받으셨다고 들었습니다.”<\/p>\n<p>호위대장의 눈이 가늘어졌다.<\/p>\n<p>“그걸 어떻게 알았지?”<\/p>\n<p>“접경 순찰망에서 협곡의 소란을 보고받았습니다.”<\/p>\n<p>“그럼 습격한 자들도 알고 있나?”<\/p>\n<p>“아직 확인되지 않았습니다.”<\/p>\n<p>여인은 잠시 말을 멈췄다가 덧붙였다.<\/p>\n<p>“다만 외무당에서도 그들을 찾고 있습니다. 누군가 우리 이름을 이용해 학도를 빼돌리려 했다면, 그것은 우리에게도 문제가 됩니다.”<\/p>\n<p>서율은 그녀를 바라봤다.<\/p>\n<p>“그럼 저를 왜 부르셨습니까?”<\/p>\n<p>여인은 곧바로 답하지 않았다.<\/p>\n<p>강 위로 바람이 불었다. 검은 깃발이 멀리서 한 번 크게 펄럭였다.<\/p>\n<p>“학도께서 보이셨다는 검의 흐름 때문입니다.”<\/p>\n<p>“제 검은 아직 완성되지 않았습니다.”<\/p>\n<p>“그렇기에 확인하고 싶은 겁니다.”<\/p>\n<p>여인의 눈빛이 처음으로 달라졌다.<\/p>\n<p>“완성되지 않은 검이 어째서 이미 완성된 초식의 끝을 벗어나려 하는지.”<\/p>\n<p>서율의 가슴이 조용히 뛰었다.<\/p>\n<p>그는 학관에서 그 질문을 처음 했을 때를 기억했다. 검식이 끝나는 곳에서 왜 다음 동작이 끊어지는지. 왜 이어질 수 있는 길을 일부러 멈춰야 하는지.<\/p>\n<p>그 질문을 비웃는 사람도 있었고, 위험하다고 말하는 사람도 있었다.<\/p>\n<p>그런데 지금, 처음 만난 마교의 여인이 똑같은 의문을 다른 말로 묻고 있었다.<\/p>\n<p>서율은 강 건너편을 바라봤다.<\/p>\n<p>자신이 믿어 온 정파의 길이 틀렸다고 생각하지 않았다. 그렇다고 아직 보지 못한 마교의 길을 미리 틀렸다고 단정하고 싶지도 않았다.<\/p>\n<p>그는 노교두의 교본이 든 보퉁이를 고쳐 멨다.<\/p>\n<p>“가서 이야기하겠습니다.”<\/p>\n<p>여인이 고개를 숙였다.<\/p>\n<p>“안내하겠습니다.”<\/p>\n<h3>11. 돌아올 곳<\/h3>\n<p>그 시각, 정파 학관의 기숙사에서는 태경이 서율의 침상 위에 떨어진 먼지를 털고 있었다.<\/p>\n<p>“하루도 안 지났는데 뭘 그렇게 닦아?”<\/p>\n<p>소윤이 문간에서 물었다.<\/p>\n<p>“먼지가 보여서.”<\/p>\n<p>“거짓말.”<\/p>\n<p>“……알아.”<\/p>\n<p>태경은 걸레를 내려놓았다.<\/p>\n<p>소윤은 침상 옆의 나무패를 바라봤다.<\/p>\n<p><strong>돌아올 곳.<\/strong><\/p>\n<p>그녀는 조심스럽게 손을 뻗어 비뚤어진 패를 바로잡으려 했다. 그러다 손을 거뒀다.<\/p>\n<p>“그냥 두자.”<\/p>\n<p>“왜?”<\/p>\n<p>“서율이가 이대로 두는 걸 좋아했잖아.”<\/p>\n<p>태경은 잠시 바라보다 고개를 끄덕였다.<\/p>\n<p>연무장에서는 저녁 수련을 알리는 종이 울렸다. 학관은 아무 일도 없었다는 듯 하루를 이어 가고 있었다.<\/p>\n<p>누군가는 서율이 떠난 것을 기뻐했고, 누군가는 금세 잊었다. 누군가는 이제야 자신이 침묵했던 일을 후회했다.<\/p>\n<p>하지만 어떤 사람들은 그 빈자리를 지켰다.<\/p>\n<p>같은 시각, 진하연은 사파 수련반의 빈 연무장에 홀로 서 있었다. 그녀는 검을 뽑았다가, 이내 다시 검집에 넣었다.<\/p>\n<p>“기다리기만 할 생각은 없거든.”<\/p>\n<p>그녀는 낮게 중얼거렸다.<\/p>\n<p>서율을 부른 이유와 협곡에서 벌어진 일을 알아볼 생각이었다. 다만 서율의 선택을 대신하지는 않을 것이다.<\/p>\n<p>먼 강가에서, 서율은 배에 올랐다.<\/p>\n<p>배가 물살을 가르자 강 양쪽의 풍경이 조금씩 멀어졌다. 그가 지나온 길은 저편에 있었고, 아직 알지 못하는 길은 앞에 있었다.<\/p>\n<p>서율은 다친 오른손을 내려다봤다.<\/p>\n<p>아직 검을 제대로 쥘 수 없었다.<\/p>\n<p>아직 자신의 검에 이름도 붙이지 못했다.<\/p>\n<p>아직 누구의 마음에도 분명한 답을 주지 못했다.<\/p>\n<p>그런데도 그는 이곳에 와 있었다.<\/p>\n<p><em>돌아갈 거야.<\/em><\/p>\n<p>그는 마음속으로 다시 약속했다.<\/p>\n<p><em>내가 시작한 질문의 답을 찾고, 반드시 돌아갈 거야.<\/em><\/p>\n<p>강 건너편에서 종이 울렸다.<\/p>\n<p>그 소리는 정파 학관의 종소리와 닮았으면서도 달랐다.<\/p>\n<p>전서율은 고개를 들었다.<\/p>\n<p>그리고 아직 이름 없는 자신의 길을 향해 첫걸음을 내디뎠다.<\/p>\n<p><strong>— 제24장 「떠나는 사람」 끝.<\/strong><\/p>\n<p><strong>— 《천류관》 제1부 《돌아올 곳》 끝.<\/strong><\/p>\n"}];let index=0;const $=id=>document.getElementById(id);const sel=$('chapters');chapters.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${String(x.n).padStart(2,'0')}화 · ${x.title}`;sel.appendChild(o)});function show(i,scroll=true){index=Math.max(0,Math.min(chapters.length-1,i));const c=chapters[index];sel.value=index;$('story').innerHTML=c.body;$('counter').textContent=`제 ${c.n} / ${chapters.length} 장`;['prev','prev2'].forEach(x=>$(x).disabled=index===0);['next','next2'].forEach(x=>$(x).disabled=index===chapters.length-1);history.replaceState(null,'',`#chapter-${String(c.n).padStart(2,'0')}`);if(scroll)window.scrollTo(0,0)}sel.addEventListener('change',()=>show(Number(sel.value)));['prev','prev2'].forEach(x=>$(x).addEventListener('click',()=>show(index-1)));['next','next2'].forEach(x=>$(x).addEventListener('click',()=>show(index+1)));window.addEventListener('hashchange',()=>{const m=location.hash.match(/chapter-(\d+)/);if(m)show(Number(m[1])-1)});const m=location.hash.match(/chapter-(\d+)/);show(m?Number(m[1])-1:0,false);</script></body></html>
